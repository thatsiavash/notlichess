/* ══════════════════════════════════════════════════════════════════════════
   notlichess.org: the mistakes trainer.
   Single static file. No build step, no framework, no backend.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#161512;      /* page ground */
  --raised:#1b1a17;      /* header, inputs, sheets */
  --card:#1d1c18;        /* cards on the ground */
  --rule:#2c2a26;        /* major hairline */
  --rule-soft:#24221f;   /* row rule */
  --edge:#3a3733;        /* outline on quiet cards and chips */

  --display:#e8e4da;
  --primary:#dedbd2;
  --body:#bdbab2;
  --secondary:#8c8880;
  --dim:#8c867c;         /* the floor: never dimmer for text that means something */

  --gold:#b68235;
  --link:#c99a4e;
  --link-hover:#e0b869;
  --kicker:#a87d38;
  --gold-quiet:#96825f;

  --win:#7a9a5e;
  --loss:#b87a6a;
  --info:#8aa0b8;

  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-body:"Lora",Georgia,serif;
  --gutter:clamp(14px,4vw,22px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground)}
body{
  color:var(--body);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding:0 0 56px;-webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{color:var(--link-hover)}
button{font-family:inherit}
*:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:rgba(182,130,53,.3)}
[hidden]{display:none !important}
.tnum{font-variant-numeric:tabular-nums}
.win{color:var(--win)}
.loss{color:var(--loss)}
.dim{color:var(--dim)}
.sec{color:var(--secondary)}
.gold{color:var(--gold)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kicker)}
.display{font-family:var(--font-display);font-weight:400;color:var(--display);font-variant-numeric:lining-nums tabular-nums}

/* header ─────────────────────────────────────────────────────────────── */
.bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;
  padding:11px var(--gutter);border-bottom:1px solid var(--rule);
  background:var(--raised);position:sticky;top:0;z-index:5;
}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto;min-width:0}
.brand-name{font-family:var(--font-display);font-size:23px;color:var(--display);cursor:pointer;white-space:nowrap}
.brand-name:hover{color:var(--link-hover)}
.brand-user{font-size:13px;color:#a9a49a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-out{font-size:11px;color:var(--dim)}
.brand-out:hover{color:var(--loss)}
.ratings{display:flex;flex-wrap:wrap;gap:0 16px;font-variant-numeric:tabular-nums;font-size:13px}
.ratings span{color:var(--secondary)}
.ratings b{color:var(--primary);font-weight:400}
.ratings .win{color:var(--win)}
.bar-right{display:flex;align-items:center;gap:14px;font-size:12.5px}
.streak-badge{display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-size:14px}
.streak-badge b{font-weight:400;color:var(--link-hover)}
.flame{width:13px;height:16px}
.views{display:flex;border-bottom:1px solid var(--rule);margin-top:4px}
.view-tab{
  padding:12px 18px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--secondary);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.view-tab:hover{color:var(--link-hover)}
.view-on{color:var(--display);border-bottom-color:var(--gold)}
.view-tab .badge{
  display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;
  background:var(--gold);color:#181410;font-size:10.5px;letter-spacing:0;line-height:17px;text-align:center;
}
.page{max-width:1180px;margin:0 auto;padding:0 var(--gutter)}

/* buttons ────────────────────────────────────────────────────────────── */
.btn-big{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gold);color:#181410;border:1px solid var(--gold);
  border-radius:6px;padding:13px 30px;font-size:15.5px;font-weight:600;min-width:220px;cursor:pointer;
}
.btn-big:hover{background:var(--link-hover);border-color:var(--link-hover);color:#181410}
.btn-line{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--edge);border-radius:6px;padding:9px 16px;color:var(--body);font-size:14px;
  background:transparent;cursor:pointer;
}
.btn-line:hover{border-color:var(--gold);color:var(--link-hover)}
.btn-gold{border:1px solid var(--gold);border-radius:6px;padding:9px 16px;color:var(--link);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-quiet{color:var(--secondary);font-size:13.5px;padding:9px 4px}
.btn-quiet:hover{color:var(--link-hover)}
.btn-off{opacity:.4;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .btn-pulse{animation:pull 1.8s ease-in-out infinite}
  @keyframes pull{0%,100%{box-shadow:0 0 0 0 rgba(182,130,53,0)}50%{box-shadow:0 0 0 6px rgba(182,130,53,.22)}}
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--edge);border-radius:4px;padding:6px 11px;font-size:13px;color:var(--body);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--gold-quiet)}
.chip-on{color:var(--link);border-color:var(--gold)}
.input{
  background:var(--raised);border:1px solid var(--edge);border-radius:6px;color:var(--primary);
  font-family:inherit;font-size:16px;padding:12px 14px;
}
.input:focus{border-color:var(--gold);outline:none}

/* landing ────────────────────────────────────────────────────────────── */
.first{max-width:720px;margin:0 auto;padding:clamp(40px,9vw,80px) var(--gutter) 30px}
.first h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(32px,8vw,46px);
  line-height:1.1;color:var(--display);margin:0 0 16px;max-width:15em;
}
.lede{margin:0 0 28px;max-width:38em;color:#a9a49a;font-size:16.5px}
.src-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 0 14px}
.src-btn{
  border:1px solid var(--edge);border-radius:8px;padding:14px 16px;color:var(--primary);
  font-size:15px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:transparent;
}
.src-btn small{color:var(--dim);font-size:12.5px}
.src-btn:hover{border-color:var(--gold-quiet)}
.src-on{border-color:var(--gold);background:rgba(182,130,53,.06)}
.first-form{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;max-width:520px;margin-bottom:10px}
.first-form .input{flex:1 1 220px;min-width:0}
.confirm{
  border:1px solid var(--gold);border-radius:8px;padding:16px 18px;max-width:520px;margin:6px 0 16px;
  display:flex;gap:14px;align-items:center;background:rgba(182,130,53,.04);
}
.confirm img{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--raised)}
.confirm .who{flex:1;min-width:0}
.confirm .who b{display:block;font-size:17px;color:var(--display);font-weight:400}
.confirm .who span{font-size:13px;color:var(--secondary)}
.value{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:0 34px;border-top:1px solid var(--rule);margin-top:36px}
.value-item{border-bottom:1px solid var(--rule-soft);padding:14px 0}
.value-item b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--display);margin-bottom:3px}
.value-item span{color:var(--secondary);font-size:13.5px}
.first-foot{font-size:13px;margin-top:22px;color:var(--dim)}

/* narration (first load) ─────────────────────────────────────────────── */
.narr{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.narr-line{color:var(--body);font-size:15px;animation:narr-in .35s ease}
.narr-line b{color:var(--display);font-weight:400}
.narr-bar{display:block;height:3px;background:var(--rule);border-radius:2px;margin-top:7px;max-width:340px;overflow:hidden}
.narr-fill{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.narr-strip{overflow:hidden;margin:26px 0 6px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.narr-track{display:flex;gap:16px;width:max-content}
.narr-card{display:flex;flex-direction:column;gap:5px;align-items:center;transition:opacity .45s ease,transform .45s ease}
.narr-card .board{width:238px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.narr-card-cap{font-size:13px;color:var(--secondary)}
.narr-fade{opacity:0;transform:scale(.96)}
.narr-wisdom{margin-top:30px;font-family:var(--font-display);font-size:19px;line-height:1.4;color:var(--gold-quiet);max-width:30em;min-height:3.2em;transition:opacity .3s}
@keyframes narr-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .narr-track{animation:drift 46s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}
@media (prefers-reduced-motion:reduce){.narr-line{animation:none}}

/* today ──────────────────────────────────────────────────────────────── */
.today{max-width:720px;padding:24px 0 10px}
.today-grid{max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1000px){.today-grid{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.today-main{min-width:0}
.latest{border:1px solid var(--rule);border-radius:10px;padding:16px 16px 10px}
.latest .kicker{margin-bottom:8px}
.lg-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--rule);border-radius:6px}
.latest .kicker + .lg-row{border-top:0}
.lg-row.is-open{cursor:pointer}
.lg-row.is-open:hover{background:rgba(212,175,55,.06)}
.lg-res{flex:0 0 22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
.lg-W{background:rgba(120,170,100,.18);color:#9fcf8a}
.lg-L{background:rgba(200,90,80,.18);color:#e0968c}
.lg-D{background:rgba(160,160,160,.15);color:#bdbab2}
.lg-who{flex:1 1 auto;min-width:0;font-size:14px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-who small{display:block;font-size:12px;color:var(--secondary);margin-top:1px}
.lg-state{flex:0 0 auto;text-align:right;font-size:13px;color:var(--gold)}
.lg-state i{display:block;font-style:normal;font-size:11.5px;color:#e0968c}
.lg-state.ok{color:#9fcf8a}
.lg-foot{font-size:12.5px;margin:8px 0 4px}
.since{font-size:14.5px;color:var(--gold-quiet);margin:0 0 16px}
.hero{
  border:1px solid var(--edge);border-radius:10px;padding:22px 22px 20px;background:var(--card);
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.1;color:var(--display);margin:4px 0 6px}
.hero .why{color:var(--secondary);font-size:14.5px;margin:0 0 18px}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.week{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12.5px;color:var(--secondary)}
.week-dots{display:flex;gap:4px}
.week-dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;border:1px solid var(--edge)}
.week-dot.on{background:var(--gold);border-color:var(--gold)}
.week-dot.is-today{border-color:var(--gold-quiet)}
.focus{border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:14px}
.focus-name{font-family:var(--font-display);font-size:22px;color:var(--display);margin:4px 0 4px}
.focus p{margin:0 0 10px;font-size:14px;color:var(--body)}
.focus .plan{border-left:2px solid var(--gold);padding:2px 0 2px 12px;color:var(--primary);font-size:14.5px;margin:10px 0 12px}
.focus .acts{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--secondary);margin:16px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status .bar-line{flex:1 1 140px;max-width:220px;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.status .bar-fill{display:block;height:100%;background:var(--gold);transition:width .5s}
.finding{border:1px dashed var(--edge);border-radius:10px;padding:20px 22px}
.finding h2{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);margin:4px 0 6px}
.finds{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.find{font-size:14px;color:var(--body);animation:narr-in .35s ease}
.find b{color:var(--display);font-weight:400}
.done-big{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,6vw,36px);color:var(--display);margin:2px 0 6px}
.recap{display:flex;gap:10px;overflow-x:auto;padding:8px 0 4px;margin:10px 0 16px}
.recap-item{flex:none;width:118px;cursor:pointer}
.recap-item .board{width:118px;box-shadow:none;border-radius:4px}
.recap-item span{display:block;font-size:11.5px;color:var(--secondary);margin-top:4px;line-height:1.3}
.recap-item .res{font-size:11px}

/* the card ───────────────────────────────────────────────────────────── */
.card{display:grid;grid-template-columns:minmax(0,min(520px,max(340px,calc(100vh - 150px)))) minmax(0,1fr);gap:14px 30px;padding:14px 0 20px;align-items:start}
.card-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex:1 1 180px;max-width:420px}
.dot{flex:1;height:5px;border-radius:2px;background:var(--edge);min-width:6px}
.dot.on{background:var(--gold)}
.dot.ok{background:var(--win)}
.dot.bad{background:var(--loss)}
.dot.mid{background:var(--gold-quiet)}
.card-count{font-size:13px;color:var(--secondary);white-space:nowrap}
.card-menu{margin-left:auto;font-size:13px;color:var(--secondary);position:relative}
.menu-pop{
  position:absolute;right:0;top:26px;z-index:8;background:var(--raised);border:1px solid var(--edge);
  border-radius:8px;padding:6px;min-width:220px;box-shadow:0 10px 26px rgba(0,0,0,.45);display:flex;flex-direction:column;
}
.menu-pop a{padding:8px 10px;border-radius:5px;color:var(--body);font-size:14px}
.menu-pop a:hover{background:rgba(182,130,53,.08);color:var(--link-hover)}
.menu-pop .sep{height:1px;background:var(--rule);margin:4px 2px}
.board-col{position:relative;min-width:0}
.board-row{display:flex;gap:6px;align-items:stretch}
.evalbar{
  width:14px;flex:none;border-radius:3px;position:relative;background:#403d38;z-index:2;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.evalbar-fill{position:absolute;left:0;right:0;bottom:0;background:#e9e5dc;transition:height .45s ease;border-radius:3px}
.evalbar.flip .evalbar-fill{bottom:auto;top:0}
.evalbar-label{
  position:absolute;left:0;min-width:100%;box-sizing:border-box;white-space:nowrap;text-align:center;
  font-size:10px;line-height:14px;padding:0 3px;border-radius:3px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;font-family:system-ui,sans-serif;font-weight:600;
}
.evalbar-label:empty{display:none}
.evalbar-label.low{bottom:3px;color:#403d38;background:#e9e5dc}
.evalbar-label.high{top:3px;color:#e9e5dc;background:#403d38}
.board-wrap{position:relative;flex:1;min-width:0}
.board{width:100%;display:block;user-select:none;border-radius:4px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4);touch-action:none}
.board rect[data-sq],.board use[data-sq]{cursor:pointer}
#bwrap.static .board{touch-action:pan-y}
#bwrap.static .board rect[data-sq],#bwrap.static .board use[data-sq]{cursor:default}
.board use.drag-src{opacity:.35}
.anim-piece{transition:transform .22s ease;will-change:transform}
.drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.drag-ghost svg{width:100%;height:100%}
.promo-card{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(15,14,12,.72);
}
.promo-in{display:flex;gap:10px;background:rgba(15,14,12,.92);border:1px solid var(--gold);border-radius:6px;padding:12px 16px}
.promo-opt{width:52px;height:52px;border:1px solid var(--edge);border-radius:4px;display:flex;cursor:pointer}
.promo-opt:hover{border-color:var(--gold)}
.promo-opt svg{width:100%;height:100%}
.panel{min-width:0;display:flex;flex-direction:column}
.ctx{font-size:13px;color:var(--secondary);margin:0 0 6px;line-height:1.45}
.ctx b{color:var(--primary);font-weight:400}
.ctx .tag{color:var(--gold-quiet)}
.task{font-family:var(--font-display);font-size:27px;line-height:1.15;color:var(--display);margin:4px 0 6px}
.stakes{font-size:14.5px;color:var(--body);margin:0 0 14px}
.verdict{font-size:16px;margin:4px 0 10px;min-height:1.4em;color:var(--primary)}
.verdict b{font-weight:600}
.verdict-good{color:var(--win)}
.verdict-bad{color:var(--loss)}
.verdict-mid{color:var(--link-hover)}
.checking{
  display:flex;align-items:center;gap:10px;font-size:15px;color:var(--gold-quiet);margin:4px 0 10px;
}
.checking .meter{flex:0 0 120px;height:4px;border-radius:2px;background:var(--rule);overflow:hidden;position:relative}
.checking .meter i{position:absolute;top:0;bottom:0;width:40%;background:var(--gold);border-radius:2px;animation:sweep 1s ease-in-out infinite}
@keyframes sweep{0%{left:-40%}100%{left:100%}}
.acts-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:6px 0 4px}
.hint-note{font-size:14px;color:var(--link-hover);margin:6px 0 8px;border-left:2px solid var(--gold);padding-left:10px}
.lines{margin:10px 0 6px}
.line-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.line-tab{
  font-size:12.5px;padding:5px 10px;border-radius:5px;border:1px solid var(--rule);color:var(--secondary);cursor:pointer;
}
.line-tab:hover{color:var(--link-hover)}
.line-tab.on{border-color:var(--gold);color:var(--display);background:rgba(182,130,53,.07)}
.line-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-btn{border:1px solid var(--edge);border-radius:5px;padding:2px 12px;font-size:16px;color:var(--body);line-height:1.4;cursor:pointer}
.nav-btn:hover{border-color:var(--gold)}
.nav-off{opacity:.35;pointer-events:none}
.moves{display:flex;flex-wrap:wrap;gap:2px 7px;font-size:14px;color:var(--secondary);font-variant-numeric:tabular-nums}
.mv{color:var(--secondary);cursor:pointer;padding:0 1px;border-bottom:1px solid transparent}
.mv:hover{color:var(--link-hover)}
.mv-n{color:var(--dim)}
.mv-on{color:var(--link-hover);border-bottom-color:var(--gold)}
.mv-bad{color:var(--loss)}
.explain{font-size:15px;color:var(--primary);margin:10px 0 8px;line-height:1.5}
.explain .sub{display:block;font-size:13.5px;color:var(--secondary);margin-top:4px}
.missed-it{font-size:13px;color:var(--win)}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);border-radius:14px;padding:3px 11px;font-size:12.5px;color:var(--gold-quiet);cursor:pointer}
.pchip:hover{border-color:var(--gold);color:var(--link-hover)}
.habit{font-size:13.5px;color:var(--body);margin:10px 0 4px;border-left:2px solid var(--gold-quiet);padding-left:10px}
.next-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.run{display:inline-flex;align-items:center;gap:4px}
.run-step{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold-quiet)}
.run-won{background:var(--gold);border-color:var(--gold)}
.run-word{font-size:12.5px;color:var(--secondary);margin-left:4px}
.coach-mark{
  font-size:13px;color:var(--primary);background:rgba(182,130,53,.08);border:1px solid rgba(182,130,53,.35);
  border-radius:8px;padding:10px 12px;margin:0 0 12px;
}
.coach-mark ol{margin:4px 0 6px 18px;padding:0}
.coach-mark li{margin:2px 0}
@media (max-width:860px){
  .card{grid-template-columns:1fr;gap:12px}
  .board-col{margin:0 calc(-1 * var(--gutter))}
  .board-row{gap:0}
  .board{border-radius:0}
  .evalbar{width:10px;border-radius:0}
  .panel{padding-bottom:84px}
  .sticky-acts{
    position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(27,26,23,.97);
    border-top:1px solid var(--rule);padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;
  }
  .sticky-acts .btn-big{flex:1;min-width:0;padding:13px 16px}
  .sticky-acts{flex-wrap:nowrap}
  .sticky-acts > *{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task{font-size:24px}
  /* thumbs: room around the small controls */
  .card-menu > a{display:inline-flex;min-width:44px;min-height:40px;align-items:center;justify-content:flex-end}
  .sheet .close{padding:10px;margin:-10px -10px 0 0}
  .mv{padding:8px 3px}
  .line-tab{padding:10px 12px}
  .pchip{padding:9px 12px}
  .bar-right a,.brand-out{padding:10px 0}
}

/* insights ───────────────────────────────────────────────────────────── */
.ins{max-width:860px;padding:24px 0 10px}
.ins h2{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15;color:var(--display);margin:4px 0 8px}
.ins .lead{font-size:15.5px;color:var(--body);margin:0 0 18px;max-width:40em}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.fam{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:10px;cursor:pointer;display:block;color:inherit}
.fam:hover{border-color:var(--edge);color:inherit}
.fam-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fam-name{font-family:var(--font-display);font-size:21px;color:var(--display)}
.fam-cost{font-size:13.5px;color:var(--loss);white-space:nowrap}
.fam-cost.none{color:var(--secondary)}
.fam-sub{font-size:13.5px;color:var(--secondary);margin:4px 0 0}
.fam-types{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:8px;color:var(--body)}
.fam-types span b{color:var(--primary);font-weight:400}
.meter-row{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--rule);margin-top:10px;max-width:360px}
.meter-row i{display:block;height:100%}
.m-learned{background:var(--win)}
.m-practice{background:var(--gold)}
.slice{border-left:2px solid var(--gold-quiet);padding:4px 0 4px 14px;margin:0 0 16px}
.slice p{margin:0 0 6px;font-size:15px;color:var(--primary)}
.slice .n{font-size:12.5px;color:var(--dim)}
.mrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.mrow-l{flex:0 0 58px;color:var(--secondary);white-space:nowrap}
.mrow-bar{flex:1 1 auto;max-width:320px;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.mrow-bar i{display:block;height:100%;background:var(--gold-quiet);border-radius:4px}
.mrow-v{flex:0 0 auto;color:var(--primary);white-space:nowrap;font-variant-numeric:tabular-nums}
.peer-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.peer-row b{font-weight:400;color:var(--primary)}

/* sheet (pattern details, what's new) ────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{
  width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--raised);border:1px solid var(--rule);
  border-radius:14px 14px 0 0;padding:22px 22px 28px;box-shadow:0 -10px 30px rgba(0,0,0,.45);
}
@media (min-width:700px){.sheet{border-radius:12px}}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);margin:4px 0 6px}
.sheet .close{float:right;font-size:22px;line-height:1;color:var(--secondary)}
.sheet p{font-size:14.5px}
.ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:12px 0}
.ex{cursor:pointer}
.ex .board{box-shadow:none;border-radius:4px}
.ex span{display:block;font-size:12px;color:var(--secondary);margin-top:4px;line-height:1.3}

/* settings ───────────────────────────────────────────────────────────── */
.settings{border-top:1px solid var(--rule);margin-top:30px;padding-top:20px}
.settings h2{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);margin:0 0 4px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 40px}
.set-block{border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:18px}
.set-block > .kicker{display:block;margin-bottom:6px}
.set-block p{font-size:13.5px;color:var(--secondary);margin:0 0 8px}
.check{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:14px;cursor:pointer;color:var(--body)}
.check input{accent-color:var(--gold);margin:0}

/* footer, notices ────────────────────────────────────────────────────── */
.foot{max-width:1180px;margin:40px auto 0;padding:14px var(--gutter) 22px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.foot-line{font-size:12.5px;color:var(--dim)}
.foot-links{display:flex;gap:20px;font-size:12.5px;flex-wrap:wrap}
.foot-links a{color:var(--gold-quiet)}
.notice{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
  background:var(--raised);border:1px solid var(--edge);border-radius:6px;
  padding:10px 16px;font-size:13.5px;color:var(--body);max-width:min(90vw,560px);
}
@media (max-width:860px){.notice{bottom:86px}}
.loading{color:var(--dim);font-size:14px;padding:6px 0}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  .checking .meter i{animation:none !important;left:0;width:100%;opacity:.5}
}
.sheet{overscroll-behavior:contain}
.kb-move{position:absolute;left:-9999px;top:auto}
.kb-move:focus-within{position:static;display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--secondary)}
.kb-move input{background:var(--raised);border:1px solid var(--edge);border-radius:5px;color:var(--primary);padding:7px 9px;font:inherit;width:9em}
.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){
  .ratings{display:none}
  .brand-name{font-size:20px}
  .brand{gap:8px}
  .hero-top .week{flex-direction:row;align-items:center;gap:8px;margin:-4px 0 14px}
}
.card-task{display:none}
@media (max-width:860px){
  .card-task{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-basis:100%;
    font-size:14.5px;line-height:1.35;color:var(--primary);margin:-2px 0 2px}
  .card-task.bad{color:#e0968c}
  .card-task.good{color:#9fcf8a}
}
.sticky-nav{display:none}
@media (max-width:860px){
  .sticky-acts .sticky-nav{display:inline-flex;flex:0 0 44px;justify-content:center;align-items:center;height:46px;font-size:22px}
  .card-task.good{color:var(--primary)}
  .card-task.good b{color:#9fcf8a;font-weight:400}
}
</style>

           at most one every five minutes */

         surfaces as an opaque redirect rather than silently becoming HTML. */

/* ── 6. Game cache and normalisation ─────────────────────────────────── */
/* Raw exports with clocks and evals are far too big for localStorage, so each

/* Mirrors baselines.py move for move: same 1500cp clamp, same 1000cp cap on a

  if (!analysis || analysis.length < 10) return null;
  var sign = meIsWhite ? 1 : -1;
  var prev = 20, best = -10000, worst = 10000;
  var lossSum = 0, lossN = 0;

  var accs = [], phAcc = { o: [], m: [], e: [] }, ta = [];
  var pieces = {};

  var oppJustDropped = false;
  for (var i = 0; i < analysis.length; i++) {
    var cp = evalCp(analysis[i]);
    if ((i % 2 === 0) === meIsWhite) {
      var d = meIsWhite ? (prev - cp) : (cp - prev);
      d = Math.max(0, Math.min(1000, d));
      lossSum += d; lossN++;
      var k = i < 30 ? 'o' : (i < 60 ? 'm' : 'e');
      bs[k][0] += d; bs[k][1]++;

      var wb = winPct(meIsWhite ? prev : -prev);
      var wa = winPct(meIsWhite ? cp : -cp);
      var a = moveAcc(wb, wa);
      accs.push(a);
      phAcc[k].push(a);

      var owa = winPct(meIsWhite ? -cp : cp);

    acpl: Math.round(lossSum / lossN),

    accM: phAcc.m.length >= 3 ? mean(phAcc.m) : null,
    accE: phAcc.e.length >= 3 ? mean(phAcc.e) : null,

/* ── 8b2. The reply book ─────────────────────────────────────────────────
   From the same open database: for ~2,700 opening positions, the moves
   players in each rating band actually answer with, count and White-score.
   This is what lets the openings trainer play the opponent you will really
   face, offline, with no request to anyone. Prefix-keyed in the blob;
   converted to FEN-keyed maps (merging transpositions) lazily below.       */



/* chess.com and Lichess ratings live on different scales. Published
   equivalences put club-level Lichess numbers a few hundred above
   chess.com's, widest in blitz. All peer/book comparisons band on the
   Lichess-equivalent rating; the site's own rating still displays raw. */
var CC_OFFSET = { bullet: 250, blitz: 300, rapid: 150 };
function bandEquivRating(perf, rating) {
  if (rating == null) return null;
  return isCC() ? rating + (CC_OFFSET[perf] != null ? CC_OFFSET[perf] : 200) : rating;
}
function peerCell(perf, rating) {
  if (!PEER.cells || rating == null) return null;
  var r = bandEquivRating(perf, rating);
  var b = Math.max(800, Math.min(2400, Math.floor(r / 100) * 100));
  return PEER.cells[perf + '|' + b] || null;

    .then(function (text) {
      if (stale(myGen)) return 0;
      var byId = {};
      data.games.forEach(function (g) { byId[g.id] = g; });
      var fed = 0;
      text.split('\n').forEach(function (line) {
        if (!line.trim()) return;
        try {
          var full = JSON.parse(line);
          var g3 = byId[full.id];
          if (g3 && full.moves && scannableAny(g3)) {
            g3.mv = full.moves;
            if (full.clocks) g3.ck = full.clocks;
            fed++;
          }
        } catch (e) {}
      });
      if (fed) saveGames(data.games);
      bulkState.busy = false;
      bulkState.fails = 0;
      return fed;
    })
    .catch(function () {
      bulkState.busy = false;
      bulkState.fails++;
      return 0;
    });
}

/* chess.com's refuel: games that lost their movetext get it back by
   refetching their MONTHS (a couple of cheap GETs), since the single-game
   endpoint is lichess's. */
function ccRefuel() {
  bulkState.busy = true;
  bulkState.at = Date.now();
  var myGen = gen;
  var months = {};
  data.games.forEach(function (g) {
    if (!scannableAny(g) || g.mv) return;
    var d = new Date(g.ts);
    var ym = d.getUTCFullYear() + '/' + String(d.getUTCMonth() + 1).padStart(2, '0');
    months[ym] = 1;
  });
  var list = Object.keys(months).sort().reverse().slice(0, 3);
  if (!list.length) { bulkState.busy = false; return Promise.resolve(0); }
  var byId = {};
  data.games.forEach(function (g) { if (!g.mv && scannableAny(g)) byId[g.id] = g; });
  var fed = 0;
  var chain = Promise.resolve();
  list.forEach(function (ym) {
    chain = chain.then(function () {
      if (stale(myGen)) return;
      return ccJSON('/player/' + encodeURIComponent(cfg.user) + '/games/' + ym, { quiet: true })
        .then(function (mo) {
          (mo.games || []).forEach(function (raw) {
            var shaped = ccShape(raw);
            if (!shaped) return;
            var g2 = byId[shaped.id];
            if (g2 && shaped.moves) {
              g2.mv = shaped.moves;
              if (shaped.clocks) g2.ck = shaped.clocks;
              delete g2.mvMiss;
              fed++;
            }
          });
          /* this month has now been read in full: any of its games still
             without movetext truly has no copy to fetch */
          Object.keys(byId).forEach(function (id2) {
            var g6 = byId[id2];
            if (g6.mv) return;
            var d6 = new Date(g6.ts);
            var ym6 = d6.getUTCFullYear() + '/' + String(d6.getUTCMonth() + 1).padStart(2, '0');
            if (ym6 === ym) g6.mvMiss = 1;
          });
        }).catch(function () {});
    });
  });
  return chain.then(function () {
    if (!stale(myGen) && fed) saveGames(data.games);
    bulkState.busy = false;
    return fed;
  });
}

function autoScan() {
  var tr = function () {};
  if (!cfg.user) { scanState.running = false; scanState.pending = false; return; }
  if (scanState.running || SF.state === 'failed') { tr('busy/failed'); return; }
  /* the scan is the politest customer in the shop: it waits out any backoff
     with room to spare rather than being the thing that causes one */
  if (Date.now() < backoffUntil) {
    tr('backoff');
    setTimeout(autoScan, backoffUntil - Date.now() + 30000);
    return;
  }
  var target = nextScanTarget();
  if (!target) { tr('no-target'); scanState.current = null; scanState.pending = false; renderAnalysisStatus(); return; }
  if (!target.mv && bulkAllowed()) {
    /* refuel first, the same games come back fetchless in a few seconds */
    scanState.running = true;
    renderAnalysisStatus();
    bulkRetain().then(function (fed) {
      scanState.running = false;
      setTimeout(autoScan, fed ? 800 : 1500);
    });
    return;
  }
  if (isCC() && !target.mv) {
    if (!bulkState.busy && bulkState.fails < 3 && Date.now() - bulkState.at > 60000) {
      tr('ccRefuel');
      scanState.running = true;
      renderAnalysisStatus();
      ccRefuel().then(function (fed) {
        scanState.running = false;
        if (fed) bulkState.fails = 0; else bulkState.fails++;
        setTimeout(autoScan, fed ? 300 : 1000);
      });
      return;
    }
    /* refuel is cooling down: wait for its window rather than branding
       the game, only a refetched month that truly lacks the game may
       mark mvMiss (ccRefuel does that precisely) */
    tr('mv-wait');
    setTimeout(autoScan, 8000);
    return;
  }
  tr('scan:' + target.id);
  scanState.running = true;
  scanState.current = target;
  scanState.lastLocal = !!(target.mv && !target.bl);
  renderAnalysisStatus();
  scanGame(target)
    .catch(function (e) { if (window.console) console.error('scan fail', e && e.message); scanMiss(target); })
    .then(function () {
      scanState.running = false;
      /* the fish stays awake through the breather between games, grey means
         genuinely done (or the engine failed), never "between bites" */
      scanState.pending = !!nextScanTarget();
      scanState.done++;
      renderAnalysisStatus();
      /* the expensive work, serializing the cache, re-mining the trainer's
         queues, batches across scans instead of taxing every completion */
      if ((scanState.dirty || 0) >= 5 || !scanState.pending) {
        scanState.dirty = 0;
        flushSave();
        if (ui.view === 'insights' && !ui.session) renderInsights();
        if (!scanState.pending) setTimeout(autoEnrich, 500);
      }
      setTimeout(autoScan, scanState.lastLocal ? 150 : 20000);
    });
}






/* A player who mostly blitzes still deserves a real rapid read: after the
   main window lands, any tracked format sitting under its floor gets its
   own quiet per-format fetch, merged and deduped in the background. */
function retainMovetext() {
  var kept = {};
  /* count what is already retained so repeat passes respect the cap */
  data.games.forEach(function (g) {
    if (g.mv && !g.bl && !g.scanned && !g.analysed) kept[g.perf] = (kept[g.perf] || 0) + 1;
  });
  data.games.forEach(function (g) {
    if (!g.mvTmp) return;
    if (!g.analysed && !g.scanned && !g.bl && !g.mv && g.plies >= 6
        && (isCC() || (kept[g.perf] || 0) < RETAIN_PER_FORMAT)) {
      g.mv = g.mvTmp;
      if (g.ckTmp) g.ck = g.ckTmp;
      kept[g.perf] = (kept[g.perf] || 0) + 1;
    }
    delete g.mvTmp;
    delete g.ckTmp;
  });
}

function topUpFormats() {
  if (isCC()) return;   /* the archive walker enforces the floors itself */
  if (data.sections.games !== 'ok') return;
  data.topups = data.topups || {};
  var meId = String(cfg.user).toLowerCase();
  var myGen = gen;
  var chain = Promise.resolve();
  trackedPerfs().forEach(function (p) {
    var have = 0;
    data.games.forEach(function (g) { if (g.perf === p) have++; });
    if (have >= cfg.perFormat || data.topups[p]) return;
    data.topups[p] = 1;
    chain = chain.then(function () {
      if (stale(myGen)) return;
      return getND('/api/games/user/' + encodeURIComponent(cfg.user)
          + '?perfType=' + p + '&' + GAME_PARAMS + '&max=' + cfg.perFormat,
        function (g) {
          var c = compact(g, meId);
          if (c) data.games.push(c);
        }, { quiet: true }
      ).then(function () {
        if (stale(myGen)) return;
        var seen = {};
        data.games = data.games.filter(function (g) {
          if (seen[g.id]) return false;
          seen[g.id] = 1;
          return true;
        }).sort(function (a, b) { return b.ts - a.ts; });
        retainMovetext();
        saveGames(data.games);
        modelDirty();
        renderAll();
      }).catch(function () {
        /* a rate-limited top-up retries once the backoff clears, a format
           must not stay starved because one fetch hit a 429 */
        setTimeout(function () {
          if (stale(myGen)) return;
          delete data.topups[p];
          topUpFormats();
        }, 90000);
      });
    });
  });
}

/* ── 15. Loading ─────────────────────────────────────────────────────── */
/* Slow-moving data persists across visits: profiles, peaks and tournament
   schedules do not change by the minute, so they should not be fetched by
   the minute. Serve the stored copy inside its TTL and skip the network
   entirely; past the TTL, fetch and re-store. Rated games stay on their own
   incremental path. */
function cachedJSON(key, ttlMs, fetcher) {
  var k = 'nl:cache:' + key;
  var hit = store.get(k, null);
  if (hit && hit.at && Date.now() - hit.at < ttlMs) return Promise.resolve(hit.v);
  return fetcher().then(function (v) {
    store.set(k, { at: Date.now(), v: v });
    return v;
  }).catch(function (err) {
    if (hit) return hit.v;          /* stale beats an error */
    throw err;
  });
}

function loadUser() {
  var myGen = gen;
  data.sections.user = 'loading';
  return cachedJSON('user:' + cfg.src + ':' + String(cfg.user).toLowerCase(), 30 * 60 * 1000, function () {

    return ccJSON('/player/' + encodeURIComponent(cfg.user)).then(function (prof) {
      return ccJSON('/player/' + encodeURIComponent(cfg.user) + '/stats').then(function (st) {

        [['chess_bullet', 'bullet'], ['chess_blitz', 'blitz'], ['chess_rapid', 'rapid']]
          .forEach(function (pair) {
            var v = st[pair[0]];
            if (!v || !v.last) return;
            var rec = v.record || {};
            perfs[pair[1]] = {

      ['rapid','blitz','bullet'].forEach(function (k) {

      });

        + (bits.length ? ': ' + bits.join(', ') : '') + '.');

    }
    data.sections.user = 'ok';
    renderHeader();
  }).catch(function (err) {
    if (stale(myGen)) return;
    data.sections.user = 'fail';

    /* only a true 404 means the account is wrong, a rate limit or a bad

    if (err && err.code === 404) notice((isCC() ? 'chess.com' : 'lichess') + ' has no account called ' + cfg.user + '.');
  });
}


/* The rating curve is reconstructed from the games we already hold: the rating
   after a game is the rating it was played at plus its diff. No extra request,
   and it moves with whatever game window is loaded. */
function buildSeries() {
  data.series = {};
  data.deltas = {};
  var midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  var cut = Date.now() - 90 * 864e5;

  trackedPerfs().forEach(function (p) {
    var list = data.games.filter(function (g) { return g.perf === p && g.myR; }).slice().reverse();
    if (!list.length) return;
    var rating = function (g) { return g.myR + (g.rd || 0); };
    var recent = list.filter(function (g) { return g.ts >= cut; });
    data.series[p] = {
      points: recent.length >= 2 ? recent.map(rating) : list.slice(-12).map(rating)
    };
    /* the product's one progress window: the past 30 days, same as the
       blunder trend. Baseline = rating after the last game older than 30d,
       or the pre-rating of the oldest in-window game for newer accounts. */
    var monthCut = Date.now() - 30 * 864e5;
    var older = list.filter(function (g) { return g.ts < monthCut; });
    var inWin = list.filter(function (g) { return g.ts >= monthCut; });
    if (inWin.length) {
      var base = older.length ? rating(older[older.length - 1]) : inWin[0].myR;
      var cur = data.user && data.user.perfs && data.user.perfs[p]
        ? data.user.perfs[p].rating : rating(list[list.length - 1]);
      data.deltas[p] = cur - base;
    }
  });
}


/* The annotated 1000-game export takes Lichess several seconds to even
   begin sending. The theater cannot wait for that: a 12-game moves-only
   fetch returns instantly and fills the boards while the big one warms up. */
function loadNarrPreview() {
  /* chess.com has no cheap last-N endpoint, and asking LICHESS for a
     chess.com username can stream a stranger's games onto the boards -
     the archive walker feeds the strip itself, games arrive with month 1 */
  if (isCC()) return Promise.resolve();
  if (!data.narrate || (data.narrPreview && data.narrPreview.length >= 3)) return Promise.resolve();
  var myGen = gen;
  var got = [];
  return getND('/api/games/user/' + encodeURIComponent(cfg.user)
      + '?max=12&moves=true&perfType=' + trackedPerfs().join(','),
    function (g) {
      if (!g.moves || (g.variant && g.variant !== 'standard')) return;
      var w = g.players && g.players.white, b = g.players && g.players.black;
      if (!w || !b) return;
      var meWhite = !!(w.user && w.user.id === String(cfg.user).toLowerCase());
      var opp = meWhite ? b : w;
      got.push({
        op16: g.moves.split(' ').slice(0, 16).join(' '),
        mv40: g.moves.split(' ').slice(0, 40).join(' '),
        color: meWhite ? 'white' : 'black',
        opp: (opp.user && (opp.user.name || opp.user.id)) || 'Anonymous'
      });
    }
  ).then(function () {
    if (stale(myGen) || !data.narrate) return;
    data.narrPreview = (got.concat(data.narrPreview || [])).slice(0, 15);
    var stage0 = el('narr-stage');
    if (stage0 && !stage0.firstChild && data.narrPreview.length >= 3) {
      stage0.innerHTML = narrBoards();
    }
  }).catch(function () {});
}

function loadGames() {
  var myGen = gen;
  data.sections.games = 'loading';
  data.gamesErr = null;
  data.gamesCount = 0;
  renderHeader(); renderFoot();
  var meId = String(cfg.user).toLowerCase();

  return fetchGames(meId, function (n, c2) {
    if (stale(myGen)) return;
    data.gamesCount = n;
    if (data.narrate) {
      if (c2 && c2.op16) {
        data.narrPreview = data.narrPreview || [];
        if (data.narrPreview.length < 15) data.narrPreview.push(c2);
        /* mount the strip THE MOMENT there is enough to show, the polling
           timer gets starved while the stream chews through games, so this
           cannot wait for it */
        if (data.narrPreview.length === 3) {
          var stage0 = el('narr-stage');
          if (stage0 && !stage0.firstChild) stage0.innerHTML = narrBoards();
        }
      }
      if (!data.narrStart) data.narrStart = Date.now();
      /* one DOM write per ~15 games, not per game, the stream must not
         starve the paint */
      if (n % 15 === 0 || n < 5) {
        var limit = data.progressTarget || readTarget();
        var pctDone = Math.min(100, Math.round(n * 100 / limit));
        var eta = '';
        var elapsed = (Date.now() - data.narrStart) / 1000;
        if (n > 50 && elapsed > 2) {
          var rate = n / elapsed;
          var left = Math.max(0, (limit - n) / rate);
          eta = left < 8 ? ' · nearly there' : ' · about ' + (Math.round(left / 5) * 5) + 's left';
        }
        if (!n && typeof c2 === 'number' && c2 > 2) {
          /* a dormant account: months are being walked with nothing kept
             yet, show the depth so the search never looks frozen */
          narrLine('games', 'Searching your archives… <span class="tnum">' + c2
            + '</span> months back<span class="dim"> · looking for your rated games</span>');
        } else {
          narrLine('games', 'Reading your games… <span class="tnum">' + n + ' / ' + limit + '</span>'
            + '<span class="dim">' + eta + '</span>'
            + '<span class="narr-bar"><span class="narr-fill" style="width:' + pctDone + '%"></span></span>');
        }
      }
    }
    /* Cheap: only the two places that show a count. */
    if (n % 25 === 0) { renderFoot(); if (data.games.length) renderHeader(); }
  }, function (partial) {
    if (stale(myGen)) return;
    data.games = partial;
    modelDirty();
    buildSeries();
    renderHeader();
    if (!data.narrate) renderTrain();
  }).then(function (payload) {
    if (stale(myGen)) return;
    data.games = payload.games;
    data.sections.games = 'ok';
    if (data.narrate) {
      var totalRead = payload.games.length;
      var byP = {};
      payload.games.forEach(function (g2) { byP[g2.perf] = (byP[g2.perf] || 0) + 1; });
      var perBits = trackedPerfs().map(function (p2) {
        return perfLabel(p2) + ' <span class="tnum">' + (byP[p2] || 0) + '</span>';
      }).join(' · ');
      narrLine('games', (totalRead < windowCap() && payload.all !== false
        ? 'Read every rated game you have: '
        : 'Read your recent rated games: ') + perBits + '.');
    }
    computeGreeting();
    modelDirty();
    buildSeries();
    retainMovetext();
    saveGames(data.games);
    renderHeader(); renderFoot();
    if (!data.narrate) { renderTrain(); renderInsights(); renderViews(); }
    topUpFormats();
    setTimeout(autoScan, 800);   /* fresh games always wake the engine */
  }).catch(function (err) {
    if (stale(myGen)) return;
    data.sections.games = 'fail';
    data.gamesErr = err && err.code === 429 ? 'The site asked us to slow down. Try again in a minute.' : '';
    renderTrain(); renderFoot();
  });
}


/* Your record against whoever is across the board right now. Public, cheap,
   and the single most interesting thing to know mid-game. */






/* ── Proper SAN, FEN parsing, material ─────────────────────────────────────
   Standard algebraic notation with every detail a reader expects: capture
   marks, file for pawn captures, disambiguation, promotion, check and mate. */
function sqName(sq) { return String.fromCharCode(97 + sq % 8) + (1 + (sq >> 3)); }
function sqIndex(name) { return (name.charCodeAt(1) - 49) * 8 + (name.charCodeAt(0) - 97); }
function moveUci(m) { return sqName(m.from) + sqName(m.to) + (m.promo ? m.promo.toLowerCase() : ''); }
function sanOf(st, m) {
  var p = st.b[m.from];
  if (!p) return '?';
  var u = p.toUpperCase(), s;
  if (m.castle) s = m.castle;
  else {
    var capture = m.ep >= 0 || st.b[m.to] != null;
    if (u === 'P') {
      s = (capture ? String.fromCharCode(97 + m.from % 8) + 'x' : '') + sqName(m.to)
        + (m.promo ? '=' + m.promo : '');
    } else {
      var rivals = legalMoves(st).filter(function (o) {
        return o.to === m.to && o.from !== m.from && st.b[o.from] === p;
      });
      var dis = '';
      if (rivals.length) {
        var sameFile = rivals.some(function (o) { return o.from % 8 === m.from % 8; });
        var sameRank = rivals.some(function (o) { return (o.from >> 3) === (m.from >> 3); });
        if (!sameFile) dis = String.fromCharCode(97 + m.from % 8);
        else if (!sameRank) dis = String(1 + (m.from >> 3));
        else dis = sqName(m.from);
      }
      s = u + dis + (capture ? 'x' : '') + sqName(m.to);
    }
  }
  var after = cloneState(st);
  applyMove(after, m);
  if (checkedKingSq(after) != null) s += legalMoves(after).length ? '+' : '#';
  return s;
}
function stateFromFen(fen) {
  var parts = String(fen).trim().split(/\s+/);
  var b = new Array(64).fill(null);
  var rows = parts[0].split('/');
  if (rows.length !== 8) return null;
  for (var r = 0; r < 8; r++) {
    var f = 0, row = rows[r];
    for (var i = 0; i < row.length; i++) {
      var c = row[i];
      if (c >= '1' && c <= '8') f += +c;
      else { if (f > 7) return null; b[(7 - r) * 8 + f] = c; f++; }
    }
  }
  return {
    b: b, w: parts[1] !== 'b', cast: parts[2] && parts[2] !== '-' ? parts[2] : '',
    ep: parts[3] && parts[3] !== '-' ? sqIndex(parts[3]) : -1,
    half: +(parts[4] || 0), full: +(parts[5] || 1)
  };
}
/* play a UCI line from a state: SAN labels, states after each move, the moves */
function playUci(st0, ucis) {
  var st = cloneState(st0), out = { san: [], states: [], moves: [], uci: [] };
  for (var i = 0; i < (ucis || []).length; i++) {
    var m = uciToMove(st, ucis[i]);
    if (!m) break;
    out.san.push(sanOf(st, m));
    applyMove(st, m);
    out.states.push(cloneState(st));
    out.moves.push(m);
    out.uci.push(ucis[i]);
  }
  return out;
}
/* material in pawns, from White's side (+ = White ahead) */
function materialDiff(b) {
  var d = 0;
  for (var i = 0; i < 64; i++) {
    var p = b[i];
    if (!p) continue;
    var v = PIECE_VAL[p.toUpperCase()];
    if (v === 99) continue;
    d += isW(p) ? v : -v;
  }
  return d;
}

/* ── Motifs: what a line of moves actually does ─────────────────────────────
   Deterministic tactic detection on our own move generator, ported from the
   rules of the lichess puzzle tagger (ornicar/lichess-puzzler, cook.py), so
   the names match what players already know from lichess puzzle themes.
   A "line" is judged from one side's point of view (pov): the side whose
   moves are the idea. line.nodes[0] is the move that set it up (the game
   move, or a null move), then the pov side and the other side alternate. */

var MOTIF_VAL = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 99 };

function pieceAt(b, sq) { return sq >= 0 && sq < 64 ? b[sq] : null; }
function pType(p) { return p ? p.toUpperCase() : null; }
function colorW(p) { return p >= 'A' && p <= 'Z'; }

/* every square the piece on `sq` attacks (sliders stop at the first piece) */
function attacksFrom(b, sq) {
  var p = b[sq];
  if (!p) return [];
  var u = pType(p), w = colorW(p), f = sq % 8, r = sq >> 3, out = [], i, d, tf, tr;
  if (u === 'P') {
    var dr = w ? 1 : -1;
    [-1, 1].forEach(function (df) {
      if (sqOk(f + df, r + dr)) out.push((r + dr) * 8 + f + df);
    });
    return out;
  }
  if (u === 'N' || u === 'K') {
    var steps = u === 'N' ? KNIGHT_D : BISHOP_D.concat(ROOK_D);
    for (i = 0; i < steps.length; i++) {
      tf = f + steps[i][0]; tr = r + steps[i][1];
      if (sqOk(tf, tr)) out.push(tr * 8 + tf);
    }
    return out;
  }
  var rays = u === 'B' ? BISHOP_D : (u === 'R' ? ROOK_D : BISHOP_D.concat(ROOK_D));
  for (i = 0; i < rays.length; i++) {
    d = rays[i]; tf = f + d[0]; tr = r + d[1];
    while (sqOk(tf, tr)) {

  if (a.phase !== 'done') ss.results[a.key + (again ? '#r' : '')] = 'skip';

}
/* "not a real mistake": the card leaves the queue and the statistics */
function disputeCard(reason) {
  var ss = ui.session, a = ss && ss.active;
  if (!a) return;
  a.it.b.x = 'user:' + reason;
  srsHide(a.it);
  modelDirty();
  saveGames(data.games);
  notice('Removed. It won\'t come back or count in your stats.');
  if (a.phase !== 'done') ss.results[a.key + (ss_relearn(a) ? '#r' : '')] = 'skip';
  nextCard();
}

/* ── after answering: stepping through the lines ────────────────────────── */
function lineView(a) {
  var v = a.view || { line: 'best', idx: -1 };
  var L = a.lines && a.lines[v.line];
  if (!L || !L.states.length) return { st: a.pre, last: a.preLast, ev: a.it.b.eb };
  if (v.idx < 0) return { st: a.pre, last: a.preLast, ev: a.it.b.eb };
  var i = Math.min(v.idx, L.states.length - 1);
  return { st: L.states[i], last: [L.moves[i].from, L.moves[i].to], ev: L.ev[i] != null ? L.ev[i] : a.it.b.eb };
}
function stepView(d) {
  var a = ui.session && ui.session.active;
  if (!a || a.phase !== 'done' || !a.lines) return;
  var L = a.lines[a.view.line];
  if (!L) return;
  a.explore = null;
  stopAuto(a);
  a.view.idx = Math.max(-1, Math.min(L.states.length - 1, a.view.idx + d));
  if (d > 0) snd('move');
  renderCard();
}
/* after the answer, the board is free: try your own ideas, the bar follows */
function exploreClick(sq) {
  var a = ui.session.active, ex = a.explore;
  var p = ex.st.b[sq];
  if (p && isW(p) === ex.st.w) { ex.sel = ex.sel === sq ? -1 : sq; renderCard(); return; }
  if (ex.sel < 0) return;
  var legal = legalMoves(ex.st).filter(function (m) { return m.from === ex.sel && m.to === sq; });
  ex.sel = -1;
  if (!legal.length) { renderCard(); return; }
  var m = legal[0];
  ex.san.push(sanOf(ex.st, m));
  applyMove(ex.st, m);
  ex.last = [m.from, m.to];
  ex.ev = null;
  snd('move');
  renderCard();
  var cardKey = a.key, fen = stateFen(ex.st);
  engineEvalCached(fen, { nodes: EXT_NODES }, true).then(function (r) {
    var a2 = ui.session && ui.session.active;
    if (!a2 || a2.key !== cardKey || !a2.explore || stateFen(a2.explore.st) !== fen) return;
    a2.explore.ev = r.cp * (myPov(a2.it) ? 1 : -1);
    a2.explore.reply = r.bestUci;
    renderCard();
  }, function () {});
}
function startExplore() {
  var a = ui.session && ui.session.active;
  if (!a || a.phase !== 'done') return;
  var v = lineView(a);
  a.explore = { st: cloneState(v.st), sel: -1, san: [], last: v.last, ev: v.ev };
  renderCard();
}

/* ── Rendering ──────────────────────────────────────────────────────────────
   Two views (Today, Insights), a sheet for details, settings at the foot.
   The card is built once per position and then updated in place, so the
   evaluation bar animates and background progress never wipes a message. */

function el(id) { return document.getElementById(id); }
/* "1 game", "3 games" */
function plur(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function track(name) {
  try { if (window.clarity) window.clarity('event', name); } catch (e) {}
}
var saveTimer = null, saveCount = 0;

var VIEWS = [['train', 'Today'], ['insights', 'Insights']];

      + v[1] + (v[0] === 'train' && due && !(ui.session && ui.session.active) ? '<span class="badge">' + due + '</span>' : '') + '</a>';

/* ── header ──────────────────────────────────────────────────────────────── */

function deltaBadge(p) {

    + (d > 0 ? '▲' : '▼') + Math.abs(Math.round(d)) + '</span>';
}

/* the engine at work: one small status that never re-renders anything else */
function analysisNumbers() {
  var c = scanCoverage();
  var ready = allMistakes().filter(trainable).length;
  return { covered: c.covered, total: c.total, ready: ready,

}
var lastReadyShown = -1;
function renderAnalysisStatus() {
  var n = analysisNumbers();

  if (ic) {
    ic.textContent = n.working && n.covered < n.total ? 'reading ' + n.covered + '/' + n.total : '';

  var pctDone = Math.round(n.covered * 100 / Math.max(1, n.total));
  if (n.covered >= n.total) return '<span>' + (n.total === 1 ? 'Your game is checked' : 'All ' + n.total + ' of your games are checked') + ' · ' + plur(n.ready, 'mistake') + ' to learn from</span>';
  return '<span>Stockfish has checked ' + n.covered + ' of ' + n.total + ' games</span>'
    + '<span class="bar-line"><i class="bar-fill" style="width:' + pctDone + '%"></i></span>'
    + '<span>' + plur(n.ready, 'mistake') + ' found</span>';
}
function renderEngineState() { renderAnalysisStatus(); }

/* ── Today ───────────────────────────────────────────────────────────────── */
function renderTrain() {
  var box = el('train');
  if (!box || !cfg.user) return;
  var ss = ui.session;
  if (ss && ss.finished) { box.dataset.card = ''; box.innerHTML = doneHtml(ss); return; }
  if (ss) { renderCard(); return; }
  box.dataset.card = '';
  var n = analysisNumbers();
  var gamesLoading = data.sections.games === 'loading';
  if (!data.games.length) {
    box.innerHTML = '<div class="today">' + (gamesLoading
      ? '<p class="loading">Reading your games…</p>'
      : (data.sections.games === 'fail'
        ? '<div class="finding"><h2>We couldn\'t read your games.</h2><p class="sec">' + esc(data.gamesErr || 'The site may be busy.') + '</p><a class="btn-line" data-act="reload">Try again</a></div>'
        : '<div class="finding"><h2>No rated games found.</h2><p class="sec">notlichess reads rated live games (bullet, blitz, rapid' + (isCC() ? '' : ', classical') + '); ' + (isCC() ? 'daily' : 'correspondence') + ' games are not read yet. Play a few rated games on ' + (isCC() ? 'chess.com' : 'lichess') + ', then come back. Your mistakes will be waiting.</p><a class="btn-gold" href="' + playHref(cfg.tcs[0]) + '">Play a game</a></div>'))
      + '</div>';
    return;
  }
  var since = sinceHtml();
  if (n.ready < 3) { box.innerHTML = '<div class="today">' + since + findingHtml(n) + '</div>'; return; }
  var saved = savedSession();
  var day = dayLoad(), due = dueCards().length;
  var doneToday = ((day.sessions || 0) > 0 && !due) || (!saved && !todayPlan().keys.length);
  box.innerHTML = '<div class="today today-grid"><div class="today-main">' + since
    + (saved ? resumeHtml(saved) : (doneToday ? doneTodayHtml() : heroHtml()))
    + focusHtml()

    + '</div>' + latestGamesHtml() + '</div>';
}
/* the latest games, each one a way into its own mistakes */
function latestGamesHtml() {
  var games = data.games.slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, 6);
  if (!games.length) return '';
  var byGame = {};
  allMistakes().forEach(function (it) {
    if (!trainable(it)) return;
    var e = byGame[it.g.id] || (byGame[it.g.id] = { n: 0, lost: false });
    e.n++;
    if (it.b.d) e.lost = true;
  });
  var rows = games.map(function (g) {
    var e = byGame[g.id], res = g.res === 'win' ? 'W' : (g.res === 'loss' ? 'L' : 'D');
    var right;
    if (!covered(g)) right = '<span class="lg-state dim">' + (scannableAny(g) ? 'Not checked yet' : (g.plies < 6 ? 'Too short to check' : 'Could not be read')) + '</span>';
    else if (!e) right = '<span class="lg-state ok">No big mistakes</span>';
    else right = '<span class="lg-state">' + e.n + (e.n === 1 ? ' mistake' : ' mistakes')
      + (e.lost ? '<i>' + (g.res === 'draw' ? 'one cost the win' : 'one cost the game') + '</i>' : '') + '</span>';
    var attrs = e ? ' data-act="drill" data-spec="' + esc(JSON.stringify({ type: 'game', id: g.id, label: 'Game vs ' + g.opp })) + '" role="button"' : '';
    return '<div class="lg-row' + (e ? ' is-open' : '') + '"' + attrs + '>'
      + '<span class="lg-res lg-' + res + '" title="' + esc(g.res) + '">' + res + '</span>'
      + '<span class="lg-who">vs ' + esc(g.opp) + (g.oppR ? ' <span class="dim">' + g.oppR + '</span>' : '')
      + '<small>' + esc(g.perf || '') + ' · ' + agoWords(g.ts) + ' · as ' + g.color + '</small></span>'
      + right + '</div>';
  }).join('');
  return '<aside class="latest" id="latest"><div class="kicker">Your latest games</div>' + rows
    + '<p class="lg-foot dim">Tap a game to go through its mistakes in order.</p></aside>';
}
function agoWords(ts) {
  var d0 = new Date(); d0.setHours(0, 0, 0, 0);
  var days = Math.ceil((d0.getTime() - ts) / DAY);
  if (ts >= d0.getTime()) return 'today';
  if (days <= 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  return gameDateLine({ ts: ts });
}
function sinceHtml() { return data.greeting ? '<p class="since">' + data.greeting + '</p>' : ''; }
function weekHtml() {
  var goal = weekGoal(), done = weekDays(), dots = '';
  var dow = (new Date().getDay() + 6) % 7;
  for (var i = 0; i < 7; i++) {

  }
  return '<div class="week" title="Your weekly goal: ' + goal + ' days"><div class="week-dots">' + dots + '</div>'
    + '<span>' + Math.min(done, 7) + ' of ' + goal + ' days this week</span></div>';
}
function heroHtml() {
  var plan = todayPlan();
  var mins = Math.max(3, Math.round(plan.keys.length * 0.8));
  var reasons = [];
  if (plan.decisive) reasons.push(plan.decisive + (plan.decisive === 1 ? ' move that lost a game' : ' moves that lost games'));
  var reviews = plan.keys.length - plan.fresh;
  if (reviews) reasons.push(reviews + (reviews === 1 ? ' review' : ' reviews'));
  if (plan.fresh - plan.decisive > 0) reasons.push((plan.fresh - plan.decisive) + ' new from your games');

    + '<div class="kicker">Today</div>'

}
function resumeHtml(s) {

function doneTodayHtml() {

  var srs = srsLoad(), next = null;

  return '<div class="hero"><div class="hero-top"><div><div class="kicker">Today</div>'
    + '<h2>' + ((dayLoad().sessions || 0) > 0 ? 'Done for today.' : 'Nothing due right now.') + '</h2><p class="why">' + (next ? 'Your next reviews are due ' + dueWhen(next) + '.' : 'Nothing is due back yet.') + '</p></div>' + weekHtml() + '</div>'
    + '<div class="acts">' + (more ? '<a class="btn-line" data-act="keepGoing">Practise 5 more</a>' : '')
    + '<a class="btn-quiet" href="' + playHref(cfg.tcs[0]) + '">Play a game</a></div></div>';
}
function dueWhen(ts) {
  var days = Math.round((ts - Date.now()) / DAY);
  if (days <= 0) return 'later today';
  if (days === 1) return 'tomorrow';
  return 'in ' + days + ' days';
}
function recentFindsHtml() {
  var list = allMistakes().filter(trainable).slice(0, 5);
  if (!list.length) return '<p class="find dim">Nothing yet. The newest games are read first.</p>';
  return list.map(function (it) {
    return '<p class="find">' + esc(patternInfo(patternOf(it.b)).name) + ' <span class="dim">vs ' + esc(it.g.opp) + ', ' + gameDateLine(it.g) + '</span></p>';

}
function findingHtml(n) {

    return '<div class="finding"><div class="kicker">Finding your mistakes</div><h2>Stockfish could not start in this browser.</h2>'
      + '<p class="sec">It runs inside your browser, and something blocked it (a content blocker, or a very old browser). '
      + (isCC() ? '' : 'Games that lichess has already analysed still work.') + '</p><a class="btn-line" data-act="engineRetry">Try again</a></div>';
  }

  }

  if (done) {

      + '<h2>' + (n.ready === 1 ? 'One mistake' : n.ready + ' mistakes') + ' to learn from.</h2>'
      + '<p class="sec">Play a few more rated games and more will turn up. New games are checked when you come back.</p>'

  }

    + '<p class="status" id="astat">' + analysisLine(n) + '</p>'
    + (can ? '<a class="btn-line" data-act="startToday">Start with ' + can + ' now</a>' : '')
    + '</div>';

function focusHtml() {
  var f = currentFocus();

  var fam = FAMILIES.filter(function (x) { return x.key === f.fam; })[0];

  if (!fam || !agg) return '';

function gameDateLine(g) {

}
function doneHtml(ss) {

/* context from 6.7 million lichess games at your rating (not shown to

function peerHtml() {

  var cell = rating ? peerCell(perf, rating) : null;
  if (!cell) return '';
  var gs = data.games.filter(function (g) { return g.perf === perf; });
  var mine = function (fn) { var m = meanOf(gs, fn); return m && m.n >= 15 ? m.v : null; };
  var rows = [];
  var conv = gs.filter(function (g) { return g.ev && g.ev[1] >= 200; });
  if (conv.length >= 15 && cell.conv != null) rows.push(['Winning positions you convert', Math.round(conv.filter(function (g) { return g.res === 'win'; }).length * 100 / conv.length), cell.conv]);
  var res = gs.filter(function (g) { return g.ev && g.ev[2] <= -200; });
  if (res.length >= 15 && cell.resource != null) rows.push(['Lost positions you save', Math.round(res.filter(function (g) { return g.res !== 'loss'; }).length * 100 / res.length), cell.resource]);
  var ae = mine(function (g) { return g.acc2 ? g.acc2[3] : null; });
  if (ae != null && cell.acc_end != null) rows.push(['Endgame accuracy', Math.round(ae), cell.acc_end]);
  if (!rows.length) return '';
  return '<div class="section-h"><span class="kicker">Next to players at your rating</span><span class="dim" style="font-size:12px">' + perfLabel(perf) + (isCC() ? ', your level' : ' ~' + Math.floor(bandEquivRating(perf, rating) / 100) * 100) + '</span></div>'
    + rows.map(function (r) {
      return '<div class="peer-row"><span>' + r[0] + '</span><span><b>' + r[1] + '%</b> <span class="dim">vs ' + Math.round(r[2]) + '%</span></span></div>';
    }).join('');
}

function autoPerfs(u) {
  var counts = [];
  ['rapid', 'blitz', 'bullet', 'classical'].forEach(function (p) {
    var pf = u && u.perfs && u.perfs[p];
    if (pf && pf.games) counts.push([p, pf.games]);
  });
  if (!counts.length) return ['rapid', 'blitz'];
  var total = counts.reduce(function (a, c) { return a + c[1]; }, 0);
  counts.sort(function (a, b) { return b[1] - a[1]; });
  var pick = counts.filter(function (c) {
    if (c[0] === 'bullet' && counts[0][0] !== 'bullet') return false;
    return c[1] >= 20 && c[1] / total >= 0.1;
  }).map(function (c) { return c[0]; }).slice(0, 2);
  return pick.length ? pick : [counts[0][0]];
}

}

/* old keys from the retired features, and the one-time "what changed" */
function migrateStorage() {
  if (store.get('nl:migrated', 0) >= 2) return;
  var hadV1 = false;
  try {
    var dead = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k) continue;
      /* regenerable caches and old screen flags go; progress in the retired
         trainers (puzzles, opening lines) stays, in case they come back */
      if (k === 'nl:cache:tours' || /^nl:cache:prep:/.test(k)
          || k === 'nl:setSize' || k === 'nl:obDone' || k === 'nl:tcs_edit') dead.push(k);
      if (/^nl:srs:/.test(k)) hadV1 = true;
    }
    dead.forEach(function (k2) { localStorage.removeItem(k2); });
  } catch (e) {}
  if (hadV1) store.set('nl:whatsNew', 1);
  store.set('nl:migrated', 2);
}

             due: dueCards().length, engine: SF.build, state: SF.state };
  }
};
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__nlTest.ev = function (code) { return eval(code); };

/* chess.com games carry their start time in the PGN headers */
function ccStartMs(g) {
  var pgn = g.pgn || '';
  var d = /\[UTCDate "(\d{4})\.(\d{2})\.(\d{2})"\]/.exec(pgn), t = /\[UTCTime "(\d{2}):(\d{2}):(\d{2})"\]/.exec(pgn);
  if (!d || !t) return null;
  var ms = Date.UTC(+d[1], +d[2] - 1, +d[3], +t[1], +t[2], +t[3]);
  return isFinite(ms) && ms > 0 && (!g.end_time || ms <= g.end_time * 1000) ? ms : null;
}
function narrAnimate() {
  var stageTimer = setInterval(function () {
    if (!data.narrate || !el('narr-stage')) { clearInterval(stageTimer); return; }
    var stage = el('narr-stage');
    if (!stage.querySelector('.narr-track')) {
      stage.innerHTML = narrBoards();
      return;
    }
    var live = data.narrLive || [];
    var cards = stage.querySelectorAll('.narr-card');
    if (!live.length || !cards.length) return;
    var now = Date.now();
    var n = live.length;
    var pool = (data.narrPreview && data.narrPreview.length >= 3)
      ? data.narrPreview
      : data.games.filter(function (g) { return g.op16; });
    live.forEach(function (b, i) {
      var pair = [cards[i], cards[i + n]];
      if (b.phase === 'fading') {
        if (now < b.until) return;
        /* the analyzed game leaves; the next one takes its seat */
        data.narrNext = (data.narrNext == null ? live.length : data.narrNext);
        var g2 = pool[data.narrNext % pool.length];
        data.narrNext++;
        if (g2) {
          b.toks = (g2.mv40 || g2.op16).split(' ');
          b.opp = g2.opp;
          b.flip = g2.color === 'black';
        }
        b.st = chessStart(); b.ply = 0;
        b.phase = 'live';
        b.nextAt = now + 350 + Math.random() * 250;
        var freshHtml = boardSvg(b.st, { flip: b.flip });
        pair.forEach(function (c) {
          if (!c) return;
          var old = c.querySelector('svg');
          if (old) old.outerHTML = freshHtml;
          var cap = c.querySelector('.narr-card-cap');
          if (cap && b.opp) cap.textContent = cfg.user + ' vs ' + b.opp;
          c.classList.remove('narr-fade');
        });
        return;
      }
      if (now < b.nextAt || reducedMotion()) return;
      b.nextAt = b.nextAt + 250;              /* steady beat, per-board phase */
      if (now - b.nextAt > 1000) b.nextAt = now + 250;   /* tab was hidden */
      var mv = b.ply < b.toks.length ? sanApply(b.st, b.toks[b.ply]) : null;
      if (!mv) {
        b.phase = 'fading';
        b.until = now + 480;
        pair.forEach(function (c) { if (c) c.classList.add('narr-fade'); });
        return;
      }
      b.ply++;
      var html = boardSvg(b.st, { flip: b.flip, anim: [mv.from, mv.to] });
      pair.forEach(function (c) {
        if (!c) return;
        var old = c.querySelector('svg');
        if (old) old.outerHTML = html;
      });
      releaseAnims(stage);
    });
  }, 90);
  var i = 0;
  function tick() {
    var box = el('narr-wisdom');
    if (!box || !data.narrate) return;
    box.style.opacity = 0;
    setTimeout(function () {
      if (!el('narr-wisdom') || !data.narrate) return;
      box.textContent = NARR_WISDOM[i % NARR_WISDOM.length];
      box.style.opacity = 1;
      i++;
    }, 300);
    setTimeout(tick, 4600);
  }
  tick();
}

/* new games are picked up about once an hour while the page is open */
setInterval(function () {
  if (!cfg.user || data.narrate || data.sections.games === 'loading') return;
  var c = loadCachedGames();
  if (Date.now() - (c.fetchedAt || c.at || 0) > 3600 * 1000) loadGames().then(function () { setTimeout(autoScan, 800); });
}, 10 * 60 * 1000);
window.addEventListener('online', function () { notice('Back online.'); if (cfg.user && !data.narrate) checkForGames(); });
window.addEventListener('offline', function () { notice('You are offline. Your practice keeps working.'); });

/* ── 16. Boot ────────────────────────────────────────────────────────── */


/* ── 15b. Narration, the first load, watched ────────────────────────────
   A first-time user should see their program being built, not a skeleton
   with spinners. Lines appear as the data lands; the page reveals when the
   profile is computable. Only runs when there is no cached history.        */


/* The loading theater: the user's own games replay on a slow-drifting strip
   of boards while the count climbs, the wait shows the work. */
function narrBoards() {
  var src = (data.narrPreview && data.narrPreview.length >= 3)
    ? data.narrPreview
    : data.games;
  var gs = src.slice(0, 10).filter(function (g) { return g.op16; });
  if (gs.length < 3) return '';
  /* each board keeps its own live cursor: position, next token, next beat */
  data.narrLive = gs.map(function (g, i) {
    return { toks: (g.mv40 || g.op16).split(' '), st: chessStart(), ply: 0,
             flip: g.color === 'black',
             nextAt: Date.now() + Math.random() * 250 };
  });
  var cards = gs.map(function (g, i) {
    return '<div class="narr-card">'
      + boardSvg(data.narrLive[i].st, { flip: data.narrLive[i].flip })
      + '<span class="narr-card-cap">' + esc(cfg.user) + ' vs ' + esc(g.opp) + '</span></div>';
  }).join('');
  return '<div class="narr-strip"><div class="narr-track">' + cards + cards + '</div></div>';
}
function narrLine(id, html) {
  data.narrLog = (data.narrLog || []).filter(function (l) { return l[0] !== id; });
  data.narrLog.push([id, html]);
  var box = el('narr');
  if (!box) return;
  var row = box.querySelector('[data-n="' + id + '"]');
  if (!row) {
    row = document.createElement('div');
    row.className = 'narr-line';
    row.setAttribute('data-n', id);
    box.appendChild(row);
  }
  row.innerHTML = html;
}




boot();

})();
