<style>
/* ══════════════════════════════════════════════════════════════════════════
   notlichess.org — a personal launcher for lichess.org.
   Single static file. No build step, no framework, no backend.
   Every value below comes from the design handoff's visual language.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#161512;      /* page ground */
  --raised:#1b1a17;      /* header, inputs */
  --rule:#2c2a26;        /* major hairline */
  --rule-soft:#24221f;   /* row rule */
  --edge:#3a3733;        /* outline on quiet cards and chips */

  --display:#e8e4da;
  --primary:#dedbd2;
  --body:#bdbab2;
  --secondary:#85817a;
  --dim:#7a756c;         /* the floor — never dimmer for text that means something */

  --gold:#b68235;
  --link:#c99a4e;
  --link-hover:#e0b869;
  --kicker:#8a6529;
  --gold-quiet:#96825f;

  --win:#7a9a5e;
  --loss:#a9695a;

  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-body:"Lora",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground)}
body{
  color:var(--body);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  padding:0 0 56px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{color:var(--link-hover)}
*:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:rgba(182,130,53,.3)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7) sepia(.4);cursor:pointer}
[hidden]{display:none !important}
.tnum{font-variant-numeric:tabular-nums}.first h1,.value-item b,.settings h2,.help-h{
  font-variant-numeric:lining-nums tabular-nums;
}
.win{color:var(--win)}
.loss{color:var(--loss)}

/* header ─────────────────────────────────────────────────────────────── */
.bar{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;
  padding:12px clamp(14px,4vw,22px);
  border-bottom:1px solid var(--rule);
  background:var(--raised);
  position:sticky;top:0;z-index:5;
}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand-name{font-family:var(--font-display);font-size:23px;color:var(--display);cursor:pointer}
.brand-name:hover{color:var(--link-hover)}
.brand-sep{color:#3a3733}
.brand-user{font-size:13px;color:#a9a49a}
.brand-out{font-size:11px;color:var(--dim);margin-left:2px}
.brand-out:hover{color:var(--loss)}
.ratings{display:flex;flex-wrap:wrap;gap:0 18px;font-variant-numeric:tabular-nums;font-size:13px}
.ratings span{color:var(--secondary)}
.ratings .win{color:var(--win)}
.ratings b{color:var(--primary);font-weight:400}
.views{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-top:4px}
.view-tab{
  padding:12px 18px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--secondary);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.view-tab:hover{color:var(--link-hover)}
.view-on{color:var(--display);border-bottom-color:var(--gold)}
.view[hidden]{display:none}
.bar-right{display:flex;align-items:center;gap:14px;font-size:12px}
.hint{color:var(--dim)}
.key{border:1px solid var(--edge);border-radius:3px;padding:1px 5px;color:#a9a49a}

/* page ───────────────────────────────────────────────────────────────── */
.page{max-width:1500px;margin:0 auto;padding:0 clamp(14px,4vw,22px)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kicker)}
.kicker-sm{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--kicker)}
.dim{color:var(--dim)}
.sec{color:var(--secondary)}

/* in progress ────────────────────────────────────────────────────────── */
.strip{
  border:1px solid #4a4127;border-radius:4px;padding:12px 16px;margin:20px 0 0;
  display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:#1c1a15;
}
.strip .who{color:var(--body)}
.strip .who b{color:var(--display);font-weight:400}
.btn-gold{border:1px solid var(--gold);border-radius:4px;padding:5px 16px;font-size:13px}
/* the ONE next action on a screen: big, filled, generous to the thumb */
.btn-big{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--gold);color:#181410;border:1px solid var(--gold);
  border-radius:6px;padding:13px 34px;font-size:15.5px;font-weight:600;
  min-width:230px;letter-spacing:.01em;
}
.btn-big:hover{background:var(--link-hover);border-color:var(--link-hover);color:#181410}
@media (max-width:820px){
  .btn-big{width:100%;min-width:0;padding:15px 20px;font-size:16px}
  .trainer-foot .btn-big{order:-1}
}
.btn-quiet{border:1px solid var(--edge);border-radius:4px;padding:5px 12px;color:var(--body)}

/* findings ───────────────────────────────────────────────────────────── */
.findings{padding:26px 0 20px;border-bottom:1px solid var(--rule)}
.note{border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:16px}

/* cards ──────────────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:0 40px}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:14px;gap:12px;
}
.card-ctrl{display:flex;gap:12px;font-size:12px;white-space:nowrap}
.card-ctrl a{font-size:12px}
.hero{
  display:block;border:1px solid var(--edge);border-radius:4px;padding:14px 18px;
  margin-bottom:10px;overflow-wrap:anywhere;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;font-variant-numeric:tabular-nums}
.chip{
  border:1px solid var(--edge);border-radius:4px;padding:6px 11px;
  font-size:13px;color:var(--body);white-space:nowrap;
}
.chip-sm{border:1px solid var(--rule);border-radius:4px;padding:5px 10px;font-size:13px;white-space:nowrap}
.chip-on{color:var(--link)}
.chip-off{color:var(--body)}
.chip-full{color:#5f5b53}
.panel{border:1px dashed var(--edge);border-radius:4px;padding:12px 14px;margin-top:12px}
.panel-lead{font-size:12px;color:var(--dim);margin-bottom:9px;font-variant-numeric:tabular-nums}
.more{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:12px}
.rows{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.row{
  display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-soft);
  font-size:13px;align-items:baseline;
}
.row b{color:var(--primary);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{color:var(--dim);margin-left:auto;white-space:nowrap}
.row .kind{color:var(--kicker);width:3.2em;flex:none}
.caption{font-size:12px;color:var(--dim);margin-bottom:8px;font-variant-numeric:tabular-nums}
.caption-after{font-size:12px;color:var(--dim);padding-top:8px}
.failed{
  border:1px dashed var(--edge);border-radius:4px;padding:14px;display:flex;flex-wrap:wrap;
  gap:10px 16px;align-items:center;color:var(--secondary);font-size:13px;
}
.loading{color:var(--dim);font-size:13px;padding:4px 0}
.foot{
  max-width:1100px;margin:40px auto 0;padding:14px 28px 22px;
  border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;
}
.foot-inner{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;width:100%}
.foot-line{font-size:12.5px;color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.foot-line .fish{width:17px;height:11px;opacity:.7;transform:translateY(1px)}
.foot-links{display:flex;gap:20px;font-size:12.5px;white-space:nowrap;flex-wrap:wrap}
.foot-links a{color:var(--gold-quiet)}
.foot-links a:hover{color:var(--link-hover)}

/* first visit ────────────────────────────────────────────────────────── */
.first{max-width:720px;margin:0 auto;padding:clamp(48px,10vw,88px) clamp(14px,4vw,22px)}
.first h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(30px,8vw,42px);
  line-height:1.15;color:var(--display);margin:0 0 18px;
}
.first p{margin:0 0 32px;max-width:46em;color:#a9a49a;text-align:justify}
/* keyboard hints mean nothing to a thumb */
@media (hover:none),(max-width:760px){.bar-right .hint{display:none}}
.first-form{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:38px}
.input{
  background:var(--raised);border:1px solid var(--edge);border-radius:4px;color:var(--primary);
  font-family:inherit;font-size:15px;padding:10px 14px;
}
.input-sm{font-size:13px;padding:5px 9px}
.btn-outline{
  background:transparent;border:1px solid var(--gold);border-radius:4px;color:var(--link);
  font-family:inherit;font-size:14px;padding:10px 20px;cursor:pointer;
}
.btn-outline:hover{color:var(--link-hover)}

/* skill profile ──────────────────────────────────────────────────────── */
.prof{padding:24px 0 6px;border-bottom:1px solid var(--rule)}
.prof-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.prof-line{margin:0 0 14px;color:#a9a49a;font-size:15px;max-width:52em}
.skills{display:grid;gap:0}
.today{padding:20px 0 4px}
.steps{display:flex;flex-wrap:wrap;gap:10px}
.step{
  border:1px solid var(--edge);border-radius:4px;padding:9px 16px;font-size:14px;
  color:var(--body);display:flex;align-items:baseline;gap:10px;cursor:pointer;
}
.step:first-child{border-color:var(--gold);color:var(--link)}
.board{width:min(88vw,400px);display:block;margin:0 auto;user-select:none}
.board rect[data-sq],.board use[data-sq]{cursor:pointer}
.board{border-radius:3px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.trainer{
  width:min(460px,94vw);background:var(--raised);border:1px solid var(--rule);
  border-radius:4px;padding:14px 16px 12px;box-shadow:0 12px 32px rgba(0,0,0,.5);
  max-height:92vh;overflow:auto;
}
.trainer-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.trainer-head .tnum{margin-left:auto}
.trainer-head a{font-size:18px;line-height:1;color:var(--dim)}
.trainer-prompt{margin:12px 0 2px;color:var(--primary);font-size:15px}
.trainer-sub{margin:0 0 12px;color:var(--secondary);font-size:14px;min-height:1.4em}
.trainer-foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fish-ic{display:inline-flex;align-items:center;gap:6px;color:var(--dim);align-self:center;position:relative;top:1.5px}
.scan-count:empty{display:none}
.fish{width:19px;height:13px}
.fish-on{color:var(--gold)}
.scan-count{font-size:12px;font-weight:400;color:var(--secondary)}
.fish-on .scan-count{color:var(--gold-quiet)}
@media (prefers-reduced-motion:no-preference){
  .fish-on .fish{animation:swim 1.6s ease-in-out infinite}
  @keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
}
.streak-badge{display:inline-flex;align-items:baseline;gap:5px;color:var(--gold);font-size:14px}
.streak-badge b{font-weight:400;color:var(--link-hover)}
.flame{width:13px;height:16px;align-self:center}
.play-stage{padding-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;max-width:640px}
.tile{
  border:1px solid var(--edge);border-radius:4px;padding:16px 8px 13px;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
}
.tile:hover{border-color:var(--gold-quiet)}
.tile-hero{grid-column:span 2;border-color:var(--gold)}
.tile-tc{
  font-family:var(--font-display);font-variant-numeric:lining-nums tabular-nums;
  font-size:30px;line-height:1;color:var(--display);
}
.tile-hero .tile-tc{font-size:40px;color:var(--link-hover)}
.tile-perf{font-size:12px;color:var(--secondary)}
.tile-edit{border-style:dashed}
.tile-live{width:7px;height:7px;border-radius:50%;background:var(--win);align-self:flex-end;margin:-6px -2px 0 0}
@media (prefers-reduced-motion:no-preference){
  .tile-live{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
}
.prep{border:1px solid var(--edge);border-radius:4px;padding:12px 16px;margin-top:12px;max-width:640px}
.prep-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:6px 28px}
.prep-side{padding-top:8px}
.prep-line{font-size:14px;color:var(--body);padding:2px 0}
.prep-line .kicker-sm{margin-right:6px}
.odds-bar{
  display:inline-flex;width:150px;height:7px;border-radius:3px;overflow:hidden;
  vertical-align:middle;background:var(--edge);
}
.ob{display:block;height:100%}
.ob-w{background:var(--win)}
.ob-d{background:var(--gold-quiet)}
.ob-l{background:var(--loss)}
.tile-edit .tile-perf{color:var(--loss)}
.since{margin:-4px 0 12px;font-size:15px;color:var(--gold-quiet)}
.set-head{display:flex;align-items:center;gap:14px;padding:20px 0 12px;flex-wrap:wrap}
.set-sub{font-size:13px;color:var(--dim)}
.set-spacer{flex:1}
.set-bar{display:flex;gap:4px;align-items:center;margin:0 0 14px;max-width:480px}
.set-seg{flex:1;height:5px;background:var(--edge);border-radius:2px;min-width:8px}
.seg-won{background:var(--win)}
.seg-lost{background:var(--loss)}
.seg-on{background:var(--gold)}
.set-flag{color:var(--dim);font-size:13px;margin-left:2px}
.drag-ghost{
  position:fixed;left:0;top:0;z-index:60;pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));
}
.drag-ghost svg{width:100%;height:100%}
.board use.drag-src{opacity:.35}
.board{touch-action:none}
.train-cols{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.train-main{flex:1 1 400px;max-width:480px;min-width:0}
.train-side{flex:1 1 260px;max-width:340px;min-width:240px}

/* missions: the day's checklist — check for satisfaction, tap to start */
.missions{max-width:480px;margin-top:6px}
.train-side .missions{margin-top:0}
.inline-trainer + .missions,.set-done + .missions{margin-top:22px}
.missions-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:2px;
}
.mission{
  display:flex;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--rule);cursor:pointer;color:var(--primary);
}
.mission:hover{background:rgba(182,130,53,.05)}
.mission:hover .mission-go{color:var(--link-hover)}
.mission-check{
  width:19px;height:19px;flex:none;border:1px solid var(--edge);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--gold);
}
.mission-done .mission-check{border-color:var(--gold-quiet);background:rgba(182,130,53,.12)}
.mission-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mission-label{font-size:13.5px;color:var(--display)}
.mission-gold{color:var(--gold)}
.mission-done .mission-label{color:var(--secondary)}
.mission-sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission-go{font-size:11px;color:var(--gold-quiet);flex:none;letter-spacing:.04em}
.mission-live .mission-go{color:var(--gold)}
.mission-live{border-left:2px solid var(--gold);padding-left:8px;margin-left:-10px}
.pre-count .train-side{filter:blur(2px) brightness(.6);pointer-events:none}

/* repertoire families: one stacked row each — expansion pushes down, never
   fights a grid row; the chevron says "there is more" before any click */
.fam-list{max-width:none}
.fam-block{border-bottom:1px solid var(--rule)}
.fam-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 2px}
.fam-head{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;color:var(--display);cursor:pointer}
.fam-head:hover .fam-name{color:var(--link-hover)}
.fam-chev{
  display:inline-block;color:var(--dim);font-size:15px;width:12px;flex:none;
  transition:transform .18s ease;transform-origin:45% 50%;
}
.fam-open .fam-chev{transform:rotate(90deg);color:var(--gold)}
.fam-name{font-size:15px}
.fam-stats{font-size:12px}
.fam-btns{display:flex;gap:8px;flex:none}
.fam-lines{padding:2px 0 12px 21px}

/* repertoire lines: a book page, one row per line */
.line-row{
  display:flex;align-items:center;gap:12px;padding:8px 2px;
  border-bottom:1px solid var(--rule);cursor:pointer;color:var(--primary);
}
.line-row:hover{background:rgba(182,130,53,.05)}
.line-chip{
  flex:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--edge);border-radius:3px;padding:2px 7px;color:var(--secondary);
  min-width:3.2em;text-align:center;
}
.lc-new{color:var(--gold);border-color:var(--gold-quiet)}
.lc-due{color:var(--loss);border-color:rgba(190,90,80,.5)}
.lc-ready{color:var(--display)}
.lc-ok{color:var(--win);border-color:rgba(120,160,90,.4)}
.lc-rest{color:var(--dim);border-color:var(--rule)}
.line-sans{flex:1;min-width:0;font-size:13px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-sans b{color:var(--display);font-weight:600}
.line-stat{flex:none;font-size:11.5px;color:var(--dim)}
.line-detail{padding:12px 2px 14px;border-bottom:1px solid var(--rule)}
.line-detail .ev-thumb{margin-bottom:10px}
.line-note{font-size:13px;color:var(--body);padding:4px 0;display:flex;gap:10px;line-height:1.45}
.line-note b{color:var(--display);font-weight:600}
.line-note-n{flex:none;width:1.4em;color:var(--dim);font-size:12px;padding-top:1px}
.anim-piece{transition:transform .22s ease;will-change:transform}
.bad-arrow{animation:badpulse 1.6s ease-in-out infinite}
@keyframes badpulse{0%,100%{opacity:.85}50%{opacity:.35}}
.narr-card .anim-piece{transition-duration:.15s}
.narr-card{transition:opacity .45s ease,transform .45s ease}
.narr-fade{opacity:0;transform:scale(.96)}
.segctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.segctl-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--kicker);flex:none}
/* selection speaks the same language as the main tabs: gold underline,
   quiet otherwise — wraps like text, so nothing breaks on a phone */
.subtabs{display:inline-flex;flex-wrap:wrap;gap:2px 22px;align-items:baseline}
.subtab{
  font-size:14px;color:var(--secondary);cursor:pointer;padding:4px 0 5px;
  border-bottom:2px solid transparent;white-space:nowrap;
}
.subtab:hover{color:var(--display)}
.subtab-on{color:var(--display);border-bottom-color:var(--gold)}
.subtab-stat{font-size:12px;margin-left:2px}
.subtab:not(.subtab-on):not(:hover) .subtab-stat.dim{opacity:.7}
.verdict-lesson{color:var(--gold-quiet)}
.verdict-lesson b{color:var(--gold)}
.how-btn{
  width:22px;height:22px;border:1px solid var(--edge);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--secondary);
}
.how-btn:hover{border-color:var(--gold);color:var(--link)}
.run-meter{display:inline-flex;align-items:center;gap:4px;margin-left:12px}
@media (prefers-reduced-motion:no-preference){
  .meter-broke .run-step{animation:shatter .7s ease-out both}
  .meter-broke .run-step:nth-child(2){animation-delay:.08s}
  .meter-broke .run-step:nth-child(3){animation-delay:.16s}
  @keyframes shatter{
    0%{transform:none}
    30%{transform:translateX(-2px) rotate(-8deg);border-color:var(--loss);background:var(--loss);color:#1b1a17}
    60%{transform:translateX(2px) rotate(6deg);border-color:var(--loss);background:transparent;color:transparent}
    100%{transform:none;border-color:var(--gold);background:transparent;color:transparent}
  }
}
.run-step{
  width:16px;height:16px;border:1px solid var(--gold);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--ground);
}
.run-won{background:var(--gold);color:#1b1a17}
.run-word{font-size:12px;color:var(--gold-quiet);margin-left:3px}
.btn-off{opacity:.4}
.pre-count .train-main > *:not(.board-wrap),.pre-count .trainer-head,.pre-count .inline-why,
.pre-count .verdict,.pre-count .trainer-sub,.pre-count .trainer-foot{filter:blur(3px);pointer-events:none}
.promo-card{
  display:flex;gap:10px;background:rgba(15,14,12,.9);border:1px solid var(--gold);
  border-radius:6px;padding:12px 16px;
}
.promo-opt{width:52px;height:52px;border:1px solid var(--edge);border-radius:4px;display:flex}
.promo-opt:hover{border-color:var(--gold)}
.promo-opt svg{width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){
  .hint-ring{animation:hintpulse 1.4s ease-in-out infinite}
  @keyframes hintpulse{0%,100%{opacity:.9}50%{opacity:.35}}
}
.count-card{
  background:rgba(15,14,12,.82);border:1px solid var(--gold);border-radius:6px;
  padding:18px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.board-wrap{position:relative;max-width:min(88vw,400px)}
/* wide desks earn a bigger board */
@media (min-width:1250px){
  .train-main{max-width:560px;flex-basis:480px}
  .board-wrap{max-width:min(88vw,480px)}
  .board-wrap .board{width:min(88vw,480px)}
  .inline-trainer{max-width:1000px}
}
@media (max-width:820px){
  .train-main{max-width:none}
  .train-side{max-width:none;flex-basis:100%}
  .board-wrap{
    max-width:none;
    width:calc(100% + 2*clamp(14px,4vw,22px));
    margin-left:calc(-1*clamp(14px,4vw,22px));
  }
  .trainer-board-full .board,.board-wrap .board{width:100%;border-radius:0}
  .missions{max-width:none}
  .inline-trainer .set-bar{max-width:none}
}
.pre-count .board-wrap .board{filter:blur(2px) brightness(.55)}
.countdown{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;padding:0 20px;
}
.count-num{
  font-family:var(--font-display);font-size:64px;line-height:1;color:var(--link-hover);
  font-variant-numeric:lining-nums;
}
.count-line{font-size:15px;color:var(--display);max-width:16em}
.count-sub{font-size:12px;color:var(--gold-quiet)}
@media (prefers-reduced-motion:no-preference){
  .count-num{animation:pop .4s ease-out}
}
@media (prefers-reduced-motion:no-preference){
  .btn-pulse{animation:pull 1.8s ease-in-out infinite}
  @keyframes pull{
    0%,100%{box-shadow:0 0 0 0 rgba(182,130,53,0)}
    50%{box-shadow:0 0 0 5px rgba(182,130,53,.22)}
  }
}
.score-moment{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px}
.score-flame{color:var(--gold);display:inline-flex}
.score-flame .flame{width:26px;height:32px}
.score-num{
  font-family:var(--font-display);font-variant-numeric:lining-nums tabular-nums;
  font-size:44px;line-height:1;color:var(--link-hover);
}
@media (prefers-reduced-motion:no-preference){
  .score-live .score-flame{animation:flare 1.1s ease-out}
  .score-live .score-num{animation:pop .6s ease-out}
  @keyframes flare{
    0%{transform:scale(.6);opacity:.3}
    35%{transform:scale(1.45);opacity:1}
    60%{transform:scale(.95)}
    100%{transform:scale(1)}
  }
  @keyframes pop{0%{transform:translateY(6px);opacity:0}100%{transform:none;opacity:1}}
}
.set-done-big{
  font-family:var(--font-display);font-weight:400;font-size:clamp(26px,6vw,34px);
  color:var(--display);margin:6px 0 4px;
}
.line-nav{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap;max-width:480px}
.nav-btn{
  border:1px solid var(--edge);border-radius:4px;padding:1px 12px;font-size:16px;
  color:var(--body);line-height:1.4;
}
.nav-off{opacity:.35;pointer-events:none}
.line-moves{font-size:13px;color:var(--secondary);display:flex;flex-wrap:wrap;gap:2px 8px}
.line-mv{color:var(--secondary);font-size:13px}
.line-on{color:var(--link-hover);border-bottom:1px solid var(--gold)}
.run-lockup{display:inline-flex;align-items:baseline;gap:7px;color:var(--gold)}
.run-flame .flame{width:17px;height:22px;transform:translateY(3px)}
.run-count{font-family:var(--font-display);font-variant-numeric:lining-nums tabular-nums;
  font-size:30px;line-height:1;color:var(--link-hover);font-weight:400}
.run-label{font-size:13px;color:var(--secondary)}
.wd{
  width:22px;height:22px;border:1px solid var(--edge);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--dim);
}
.coach{padding:26px 0 18px;border-bottom:1px solid var(--rule)}
.coach-text{
  margin:0 0 10px;font-family:var(--font-display);font-weight:400;
  font-size:clamp(20px,4.5vw,26px);line-height:1.35;color:var(--display);max-width:34em;
}
.coach-directive{margin:0;font-size:15px;color:var(--link)}
.perf-pick{display:inline-flex;gap:8px;margin-left:auto}
.focus-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.move-card{
  border:1px solid var(--edge);border-radius:4px;padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;justify-content:space-between;
}
.move-gold{border-color:var(--gold)}
.move-text{font-size:15px;color:var(--body);line-height:1.45}
.move-card .btn-gold,.move-card .btn-quiet{align-self:flex-start}
.story{
  border-top:1px solid var(--rule-soft);margin-top:22px;padding-top:14px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;
}
.story svg{flex:1 1 150px;max-width:240px;height:48px}
.story-side{font-size:14px;color:var(--secondary)}
.story-goal{flex-basis:100%;font-size:14px;color:var(--secondary);max-width:46em}
.verdict{font-size:16px;margin:12px 0 2px}
.verdict-good{color:var(--win)}
.verdict-bad{color:var(--loss)}
.inline-trainer{max-width:920px;padding:8px 0 20px}
.inline-trainer .set-bar{max-width:480px}
.inline-why{font-size:14px;color:var(--gold-quiet);margin:0 0 10px}
.intro{border:1px dashed var(--edge);border-radius:4px;padding:14px 16px;margin:0 0 12px;max-width:480px}
.intro-line{font-size:13px;color:var(--body);padding:4px 0}
.intro-line b{color:var(--primary);font-weight:400}
.skill-click{cursor:pointer}
.skill-click:hover .skill-label{color:var(--display)}
.skill-open{border-bottom:0}
.skill-detail{
  border-bottom:1px solid var(--rule-soft);padding:2px 0 12px;
  display:flex;flex-direction:column;gap:2px;
}
.skill-detail .row{border-bottom:0;padding:4px 0}
.ev-line{font-size:14px;padding:3px 0;color:var(--body)}
.prof-coach{margin:-2px 0 10px;font-size:13px;color:var(--secondary)}
.plan-pay{color:var(--gold-quiet);white-space:nowrap}
.btn-out{display:inline-flex;align-items:baseline;gap:5px;color:var(--secondary)}
.btn-out:hover{color:var(--link-hover)}
.out-mark{font-size:11px;opacity:.7}
.no-trend .skill{grid-template-columns:minmax(8em,1fr) 97px 5.4em}
@media (max-width:560px){.segbar{display:none}
  .skill,.no-trend .skill{grid-template-columns:minmax(8em,1fr) 5.4em 2.4em}}
.ev-thumb .board{width:150px;margin:4px 0 8px}
.skill-sent{
  font-size:14px;color:var(--secondary);padding:0 0 10px;
  border-bottom:1px solid var(--rule-soft);max-width:44em;
}
.skill-sent.skill-open{border-bottom:0;padding-bottom:4px}
.segbar{display:inline-flex;gap:2px;align-items:center}
.segb{width:11px;height:5px;border-radius:1.5px;background:var(--edge)}
.seg-critical{background:#c14f3f}
.seg-weak{background:var(--loss)}
.seg-behind{background:#b58455}
.seg-level{background:var(--gold-quiet)}
.seg-solid{background:#8a9a68}
.seg-strong{background:var(--win)}
.seg-elite{background:#8fb864}
.seg-mid{background:var(--gold-quiet)}
.v-critical{color:#c14f3f}
.v-weak{color:var(--loss)}
.v-behind{color:#b58455}
.v-level{color:var(--dim)}
.v-solid{color:#8a9a68}
.v-strong{color:var(--win)}
.v-elite{color:#8fb864}
.v-context{color:var(--dim)}
.skill{
  display:grid;
  grid-template-columns:minmax(8em,1fr) 97px 5.4em 2.4em;
  align-items:center;gap:0 12px;padding:8px 0 2px;font-size:14px;
}
.skill-label{color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-verdict{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.skill-trend{font-size:12px;text-align:right}


/* the plan ───────────────────────────────────────────────────────────── */
.plan{padding:22px 0 8px;border-bottom:1px solid var(--rule)}
.plan-list{list-style:none;margin:0;padding:0}
.plan-step{
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--rule-soft);
}
.plan-n{color:var(--kicker);font-family:var(--font-display);font-size:19px;flex:none;width:1.2em}
.plan-body{flex:1 1 16em;min-width:0;display:flex;flex-direction:column;gap:2px}
.plan-what{color:var(--display);font-size:15px}
.plan-why{color:var(--secondary);font-size:13px}
.plan-none{margin:0;color:var(--secondary)}
.plan-step .btn-gold,.plan-step .btn-quiet{flex:none;white-space:nowrap}

/* welcome ────────────────────────────────────────────────────────────── */
.value{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));
  gap:0 40px;border-top:1px solid var(--rule);
}
.value-item{border-bottom:1px solid var(--rule-soft);padding:14px 0}
.value-item b{
  display:block;font-family:var(--font-display);font-weight:400;font-size:19px;
  color:var(--display);margin-bottom:3px;
}
.value-item span{color:var(--secondary);font-size:13px}
.first-lean h1{max-width:16em}
.lede{margin:0 0 26px;max-width:40em;color:#a9a49a;text-align:left;font-size:16px}
.first-lean .value{margin-top:8px;border-top:1px solid var(--rule)}
.ob-q{margin:0 0 22px}
.ob-label{font-size:16px;color:var(--primary);margin-bottom:10px}
.narr-strip{overflow:hidden;margin:26px 0 6px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.narr-track{display:flex;gap:16px;width:max-content}
@media (prefers-reduced-motion:no-preference){
  .narr-track{animation:drift 46s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}
.narr-card{display:flex;flex-direction:column;gap:5px;align-items:center}
.narr-card .board{width:258px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.narr-card-cap{font-size:13.5px;color:var(--secondary);letter-spacing:.02em}
.narr-bar{
  display:block;height:3px;background:var(--rule);border-radius:2px;
  margin-top:7px;max-width:340px;overflow:hidden;
}
.narr-fill{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.narr{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.narr-line{color:var(--body);font-size:15px;animation:narr-in .35s ease}
.narr-line b{color:var(--display);font-weight:400}
.narr-wisdom{
  margin-top:34px;font-family:var(--font-display);font-size:19px;line-height:1.4;
  color:var(--gold-quiet);max-width:30em;min-height:3.2em;
  transition:opacity .3s;font-weight:400;
}
@keyframes narr-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.narr-line{animation:none}}
.fmt{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--body)}
.fmt input{accent-color:var(--gold);margin:0}
.first-foot{font-size:13px;margin-top:24px}
/* The system justifies body copy, which is right at the measure it was drawn
   for. In a phone-width column it opens rivers, so narrow screens set ragged. */
@media (max-width:620px){
  .first p,.first .lede,.first-foot{text-align:left}
}
.door{border:1px solid var(--edge);border-radius:4px;padding:18px 20px}
.door:first-child{border-color:var(--gold)}

/* settings ───────────────────────────────────────────────────────────── */
.settings{border-top:1px solid var(--rule);margin-top:26px;padding-top:20px}
.settings h2{
  font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);
  margin:0 0 4px;
}
.set-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
  gap:0 40px;
}
.set-block{border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:18px}
.set-block > .kicker-sm{display:block;margin-bottom:6px}
.check{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:13px;cursor:pointer;color:var(--body)}
.check input{accent-color:var(--gold);margin:0}
.check span.off{color:var(--dim)}

/* palette ────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.72);z-index:20;display:flex;
  align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.palette{
  width:min(620px,100%);background:var(--raised);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.5);
}
.palette input{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);
  color:var(--primary);font-family:inherit;font-size:16px;padding:14px 16px;outline:none;
}
.palette ul{list-style:none;margin:0;padding:6px 0;max-height:52vh;overflow:auto}
.palette li{padding:8px 16px;display:flex;gap:12px;align-items:baseline;cursor:pointer;font-size:14px;color:var(--body)}
.palette li .grp{margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.palette li[aria-selected=true]{background:#221f1a;color:var(--display)}
.palette li[aria-selected=true] .grp{color:var(--kicker)}
.help{list-style:none;margin:0;padding:6px 0 10px}
.help li{display:flex;gap:14px;align-items:baseline;padding:5px 16px;font-size:13px;color:var(--body)}
.help li .key{flex:none;min-width:1.6em;text-align:center}
.help-h{
  font-family:var(--font-display);font-size:20px;color:var(--display);
  padding:12px 16px 8px;border-bottom:1px solid var(--rule);
}
.palette .empty{padding:14px 16px;color:var(--dim);font-size:13px}
.palette-foot{border-top:1px solid var(--rule);padding:8px 16px;font-size:11px;color:var(--dim)}

/* progressive detail — compact by default, full sentence on tap/hover ── */
.det{border-bottom:1px dotted transparent;cursor:help;color:inherit}
.det:hover,.det:focus-visible{color:var(--display);border-bottom-color:var(--gold)}
.det-body{display:block;font-size:12px;color:var(--dim);margin-top:3px;max-width:34em}
.detwrap{display:inline}

/* severity{color:var(--loss)}
.live{color:var(--win)}
.soon{color:var(--link)}

/* on/off text toggles in a card head ─────────────────────────────────── */
.tog{font-size:12px}

/* notice ─────────────────────────────────────────────────────────────── */
.notice{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
  background:var(--raised);border:1px solid var(--edge);border-radius:4px;
  padding:9px 16px;font-size:13px;color:var(--body);max-width:min(90vw,560px);
}
@media (prefers-reduced-motion:no-preference){
  .notice{transition:opacity .2s}
}

<script>
/* ══════════════════════════════════════════════════════════════════════════
   notlichess.org
   ─────────────────────────────────────────────────────────────────────────
   Reference: projects/lichess-launcher/engineering-handoff.md (API, deep
   links, what is impossible) and design-handoff.md (visual language).

   Nothing is played, solved or analysed here. Every action opens lichess.org.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
'use strict';

/* ── 1. Storage, tolerant of file:// and private windows ─────────────── */

var mem = {};
var store = {
  get: function (k, fallback) {
    try {
      var v = localStorage.getItem(k);
      if (v === null) return k in mem ? mem[k] : fallback;
      return JSON.parse(v);
    } catch (e) { return k in mem ? mem[k] : fallback; }
  },
  set: function (k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  },
  del: function (k) {
    delete mem[k];
    try { localStorage.removeItem(k); } catch (e) {}
  }
};

/* ── 2. Configuration ────────────────────────────────────────────────── */

var ALL_TC = ['1+0','1+1','2+1','3+0','3+2','5+0','5+3','10+0','10+5','15+10','30+0','30+20'];
/* Pools that lichess.org/#pool/ actually accepts. Anything else is silently
   ignored by the lobby, so those fall back to the pre-filled setup modal. */
var POOL_TC = ['1+0','2+1','3+0','3+2','5+0','5+3','10+0','10+5','15+10','30+0','30+20'];
var MAX_TC = 6;
var DEFAULT_TC = ['10+0','5+0','3+0'];
var FIRST_PAINT = 200;      /* render as soon as this many are in */
var MIN_PER_FORMAT = 200;
var RETAIN_PER_FORMAT = 100; /* newest unanalysed games per format that keep
                                their movetext for the fetch-free scan batch */   /* every tracked format keeps at least this
                               many recent games — a 1000-game window of
                               mostly blitz must not starve the rapid coach */
var MAX_GAMES = 3000;       /* ~2 minutes at Lichess's ~24 games/sec */
var LIMIT_CHOICES = [200, 500, 1000, 2000, 3000];

var params = new URLSearchParams(location.search);
var urlUser = (params.get('u') || params.get('user') || '').trim();
var urlSrc = (params.get('src') || '').trim();
var urlSrc = params.get('src');

/* Defaults per format lean no-increment: the most-played pools, and a
   clean three-tile Play stage for a fresh account. Increments stay one tap
   away in the edit panel. */
var PERF_TCS = { bullet: ['1+0'], blitz: ['5+0','3+0'],
                 rapid: ['10+0'], classical: ['30+0'] };
var PERF_HINT = { bullet: '1–2 min games', blitz: '3–5 min',
                  rapid: '10–15 min', classical: '30+ min' };
var cfg = {
  user: urlUser || store.get('nl:user', ''),
  tcs: store.get('nl:tcs', DEFAULT_TC.slice()),
  sound: store.get('nl:sound', true),
  perfs: store.get('nl:perfs', null),   /* the formats being trained; null = derive from tcs */
  hidden: store.get('nl:hidden', {}),
  findingsOff: store.get('nl:findingsOff', {}),
  gameLimit: store.get('nl:gameLimit', 1000),
  reviewTcs: store.get('nl:reviewTcs', null),
  fromDate: store.get('nl:fromDate', null),
  newTab: store.get('nl:newTab', true),
  src: (urlSrc === 'chesscom' || urlSrc === 'lichess') ? urlSrc : store.get('nl:src', 'lichess')
};
function isCC() { return cfg.src === 'chesscom'; }
var CC = 'https://api.chess.com/pub';
function applyLinkTarget() {
  var b = document.getElementById('basetag');
  if (b) b.target = cfg.newTab ? '_blank' : '_self';
}
/* ?u=name wins for this visit but is not persisted — a shared link should not
   rewrite whoever's launcher this browser normally opens. Settings does that. */
function saveCfg(k) { store.set('nl:' + k, cfg[k]); }

/* Ephemeral view state — not persisted. */
var ui = {
  view: (function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'coach') h = 'insights';
    if (h === 'today') h = 'train';
    if (['train', 'insights', 'openings', 'play'].indexOf(h) !== -1) return h;
    var v = store.get('nl:view', 'train');
    if (v === 'launch' || v === 'watch') v = 'train';
    if (['train', 'insights', 'openings', 'play'].indexOf(v) === -1) v = 'train';
    return v;
  })(),
  open: {},            /* which cards have their "+ n more" list open */
  openSkill: null,     /* which profile row is showing its evidence */
  editing: false,      /* Play card edit mode */
  settingsOpen: false
};

/* ── 3. Time control helpers ─────────────────────────────────────────── */

function tcParts(tc) {
  var p = String(tc).split('+');
  return { min: parseInt(p[0], 10) || 0, inc: parseInt(p[1], 10) || 0 };
}
function tcSeconds(tc) { var p = tcParts(tc); return p.min * 60 + 40 * p.inc; }
function tcPerf(tc) {
  var s = tcSeconds(tc);
  if (s < 30) return 'ultraBullet';
  if (s < 180) return 'bullet';
  if (s < 480) return 'blitz';
  if (s < 1500) return 'rapid';
  return 'classical';
}
function trackedPerfs() {
  /* The formats the user said they are training. Everything downstream —
     the export, the profile, the coach, the sessions — keys off this. */
  if (cfg.perfs && cfg.perfs.length) return cfg.perfs.slice();
  var seen = {}, out = [];
  cfg.tcs.forEach(function (tc) {
    var p = tcPerf(tc);
    if (!seen[p]) { seen[p] = 1; out.push(p); }
  });
  return out;
}

function setPerfs(perfs) {
  cfg.perfs = perfs;
  saveCfg('perfs');
  /* Time controls follow the formats so Play and the filters agree. */
  var tcs = [];
  perfs.forEach(function (p) { (PERF_TCS[p] || []).forEach(function (tc) { if (tcs.length < MAX_TC) tcs.push(tc); }); });
  if (tcs.length) { cfg.tcs = tcs; saveCfg('tcs'); }
}

/* ── 4. Deep links (handoff §4) ──────────────────────────────────────── */

var L = 'https://lichess.org';
function playHref(tc) {
  if (isCC()) return 'https://www.chess.com/play/online';
  if (POOL_TC.indexOf(tc) !== -1) return L + '/#pool/' + tc;
  var p = tcParts(tc);
  return L + '/?time=realTime&minutesPerSide=' + p.min + '&increment=' + p.inc + '&gameMode=rated#hook';
}
function userHref(u) {
  if (isCC()) return 'https://www.chess.com/member/' + encodeURIComponent(u);
  return L + '/@/' + encodeURIComponent(u);
}
function perfHref(u, perf) { return L + '/@/' + encodeURIComponent(u) + '/perf/' + perf; }
function insightsHref(u, metric, dim) {
  return L + '/insights/' + encodeURIComponent(u) + (metric ? '/' + metric + '/' + dim : '');
}
function gameHref(id, color, ply) {
  if (isCC()) return 'https://www.chess.com/game/live/' + id;
  return L + '/' + id + (color ? '/' + color : '') + (ply ? '#' + ply : '');
}
/* Tutor: the /tutor/{user}/{range}/{perf}/{angle} shape exists, but the angle
   keys are not verified anywhere we can check, so we link to the section that
   is guaranteed to resolve. Handoff §5: link to Tutor, do not reproduce it. */
function tutorHref() { return L + '/tutor'; }
/* Lichess's openings database keys on the name with punctuation stripped and
   spaces underscored: "Bishop's Opening" is /opening/Bishops_Opening. */
function openingHref(name) {
  return L + '/opening/' + encodeURIComponent(
    String(name).replace(/[',.]/g, '').replace(/\s+/g, '_')
  );
}

/* ── 5. API layer ────────────────────────────────────────────────────── */
/* Lichess policy is one request at a time, and 429 carries no Retry-After,
   so we serialise every call and back off blind for 60s. */

var chain = Promise.resolve();
var backoffUntil = 0;
var lastLimitNotice = 0;

function queued(fn) {
  var run = function () {
    var wait = Math.max(0, backoffUntil - Date.now());
    return new Promise(function (r) { setTimeout(r, wait); }).then(fn);
  };
  var p = chain.then(run, run);
  chain = p.then(function () {}, function () {});
  return p;
}

function request(path, opts) {
  opts = opts || {};
  var headers = { Accept: opts.accept || 'application/json' };
  return queued(function () {
    return fetch(opts.abs ? path : L + path, {
      method: opts.method || 'GET',
      body: opts.body || undefined,
      headers: headers,
      redirect: opts.manualRedirect ? 'manual' : 'follow'
    }).then(function (res) {
      if (res.status === 429) {
        backoffUntil = Date.now() + 60000;
        /* background jobs (the scan, feed refreshes) ride the backoff
           silently; only work the user is waiting on gets a notice, and
           at most one every five minutes */
        if (!opts.quiet && Date.now() - lastLimitNotice > 300000) {
          lastLimitNotice = Date.now();
          notice('Lichess asked us to slow down — picking the work back up in a minute.');
        }
        var err = new Error('rate-limited'); err.code = 429; throw err;
      }
      return res;
    });
  });
}

function getJSON(path, opts) {
  return request(path, opts).then(function (res) {
    if (res.status === 404) { var e = new Error('not found'); e.code = 404; throw e; }
    if (!res.ok) { var e2 = new Error('http ' + res.status); e2.code = res.status; throw e2; }
    return res.json();
  });
}

/* ndjson, streamed. onLine is called per record as it arrives. */
function getND(path, onLine, opts) {
  opts = opts || {};
  return request(path, { accept: 'application/x-ndjson', manualRedirect: opts.manualRedirect, quiet: opts.quiet })
    .then(function (res) {
      /* Handoff §3: /api/puzzle/* answers 303 to an HTML login page when the
         token is missing or lacks the scope. With redirect:'manual' that
         surfaces as an opaque redirect rather than silently becoming HTML. */
      if (res.type === 'opaqueredirect' || res.status === 303) {
        var e = new Error('auth required'); e.code = 401; throw e;
      }
      if (!res.ok) { var e2 = new Error('http ' + res.status); e2.code = res.status; throw e2; }
      if (!res.body || !res.body.getReader) {
        return res.text().then(function (t) { splitND(t, onLine); });
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      return (function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) { if (buf.trim()) safeLine(buf, onLine); return; }
          buf += dec.decode(chunk.value, { stream: true });
          var parts = buf.split('\n');
          buf = parts.pop();
          parts.forEach(function (l) { safeLine(l, onLine); });
          return pump();
        });
      })();
    });
}
function safeLine(l, onLine) {
  l = l.trim();
  if (!l) return;
  try { onLine(JSON.parse(l)); } catch (e) {}
}
function splitND(text, onLine) {
  text.split('\n').forEach(function (l) { safeLine(l, onLine); });
}

/* ── 6. Game cache and normalisation ─────────────────────────────────── */
/* Raw exports with clocks and evals are far too big for localStorage, so each
   game is reduced to the fields the detectors read, once, at ingest. */

function evalCp(a) {
  if (!a) return 0;
  if (a.mate != null) return a.mate > 0 ? 1500 : -1500;
  return Math.max(-1500, Math.min(1500, a.eval || 0));
}

/* Mirrors baselines.py move for move: same 1500cp clamp, same 1000cp cap on a
   single move's loss, same 0-30 / 30-60 / 60+ ply buckets, same +/-200
   thresholds. If this drifts from the script, every peer comparison silently
   becomes a comparison of two different measurements. */
/* The mistakes worth retrying: plies where my move cost at least 20 points
   of win chance (Lichess's own "mistake" line; 30 is their "blunder").
   Kept small: ply, win% before/after, my clock after the move, phase. */
function blunderLedger(g, meIsWhite) {
  if (!g.analysis || !g.moves) return null;
  if (g.variant && g.variant !== 'standard') return null;
  var out = [];
  var prev = 20;
  for (var i = 0; i < g.analysis.length; i++) {
    var a = g.analysis[i];
    var cp = evalCp(a);
    if ((i % 2 === 0) === meIsWhite) {
      var wb = winPct(meIsWhite ? prev : -prev);
      var wa = winPct(meIsWhite ? cp : -cp);
      if (wb - wa >= 20) {
        var clk = (g.clocks && g.clocks[i] != null) ? Math.round(g.clocks[i] / 100) : null;
        /* The previous ply's annotation holds what SHOULD have been played
           instead of the move at this ply?  No — Lichess attaches best and
           variation to the judged ply itself: the line that replaces it. */
        var vari = a.variation ? a.variation.split(' ').slice(0, 8) : null;
        var pre = vari ? stateAtPly(g.moves, i) : null;
        out.push({ p: i, wb: wb, wa: wa, c: clk,
                   bs: vari ? vari[0] : null,
                   bv: vari ? vari.join(' ') : null,
                   k: pre && vari ? classifyBlunder(pre, g.moves.split(' ')[i], vari[0], wb, wa) : null,
                   j: a.judgment ? a.judgment.name : null });
      }
    }
    prev = cp;
  }
  if (!out.length) return null;
  out.sort(function (a, b) { return (b.wb - b.wa) - (a.wb - a.wa); });
  return out.slice(0, 4).sort(function (a, b) { return a.p - b.p; });
}

/* one move's accuracy on Lichess's own curve */
function moveAcc(wb, wa) {
  if (wa >= wb) return 100;
  return Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * (wb - wa)) - 3.1669));
}

function evalMetrics(analysis, meIsWhite, moves) {
  if (!analysis || analysis.length < 10) return null;
  var sign = meIsWhite ? 1 : -1;
  var prev = 20, best = -10000, worst = 10000;
  var lossSum = 0, lossN = 0;
  var bs = { o: [0, 0], m: [0, 0], e: [0, 0] };
  var accs = [], phAcc = { o: [], m: [], e: [] }, ta = [];
  var pieces = {};
  var toks = moves ? moves.split(' ') : null;
  var oppJustDropped = false;
  for (var i = 0; i < analysis.length; i++) {
    var cp = evalCp(analysis[i]);
    if ((i % 2 === 0) === meIsWhite) {
      var d = meIsWhite ? (prev - cp) : (cp - prev);
      d = Math.max(0, Math.min(1000, d));
      lossSum += d; lossN++;
      var k = i < 30 ? 'o' : (i < 60 ? 'm' : 'e');
      bs[k][0] += d; bs[k][1]++;
      /* accuracy in win-chance terms — the number Tutor speaks */
      var wb = winPct(meIsWhite ? prev : -prev);
      var wa = winPct(meIsWhite ? cp : -cp);
      var a = moveAcc(wb, wa);
      accs.push(a);
      phAcc[k].push(a);
      if (oppJustDropped) ta.push(a);
      if (toks && toks[i]) {
        var t0 = toks[i][0];
        var pk = t0 === 'O' ? 'K' : ('NBRQK'.indexOf(t0) !== -1 ? t0 : 'P');
        (pieces[pk] = pieces[pk] || [0, 0]);
        pieces[pk][0] += wb - wa > 0 ? wb - wa : 0;
        pieces[pk][1]++;
      }
    } else {
      var owb = winPct(meIsWhite ? -prev : prev);
      var owa = winPct(meIsWhite ? -cp : cp);
      oppJustDropped = (owb - owa) >= 10;
    }
    var mine = cp * sign;
    if (mine > best) best = mine;
    if (mine < worst) worst = mine;
    prev = cp;
  }
  if (lossN < 5) return null;
  var avg = function (b) { return b[1] >= 3 ? Math.round(b[0] / b[1]) : null; };
  var mean = function (l) { return l.length ? Math.round(l.reduce(function (x, y) { return x + y; }, 0) / l.length * 10) / 10 : null; };
  var pcOut = {};
  Object.keys(pieces).forEach(function (k2) {
    if (pieces[k2][1] >= 3) pcOut[k2] = [Math.round(pieces[k2][0] / pieces[k2][1] * 100) / 100, pieces[k2][1]];
  });
  return {
    acpl: Math.round(lossSum / lossN),
    best: best, worst: worst,
    o: avg(bs.o), m: avg(bs.m), e: avg(bs.e),
    acc: mean(accs),
    accO: phAcc.o.length >= 3 ? mean(phAcc.o) : null,
    accM: phAcc.m.length >= 3 ? mean(phAcc.m) : null,
    accE: phAcc.e.length >= 3 ? mean(phAcc.e) : null,
    ta: ta.length >= 2 ? mean(ta) : null,
    taN: ta.length,
    pieces: pcOut
  };
}

/* ── chess.com adapter ───────────────────────────────────────────────────
   Emits Lichess-SHAPED game objects, so compact() and everything above it
   — the scan pipeline, the sets, the coach, the openings — never know
   which site the games came from. Public API, no auth, CORS-open, and
   past-month archives never change.                                       */

function ccParsePgn(pgn) {
  var cut = pgn.lastIndexOf('\n\n');
  var body = cut >= 0 ? pgn.slice(cut + 2) : pgn;
  var moves = [], clocks = [];
  var re = /\{[^}]*\}|\S+/g, m2, tok;
  while ((m2 = re.exec(body))) {
    tok = m2[0];
    if (tok[0] === '{') {
      var ck = tok.match(/%clk (\d+):(\d+):(\d+(?:\.\d+)?)/);
      if (ck && moves.length) {
        clocks[moves.length - 1] = Math.round(
          ((+ck[1]) * 3600 + (+ck[2]) * 60 + parseFloat(ck[3])) * 100);
      }
      continue;
    }
    if (/^\d+\.+$/.test(tok)) continue;
    if (tok === '1-0' || tok === '0-1' || tok === '1/2-1/2' || tok === '*') break;
    moves.push(tok.replace(/[?!]+$/, ''));
  }
  for (var ci = 0; ci < moves.length; ci++) if (clocks[ci] == null) clocks[ci] = 0;
  return { moves: moves.join(' '), clocks: clocks.some(function (c) { return c > 0; }) ? clocks : null };
}

function ccOpeningName(pgn) {
  var m3 = pgn.match(/ECOUrl "[^"]*\/openings\/([^"]+)"/);
  if (!m3) return null;
  var slug = m3[1].replace(/(\.{3}|-\d+\.).*$/, '');
  var words = slug.split('-').filter(Boolean);
  if (!words.length) return null;
  var name = words.join(' ');
  /* synthesize the Family: Variation shape the rest of the app groups by */
  if (words.length > 2) return words.slice(0, 2).join(' ') + ': ' + words.slice(2).join(' ');
  return name;
}

var CC_STATUS = { checkmated: 'mate', timeout: 'outoftime', resigned: 'resign',
                  abandoned: 'resign', win: '', stalemate: 'stalemate',
                  agreed: 'draw', repetition: 'draw', insufficient: 'draw',
                  '50move': 'draw', timevsinsufficient: 'draw' };

function ccShape(g) {
  if (g.rules !== 'chess' || g.rated !== true) return null;
  if (['bullet', 'blitz', 'rapid'].indexOf(g.time_class) === -1) return null;
  var tcBits = String(g.time_control).split('+');
  var initial = parseInt(tcBits[0], 10);
  if (!isFinite(initial) || initial <= 0) return null;
  var parsed = ccParsePgn(g.pgn || '');
  if (!parsed.moves) return null;
  var wRes = g.white.result, bRes = g.black.result;
  var winner = wRes === 'win' ? 'white' : (bRes === 'win' ? 'black' : null);
  var loserRes = winner === 'white' ? bRes : (winner === 'black' ? wRes : wRes);
  return {
    id: (g.url || '').split('/').pop() || g.uuid,
    ccUrl: g.url || null,
    rated: true, variant: 'standard',
    speed: g.time_class, perf: g.time_class,
    createdAt: (g.end_time || 0) * 1000,
    status: CC_STATUS[loserRes] || 'draw',
    winner: winner,
    players: {
      white: { user: { name: g.white.username, id: String(g.white.username).toLowerCase() },
               rating: g.white.rating },
      black: { user: { name: g.black.username, id: String(g.black.username).toLowerCase() },
               rating: g.black.rating }
    },
    opening: { name: ccOpeningName(g.pgn || '') },
    moves: parsed.moves,
    clocks: parsed.clocks,
    clock: { initial: initial, increment: parseInt(tcBits[1], 10) || 0 }
  };
}

function ccJSON(path, opts) {
  opts = opts || {};
  opts.abs = true;
  return request(CC + path, opts).then(function (res) {
    if (res.status === 404) { var e = new Error('404'); e.code = 404; throw e; }
    if (!res.ok) throw new Error('cc ' + res.status);
    return res.json();
  });
}

/* the walker: newest months first, until the window and every tracked
   format's floor are satisfied (or history runs out) */
function ccFetchGames(meId, onProgress, onFirstPaint) {
  var cached = loadCachedGames();
  if (!cached.games.length && data.games.length) {
    cached = { games: data.games, ts: 0, perfs: '' };
  }
  var since = cached.ts || 0;
  var got = [], painted = false, n = 0;
  var mergeAll = function () {
    var seen = {}, out = [];
    got.concat(cached.games).forEach(function (c) {
      if (!c || seen[c.id]) return;
      seen[c.id] = 1;
      out.push(c);
    });
    out.sort(function (a, b) { return b.ts - a.ts; });
    return out;
  };
  var floorsMet = function (list) {
    if (list.length >= cfg.gameLimit) {
      var counts = {};
      list.forEach(function (g) { counts[g.perf] = (counts[g.perf] || 0) + 1; });
      return trackedPerfs().every(function (pf) {
        return (counts[pf] || 0) >= MIN_PER_FORMAT;
      });
    }
    return false;
  };
  return ccJSON('/player/' + encodeURIComponent(cfg.user) + '/games/archives', { quiet: true })
    .then(function (a) {
      var months = (a.archives || []).slice().reverse();   /* newest first */
      var idx = 0;
      function step() {
        if (idx >= months.length) return null;
        var merged = mergeAll();
        if (floorsMet(merged)) return null;
        if (since && merged.length >= cfg.gameLimit) return null;
        var url = months[idx].replace(CC, '');
        idx++;
        return ccJSON(url, { quiet: idx > 2 }).then(function (mo) {
          (mo.games || []).slice().reverse().forEach(function (raw) {
            var shaped = ccShape(raw);
            if (!shaped) return;
            if (since && shaped.createdAt <= since) return;
            var c = compact(shaped, meId);
            if (!c) return;
            c.u = shaped.ccUrl;
            got.push(c);
            n++;
            if (onProgress) onProgress(n);
          });
          if (!painted && mergeAll().length >= FIRST_PAINT && onFirstPaint) {
            painted = true;
            onFirstPaint(mergeAll());
          }
          /* incremental runs stop at the first month older than the cache */
          if (since && mo.games && mo.games.length
              && (mo.games[0].end_time || 0) * 1000 <= since) return null;
          return step();
        }).catch(function () { return step(); });
      }
      return Promise.resolve(step()).then(function () {
        var merged = mergeAll();
        return { games: merged, count: merged.length };
      });
    });
}

function compact(g, meId) {
  var w = g.players && g.players.white, b = g.players && g.players.black;
  if (!w || !b) return null;
  var meIsWhite = !!(w.user && w.user.id === meId);
  var meIsBlack = !!(b.user && b.user.id === meId);
  if (!meIsWhite && !meIsBlack) return null;
  var me = meIsWhite ? w : b, opp = meIsWhite ? b : w;
  var myColor = meIsWhite ? 'white' : 'black';

  var result = g.winner ? (g.winner === myColor ? 'win' : 'loss') : 'draw';

  /* Clock left at my last move, as a share of my starting clock. */
  var clockPct = null;
  if (g.clocks && g.clocks.length && g.clock && g.clock.initial) {
    var last = null;
    for (var i = g.clocks.length - 1; i >= 0; i--) {
      if ((i % 2 === 0) === meIsWhite) { last = g.clocks[i]; break; }
    }
    if (last != null) clockPct = Math.max(0, Math.min(100, (last / (g.clock.initial * 100)) * 100));
  }

  var an = me.analysis || null;
  var em = evalMetrics(g.analysis, meIsWhite, g.moves);
  /* speed: mean share of clock remaining across my moves from ply 16 on */
  var spd = null;
  if (g.clocks && g.clocks.length > 20 && g.clock && g.clock.initial) {
    var acc2 = 0, n2 = 0;
    for (var ci = 16; ci < g.clocks.length; ci++) {
      if ((ci % 2 === 0) !== meIsWhite) continue;
      acc2 += Math.max(0, Math.min(1, g.clocks[ci] / 100 / g.clock.initial));
      n2++;
    }
    if (n2 >= 5) spd = Math.round(acc2 / n2 * 1000) / 10;
  }
  var bl = blunderLedger(g, meIsWhite);
  return {
    id: g.id,
    ts: g.createdAt,
    perf: g.perf || g.speed,
    color: myColor,
    opp: (opp.user && (opp.user.name || opp.user.id)) || (opp.aiLevel ? 'Stockfish ' + opp.aiLevel : 'Anonymous'),
    oppR: opp.rating || null,
    myR: me.rating || null,
    rd: me.ratingDiff != null ? me.ratingDiff : null,
    res: result,
    status: g.status || '',
    opening: (g.opening && g.opening.name) || null,
    plies: (g.moves ? g.moves.split(' ').length : (g.analysis ? g.analysis.length : 0)),
    tc: g.clock ? (Math.round(g.clock.initial / 60) + '+' + g.clock.increment) : null,
    analysed: !!(g.analysis && g.analysis.length),
    /* in-memory only: unanalysed games carry their movetext up to the
       retention step, so the first scan batch needs zero extra fetches */
    mvTmp: !(g.analysis && g.analysis.length) && g.moves
      && (!g.variant || g.variant === 'standard') ? g.moves : null,
    ckTmp: !(g.analysis && g.analysis.length) && g.clocks
      && (!g.variant || g.variant === 'standard') ? g.clocks : null,
    acpl: an && an.acpl != null ? an.acpl : null,
    acc: an && an.accuracy != null ? an.accuracy : null,
    blunders: an && an.blunder != null ? an.blunder : null,
    clockPct: clockPct == null ? null : Math.round(clockPct * 10) / 10,
    phases: an && an.phases ? an.phases : null,
    /* Our own eval-derived numbers, comparable with the peer baselines. */
    ev: em ? [em.acpl, em.best, em.worst, em.o, em.m, em.e] : null,
    acc2: em ? [em.acc, em.accO, em.accM, em.accE, em.ta, em.taN] : null,
    pcs: em ? em.pieces : null,
    spd: spd,
    src: g.source || null,
    secs: g.lastMoveAt && g.createdAt ? Math.round((g.lastMoveAt - g.createdAt) / 1000) : null,
    /* moves are kept only when there are mistakes to replay from them;
       the opening prefix is kept for every game, it feeds the book */
    bl: bl,
    mv: bl ? g.moves : null,
    op16: g.moves && (!g.variant || g.variant === 'standard')
      ? g.moves.split(' ').slice(0, 16).join(' ') : null
  };
}

var CACHE_VERSION = 9;   /* bump whenever the compact record shape changes */
function cacheKey() {
  /* lichess keeps its historical key; chess.com namespaces to avoid a
     same-name collision across sites */
  return 'nl:games:' + (isCC() ? 'cc:' : '') + String(cfg.user).toLowerCase();
}

function loadCachedGames() {
  var c = store.get(cacheKey(), null);
  if (!c || !c.games) return { games: [], ts: 0, perfs: '' };
  if (c.v !== CACHE_VERSION) return { games: [], ts: 0, perfs: '' };
  /* A cache built for a different set of formats is missing history that an
     incremental fetch would never back-fill, so it cannot be trusted. */
  if (c.perfs !== trackedPerfs().sort().join(',')) return { games: [], ts: 0, perfs: '' };
  return c;
}

function trimGames(games) {
  var cap = Math.max(cfg.gameLimit, FIRST_PAINT);
  if (games.length <= cap) return games;
  var head = games.slice(0, cap);
  var counts = {};
  head.forEach(function (g) { counts[g.perf] = (counts[g.perf] || 0) + 1; });
  var extra = [];
  trackedPerfs().forEach(function (p) {
    var need = MIN_PER_FORMAT - (counts[p] || 0);
    for (var i = cap; i < games.length && need > 0; i++) {
      if (games[i].perf === p) { extra.push(games[i]); need--; }
    }
  });
  if (!extra.length) return head;
  return head.concat(extra).sort(function (a, b) { return b.ts - a.ts; });
}

function saveGames(games) {
  var trimmed = trimGames(games);
  var payload = {
    v: CACHE_VERSION,
    games: trimmed,
    ts: trimmed.length ? trimmed[0].ts : 0,
    at: Date.now(),
    perfs: trackedPerfs().sort().join(',')
  };
  if (!store.set(cacheKey(), payload)) {
    /* Out of quota: keep half and say so rather than silently stopping. */
    payload.games = trimmed.slice(0, Math.ceil(trimmed.length / 2));
    if (store.set(cacheKey(), payload)) {
      notice('Storage is full, so only ' + payload.games.length + ' games are being kept.');
    }
  }
  return payload;
}

/* evals=true AND division=true together are what make
   players.X.analysis.phases appear — Lichess's own per-phase accuracy, which
   beats anything we could reconstruct. Neither flag alone produces it. */
var GAME_PARAMS = 'rated=true&evals=true&accuracy=true&opening=true&clocks=true&division=true&sort=dateDesc';

function fetchGames(meId, onProgress, onFirstPaint) {
  if (isCC()) return ccFetchGames(meId, onProgress, onFirstPaint);
  var cached = loadCachedGames();
  /* a format change invalidates the stored cache, but what is already on
     screen is still real — merge against it so nothing vanishes mid-fetch */
  if (!cached.games.length && data.games.length) {
    cached = { games: data.games, ts: 0, perfs: '' };
  }
  var perfs = trackedPerfs().join(',');
  var path = '/api/games/user/' + encodeURIComponent(cfg.user)
    + '?perfType=' + perfs + '&' + GAME_PARAMS;

  /* Incremental: only ask for what happened since the newest cached game. */
  var incremental = cached.games.length && cached.ts;
  if (incremental) {
    path += '&since=' + (cached.ts - 12 * 3600 * 1000) + '&max=' + cfg.gameLimit;
  } else {
    path += '&max=' + cfg.gameLimit;
  }

  var fresh = [], painted = false;
  return getND(path, function (g) {
    var c = compact(g, meId);
    if (!c) return;
    fresh.push(c);
    if (onProgress) onProgress(fresh.length, c);
    /* First useful picture well before the tail arrives. */
    if (!painted && !incremental && fresh.length >= FIRST_PAINT) {
      painted = true;
      if (onFirstPaint) onFirstPaint(merge(fresh, cached.games));
    }
  }).then(function () {
    return saveGames(merge(fresh, cached.games));
  }).catch(function (err) {
    if (cached.games.length) return cached;   /* stale beats empty */
    throw err;
  });
}

function merge(fresh, old) {
  var seen = {};
  var all = fresh.concat(old).filter(function (g) {
    if (seen[g.id]) return false;
    seen[g.id] = 1;
    return true;
  });
  all.sort(function (a, b) { return b.ts - a.ts; });
  return all;
}



/* ── 6c. Blunder taxonomy ────────────────────────────────────────────────
   A mistake with a name teaches more than a bare eval swing. Heuristics
   only — no engine needed at classification time — so they are chosen to be
   right when they speak and silent when unsure.                            */

var PIECE_VAL = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 99 };

function countAttackers(b, sq, byWhite) {
  var n = 0, cheapest = 100;
  var f = sq % 8, r = sq >> 3, i, d, tf, tr, p;
  for (i = 0; i < 8; i++) {
    d = KNIGHT_D[i]; tf = f + d[0]; tr = r + d[1];
    if (sqOk(tf, tr)) {
      p = b[tr * 8 + tf];
      if (p && isW(p) === byWhite && p.toUpperCase() === 'N') { n++; cheapest = Math.min(cheapest, 3); }
    }
  }
  var rays = BISHOP_D.concat(ROOK_D);
  for (i = 0; i < 8; i++) {
    d = rays[i]; tf = f + d[0]; tr = r + d[1];
    var step = 1;
    while (sqOk(tf, tr)) {
      p = b[tr * 8 + tf];
      if (p) {
        if (isW(p) === byWhite) {
          var u = p.toUpperCase();
          var diag = d[0] !== 0 && d[1] !== 0;
          if (u === 'Q' || (diag ? u === 'B' : u === 'R')) { n++; cheapest = Math.min(cheapest, PIECE_VAL[u]); }
          else if (step === 1 && u === 'K') { n++; cheapest = Math.min(cheapest, 99); }
          else if (step === 1 && u === 'P' && diag && (byWhite ? d[1] === -1 : d[1] === 1)) { n++; cheapest = Math.min(cheapest, 1); }
        }
        break;
      }
      tf += d[0]; tr += d[1]; step++;
    }
  }
  return { n: n, cheapest: cheapest };
}

/* kinds: hung · tactic · slip · collapse · (null when unsure) */
function classifyBlunder(pre, playedSan, bestSan, wb, wa) {
  try {
    var post = cloneState(pre);
    var mv = sanApply(post, playedSan);
    if (mv) {
      var moved = post.b[mv.to];
      if (moved && moved.toUpperCase() !== 'K') {
        var val = PIECE_VAL[moved.toUpperCase()];
        var att = countAttackers(post.b, mv.to, post.w);
        var def = countAttackers(post.b, mv.to, !post.w);
        if (att.n > 0 && (def.n === 0 || att.cheapest < val)) return 'hung';
      }
    }
    var probe = cloneState(pre);
    var bm = sanApply(probe, bestSan);
    if (bm) {
      var wasCapture = pre.b[bm.to] != null;
      var givesCheck = squareAttacked(probe.b, kingSq(probe.b, probe.w), !probe.w);
      if ((wasCapture || givesCheck) && wb - wa >= 25) return 'tactic';
    }
  } catch (e) {}
  if (wb >= 65 && wa <= 55) return 'slip';
  if (wb >= 40 && wb <= 60 && wa <= 35) return 'collapse';
  return null;
}

var KIND_WORD = { hung: 'you hung a piece', tactic: 'you missed a tactic',
                  slip: 'a won game slipped', collapse: 'level became lost' };
var KIND_THEME = { hung: ['hangingPiece', 'hung pieces are your most common mistake'],
                   tactic: ['crushing', 'missed tactics are your most common mistake'],
                   slip: ['advantage', 'slipping wins is your most common mistake'],
                   collapse: ['defensiveMove', 'holding level positions is the leak'] };

/* the shape of the last ~40 mistakes, when one dominates */
function dominantKind() {
  var counts = {}, total = 0;
  allBlunders().slice(0, 40).forEach(function (it) {
    if (!it.b.k) return;
    counts[it.b.k] = (counts[it.b.k] || 0) + 1;
    total++;
  });
  if (total < 12) return null;
  var top = null;
  Object.keys(counts).forEach(function (k) {
    if (!top || counts[k] > counts[top]) top = k;
  });
  return counts[top] / total >= 0.35 ? { kind: top, share: counts[top] / total, n: counts[top], total: total } : null;
}

/* ── 6b. SAN replay ──────────────────────────────────────────────────────
   Just enough chess to turn a Lichess movetext into the FEN at any ply, so

function peerOpening(family, colour, rating) {
  if (!PEER.openings || rating == null) return null;
  var r2 = bandEquivRating(mainPerf(), rating);
  var b = r2 < 1200 ? 1000 : (r2 < 1600 ? 1400 : (r2 < 2000 ? 1800 : 2200));
  var band = PEER.openings[String(b)];
  var row = band && band[family];
  if (!row) return null;
  return colour === 'white' ? row[0] : row[1];
}

/* chess.com and Lichess ratings live on different scales. Published
   equivalences put club-level Lichess numbers a few hundred above
   chess.com's, widest in blitz. All peer/book comparisons band on the
   Lichess-equivalent rating; the site's own rating still displays raw. */
var CC_OFFSET = { bullet: 250, blitz: 300, rapid: 150 };
function bandEquivRating(perf, rating) {
  if (rating == null) return null;
  return isCC() ? rating + (CC_OFFSET[perf] != null ? CC_OFFSET[perf] : 200) : rating;
}
function peerCell(perf, rating) {
  if (!PEER.cells || rating == null) return null;
  var r = bandEquivRating(perf, rating);
  var b = Math.max(800, Math.min(2400, Math.floor(r / 100) * 100));
  return PEER.cells[perf + '|' + b] || null;
}

/* ── 8c. Skill profile ───────────────────────────────────────────────────
   Every skill is a pair: your number and the number for players at your
   rating in the same format. `scale` is how far from the peer value counts as
   a full step of strong or weak, which keeps a 3-point accuracy gap from
   reading like a 30-point one.                                              */

/* A 22% score against +300-rated opposition is overperformance, not a
   weakness. Colour verdicts are judged on the Elo-adjusted equivalent: the
   win rate translated to what it would be against equal-rated opponents. */
function colourOppGap(colour) {
  var gs = myGamesIn(mainPerf()).filter(function (g) {
    return g.color === colour && g.oppR && g.myR;
  });
  if (gs.length < 15) return null;
  var m = meanOf(gs, function (g) { return g.oppR - g.myR; });
  return m ? m.v : null;
}
function eloExpected(gap) { return 100 / (1 + Math.pow(10, gap / 400)); }

function meanOf(list, pick) {
  var sum = 0, n = 0;
  for (var i = 0; i < list.length; i++) {
    var v = pick(list[i]);
    if (v != null) { sum += v; n++; }
  }
  return n ? { v: sum / n, n: n } : null;
}

  { key: 'black', label: 'As Black', phrase: 'your Black games', unit: '%', peer: 'bwin', scale: 5,

/* The colour prescription: the family YOU actually score worst in with that
   colour, linked to its opening page — and the advice a coach gives: one
   line, played every game, for two weeks. */
function colourPlan(colour) {
  var fams = colourFamilies(colour).slice();
  fams.sort(function (a, b) { return a.rate - b.rate; });
  var worst = fams[0];
  if (worst && worst.rate < 50 && worst.n >= 10) {
    return {
      label: 'Fix the ' + worst.family,
      href: openingHref(worst.family),
      hrefLabel: 'Study it on lichess',
      custom: { type: 'opening', family: worst.family, colour: colour,
                label: worst.family + ' as ' + colour, theme: 'opening',
                why: 'Your mistakes from ' + worst.family + ' games as ' + colour + '.' },
      why: 'You score ' + pct(worst.rate) + ' in it as ' + colour + ' over ' + worst.n

    label: 'Pick one ' + colour + ' opening',

    hrefLabel: 'Browse openings',
    why: 'Consistency beats variety: one line, every game, until it is automatic.'
