<style>
/* ══════════════════════════════════════════════════════════════════════════
   notlichess.org: the mistakes trainer.
   Single static file. No build step, no framework, no backend.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#161512;      /* page ground */
  --raised:#1b1a17;      /* header, inputs, sheets */
  --card:#1d1c18;        /* cards on the ground */
  --rule:#2c2a26;        /* major hairline */
  --rule-soft:#24221f;   /* row rule */
  --edge:#3a3733;        /* outline on quiet cards and chips */

  --display:#e8e4da;
  --primary:#dedbd2;
  --body:#bdbab2;
  --secondary:#8c8880;
  --dim:#8c867c;         /* the floor: never dimmer for text that means something */

  --gold:#b68235;
  --link:#c99a4e;
  --link-hover:#e0b869;
  --kicker:#a87d38;
  --gold-quiet:#96825f;

  --win:#7a9a5e;
  --loss:#b87a6a;
  --info:#8aa0b8;

  --font-display:"Cormorant Garamond",Georgia,serif;
  --font-body:"Lora",Georgia,serif;
  --gutter:clamp(14px,4vw,22px);

  /* the design system: roles, not shades (screens move onto these as they
     are rebuilt) */
  --bg:#161512; --surface-1:#1c1b17; --surface-2:#23211d; --line:#2e2c27; --line-strong:#736e65;
  --text-1:#ece8df; --text-2:#bdbab2; --text-3:#8f8b83;
  --accent:#c8963f; --accent-hover:#d6a852; --on-accent:#17130c; --accent-tint:rgba(200,150,63,.10);
  --good:#8fb573; --good-tint:rgba(143,181,115,.10); --bad:#d8826f; --bad-tint:rgba(216,130,111,.10);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:6px; --r2:10px; --r3:16px;
  --shadow-1:0 1px 3px rgba(0,0,0,.45); --shadow-2:0 16px 40px rgba(0,0,0,.55);
  --dur-1:120ms; --dur-2:200ms; --dur-3:320ms; --ease:cubic-bezier(.2,.7,.2,1);
}
html{scrollbar-gutter:stable}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground)}
body{
  color:var(--body);font-family:var(--font-body);font-size:15px;line-height:1.5;font-variant-numeric:lining-nums;
  padding:0 0 56px;-webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{color:var(--link-hover)}
button{font-family:inherit}
*:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:rgba(182,130,53,.3)}
[hidden]{display:none !important}
.tnum{font-variant-numeric:tabular-nums}
.win{color:var(--win)}
.loss{color:var(--loss)}
.dim{color:var(--dim)}
.sec{color:var(--secondary)}
.gold{color:var(--gold)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--kicker)}
.display{font-family:var(--font-display);font-weight:400;color:var(--display);font-variant-numeric:lining-nums tabular-nums}

/* header ─────────────────────────────────────────────────────────────── */
.bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;
  padding:11px var(--gutter);border-bottom:1px solid var(--rule);
  background:var(--raised);position:sticky;top:0;z-index:5;
}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto;min-width:0}
.brand-name{font-family:var(--font-display);font-size:23px;color:var(--display);cursor:pointer;white-space:nowrap}
.brand-name:hover{color:var(--link-hover)}

.ratings{display:flex;flex-wrap:wrap;gap:0 16px;font-variant-numeric:tabular-nums;font-size:13px}
.ratings span{color:var(--secondary)}
.ratings b{color:var(--primary);font-weight:400}
.ratings .win{color:var(--win)}
.bar-right{display:flex;align-items:center;gap:14px;font-size:12.5px}

.views{display:flex;border-bottom:1px solid var(--rule);margin-top:4px}
.view-tab{
  padding:12px 18px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--secondary);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.view-tab:hover{color:var(--link-hover)}
.view-on{color:var(--display);border-bottom-color:var(--gold)}

.page{max-width:1180px;margin:0 auto;padding:0 var(--gutter)}

/* buttons ────────────────────────────────────────────────────────────── */
.btn-big{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gold);color:#181410;border:1px solid var(--gold);
  border-radius:6px;padding:13px 30px;font-size:15.5px;font-weight:600;min-width:220px;cursor:pointer;
}
.btn-big:hover{background:var(--link-hover);border-color:var(--link-hover);color:#181410}
.btn-line{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--edge);border-radius:6px;padding:9px 16px;color:var(--body);font-size:14px;
  background:transparent;cursor:pointer;
}
.btn-line:hover{border-color:var(--gold);color:var(--link-hover)}

.btn-quiet{color:var(--secondary);font-size:13.5px;padding:9px 4px}
.btn-quiet:hover{color:var(--link-hover)}
.btn-off{opacity:.4;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .btn-pulse{animation:pull 1.8s ease-in-out 2}
  @keyframes pull{0%,100%{box-shadow:0 0 0 0 rgba(182,130,53,0)}50%{box-shadow:0 0 0 6px rgba(182,130,53,.22)}}
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--edge);border-radius:4px;padding:6px 11px;font-size:13px;color:var(--body);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--gold-quiet)}
.chip-on{color:var(--link);border-color:var(--gold)}
.input{
  background:var(--raised);border:1px solid var(--edge);border-radius:6px;color:var(--primary);
  font-family:inherit;font-size:16px;padding:12px 14px;
}
.input:focus{border-color:var(--gold);outline:none}

/* landing ────────────────────────────────────────────────────────────── */
.first{max-width:720px;margin:0 auto;padding:clamp(40px,9vw,80px) var(--gutter) 30px}
.first h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(32px,8vw,46px);
  line-height:1.1;color:var(--display);margin:0 0 16px;max-width:15em;
}
.lede{margin:0 0 28px;max-width:38em;color:#a9a49a;font-size:16.5px}
.src-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 0 14px}
.src-btn{
  border:1px solid var(--edge);border-radius:8px;padding:14px 16px;color:var(--primary);
  font-size:15px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:transparent;
}
.src-btn small{color:var(--dim);font-size:12.5px}
.src-btn:hover{border-color:var(--gold-quiet)}
.src-on{border-color:var(--gold);background:rgba(182,130,53,.06)}
.first-form{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;max-width:520px;margin-bottom:10px}
.first-form .input{flex:1 1 220px;min-width:0}
.confirm{
  border:1px solid var(--gold);border-radius:8px;padding:16px 18px;max-width:520px;margin:6px 0 16px;
  display:flex;gap:14px;align-items:center;background:rgba(182,130,53,.04);
}
.confirm img{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--raised)}
.confirm .who{flex:1;min-width:0}
.confirm .who b{display:block;font-size:17px;color:var(--display);font-weight:400}
.confirm .who span{font-size:13px;color:var(--secondary)}
.value{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:0 34px;border-top:1px solid var(--rule);margin-top:36px}
.value-item{border-bottom:1px solid var(--rule-soft);padding:14px 0}
.value-item b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--display);margin-bottom:3px}
.value-item span{color:var(--secondary);font-size:13.5px}
.first-foot{font-size:13px;margin-top:22px;color:var(--dim)}

/* narration (first load) ─────────────────────────────────────────────── */
.narr{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.narr-line{color:var(--body);font-size:15px;animation:narr-in .35s ease}
.narr-line b{color:var(--display);font-weight:400}
.narr-bar{display:block;height:3px;background:var(--rule);border-radius:2px;margin-top:7px;max-width:340px;overflow:hidden}
.narr-fill{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.narr-strip{overflow:hidden;margin:26px 0 6px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.narr-track{display:flex;gap:16px;width:max-content}
.narr-card{display:flex;flex-direction:column;gap:5px;align-items:center;transition:opacity .45s ease,transform .45s ease}
.narr-card .board{width:238px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.narr-card-cap{font-size:13px;color:var(--secondary)}
.narr-fade{opacity:0;transform:scale(.96)}
.narr-wisdom{margin-top:30px;font-family:var(--font-display);font-size:19px;line-height:1.4;color:var(--gold-quiet);max-width:30em;min-height:3.2em;transition:opacity .3s}
@keyframes narr-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .narr-track{animation:drift 46s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}
@media (prefers-reduced-motion:reduce){.narr-line{animation:none}}

/* today ──────────────────────────────────────────────────────────────── */
.today{max-width:720px;padding:24px 0 10px}
.today-grid{max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1000px){.today-grid{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.today-main{min-width:0}
.latest{border:1px solid var(--rule);border-radius:10px;padding:16px 16px 10px}
.latest .kicker{margin-bottom:8px}
.lg-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--rule);border-radius:6px}
.latest .kicker + .lg-row{border-top:0}
.lg-row.is-open{cursor:pointer}
.lg-row.is-open:hover{background:rgba(212,175,55,.06)}
.lg-res{flex:0 0 22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
.lg-W{background:rgba(120,170,100,.18);color:#9fcf8a}
.lg-L{background:rgba(200,90,80,.18);color:#e0968c}
.lg-D{background:rgba(160,160,160,.15);color:#bdbab2}
.lg-who{flex:1 1 auto;min-width:0;font-size:14px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-who small{display:block;font-size:12px;color:var(--secondary);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-state{flex:0 0 auto;text-align:right;font-size:13px;color:var(--gold)}
.lg-state i{display:block;font-style:normal;font-size:11.5px;color:#e0968c}
.lg-state.ok{color:#9fcf8a}
.lg-state.dim{color:var(--text-3)}
.lg-foot{font-size:12.5px;margin:8px 0 4px}
.since{font-size:14.5px;color:var(--gold-quiet);margin:0 0 16px}
.hero{
  border:1px solid var(--edge);border-radius:10px;padding:22px 22px 20px;background:var(--card);
}

.hero h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.1;color:var(--display);margin:4px 0 6px}
.hero .why{color:var(--secondary);font-size:14.5px;margin:0 0 18px}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.week{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12.5px;color:var(--secondary)}

.focus{border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:14px}
.focus-name{font-family:var(--font-display);font-size:22px;color:var(--display);margin:4px 0 4px}
.focus p{margin:0 0 10px;font-size:14px;color:var(--body)}
.focus .plan{border-left:2px solid var(--gold);padding:2px 0 2px 12px;color:var(--primary);font-size:14.5px;margin:10px 0 12px}
.focus .acts{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--secondary);margin:16px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.finding{border:1px dashed var(--edge);border-radius:10px;padding:20px 22px}
.finding h2{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);margin:4px 0 6px}
.finds{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.find{font-size:14px;color:var(--body);animation:narr-in .35s ease}
.find b{color:var(--display);font-weight:400}
.done-big{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,6vw,36px);color:var(--display);margin:2px 0 6px}
.recap{display:flex;gap:10px;overflow-x:auto;padding:8px 0 4px;margin:10px 0 16px}
.recap-item{flex:none;width:118px;cursor:pointer}
.recap-item .board{width:118px;box-shadow:none;border-radius:4px}
.recap-item span{display:block;font-size:11.5px;color:var(--secondary);margin-top:4px;line-height:1.3}
.recap-item .res{font-size:11px;color:var(--text-2)}
.recap-item .res.shown{color:var(--text-3)}

a.armed{color:var(--bad);background:var(--bad-tint);border-radius:4px;padding:2px 6px}

/* the card ───────────────────────────────────────────────────────────── */
.card{display:grid;grid-template-columns:minmax(0,min(520px,max(340px,calc(100vh - 150px)))) minmax(0,1fr);gap:14px 30px;padding:14px 0 20px;align-items:start}
.card-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex:1 1 180px;max-width:420px}
.dot{flex:1;height:5px;border-radius:2px;background:var(--edge);min-width:6px}
.dot.on{background:var(--gold)}
.dot.ok{background:var(--win)}
.dot.bad{background:var(--loss)}
.dot.mid{background:var(--gold-quiet)}

.card-menu{margin-left:auto;font-size:13px;color:var(--secondary);position:relative}
.menu-pop{
  position:absolute;right:0;top:26px;z-index:8;background:var(--raised);border:1px solid var(--edge);
  border-radius:8px;padding:6px;min-width:220px;box-shadow:0 10px 26px rgba(0,0,0,.45);display:flex;flex-direction:column;
}
.menu-pop a{padding:8px 10px;border-radius:5px;color:var(--body);font-size:14px}
.menu-pop a:hover{background:rgba(182,130,53,.08);color:var(--link-hover)}
.menu-pop .sep{height:1px;background:var(--rule);margin:4px 2px}
.board-col{position:relative;min-width:0}
.board-row{display:flex;gap:6px;align-items:stretch}
.evalbar{
  width:14px;flex:none;border-radius:3px;position:relative;background:#403d38;z-index:2;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.evalbar-fill{position:absolute;left:0;right:0;bottom:0;background:#e9e5dc;transition:height .45s ease;border-radius:3px}
.evalbar.flip .evalbar-fill{bottom:auto;top:0}
.evalbar-label{
  position:absolute;left:0;min-width:100%;box-sizing:border-box;white-space:nowrap;text-align:center;
  font-size:10px;line-height:14px;padding:0 3px;border-radius:3px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;font-family:system-ui,sans-serif;font-weight:600;
}
.evalbar-label:empty{display:none}

.board-wrap{position:relative;flex:1;min-width:0}
.board{width:100%;display:block;user-select:none;border-radius:4px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4);touch-action:none}
.board rect[data-sq],.board use[data-sq]{cursor:pointer}
#bwrap.static .board{touch-action:pan-y}
#bwrap.static .board rect[data-sq],#bwrap.static .board use[data-sq]{cursor:default}
.board use.drag-src{opacity:.35}
.anim-piece{transition:transform .22s ease;will-change:transform}
.drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.drag-ghost svg{width:100%;height:100%}
.promo-card{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(15,14,12,.72);
}
.promo-in{display:flex;gap:10px;background:rgba(15,14,12,.92);border:1px solid var(--gold);border-radius:6px;padding:12px 16px}
.promo-opt{width:52px;height:52px;border:1px solid var(--edge);border-radius:4px;display:flex;cursor:pointer}
.promo-opt:hover{border-color:var(--gold)}
.promo-opt svg{width:100%;height:100%}
.panel{min-width:0;display:flex;flex-direction:column}
.ctx{font-size:13px;color:var(--secondary);margin:0 0 6px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx b{color:var(--primary);font-weight:400}
.ctx .tag{color:var(--gold-quiet)}
.task{font-family:var(--font-display);font-size:27px;line-height:1.15;color:var(--display);margin:4px 0 6px}
.stakes{font-size:14.5px;color:var(--body);margin:0 0 14px}
.verdict{font-size:16px;margin:4px 0 10px;min-height:1.4em;color:var(--primary)}
.verdict b{font-weight:600}
.verdict-good{color:var(--win)}
.verdict-bad{color:var(--loss)}
.verdict-mid{color:var(--link-hover)}
.checking{
  display:flex;align-items:center;gap:10px;font-size:15px;color:var(--gold-quiet);margin:4px 0 10px;
}
.checking .meter{flex:0 0 120px;height:4px;border-radius:2px;background:var(--rule);overflow:hidden;position:relative}
.checking .meter i{position:absolute;top:0;bottom:0;width:40%;background:var(--gold);border-radius:2px;animation:sweep 1s ease-in-out infinite}
@keyframes sweep{0%{left:-40%}100%{left:100%}}
.acts-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:6px 0 4px}
.hint-note{font-size:14px;color:var(--link-hover);margin:6px 0 8px;border-left:2px solid var(--gold);padding-left:10px}
.lines{margin:10px 0 6px}

.nav-btn{border:1px solid var(--edge);border-radius:5px;padding:2px 12px;font-size:16px;color:var(--body);line-height:1.4;cursor:pointer}
.nav-btn:hover{border-color:var(--gold)}
.nav-off{opacity:.35;pointer-events:none}

/* insights ───────────────────────────────────────────────────────────── */
.ins{max-width:860px;padding:24px 0 10px}

.fam{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:10px;cursor:pointer;display:block;color:inherit}

.slice{border-left:2px solid var(--gold-quiet);padding:4px 0 4px 14px;margin:0 0 16px}
.slice p{margin:0 0 6px;font-size:15px;color:var(--primary)}
.slice .n{font-size:12.5px;color:var(--dim)}

/* sheet (pattern details, what's new) ────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{
  width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--raised);border:1px solid var(--rule);
  border-radius:14px 14px 0 0;padding:22px 22px 28px;box-shadow:0 -10px 30px rgba(0,0,0,.45);
}
@media (min-width:700px){.sheet{border-radius:12px}}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);margin:4px 0 6px}
.sheet .close{float:right;font-size:22px;line-height:1;color:var(--secondary)}
.sheet p{font-size:14.5px}
.ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:12px 0}
.ex{cursor:pointer}
.ex .board{box-shadow:none;border-radius:4px}
.ex span{display:block;font-size:12px;color:var(--secondary);margin-top:4px;line-height:1.3}

/* settings ───────────────────────────────────────────────────────────── */
.settings{border-top:1px solid var(--rule);margin-top:30px;padding-top:20px}
.settings h2{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--display);margin:0 0 4px}

.set-block{border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:18px}
.set-block > .kicker{display:block;margin-bottom:6px}
.set-block p{font-size:13.5px;color:var(--secondary);margin:0 0 8px}
.check{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:14px;cursor:pointer;color:var(--body)}
.check input{accent-color:var(--gold);margin:0}

/* footer, notices ────────────────────────────────────────────────────── */
.foot{max-width:1180px;margin:40px auto 0;padding:14px var(--gutter) 22px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.foot-line{font-size:12.5px;color:var(--dim)}
.foot-links{display:flex;gap:20px;font-size:12.5px;flex-wrap:wrap}
.foot-links a{color:var(--gold-quiet)}
.notice{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
  background:var(--raised);border:1px solid var(--edge);border-radius:6px;
  padding:10px 16px;font-size:13.5px;color:var(--body);max-width:min(90vw,560px);
}
@media (max-width:860px){.notice{bottom:86px}}
.loading{color:var(--dim);font-size:14px;padding:6px 0}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  .checking .meter i{animation:none !important;left:0;width:100%;opacity:.5}
}
.sheet{overscroll-behavior:contain}
.kb-move{position:absolute;left:-9999px;top:auto}
.kb-move:focus-within{position:static;display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:13px;color:var(--secondary)}
.kb-move input{background:var(--raised);border:1px solid var(--edge);border-radius:5px;color:var(--primary);padding:7px 9px;font:inherit;width:9em}
.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){
  .ratings{display:none}
  .brand-name{font-size:20px}
  .brand{gap:8px}
  .hero-top .week{flex-direction:row;align-items:center;gap:8px;margin:-4px 0 14px}
}
.card-task{display:none}
@media (max-width:860px){
  .card-task{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-basis:100%;
    font-size:14.5px;line-height:1.35;color:var(--primary);margin:-2px 0 2px}
  .card-task.bad{color:#e0968c}
  .card-task.good{color:#9fcf8a}
}

@media (max-width:860px){
  .sticky-acts .sticky-nav{display:inline-flex;flex:0 0 44px;justify-content:center;align-items:center;height:46px;font-size:22px}

  .card-task.good b{color:#9fcf8a;font-weight:400}
}

/* the card, guessing: one feedback slot, the actions level with the board ── */
.card > .panel{align-self:stretch}
.task{font-weight:400}
.stakes-tag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-1);margin:0 0 4px}
.dot-bad{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.feedback{min-height:72px;margin:2px 0 8px}
.feedback .verdict{margin:0 0 6px}

.guess-acts .btn-line,.guess-acts .btn-big{flex:1 1 0;justify-content:center;text-align:center;min-height:48px;display:inline-flex;align-items:center}
@media (min-width:861px){
  .guess-acts,.done-acts{margin-top:auto;padding-top:12px}
}

/* the card, answered: the result, and both halves of the lesson ────────── */
.result{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin:6px 0 12px}
.result.first{background:var(--good-tint);border-color:rgba(143,181,115,.25)}
.result-head{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.disc{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:var(--good);color:#12160f;font-size:15px;font-weight:600;animation:disc-in var(--dur-2) var(--ease)}
.disc.disc-help{background:none;border:1.5px solid var(--good);color:var(--good)}
@keyframes disc-in{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.result-h{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:1.2;color:var(--text-1);margin:0;
  font-variant-numeric:lining-nums tabular-nums;outline:none}
.result-sub{font-size:14px;color:var(--text-2);margin:0 0 8px}
.tline{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r1);
  padding:8px 8px;margin:2px -8px;font:inherit;font-size:15px;line-height:1.45;color:var(--text-2);cursor:pointer;
  font-variant-numeric:lining-nums}
.tline:hover{background:rgba(236,232,223,.04)}
.tline.on{color:var(--text-1);background:rgba(236,232,223,.05)}
.tline:focus-visible{outline:2px solid var(--text-1);outline-offset:2px}
.tl-dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:.55em}
.tl-bad .tl-dot{background:var(--bad)}
.tl-good .tl-dot,.tl-alt .tl-dot{background:var(--good)}
.tl-opp{font-size:13.5px}
.tl-opp .tl-dot{background:var(--line-strong)}
.tl-text{flex:1 1 auto;min-width:0}
.tl-play{flex:none;width:0;height:0;margin-top:.5em;border-left:7px solid var(--text-3);border-top:5px solid transparent;border-bottom:5px solid transparent;opacity:.8}
.tag-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 4px}
.when{font-size:13px;color:var(--text-3)}
.explore-line{font-size:13.5px;color:var(--text-2);margin:8px 0 0}
.done-acts .nav-btn{flex:0 0 48px;height:48px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;padding:0}
.done-acts .btn-big{flex:1 1 auto;justify-content:center;min-height:48px}
@media (max-width:860px){
  .result{padding:12px 14px}
  .result-h{font-size:24px}
  .tline{font-size:14px;line-height:1.4}
}

/* session mode: the board and nothing else ──────────────────────────── */
:root{
  --board:clamp(360px, min(100vh - 144px, 100vw - 488px), 720px);
  --board-phone:min(100vw - 6px, 100svh - 232px - env(safe-area-inset-bottom));
}
body.in-session #bar,body.in-session .views,body.in-session #foot,body.in-session #settings{display:none}
body.in-session{padding-bottom:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card-top{min-height:48px;gap:12px}
.sb-end{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;line-height:1;color:var(--text-2);border-radius:var(--r1);margin-left:-10px}

.recap-top{display:flex;align-items:center;max-width:680px;margin:0 auto}
.recap-page{max-width:680px;margin:0 auto}
.notice-act{margin-left:10px;font-weight:600;color:var(--accent)}
@media (min-width:861px){
  body.in-session .page{max-width:1200px}
  .card{grid-template-columns:minmax(0,calc(var(--board) + 20px)) minmax(280px,380px);justify-content:center;gap:16px 40px;padding:0 0 24px}
  .card-top{padding-top:4px}
  .board-row{gap:8px}
  .evalbar{width:12px}

}
@media (max-width:860px){
  .card{gap:0;padding-top:0}

  .card-task{height:56px;padding:8px 0;margin:0;font-size:15px;line-height:20px;color:var(--text-1);-webkit-line-clamp:2}

     panel they stay for screen readers only */

  .guess-acts{height:calc(64px + env(safe-area-inset-bottom));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--surface-2)}

/* header: the mark, and the gear ─────────────────────────────────────── */
.bar{position:sticky;min-height:56px;padding-top:6px;padding-bottom:6px}

.fr-name{flex:1 1 auto;min-width:0;font-weight:600;font-size:16px;color:var(--text-1)}
.fr-name small{display:block;font-weight:400;font-size:13px;color:var(--text-3);margin-top:2px}
.fr-bar{flex:0 0 220px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fr-bar i{display:block;height:100%;background:var(--line-strong);border-radius:4px}
.fam-row.is-focus .fr-bar i{background:var(--accent)}
.fr-n{flex:0 0 76px;text-align:right;font-size:14px;color:var(--text-1);font-variant-numeric:tabular-nums}
.fr-go{color:var(--text-3);font-size:18px}
.pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:0 8px;font-size:11px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;vertical-align:2px;margin-left:6px}
.ins .slice{border:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r2);padding:16px 20px;margin:0 0 12px}
.ins .slice p{color:var(--text-1)}
@media (max-width:860px){
  .ins{padding-top:20px}
  .ins h2{font-size:30px;line-height:1.13}
  .ins .lead{display:none}
  .fam-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:start;gap:8px 10px;min-height:56px;padding:12px 14px}
  .fr-bar{grid-column:1/-1;grid-row:2}
  .fr-n{padding-top:2px}
}

/* sheets: the action sits right under the habit ─────────────────────── */
.sheet{background:var(--surface-2);border-color:var(--line);box-shadow:var(--shadow-2)}
.sheet h3{font-weight:500;font-size:28px;line-height:1.2;color:var(--text-1);margin:4px 0 8px}
.sheet .close{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-12px -12px 0 0;font-size:26px;color:var(--text-2);border-radius:var(--r1)}
.sheet .close:hover{background:var(--surface-1);color:var(--text-1)}
.sheet-sum{color:var(--text-2)}
.habit-block{background:var(--surface-1);border-left:2px solid var(--line-strong);border-radius:0 var(--r1) var(--r1) 0;padding:14px 16px;margin:16px 0}
.habit-block .plan{font-size:17px;line-height:1.5;color:var(--text-1);margin-top:6px}
.sheet-acts{margin:0 0 8px}
.pat-list{margin:20px 0 0;border-top:1px solid var(--line)}
.pat-row{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);color:var(--text-1);font-size:14.5px;padding:0 4px}
.pat-row span:first-child{flex:1 1 auto}
.pat-row:hover{background:var(--surface-1);color:var(--text-1)}
.sheet-back{display:inline-block;font-size:13.5px;color:var(--text-2);padding:8px 0}
.ex-list{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
.ex span{color:var(--text-2)}
@media (max-width:860px){.ex-list{grid-template-columns:1fr 1fr}}

/* landing ───────────────────────────────────────────────────────────── */
.landing{max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:0 64px;padding-top:64px;align-items:start}
.landing-copy{min-width:0}
.landing .kicker{color:var(--text-3);margin-bottom:12px}
.landing h1{font-weight:500;font-size:56px;line-height:1.07;color:var(--text-1);max-width:11em;margin:0 0 16px}
.landing .lede{font-size:17px;line-height:1.53;color:var(--text-2);margin:0 0 24px;max-width:32em}
.landing .src-pick{display:inline-grid;grid-template-columns:1fr 1fr;gap:0;width:280px;border:1px solid var(--line-strong);border-radius:var(--r1);overflow:hidden;margin:0 0 12px}
.landing .src-btn{min-height:44px;border:0;border-radius:0;background:transparent;color:var(--text-2);font:inherit;font-size:14px;font-weight:600;padding:0 12px;cursor:pointer}
.landing .src-btn.src-on{background:var(--surface-2);color:var(--text-1);box-shadow:inset 0 0 0 1px var(--accent)}
.landing .first-form{max-width:560px}
.landing .first-form .input{min-height:56px;font-size:16px}
.landing .first-form .btn-big{min-width:200px;min-height:56px}
.landing .first-foot{color:var(--text-3);font-size:13px;margin:12px 0 0}
.landing .first-foot.small{grid-column:1/-1;margin-top:24px}
.landing-ex{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.landing-ex .board{border-radius:var(--r1)}
.ex-task{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--text-1);margin:14px 0 2px}
.ex-sub{font-size:13px;color:var(--text-2);margin:0}
.landing .value{grid-column:1/-1;margin-top:64px;border-top-color:var(--line)}
@media (max-width:1000px){
  .landing{grid-template-columns:1fr;padding-top:32px}
  .landing h1{font-size:40px;line-height:1.1}
  .landing .src-pick{width:100%}
  .landing .first-form .btn-big{width:100%;min-height:52px}
  .landing .first-form .input{flex-basis:100%;min-height:52px}
  .landing-ex{margin-top:32px}
}

/* the first minute: one card shape for every state */
.hero.state h2{margin-bottom:8px}
.read-prog{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.rp-bar{flex:1 1 auto;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.rp-bar i{display:block;height:100%;background:var(--accent);transition:width var(--dur-3) var(--ease)}
.rp-n{font-size:13px;color:var(--text-2);white-space:nowrap}
.hero .finds{margin:0 0 16px}
.hero .find{font-size:14px;color:var(--text-1);margin:4px 0}
.landing .src-btn{display:flex;align-items:center;justify-content:center;text-align:center}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:2px}

/* phones: the latest games sit right under the Today card, the way back in after a game */
@media (max-width:860px){
  .today-grid .today-main{display:contents}
  .today-grid .since{order:0}
  .today-grid .hero{order:1}
  .today-grid .latest{order:2;margin-top:16px}
  .today-grid .focus{order:3}
  .today-grid .status{order:4}
  .today-grid .fmt-line{order:5}
}
a.lg-row{color:inherit}
.recap-ladder{color:var(--text-2);margin:-12px 0 20px}
.handoff{font-size:14px;color:var(--text-2);margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.evalbar.pending{background:var(--line)}
.evalbar.pending .evalbar-fill{opacity:0}
.proof{margin:24px 0 0;padding:16px 20px;border-left:2px solid var(--line-strong);background:var(--surface-1);border-radius:0 var(--r1) var(--r1) 0}
.proof figcaption{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.proof blockquote{margin:0;font-size:16px;line-height:1.5;color:var(--text-1)}
.which-q{font-size:15px;color:var(--text-1);margin:12px 0 8px}
.which-row{display:flex;flex-wrap:wrap;gap:12px}
.which-row .btn-line{min-height:44px}
.which-none{font-size:14px;color:var(--text-2);margin:12px 0 0}
/* explore: the answered board as a question box */
.xp{position:relative;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r2);padding:8px 14px 4px;margin:0 0 12px}
.xp-meter{position:absolute;left:0;right:0;top:0;height:2px;overflow:hidden;border-radius:var(--r2) var(--r2) 0 0;visibility:hidden}
.xp-meter.run{visibility:visible;background:var(--rule)}
.xp-meter i{position:absolute;top:0;bottom:0;width:40%;background:var(--gold);animation:sweep 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.xp-meter i{animation:none !important;left:0;width:100%;opacity:.5}}
.xp-head{display:flex;align-items:center;gap:12px;height:28px}
.xp-trail{flex:1 1 auto;min-width:0;display:flex;gap:8px;overflow:hidden;white-space:nowrap;font-size:13.5px;font-variant-numeric:lining-nums tabular-nums}
.xp-label{font-size:11px;line-height:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.xp-mv{color:var(--text-1);border:0;border-bottom:1.5px solid transparent;line-height:20px;background:none;padding:0;font:inherit;cursor:pointer}
.xp-mv.xp-sf{color:var(--text-3)}
.xp-mv.on{border-bottom-color:var(--accent)}
.xp-back{flex:none;font-size:13.5px;color:var(--text-2);padding:8px 0;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;cursor:pointer}
.xp-say{font-size:16px;line-height:24px;color:var(--text-1);min-height:48px;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xp-cap{font-size:12px;line-height:18px;color:var(--text-3);margin:8px 0 0}
.xp-rows{display:flex;flex-direction:column;margin:0 -14px}
.xp-rows.k1 .xp-row:nth-child(n+2),.xp-rows.k2 .xp-row:nth-child(n+3){display:none}
.xp-row{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 14px;border:0;border-top:1px solid var(--line);font:inherit;font-size:14px;color:var(--text-3);white-space:nowrap;text-align:left;background:none;cursor:pointer}
.xp-row:first-child{border-top:0}
@media (hover:hover){.xp-row:hover{background:rgba(236,232,223,.04)}}
.xp-row:focus-visible{outline:2px solid var(--text-1);outline-offset:-2px}
.xp-row.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:1px;background:var(--gold)}
.xp-chip{flex:none;min-width:70px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface-2);color:var(--text-1);font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:lining-nums tabular-nums}
.xp-first{flex:none;color:var(--text-1);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.xp-cont{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:lining-nums tabular-nums}
.xp-cont.t1{color:var(--text-2)}
.xp-row.skel{cursor:default}
.xp-row.skel .xp-chip,.xp-row.skel .xp-first,.xp-row.skel .xp-cont{color:transparent;background:var(--line);border-radius:4px}
.xp-kb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.xp-kb:focus-within{position:static;width:auto;height:auto;clip:auto;margin:8px 0 4px;display:block}
.result.xp-on{padding:8px 14px;margin:4px 0 10px}
.result.xp-on .result-head{margin:0;gap:10px}
.result.xp-on .disc{width:22px;height:22px;font-size:12px}
.result.xp-on .result-h{font-size:21px;line-height:28px}
.result.xp-on .result-sub,.result.xp-on .tline{display:none}
.card.xp-card .tag-row,.card.xp-card .habit,.card.xp-card .explore-line{display:none}
.xp-back-ph{display:none}
@media (max-width:860px){
  /* the invite sits right under the red line, above the fixed bar */
  .card:not(.xp-card) .result{display:contents}
  .card:not(.xp-card) .result .tl-bad,.card:not(.xp-card) .result .tl-alt{order:-3}
  .explore-line{order:-2;margin-bottom:8px}
  .card:not(.xp-card) .result .tl-opp{order:-1}
  .done-acts{height:calc(64px + env(safe-area-inset-bottom));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--surface-2)}
  .card.xp-card .panel{padding-top:4px}
  .card.xp-card .result,.card.xp-card .ctx{display:none}
  .xp{order:-2;background:none;border:0;border-radius:0;padding:0;margin:0 calc(-1 * var(--gutter))}
  .xp-head,.xp-say,.xp-kb{display:none}
  .xp-meter{border-radius:0}
  .xp-cap{margin:0;padding:0 var(--gutter)}
  .xp-rows{margin:0}
  .xp-row{padding:0 var(--gutter)}
  .xp-back-ph{display:flex;align-items:center;min-height:44px;font-size:14px;color:var(--text-2);padding:0 var(--gutter);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
  .card-task.xp-task{border-left:2px solid var(--accent);padding-left:10px;margin-left:-12px}
}
</style>

function tcParts(tc) {

/* ── chess.com adapter ───────────────────────────────────────────────────

   which site the games came from. Public API, no auth, CORS-open, and

  if (cfg.sound === false) return;
  try {
    if (!sndCtx) sndCtx = new (window.AudioContext || window.webkitAudioContext)();
    /* browsers hand back a suspended context even mid-gesture, resume or
       every tone is silently swallowed */
    if (sndCtx.state === 'suspended') sndCtx.resume();
    var t = sndCtx.currentTime;
    function tone(freq, start, dur, type, gain) {
      var o = sndCtx.createOscillator(), g = sndCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + start);
      g.gain.linearRampToValueAtTime(gain || 0.06, t + start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
      o.connect(g); g.connect(sndCtx.destination);
      o.start(t + start); o.stop(t + start + dur + 0.02);
    }
    if (name === 'tap') tone(340, 0, 0.04, 'triangle', 0.025);
    else if (name === 'move') tone(220, 0, 0.06, 'triangle', 0.05);
    else if (name === 'good') { tone(660, 0, 0.09); tone(880, 0.09, 0.14); }
    else if (name === 'bad') tone(140, 0, 0.16, 'sawtooth', 0.04);
    else if (name === 'set') { tone(523, 0, 0.1); tone(659, 0.1, 0.1); tone(784, 0.2, 0.22); }
  } catch (e) {}
}

/* A custom set: the same trainer, fed by a filter, an opponent, an opening,
   a colour. Coach cards deal these directly instead of linking away. */

function uciToMove(st, uci) {
  if (!uci || uci.length < 4) return null;
  var from = (uci.charCodeAt(1) - 49) * 8 + (uci.charCodeAt(0) - 97);
  var to = (uci.charCodeAt(3) - 49) * 8 + (uci.charCodeAt(2) - 97);
  var promo = uci[4] ? uci[4].toUpperCase() : null;
  var out = null;
  legalMoves(st).forEach(function (m) {
    if (out) return;
    if (m.from === from && m.to === to && (!promo || m.promo === promo)) out = m;
  });
  return out;
}

/* Quiet hourly pickup: the incremental fetch is cheap (it asks only for
   games since the newest cached one), so staying current costs almost
   nothing and the user never has to think about refreshing. */


/* ── 14c. The engine ─────────────────────────────────────────────────────
   Stockfish 16 NNUE, fetched once from a CDN and booted as a blob worker
   (the glue is patched so its .wasm loads cross-origin; jsDelivr sends
   CORS). Falls back to the older asm.js build if WASM is unavailable. Used
   for two things: quietly scanning unanalysed games into training material,
   and judging whether a non-book answer in the trainer was also good.      */

/* ── 14d. The quiet scan ─────────────────────────────────────────────────
   Keeps a buffer of games ready to train: whenever fewer than SCAN_BUFFER
   games hold an unmastered position, the newest unanalysed game is scanned
   in the background, every position evaluated, the win-chance swings
   turned into the same blunder records the Lichess-analysed games carry.
   Results persist in the game cache, so each game is scanned once ever.   */

var SCAN_RECENT = 20;    /* incoming games always jump the queue */
/* up to two games are read at once, so the engines never wait on the slow
   tail of one game; inflight holds their ids */
var scanState = { running: false, current: null, done: 0, inflight: {}, active: 0 };

/* Coverage, not buffering: the newest SCAN_WINDOW games should each have
   analysis from somewhere, Lichess's servers or the engine here. Training
   always has fresh material, and new games go to the front of the line. */
function scanCoverage() {
  var covered = 0, total = 0;
  data.games.forEach(function (g) {
    if (!inScope(g)) return;
    if (g.analysed || g.scanned || g.bl) { covered++; total++; }
    else if (scannableAny(g)) total++;
  });
  return { covered: covered, total: total };
}

function scanMiss(g) {
  scanState.miss = scanState.miss || {};
  scanState.miss[g.id] = (scanState.miss[g.id] || 0) + 1;
}
function scanBlocked(g) {
  return scanState.miss && scanState.miss[g.id] >= 3;
}
function scannable(g) {
  return g && !g.analysed && !g.scanned && !g.bl && !g.mvMiss && !scanBlocked(g)
    && g.plies >= 6 && isEligible(g.perf);
}
/* the last lane ignores the format filter: the fish works until EVERYTHING
   is analysed, untracked formats go last, but they go */
function scannableAny(g) {
  return g && !g.analysed && !g.scanned && !g.bl && !g.mvMiss && !scanBlocked(g)
    && g.plies >= 6;
}

/* The scan never stops while anything is scannable, it rotates in batches
   so every consumer gets fed early and keeps getting fed: fresh games always
   first, then one game per coach custom set in turn, then the general pool,
   round and round until the whole window is covered. */
function nextScanTarget() {
  var i, g, free = function (x) { return !scanState.inflight[x.id]; };
  /* anything new at the top of the list first */
  for (i = 0; i < Math.min(SCAN_RECENT, data.games.length); i++) {
    if (scannable(data.games[i]) && free(data.games[i])) return data.games[i];
  }
  /* then games whose moves are already here, rotating across formats; losses
     first, since only a loss or a draw has a move that decided it */
  var perfs = trackedPerfs();
  var fStart = (scanState.frr || 0) % perfs.length;
  for (var pass = 0; pass < 2; pass++) {
    for (var fs = 0; fs < perfs.length; fs++) {
      var pf = perfs[(fStart + fs) % perfs.length];
      for (i = 0; i < data.games.length; i++) {
        g = data.games[i];
        if (g.perf === pf && g.mv && scannable(g) && free(g) && (pass === 1 || g.res !== 'win')) {
          scanState.frr = (fStart + fs + 1) % perfs.length;
          return g;
        }
      }
    }
  }
  for (i = 0; i < data.games.length; i++) if (scannable(data.games[i]) && free(data.games[i])) return data.games[i];
  for (i = 0; i < data.games.length; i++) if (scannableAny(data.games[i]) && free(data.games[i])) return data.games[i];
  return null;
}

 

/* When the retained pool runs dry, refuel it wholesale: one POST to the
   export-by-ids endpoint brings movetext for up to 150 games, the pool
   keeps eating at 1.2s gaps instead of dropping to one fetch per 20s. */
var bulkState = { at: 0, fails: 0, busy: false };
function bulkAllowed() {
  return !isCC() && !bulkState.busy && bulkState.fails < 3
    && Date.now() - bulkState.at > 120000
    && Date.now() >= backoffUntil;
}
function bulkRetain() {
  /* chess.com games arrive with their movetext in hand, nothing to refuel */
  if (isCC()) return Promise.resolve(0);
  bulkState.busy = true;
  bulkState.at = Date.now();
  var myGen = gen;
  /* newest scannable per format, interleaved, up to 150 ids */
  var perfs = trackedPerfs();
  var byPerf = {};
  perfs.forEach(function (p) { byPerf[p] = []; });
  data.games.forEach(function (g) {
    if (scannable(g) && !g.mv && byPerf[g.perf]) byPerf[g.perf].push(g);
  });
  var ids = [];
  for (var round = 0; ids.length < 150; round++) {
    var got = false;
    for (var pi = 0; pi < perfs.length && ids.length < 150; pi++) {
      var g2 = byPerf[perfs[pi]][round];
      if (g2) { ids.push(g2.id); got = true; }
    }
    if (!got) break;
  }
  if (ids.length < 150) {
    var seenIds = {};
    ids.forEach(function (id) { seenIds[id] = 1; });
    for (var gi = 0; gi < data.games.length && ids.length < 150; gi++) {
      var g4 = data.games[gi];
      if (scannableAny(g4) && !g4.mv && !seenIds[g4.id]) ids.push(g4.id);
    }
  }
  if (!ids.length) { bulkState.busy = false; return Promise.resolve(0); }
  return request('/api/games/export/_ids?moves=true&clocks=true',
      { method: 'POST', body: ids.join(','), accept: 'application/x-ndjson', quiet: true })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      if (stale(myGen)) return 0;
      var byId = {};
      data.games.forEach(function (g) { byId[g.id] = g; });
      var fed = 0;
      text.split('\n').forEach(function (line) {
        if (!line.trim()) return;
        try {
          var full = JSON.parse(line);
          var g3 = byId[full.id];
          if (g3 && full.moves && scannableAny(g3)) {
            g3.mv = full.moves;
            if (full.clocks) g3.ck = full.clocks;
            fed++;
          }
        } catch (e) {}
      });
      if (fed) saveGames(data.games);
      bulkState.busy = false;
      bulkState.fails = 0;
      return fed;
    })
    .catch(function () {
      bulkState.busy = false;
      bulkState.fails++;
      return 0;
    });
}

/* chess.com's refuel: games that lost their movetext get it back by
   refetching their MONTHS (a couple of cheap GETs), since the single-game
   endpoint is lichess's. */
function ccRefuel() {
  bulkState.busy = true;
  bulkState.at = Date.now();
  var myGen = gen;
  var months = {};
  data.games.forEach(function (g) {
    if (!scannableAny(g) || g.mv) return;
    var d = new Date(g.ts);
    var ym = d.getUTCFullYear() + '/' + String(d.getUTCMonth() + 1).padStart(2, '0');
    months[ym] = 1;
  });
  var list = Object.keys(months).sort().reverse().slice(0, 3);
  if (!list.length) { bulkState.busy = false; return Promise.resolve(0); }
  var byId = {};
  data.games.forEach(function (g) { if (!g.mv && scannableAny(g)) byId[g.id] = g; });
  var fed = 0;
  var chain = Promise.resolve();
  list.forEach(function (ym) {
    chain = chain.then(function () {
      if (stale(myGen)) return;
      return ccJSON('/player/' + encodeURIComponent(cfg.user) + '/games/' + ym, { quiet: true })
        .then(function (mo) {
          (mo.games || []).forEach(function (raw) {
            var shaped = ccShape(raw);
            if (!shaped) return;
            var g2 = byId[shaped.id];
            if (g2 && shaped.moves) {
              g2.mv = shaped.moves;
              if (shaped.clocks) g2.ck = shaped.clocks;
              delete g2.mvMiss;
              fed++;
            }
          });
          /* this month has now been read in full: any of its games still
             without movetext truly has no copy to fetch */
          Object.keys(byId).forEach(function (id2) {
            var g6 = byId[id2];
            if (g6.mv) return;
            var d6 = new Date(g6.ts);
            var ym6 = d6.getUTCFullYear() + '/' + String(d6.getUTCMonth() + 1).padStart(2, '0');
            if (ym6 === ym) g6.mvMiss = 1;
          });
        }).catch(function () {});
    });
  });
  return chain.then(function () {
    if (!stale(myGen) && fed) saveGames(data.games);
    bulkState.busy = false;
    return fed;
  });
}

function autoScan() {
  var tr = function () {};
  if (!cfg.user) { scanState.running = false; scanState.pending = false; return; }
  /* a second game joins only when both analysts can be kept busy */
  var lanes = SF.workers.length >= 3 ? 2 : 1;
  if (scanState.active >= lanes || SF.state === 'failed' || scanState.fetching) { tr('busy/failed'); return; }
  /* the scan is the politest customer in the shop: it waits out any backoff
     with room to spare rather than being the thing that causes one */
  if (Date.now() < backoffUntil) {
    tr('backoff');
    setTimeout(autoScan, backoffUntil - Date.now() + 30000);
    return;
  }
  var target = nextScanTarget();
  if (!target) { tr('no-target'); scanState.current = null; scanState.pending = false; renderAnalysisStatus(); return; }
  if (!target.mv && bulkAllowed()) {
    /* refuel first, the same games come back fetchless in a few seconds */
    if (scanState.active) return;
    scanState.fetching = scanState.running = true;
    renderAnalysisStatus();
    bulkRetain().then(function (fed) {
      scanState.fetching = false;
      scanState.running = scanState.active > 0;
      setTimeout(autoScan, fed ? 800 : 1500);
    });
    return;
  }
  if (isCC() && !target.mv) {
    if (!bulkState.busy && bulkState.fails < 3 && Date.now() - bulkState.at > 60000) {
      tr('ccRefuel');
      if (scanState.active) return;
      scanState.fetching = scanState.running = true;
      renderAnalysisStatus();
      ccRefuel().then(function (fed) {
        scanState.fetching = false;
        scanState.running = scanState.active > 0;
        if (fed) bulkState.fails = 0; else bulkState.fails++;
        setTimeout(autoScan, fed ? 300 : 1000);
      });
      return;
    }
    /* refuel is cooling down: wait for its window rather than branding
       the game, only a refetched month that truly lacks the game may
       mark mvMiss (ccRefuel does that precisely) */
    tr('mv-wait');
    setTimeout(autoScan, 8000);
    return;
  }
  tr('scan:' + target.id);
  scanState.running = true;
  scanState.active++;
  scanState.inflight[target.id] = 1;
  scanState.current = target;
  scanState.lastLocal = !!(target.mv && !target.bl);
  renderAnalysisStatus();
  /* the second lane starts at once, if there is room and work */
  if (scanState.active < lanes && scanState.lastLocal) setTimeout(autoScan, 0);
  var local = scanState.lastLocal;
  scanGame(target)
    .catch(function (e) { if (window.console) console.error('scan fail', e && e.message); scanMiss(target); })
    .then(function () {
      scanState.active--;
      delete scanState.inflight[target.id];
      scanState.running = scanState.active > 0;
      /* the fish stays awake through the breather between games, grey means
         genuinely done (or the engine failed), never "between bites" */
      scanState.pending = !!nextScanTarget();
      scanState.done++;
      renderAnalysisStatus();
      /* the expensive work, serializing the cache, re-mining the trainer's
         queues, batches across scans instead of taxing every completion */
      if ((scanState.dirty || 0) >= 5 || !scanState.pending) {
        scanState.dirty = 0;
        flushSave();
        if (ui.view === 'insights' && !ui.session) renderInsights();
        if (!scanState.pending) setTimeout(autoEnrich, 500);
      }
      /* the next local game follows straight on; a fetched one waits politely */
      setTimeout(autoScan, local ? 0 : 20000);
    });
}

/* A player who mostly blitzes still deserves a real rapid read: after the
   main window lands, any tracked format sitting under its floor gets its
   own quiet per-format fetch, merged and deduped in the background. */
function retainMovetext() {
  var kept = {};
  /* count what is already retained so repeat passes respect the cap */
  data.games.forEach(function (g) {
    if (g.mv && !g.bl && !g.scanned && !g.analysed) kept[g.perf] = (kept[g.perf] || 0) + 1;
  });
  data.games.forEach(function (g) {
    if (!g.mvTmp) return;
    if (!g.analysed && !g.scanned && !g.bl && !g.mv && g.plies >= 6
        && (isCC() || (kept[g.perf] || 0) < RETAIN_PER_FORMAT)) {
      g.mv = g.mvTmp;
      if (g.ckTmp) g.ck = g.ckTmp;
      kept[g.perf] = (kept[g.perf] || 0) + 1;
    }
    delete g.mvTmp;
    delete g.ckTmp;
  });
}

function topUpFormats() {
  if (isCC()) return;   /* the archive walker enforces the floors itself */
  if (data.sections.games !== 'ok') return;
  data.topups = data.topups || {};
  var meId = String(cfg.user).toLowerCase();
  var myGen = gen;
  var chain = Promise.resolve();
  trackedPerfs().forEach(function (p) {
    var have = 0;
    data.games.forEach(function (g) { if (g.perf === p) have++; });
    if (have >= cfg.perFormat || data.topups[p]) return;
    data.topups[p] = 1;
    chain = chain.then(function () {
      if (stale(myGen)) return;
      /* a game already held is never pushed twice, even if this read is cut short */
      var held = {};
      data.games.forEach(function (g) { held[g.id] = 1; });
      return getND('/api/games/user/' + encodeURIComponent(cfg.user)
          + '?perfType=' + p + '&' + GAME_PARAMS + '&max=' + cfg.perFormat,
        function (g) {
          if (stale(myGen)) return;
          var c = compact(g, meId);
          if (c && !held[c.id]) { held[c.id] = 1; data.games.push(c); }
        }, { quiet: true }
      ).then(function () {
        if (stale(myGen)) return;
        var seen = {};
        data.games = data.games.filter(function (g) {
          if (seen[g.id]) return false;
          seen[g.id] = 1;
          return true;
        }).sort(function (a, b) { return b.ts - a.ts; });
        retainMovetext();
        saveGames(data.games);
        modelDirty();
        renderAll();
      }).catch(function () {
        /* a rate-limited top-up retries once the backoff clears, a format
           must not stay starved because one fetch hit a 429 */
        setTimeout(function () {
          if (stale(myGen)) return;
          delete data.topups[p];
          topUpFormats();
        }, 90000);
      });
    });
  });
}

/* ── 15. Loading ─────────────────────────────────────────────────────── */
/* Slow-moving data persists across visits: profiles, peaks and tournament
   schedules do not change by the minute, so they should not be fetched by
   the minute. Serve the stored copy inside its TTL and skip the network
   entirely; past the TTL, fetch and re-store. Rated games stay on their own
   incremental path. */
function cachedJSON(key, ttlMs, fetcher) {
  var k = 'nl:cache:' + key;
  var hit = store.get(k, null);
  if (hit && hit.at && Date.now() - hit.at < ttlMs) return Promise.resolve(hit.v);
  return fetcher().then(function (v) {
    store.set(k, { at: Date.now(), v: v });
    return v;
  }).catch(function (err) {
    if (hit) return hit.v;          /* stale beats an error */
    throw err;
  });
}

function loadUser() {
  var myGen = gen;
  data.sections.user = 'loading';
  return cachedJSON('user:' + cfg.src + ':' + String(cfg.user).toLowerCase(), 30 * 60 * 1000, function () {
    if (!isCC()) return getJSON('/api/user/' + encodeURIComponent(cfg.user));
    return ccJSON('/player/' + encodeURIComponent(cfg.user)).then(function (prof) {
      return ccJSON('/player/' + encodeURIComponent(cfg.user) + '/stats').then(function (st) {
        var perfs = {};
        var peaks = {};
        [['chess_bullet', 'bullet'], ['chess_blitz', 'blitz'], ['chess_rapid', 'rapid']]
          .forEach(function (pair) {
            var v = st[pair[0]];
            if (!v || !v.last) return;
            var rec = v.record || {};
            perfs[pair[1]] = {
              rating: v.last.rating,
              games: (rec.win || 0) + (rec.loss || 0) + (rec.draw || 0),
              prog: 0,
              last: v.last.date ? v.last.date * 1000 : null      /* the last game in this format */
            };
            if (v.best) peaks[pair[1]] = { rating: v.best.rating };
          });
        return { id: String(prof.username || cfg.user).toLowerCase(),
                 username: prof.username || cfg.user, avatar: prof.avatar || null,

      });
    });
  }).then(function (u) {
    if (stale(myGen)) return;
    data.user = u;
    if (data.narrate && u.perfs) {
      var bits = [];
      ['rapid','blitz','bullet'].forEach(function (k) {
        if (u.perfs[k] && u.perfs[k].games) bits.push(k + ' ' + u.perfs[k].rating);
      });
      narrLine('user', 'Found <b>' + esc(u.username || cfg.user) + '</b>'
        + (bits.length ? ': ' + bits.join(', ') : '') + '.');
      if (el('identity')) el('identity').innerHTML = identityHtml();
    }
    data.sections.user = 'ok';
    renderHeader();
  }).catch(function (err) {
    if (stale(myGen)) return;
    data.sections.user = 'fail';
    data.userErr = err && err.code;
    /* only a true 404 means the account is wrong, a rate limit or a bad
       connection must never claim the user does not exist */
    if (err && err.code === 404) notice((isCC() ? 'chess.com' : 'lichess') + ' has no account called ' + cfg.user + '.');
  });
}

/* The rating curve is reconstructed from the games we already hold: the rating
   after a game is the rating it was played at plus its diff. No extra request,
   and it moves with whatever game window is loaded. */
function buildSeries() {
  data.series = {};
  data.deltas = {};
  var midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  var cut = Date.now() - 90 * 864e5;

  trackedPerfs().forEach(function (p) {
    var list = data.games.filter(function (g) { return g.perf === p && g.myR; }).slice().reverse();
    if (!list.length) return;
    var rating = function (g) { return g.myR + (g.rd || 0); };
    var recent = list.filter(function (g) { return g.ts >= cut; });
    data.series[p] = {
      points: recent.length >= 2 ? recent.map(rating) : list.slice(-12).map(rating)
    };
    /* the product's one progress window: the past 30 days, same as the
       blunder trend. Baseline = rating after the last game older than 30d,
       or the pre-rating of the oldest in-window game for newer accounts. */
    var monthCut = Date.now() - 30 * 864e5;
    var older = list.filter(function (g) { return g.ts < monthCut; });
    var inWin = list.filter(function (g) { return g.ts >= monthCut; });
    if (inWin.length) {
      var base = older.length ? rating(older[older.length - 1]) : inWin[0].myR;
      var cur = data.user && data.user.perfs && data.user.perfs[p]
        ? data.user.perfs[p].rating : rating(list[list.length - 1]);
      data.deltas[p] = cur - base;
    }
  });
}

/* The annotated 1000-game export takes Lichess several seconds to even
   begin sending. The theater cannot wait for that: a 12-game moves-only
   fetch returns instantly and fills the boards while the big one warms up. */
function loadNarrPreview() {
  /* chess.com has no cheap last-N endpoint, and asking LICHESS for a
     chess.com username can stream a stranger's games onto the boards -
     the archive walker feeds the strip itself, games arrive with month 1 */
  if (isCC()) return Promise.resolve();
  if (!data.narrate || (data.narrPreview && data.narrPreview.length >= 3)) return Promise.resolve();
  var myGen = gen;
  var got = [];
  return getND('/api/games/user/' + encodeURIComponent(cfg.user)
      + '?max=12&moves=true&perfType=' + trackedPerfs().join(','),
    function (g) {
      if (!g.moves || (g.variant && g.variant !== 'standard')) return;

function loadGames() {

  var meId = String(cfg.user).toLowerCase();

  return fetchGames(meId, function (n, c2) {

        var eta = '';

          var left = Math.max(0, (limit - n) / rate);

        }

             yet, show the depth so the search never looks frozen */
          narrLine('games', 'Searching your archives… <span class="tnum">' + c2
            + '</span> months back<span class="dim"> · looking for your rated games</span>');
        } else {
          narrLine('games', 'Reading your games… <span class="tnum">' + n + ' / ' + limit + '</span>'
            + '<span class="dim">' + eta + '</span>'
            + '<span class="narr-bar"><span class="narr-fill" style="width:' + pctDone + '%"></span></span>');
        }

  }, function (partial) {

    buildSeries();
    renderHeader();
    if (!data.narrate) renderTrain();
  }).then(function (payload) {
    if (stale(myGen)) return;
    data.games = payload.games;
    data.sections.games = 'ok';
    if (data.narrate) {
      var totalRead = payload.games.length;
      var byP = {};
      payload.games.forEach(function (g2) { byP[g2.perf] = (byP[g2.perf] || 0) + 1; });
      var perBits = trackedPerfs().map(function (p2) {
        return perfLabel(p2) + ' <span class="tnum">' + (byP[p2] || 0) + '</span>';
      }).join(' · ');

        ? 'Read every rated game you have: '

    saveGames(data.games);
    renderHeader(); renderFoot();

  return w >= 80 ? 'you are winning' : w >= 60 ? 'you are better' : w >= 40 ? 'about level' : w >= 20 ? 'you are worse' : 'you are losing';
}
/* when the card comes back, in a few words */
function scheduleWords(rec, a) {
  if (!rec) return '';
  if (isLearned(rec)) return 'Learned. A check-in ' + dueWhen(rec.due);
  if (a.relearnQueued) return 'Back later in this session';
  var w = dueWhen(rec.due);
  return 'Back ' + (w === 'later today' ? 'later today' : w);
}
function scrollTrainerTop() {
  if (window.innerWidth > 860) return;
  var t = el('trainbox');
  if (!t) return;
  var y = t.getBoundingClientRect().top + window.pageYOffset - ((el('bar') || {}).offsetHeight || 52) - 6;
  try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, y); }
}

/* ── Insights ────────────────────────────────────────────────────────────── */
function renderInsights() {
  var box = el('insightsbox');
  if (!box || !cfg.user) return;
  if (ui.view !== 'insights' && box.innerHTML) return;       /* rendered on demand */
  var r = insightReport(), n = analysisNumbers();
  if (!data.games.length) {
    box.innerHTML = '<div class="ins">' + (data.sections.games === 'loading' ? '<p class="loading">Reading your games…</p>'
      : '<p class="sec">Insights appear once there are rated games to read. See Today for what to do next.</p>') + '</div>';
    return;
  }
  var partial = n.covered < n.total;
  /* the window is named once, here */
  /* the window's span, not the part read so far */
  var cg = (partial ? scopedGames() : coveredGames()).map(function (g) { return g.ts; });
  var mY = function (t) { return new Date(t).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }); };
  var span = cg.length ? ', ' + mY(Math.min.apply(null, cg)) + ' to ' + mY(Math.max.apply(null, cg)) : '';
  var h = '<div class="ins"><div class="kicker">Based on ' + (partial ? r.games + ' of ' + n.total + ' games so far' : plur(r.games, 'game')) + span + '</div>';
  if (!r.families.length) {
    h += '<h2>Your report appears as Stockfish reads your games.</h2><p class="lead">' + n.covered + ' of ' + n.total + ' games checked. The first patterns show up after a handful of games; the full picture at about ' + INSIGHT_MIN_GAMES + '.</p></div>';
    box.innerHTML = h;
    return;
  }
  var cov = r.coverage, top = r.families[0];
  var head, lead = '';
  if (cov.losses >= 5) {
    head = cov.decided + ' of your ' + cov.losses + ' losses came down to one big mistake.';
    if (top.cost >= 1) lead = 'The biggest leak is ' + esc(top.fam.name.toLowerCase()) + '. It decided ' + fmtGames(top.cost) + '.';
  } else head = 'Your mistakes, grouped by the habit that would prevent them.';
  h += '<h2>' + head + '</h2>' + (lead ? '<p class="lead">' + lead + '</p>' : '');
  /* one ranked list: the bar is games decided, against the top family */
  var focus = currentFocus(), maxCost = Math.max.apply(null, r.families.map(function (a) { return a.cost; }).concat([1]));
  h += '<h3 class="ins-h">What decided your games</h3><div class="fam-list">';
  r.families.forEach(function (a) {
    var pats = a.patterns.slice().sort(function (x, y) { return y.cost - x.cost || y.count - x.count; });
    var sub = pats.length > 1 ? pats.slice(0, 3).map(function (s) { return esc(s.info.plural); }).join(', ') : '';
    var isFocus = focus && focus.fam === a.fam.key;
    h += '<a class="fam-row' + (isFocus ? ' is-focus' : '') + '" data-act="sheet" data-k="family:' + a.fam.key + '">'
      + '<span class="fr-name">' + esc(a.fam.name) + (isFocus ? ' <span class="pill">Focus</span>' : '')
        + (sub ? '<small>' + sub + '</small>' : '') + (a.learned ? '<small>' + a.learned + ' learned so far</small>' : '') + '</span>'
      + '<span class="fr-bar"><i style="width:' + Math.max(3, Math.round(a.cost * 100 / maxCost)) + '%"></i></span>'
      + '<span class="fr-n">' + (a.cost >= 1 ? fmtGames(a.cost) : plur(a.count, 'position')) + '</span><span class="fr-go" aria-hidden="true">›</span></a>';
  });
  h += '</div>';
  if (r.ready) {
    h += '<h3 class="ins-h">Where it happens</h3>';
    if (r.slices.length) {
      r.slices.forEach(function (s) {
        h += '<div class="slice"><p>' + esc(s.text) + '</p><a data-act="drill" data-spec="' + esc(JSON.stringify(s.spec)) + '">Drill these ›</a></div>';
      });
    } else h += '<p class="sec">No clear pattern yet by colour or opening. This sharpens as more games are checked; for now the list above is where the points are.</p>';
  } else {
    h += '<p class="sec" style="margin-top:20px">After ' + INSIGHT_MIN_GAMES + ' checked games you will also see where your mistakes happen: as White or Black, and in which openings.</p>';
  }
  h += '</div>';
  box.innerHTML = h;
}

/* the name on both sites at once: one found, go; both, ask which; neither,
   say so. A site that does not answer counts as not found there */
var findSeq = 0;
function findUser(name) {
  name = String(name || '').trim();
  if (!name) return;
  if (!/^[a-zA-Z0-9_-]{2,30}$/.test(name)) { notice('That is not a chess.com or lichess username: letters, numbers, underscore and hyphen only.'); return; }
  /* only the latest lookup acts: an earlier one answering late is ignored */
  var seq = ++findSeq;
  var btn = el('findBtn'), box = el('whichSite');
  if (btn) { btn.textContent = 'Looking…'; btn.classList.add('btn-off'); }
  if (box) box.innerHTML = '';
  /* only a real 404 means "no account there"; anything else is "no answer" */
  var failed = function (e) { return e && e.code === 404 ? null : { err: true }; };
  var li = getJSON('/api/user/' + encodeURIComponent(name), { quiet: true }).then(function (u) {
    if (!u || u.disabled || u.closed) return null;
    var best = null;
    ['rapid', 'blitz', 'bullet', 'classical'].forEach(function (p) { var pf = u.perfs && u.perfs[p]; if (pf && pf.games && (!best || pf.games > best.games)) best = { p: p, games: pf.games, r: pf.rating }; });
    return { site: 'lichess', name: u.username || name, best: best };
  }, failed);
  var cc = ccJSON('/player/' + encodeURIComponent(name), { quiet: true }).then(function (p) {
    if (!p) return null;
    return ccJSON('/player/' + encodeURIComponent(name) + '/stats', { quiet: true }).then(function (st) {
      var best = null;
      [['chess_rapid', 'rapid'], ['chess_blitz', 'blitz'], ['chess_bullet', 'bullet']].forEach(function (k) {
        var v = st && st[k[0]], n = v && v.record ? (v.record.win || 0) + (v.record.loss || 0) + (v.record.draw || 0) : 0;
        if (n && (!best || n > best.games)) best = { p: k[1], games: n, r: v.last && v.last.rating };
      });
      return { site: 'chesscom', name: p.username || name, best: best };
    }, function () { return { site: 'chesscom', name: p.username || name, best: null }; });
  }, failed);
  Promise.all([cc, li]).then(function (res) {
    if (seq !== findSeq) return;
    box = el('whichSite'); btn = el('findBtn');
    if (btn) { btn.textContent = 'Find my mistakes'; btn.classList.remove('btn-off'); }
    if (!box) return;
    var found = res.filter(function (f) { return f && !f.err; }), silent = res.some(function (f) { return f && f.err; });
    /* one site has it and the other surely does not, or only one of the
       two accounts has rated games: go */
    var played = found.filter(function (f) { return f.best; });
    if (found.length === 2 && played.length === 1 && !silent) found = played;
    if (found.length === 1 && !silent) { cfg.src = found[0].site; saveCfg('src'); setUser(name); return; }
    if (!found.length && !silent) {
      box.innerHTML = '<p class="which-none">Neither chess.com nor lichess has an account called ' + esc(name) + '. Check the spelling.</p>';
      return;
    }
    if (!found.length) {
      var down = res.filter(function (f) { return f && f.err; }).length === 2 ? 'chess.com or lichess' : (res[0] && res[0].err ? 'chess.com' : 'lichess');
      box.innerHTML = '<p class="which-none">Could not reach ' + down + '. Check your connection and try again.</p>';
      return;
    }
    /* both, or one while the other did not answer: ask */
    var offer = found.concat(silent && found.length === 1 ? [{ site: found[0].site === 'chesscom' ? 'lichess' : 'chesscom', best: null }] : []);
    box.innerHTML = '<p class="which-q">Which one is you?</p><div class="which-row">' + offer.map(function (f) {
      return '<button class="btn-line" data-act="pickSite" data-k="' + f.site + '" data-n="' + esc(name) + '">' + (f.site === 'chesscom' ? 'chess.com' : 'lichess')
        + (f.best && f.best.r ? ' · ' + f.best.p + ' ' + f.best.r : (!f.best && !silent ? ' · no rated games' : '')) + '</button>';
    }).join('') + '</div>';
  });
}

/* chess.com games carry their start time in the PGN headers */
function ccStartMs(g) {

  var ms = Date.UTC(+d[1], +d[2] - 1, +d[3], +t[1], +t[2], +t[3]);

function narrAnimate() {

    }
