function startOpeningSession(colour, fam, mode) {
  var pool = colour ? linesFor(colour, fam)
    : repLines().white.concat(repLines().black);
  var cap = setSize() <= 8 ? 6 : 8;
  var lessonCap = setSize() <= 8 ? 2 : 3;
  var items = [];
  var newLines = pool.filter(function (l) { return l.status === 'new'; });
  var dueLines = pool.filter(function (l) { return l.status === 'due'; });
  var readyLines = pool.filter(function (l) { return l.status === 'ready'; });
  var restLines = pool.filter(function (l) { return l.status === 'scheduled' || l.status === 'trained'; });
  if (mode === 'learn') {
    newLines.slice(0, lessonCap).forEach(function (l) {
      items.push({ kind: 'openlearn', line: l });
    });
    if (!items.length) { notice('Nothing new to learn there — everything is in your drills now.'); return; }
  } else {
    dueLines.forEach(function (l) { if (items.length < cap - 2) items.push({ kind: 'opening', line: l }); });
    readyLines.forEach(function (l) { if (items.length < cap - 2) items.push({ kind: 'opening', line: l }); });
    if (mode !== 'drill') {
      newLines.slice(0, 1).forEach(function (l) { items.push({ kind: 'openlearn', line: l }); });
    }
    restLines.forEach(function (l) { if (items.length < cap) items.push({ kind: 'opening', line: l, review: true }); });
    if (!items.length) { notice('Nothing to drill there yet — play a few more games in it.'); return; }
  }
  items = items.slice(0, cap);
  var prevLine = null;
  items.forEach(function (it) {
    if (it.kind !== 'opening' || !prevLine) { if (it.kind === 'opening') prevLine = it.line; return; }
    var di = 0;
    var a2 = it.line.decisions, b2 = prevLine.decisions;
    while (di < a2.length - 1 && di < b2.length
           && a2[di].nd.key === b2[di].nd.key) di++;
    it.startDi = Math.min(di, Math.max(0, a2.length - 2));
    prevLine = it.line;
  });
  ui.session = { items: items, idx: 0, results: [], done: 0, solved: 0,
                 skips: 3, countdown: 5,
                 customLabel: mode === 'learn'
                   ? 'learning ' + (fam || (colour ? colour + ' lines' : 'new lines'))
                   : (fam || (colour ? colour + ' book' : 'your book')) + ' · ' + items.length + ' lines',
                 missionKey: (mode === 'learn' ? 'oplearn:' : 'op:') + (colour || 'all') + (fam ? '|' + fam : '') };
  if (ui.view !== 'train') setView('train');
  loadSessionItem();
  var ssC = ui.session;
  var tick = function () {
    if (ui.session !== ssC) return;
    ssC.countdown--;
    renderTrainerInline();
    if (ssC.countdown > 0) setTimeout(tick, 900);
  };
  setTimeout(tick, 900);
}

/* Diagnostics: for each spec type this account can produce, run the REAL
   selector and report what it picked — category fields, swing, age — so
   set quality is checkable mechanically. Read-only. */
window.__audit = function () {
  var out = { user: cfg.user, games: data.games.length,
              covered: data.games.filter(function (g) { return g.analysed || g.scanned; }).length,
              blunders: allBlunders().length, specs: {} };
  var specs = [];
  mistakeShapes().forEach(function (sh) { specs.push(sh.spec); });
  specs.push({ type: 'colour', colour: 'white', label: 'as white' });
  specs.push({ type: 'colour', colour: 'black', label: 'as black' });
  specs.push({ type: 'clock', mode: 'high', label: 'unhurried' });
  specs.push({ type: 'clock', mode: 'low', label: 'time-trouble' });
  specs.push({ type: 'window', days: 30, label: 'this month' });
  specs.push({ type: 'stronger', label: 'vs stronger' });
  var famsW = colourFamilies('white'), famsB = colourFamilies('black');
  if (famsW[0]) specs.push({ type: 'opening', family: famsW[0].family,
                             colour: 'white', label: 'top opening' });
  else if (famsB[0]) specs.push({ type: 'opening', family: famsB[0].family,
                                  colour: 'black', label: 'top opening' });
  specs.forEach(function (sp) {
    var picked = selectCustomItems(sp).slice(0, 10);
    out.specs[sp.label] = {
      pool: selectCustomItems(sp).length,
      picked: picked.map(function (x) {
        var it = x.it;
        var init = tcInitialSecs(it.g.tc);
        return { d: Math.round((Date.now() - it.g.ts) / 864e5),
                 k: it.b.k || null, ph: blunderPhase(it),
                 cf: init && it.b.c != null ? Math.round(it.b.c * 100 / init) : null,
                 sw: Math.round(it.b.wb - it.b.wa),
                 col: it.g.color, od: it.g.oppR != null && it.g.myR != null ? it.g.oppR - it.g.myR : null,
                 fam: it.g.opening ? it.g.opening.split(':')[0].trim() : null };
      })
    };
  });
  return JSON.stringify(out);
};

window.__auditSummary = function () {
  var raw = JSON.parse(window.__audit());
  var out = { u: raw.user, g: raw.games, cov: raw.covered, bl: raw.blunders, s: {} };
  Object.keys(raw.specs).forEach(function (label) {
    var sp = raw.specs[label];
    var viol = 0, ds = [], sws = [];
    sp.picked.forEach(function (x) {
      ds.push(x.d); sws.push(x.sw);
      if (label.indexOf('as ') === 0 && x.col !== label.slice(3)) viol++;
      if (label === 'unhurried' && (x.cf == null || x.cf < 33)) viol++;
      if (label === 'time-trouble' && (x.cf == null || x.cf > 15)) viol++;
      if (label === 'this month' && x.d > 30) viol++;
      if (label === 'vs stronger' && (x.od == null || x.od < 50)) viol++;
      if (label === 'Hung pieces' && x.k !== 'hung') viol++;
      if (label === 'Missed tactics' && x.k !== 'tactic') viol++;
      if (label === 'Won games slipping' && x.k !== 'slip') viol++;
      if (label === 'Level positions collapsing' && x.k !== 'collapse') viol++;
      if (label === 'Opening mistakes' && x.ph !== 'open') viol++;
      if (label === 'Middlegame mistakes' && x.ph !== 'mid') viol++;
      if (label === 'Endgame mistakes' && x.ph !== 'end') viol++;
    });
    ds.sort(function (a, b) { return a - b; });
    sws.sort(function (a, b) { return a - b; });
    out.s[label] = { pool: sp.pool, n: sp.picked.length, viol: viol,
                     medD: ds.length ? ds[ds.length >> 1] : null,
                     medSw: sws.length ? sws[sws.length >> 1] : null };
  });
  return JSON.stringify(out);
};

/* ── The board ── */
/* Classic colours and the cburnett pieces — the board every Lichess player
   already reads fluently. Squares #f0d9b5/#b58863, last-move green, quiet
   dots for legal targets. Piece art is CC-BY-SA (see the credit in the
   symbol sheet and in settings). */
var SQ_LIGHT = '#f0d9b5', SQ_DARK = '#b58863';
var HL_MOVE = 'rgba(155,199,0,.41)', HL_SEL = 'rgba(20,85,30,.5)';
var PIECE_ID = { K:'wK',Q:'wQ',R:'wR',B:'wB',N:'wN',P:'wP',
                 k:'bK',q:'bQ',r:'bR',b:'bB',n:'bN',p:'bP' };

function boardSvg(st, opts) {
  opts = opts || {};
  var flip = !!opts.flip;
  var SZ = 45, W = SZ * 8;
  var out = '<svg class="board" viewBox="0 0 ' + W + ' ' + W + '" role="img" aria-label="chess position">'
    + '<defs><radialGradient id="checkglow"><stop offset="0%" stop-color="rgba(230,60,50,.85)"/>'
    + '<stop offset="70%" stop-color="rgba(230,60,50,.35)"/>'
    + '<stop offset="100%" stop-color="rgba(230,60,50,0)"/></radialGradient></defs>';
  for (var r = 0; r < 8; r++) {
    for (var f = 0; f < 8; f++) {
      var sq = r * 8 + f;
      var col = flip ? 7 - f : f, row = flip ? r : 7 - r;
      var x = col * SZ, y = row * SZ;
      var light = (r + f) % 2 === 1;
      out += '<rect data-sq="' + sq + '" x="' + x + '" y="' + y + '" width="' + SZ
        + '" height="' + SZ + '" fill="' + (light ? SQ_LIGHT : SQ_DARK) + '"/>';
      if (opts.mark && opts.mark.indexOf(sq) >= 0)
        out += '<rect x="' + x + '" y="' + y + '" width="' + SZ + '" height="' + SZ
          + '" fill="' + HL_MOVE + '" style="pointer-events:none"/>';
      if (opts.sel === sq)
        out += '<rect x="' + x + '" y="' + y + '" width="' + SZ + '" height="' + SZ
          + '" fill="' + HL_SEL + '" style="pointer-events:none"/>';
      if (opts.hint === sq) {
        out += '<circle cx="' + (x + SZ / 2) + '" cy="' + (y + SZ / 2) + '" r="' + (SZ / 2 - 2.5)
          + '" fill="none" stroke="rgba(182,130,53,.9)" stroke-width="3.5"'
          + ' style="pointer-events:none" class="hint-ring"/>';
      }
      if (opts.check === sq) {
        out += '<circle cx="' + (x + SZ / 2) + '" cy="' + (y + SZ / 2) + '" r="' + (SZ * 0.52)
          + '" fill="url(#checkglow)" style="pointer-events:none"/>';
      }
      var p = st.b[sq];
      if (p) {
        var animAttr = '';
        if (opts.anim && opts.anim[1] === sq) {
          var af = opts.anim[0];
          var acol = flip ? 7 - af % 8 : af % 8, arow = flip ? (af >> 3) : 7 - (af >> 3);
          animAttr = ' class="anim-piece" style="transform:translate('
            + (acol * SZ - x) + 'px,' + (arow * SZ - y) + 'px)"';
        }
        out += '<use href="#pc-' + PIECE_ID[p] + '" x="' + x + '" y="' + y
          + '" width="' + SZ + '" height="' + SZ + '" data-sq="' + sq + '"' + animAttr + '/>';
      }
      if (opts.dots && opts.dots.indexOf(sq) >= 0) {
        if (p) /* capture: ring around the square, lichess-style */
          out += '<circle cx="' + (x + SZ / 2) + '" cy="' + (y + SZ / 2) + '" r="' + (SZ / 2 - 3)
            + '" fill="none" stroke="' + HL_SEL + '" stroke-width="4" style="pointer-events:none"/>';
        else
          out += '<circle cx="' + (x + SZ / 2) + '" cy="' + (y + SZ / 2) + '" r="5.5"'
            + ' fill="' + HL_SEL + '" style="pointer-events:none"/>';
      }
      /* coordinates live inside the edge squares, tinted with the opposite
         square colour, exactly where a Lichess eye expects them */
      if (row === 7)
        out += '<text x="' + (x + SZ - 3.2) + '" y="' + (y + SZ - 3) + '" text-anchor="end"'
          + ' font-size="7.5" font-weight="600" font-family="sans-serif" fill="'
          + (light ? SQ_DARK : SQ_LIGHT) + '" style="pointer-events:none">'
          + String.fromCharCode(97 + sq % 8) + '</text>';
      if (col === 0)
        out += '<text x="' + (x + 2.8) + '" y="' + (y + 9.5) + '"'
          + ' font-size="7.5" font-weight="600" font-family="sans-serif" fill="'
          + (light ? SQ_DARK : SQ_LIGHT) + '" style="pointer-events:none">'
          + (1 + (sq >> 3)) + '</text>';
    }
  }
  /* the advice: a gold arrow tracing the move the text is talking about */
  if (opts.ghost) {
    var gf = opts.ghost[0], gt = opts.ghost[1];
    var gfc = flip ? 7 - gf % 8 : gf % 8, gfr = flip ? (gf >> 3) : 7 - (gf >> 3);
    var gtc = flip ? 7 - gt % 8 : gt % 8, gtr = flip ? (gt >> 3) : 7 - (gt >> 3);
    var gx1 = gfc * SZ + SZ / 2, gy1 = gfr * SZ + SZ / 2;
    var gx2 = gtc * SZ + SZ / 2, gy2 = gtr * SZ + SZ / 2;
    var gdx = gx2 - gx1, gdy = gy2 - gy1;
    var glen = Math.sqrt(gdx * gdx + gdy * gdy) || 1;
    var gtx = gx2 - gdx / glen * (SZ * 0.34), gty = gy2 - gdy / glen * (SZ * 0.34);
    out += '<defs><marker id="ahgold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">'
      + '<path d="M0 0 L10 5 L0 10 z" fill="rgba(182,130,53,.85)"/></marker></defs>'
      + '<line x1="' + gx1 + '" y1="' + gy1 + '" x2="' + gtx + '" y2="' + gty
      + '" stroke="rgba(182,130,53,.85)" stroke-width="6" stroke-linecap="round"'
      + ' marker-end="url(#ahgold)" style="pointer-events:none"/>';
  }
  /* the mistake itself: a red arrow tracing the move that was played */
  if (opts.bad) {
    var bf = opts.bad[0], bt = opts.bad[1];
    var bfc = flip ? 7 - bf % 8 : bf % 8, bfr = flip ? (bf >> 3) : 7 - (bf >> 3);
    var btc = flip ? 7 - bt % 8 : bt % 8, btr = flip ? (bt >> 3) : 7 - (bt >> 3);
    var bx1 = bfc * SZ + SZ / 2, by1 = bfr * SZ + SZ / 2;
    var bx2 = btc * SZ + SZ / 2, by2 = btr * SZ + SZ / 2;
    var bdx = bx2 - bx1, bdy = by2 - by1;
    var blen = Math.sqrt(bdx * bdx + bdy * bdy) || 1;
    var btx = bx2 - bdx / blen * (SZ * 0.34), bty = by2 - bdy / blen * (SZ * 0.34);
    out += '<defs><marker id="ahbad" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">'
      + '<path d="M0 0 L10 5 L0 10 z" fill="rgba(190,72,60,.8)"/></marker></defs>'
      + '<line class="bad-arrow" x1="' + bx1 + '" y1="' + by1 + '" x2="' + btx + '" y2="' + bty
      + '" stroke="rgba(190,72,60,.8)" stroke-width="6" stroke-linecap="round"'
      + ' marker-end="url(#ahbad)" style="pointer-events:none"/>';
  }
  /* drawn shapes: the calculation scaffolding, lichess-green */
  if (opts.shapes && opts.shapes.length) {
    var ctr = function (sq) {
      var c = flip ? 7 - sq % 8 : sq % 8, rw = flip ? (sq >> 3) : 7 - (sq >> 3);
      return [c * SZ + SZ / 2, rw * SZ + SZ / 2];
    };
    out += '<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">'
      + '<path d="M0 0 L10 5 L0 10 z" fill="rgba(21,120,27,.8)"/></marker></defs>';
    opts.shapes.forEach(function (sh) {
      if (sh.at != null) {
        var c0 = ctr(sh.at);
        out += '<circle cx="' + c0[0] + '" cy="' + c0[1] + '" r="' + (SZ / 2 - 2.5)
          + '" fill="none" stroke="rgba(21,120,27,.8)" stroke-width="4" style="pointer-events:none"/>';
      } else {
        var f0 = ctr(sh.from), t0 = ctr(sh.to);
        var dx = t0[0] - f0[0], dy = t0[1] - f0[1];
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var tx = t0[0] - dx / len * (SZ * 0.34), ty = t0[1] - dy / len * (SZ * 0.34);
        out += '<line x1="' + f0[0] + '" y1="' + f0[1] + '" x2="' + tx + '" y2="' + ty
          + '" stroke="rgba(21,120,27,.8)" stroke-width="7" stroke-linecap="round"'
          + ' marker-end="url(#ah)" style="pointer-events:none"/>';
      }
    });
  }
  return out + '</svg>';
}

/* ── Sounds — a whisper of feedback, synthesized, no files. Off in
   settings, and respectful of the first-gesture rule (the context is
   created inside a click). ── */
var sndCtx = null;
function snd(name) {
  if (cfg.sound === false) return;
  try {
    if (!sndCtx) sndCtx = new (window.AudioContext || window.webkitAudioContext)();
    /* browsers hand back a suspended context even mid-gesture — resume or
       every tone is silently swallowed */
    if (sndCtx.state === 'suspended') sndCtx.resume();
    var t = sndCtx.currentTime;
    function tone(freq, start, dur, type, gain) {
      var o = sndCtx.createOscillator(), g = sndCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + start);
      g.gain.linearRampToValueAtTime(gain || 0.06, t + start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
      o.connect(g); g.connect(sndCtx.destination);
      o.start(t + start); o.stop(t + start + dur + 0.02);
    }
    if (name === 'tap') tone(340, 0, 0.04, 'triangle', 0.025);
    else if (name === 'move') tone(220, 0, 0.06, 'triangle', 0.05);
    else if (name === 'good') { tone(660, 0, 0.09); tone(880, 0.09, 0.14); }
    else if (name === 'bad') tone(140, 0, 0.16, 'sawtooth', 0.04);
    else if (name === 'set') { tone(523, 0, 0.1); tone(659, 0.1, 0.1); tone(784, 0.2, 0.22); }
  } catch (e) {}
}

/* ── Trainer state and flow ── */
/* One session, one board, inline on the Train view. Items mix your own
   mistakes (graded against Lichess's stored best move, scheduled by the
   SRS ladder) with fresh Lichess puzzles pulled from /api/puzzle/next,
   themed at the coach's focus. Every item says why it is in front of you. */

var PUZZLES_PER_SESSION = 4;

/* Deliberate practice happens near the edge of ability — roughly a 70-85%
   success band. The rolling first-try rate over the last 20 puzzles steers
   Lichess's difficulty parameter to hold the player there. */
function puzzleStats() { return store.get('nl:pz:' + String(cfg.user).toLowerCase(), { r: [] }); }
function recordPuzzleResult(firstTry) {
  var st = puzzleStats();
  st.r.push(firstTry ? 1 : 0);
  if (st.r.length > 20) st.r = st.r.slice(-20);
  store.set('nl:pz:' + String(cfg.user).toLowerCase(), st);
}
function puzzleDifficulty() {
  var r = puzzleStats().r;
  if (r.length < 6) return 'normal';
  var rate = r.reduce(function (a, x) { return a + x; }, 0) / r.length;
  if (rate > 0.85) return 'harder';
  if (rate < 0.55) return 'easier';
  if (rate < 0.70 && r.length >= 12) return 'easier';
  return 'normal';
}

function focusTheme() {
  var dk = dominantKind();
  if (dk) return { key: KIND_THEME[dk.kind][0], why: KIND_THEME[dk.kind][1] };
  var focus = coachFocus();
  var map = {
    opening: ['opening', 'the opening is the focus'],
    middlegame: ['middlegame', 'the middlegame is the focus'],
    endgame: ['endgame', 'the endgame is the focus'],
    conversion: ['advantage', 'converting good positions is the focus'],
    resource: ['defensiveMove', 'defending worse positions is the focus'],
    white: ['opening', 'your White openings are the focus'],
    black: ['opening', 'your Black openings are the focus']
  };
  var m = focus && map[focus.key];
  return m ? { key: m[0], why: m[1] } : { key: 'mix', why: 'a little of everything' };
}

function setSize() { return store.get('nl:setSize', 14); }

function sessionItems(startKey) {
  var target = setSize();
  /* opening cards claim their room first: they are the smallest, highest-
     yield reps in the set, and the lesson lives elsewhere — drills only */
  var opens = startKey ? [] : openingItems(OPEN_PER_SET);
  var puzzleBudget = opens.length ? 2 : PUZZLES_PER_SESSION;
  var items = drillQueue().map(function (it) { return { kind: 'blunder', it: it }; });
  items = items.slice(0, Math.max(4, target - puzzleBudget - opens.length));

  /* Warm-up first: the item nearest mastery opens the session, because an
     early success carries the player through the hard middle (behavioral
     momentum). The rest run hardest-swing first while attention is fresh. */
  var srs = srsLoad();
  items.sort(function (a, b) {
    var ra = srs[a.it.g.id + ':' + a.it.b.p], rb = srs[b.it.g.id + ':' + b.it.b.p];
    return ((rb && rb.streak) || 0) - ((ra && ra.streak) || 0);
  });
  var warm = items.length > 2 ? items.shift() : null;
  items.sort(function (a, b) { return (b.it.b.wb - b.it.b.wa) - (a.it.b.wb - a.it.b.wa); });
  if (warm) items.unshift(warm);

  if (startKey) {
    var i = -1;
    items.forEach(function (x, n) {
      if (i < 0 && x.it.g.id + ':' + x.it.b.p === startKey) i = n;
    });
    if (i > 0) items.unshift(items.splice(i, 1)[0]);
    else if (i < 0) {
      allBlunders().forEach(function (it) {
        if (trainable(it) && it.g.id + ':' + it.b.p === startKey)
          items.unshift({ kind: 'blunder', it: it });
      });
    }
  }
  /* one spot-check per session: a position trained the hard way */
  var srs = srsLoad();
  var refresher = null;
  allBlunders().forEach(function (it) {
    if (!trainable(it)) return;
    var rec = srs[it.g.id + ':' + it.b.p];
    if (rec && rec.mastered && !rec.clean) {
      if (!refresher || rec.last < refresher.rec.last) refresher = { it: it, rec: rec };
    }
  });
  if (refresher && !items.some(function (x) {
    return x.it && x.it.g.id === refresher.it.g.id && x.it.b.p === refresher.it.b.p;
  })) {
    items.push({ kind: 'blunder', it: refresher.it, refresher: true });
  }
  /* opening cards weave in early — recall is freshest at the top of a set */
  if (opens.length) {
    var oi = 0;
    var woven = [];
    items.forEach(function (x, n) {
      woven.push(x);
      if (oi < opens.length && n % 2 === 0) { woven.push(opens[oi]); oi++; }
    });
    while (oi < opens.length) { woven.push(opens[oi]); oi++; }
    items = woven;
  }
  /* Interleaving: puzzles woven between own positions, never opening the
     session, never more than one in a row — mixed practice teaches when a
     pattern applies, not just what it is. */
  var theme = focusTheme();
  var out = [];
  var gap = Math.max(2, Math.ceil((items.length + 1) / (puzzleBudget + 1)));
  var puzzlesLeft = puzzleBudget;
  items.forEach(function (x, n) {
    out.push(x);
    if (puzzlesLeft > 0 && (n + 1) % gap === 0) {
      out.push({ kind: 'puzzle', theme: theme });
      puzzlesLeft--;
    }
  });
  while (puzzlesLeft-- > 0) out.push({ kind: 'puzzle', theme: theme });
  /* a set is a set: when own material runs dry, puzzles keep it full */
  while (out.length < target) out.push({ kind: 'puzzle', theme: theme });
  return out.slice(0, Math.max(target, 6));
}

function startSession(startKey, quiet) {
  ui.session = { items: sessionItems(startKey), idx: 0, results: [], done: 0, solved: 0,
                 skips: 3, countdown: startKey ? 0 : 5, missionKey: 'daily' };
  /* the auto-deal must not yank the user off the tab they chose */
  if (!quiet && ui.view !== 'train') setView('train');
  loadSessionItem();
  if (ui.session.countdown) {
    var ssC = ui.session;
    var tick = function () {
      if (ui.session !== ssC) return;
      ssC.countdown--;
      renderTrainerInline();
      if (ssC.countdown > 0) setTimeout(tick, 900);
    };
    setTimeout(tick, 900);
  }
}

/* Puzzles only, endlessly refillable — for the player who wants to keep going
   after the day's positions are done. */
/* A custom set: the same trainer, fed by a filter — an opponent, an opening,
   a colour. Coach cards deal these directly instead of linking away. */
/* one registry for every button that can deal a set; deduped so partial
   re-renders never grow it */
function registerSpec(spec) {
  data.customSpecs = data.customSpecs || [];
  var key = [spec.type, spec.name, spec.family, spec.colour, spec.mode, spec.days, spec.kind, spec.phase].join('|');
  for (var i = 0; i < data.customSpecs.length; i++) {
    if (data.customSpecs[i]._k === key) return i;
  }
  spec._k = key;
  data.customSpecs.push(spec);
  return data.customSpecs.length - 1;
}

function customGameFilter(spec) {
  return function (g) {
    if (spec.type === 'opp') return g.opp && g.opp.toLowerCase() === spec.name.toLowerCase();
    if (spec.type === 'opening')
      return g.color === spec.colour && g.opening
        && g.opening.split(':')[0].trim() === spec.family;
    if (spec.type === 'variation')
      return g.color === spec.colour && g.opening === spec.name;
    if (spec.type === 'colour') return g.color === spec.colour;
    if (spec.type === 'piece') return true;   /* narrowed per-blunder below */
    if (spec.type === 'clock') return true;   /* narrowed per-blunder below */
    if (spec.type === 'kind') return true;    /* narrowed per-blunder below */
    if (spec.type === 'phase') return true;   /* narrowed per-blunder below */
    if (spec.type === 'window')
      return g.ts >= Date.now() - (spec.days || 30) * 864e5;
    if (spec.type === 'stronger')
      return g.oppR != null && g.myR != null && g.oppR - g.myR >= 50;
    return false;
  };
}

function blunderPhase(it) {
  return it.b.p < 30 ? 'open' : (it.b.p < 60 ? 'mid' : 'end');
}

function tcInitialSecs(tc) {
  if (!tc) return null;
  var m = String(tc).split('+')[0];
  var mins = parseFloat(m);
  return isFinite(mins) && mins > 0 ? mins * 60 : null;
}
/* clock specs narrow at the blunder level: how much clock was in hand */
function blunderClockBand(it) {
  var init = tcInitialSecs(it.g.tc);
  if (init == null || it.b.c == null) return null;
  var frac = it.b.c / init;
  return frac >= 0.33 ? 'high' : (frac <= 0.15 ? 'low' : 'mid');
}

/* piece specs narrow at the blunder level: which piece made the move */
function blunderPiece(it) {
  var tok = it.g.mv ? it.g.mv.split(' ')[it.b.p] : null;
  if (!tok) return null;
  var t0 = tok[0];
  return t0 === 'O' ? 'K' : ('NBRQK'.indexOf(t0) !== -1 ? t0 : 'P');
}

function selectCustomItems(spec) {
  var gf = customGameFilter(spec);
  var srs = srsLoad(), now = Date.now();
  var dealtToday = dayLoad().dealt || {};
  var items = [];
  allBlunders().forEach(function (it) {
    if (!trainable(it) || !gf(it.g)) return;
    if (spec.type === 'piece' && blunderPiece(it) !== spec.piece) return;
    if (spec.type === 'clock' && blunderClockBand(it) !== spec.mode) return;
    if (spec.type === 'kind' && it.b.k !== spec.kind) return;
    if (spec.type === 'phase' && blunderPhase(it) !== spec.phase) return;
    /* selection order: spaced repetition first (due > never seen > resting
       > mastered, dealt-today to the back), then WITHIN a band a weighted
       score — recent mistakes lead (people remember them, and fixing them
       lands hardest), the clearest examples of the category lead, and a
       dose of jitter keeps two overlapping specs from rhyming */
    var rec = srs[it.g.id + ':' + it.b.p];
    var band = rec
      ? (rec.due == null || rec.due <= now ? 0 : (rec.mastered ? 3 : 2))
      : 1;
    if (dealtToday[it.g.id + ':' + it.b.p]) band += 4;
    var ageDays = (now - it.g.ts) / 864e5;
    var recency = Math.exp(-ageDays / 30);
    var swing = (it.b.wb - it.b.wa) / 100;
    var fit = 1;
    if (spec.type === 'clock') {
      var init2 = tcInitialSecs(it.g.tc);
      var frac2 = init2 && it.b.c != null ? Math.min(1, it.b.c / init2) : 0.5;
      fit = spec.mode === 'high' ? 0.5 + frac2 : 1.3 - frac2;
    }
    var score = recency * (0.3 + swing) * fit * (0.6 + 0.8 * Math.random());
    items.push({ kind: 'blunder', it: it, _band: band, _s: score });
  });
  items.sort(function (a, b) { return a._band - b._band || b._s - a._s; });
  return items;
}

function startCustomSession(spec) {
  var items = selectCustomItems(spec).slice(0, Math.max(4, setSize() - PUZZLES_PER_SESSION));
  if (items.length < 3) {
    notice('Only ' + items.length + ' analysed positions match so far — the engine is '
      + 'prioritising those games now. Try again in a few minutes.');
    data.scanFocus = spec;
    setTimeout(autoScan, 300);
    if (!items.length) return;
  }
  var theme = spec.theme
    ? { key: spec.theme, why: spec.why }
    : { key: 'mix', why: spec.why };
  var out = [];
  var target = setSize();
  items.forEach(function (x, n) {
    out.push(x);
    if ((n + 1) % 3 === 0 && out.length < target) out.push({ kind: 'puzzle', theme: theme });
  });
  while (out.length < Math.min(target, items.length + PUZZLES_PER_SESSION))
    out.push({ kind: 'puzzle', theme: theme });
  ui.session = { items: out, idx: 0, results: [], done: 0, solved: 0,
                 skips: 3, countdown: 5, customLabel: spec.label,
                 missionKey: 'cs:' + spec._k };
  if (ui.view !== 'train') setView('train');
  loadSessionItem();
  var ssC = ui.session;
  var tick = function () {
    if (ui.session !== ssC) return;
    ssC.countdown--;
    renderTrainerInline();
    if (ssC.countdown > 0) setTimeout(tick, 900);
  };
  setTimeout(tick, 900);
}

function lessonNote(line, di) {
  var d = line.decisions[di];
  var nd = d.nd;
  var bits = [];
  if (nd.status === 'adopted' && nd.mineBook) {
    bits.push('The band\'s best here: ' + Math.round(nd.mineBook.share * 100) + '% of '
      + myBand() + 's play it, scoring ' + Math.round(myScoreOf(nd.mineBook, nd.colour))
      + '% for your side.');
  } else if (nd.status === 'fix' && nd.bestBook) {
    bits.push('You usually play ' + esc(nd.myMove) + ' here — ' + esc(nd.keeper)
      + ' scores ' + Math.round(myScoreOf(nd.bestBook, nd.colour)) + '% for '
      + Math.round(nd.bestBook.share * 100) + '% of ' + myBand() + 's. This is the upgrade.');
  } else if (nd.mineBook) {
    bits.push('Your own move — ' + Math.round(nd.mineBook.share * 100) + '% of '
      + myBand() + 's agree, scoring ' + Math.round(myScoreOf(nd.mineBook, nd.colour)) + '%.');
  } else {
    bits.push('Your move in this spot, ' + nd.myMoveN + ' games deep.');
  }
  return 'Move ' + (di + 1) + ' of ' + line.decisions.length + ': play <b>'
    + esc(nd.keeper) + '</b>. ' + bits.join(' ');
}

function startPuzzleRun() {
  var theme = focusTheme();
  var items = [];
  for (var i = 0; i < 6; i++) items.push({ kind: 'puzzle', theme: theme });
  ui.session = { items: items, idx: 0, results: [], done: 0, solved: 0, puzzleRun: true,
                 missionKey: 'puzzles', customLabel: 'bonus puzzles' };
  if (ui.view !== 'train') setView('train');
  loadSessionItem();
}

function loadSessionItem() {
  var ss = ui.session;
  if (!ss) return;
  if (ss.idx >= ss.items.length) {
    if (!ss.finished) {
      ss.finished = true;
      if (ss.done > 0) snd('set');
      if (ss.done > 0) {
        var dayS = dayLoad();
        dayS.sets = (dayS.sets || 0) + 1;
        dayS.missions = dayS.missions || {};
        var mk = ss.missionKey || 'daily';
        dayS.missions[mk] = (dayS.missions[mk] || 0) + 1;
        store.set(dayKey(), dayS);
        ss.justScored = true;
      }
    }
    renderTrainerInline();
    return;
  }
  var item = ss.items[ss.idx];
  ss.active = null;

  if (item.kind === 'blunder' && item.it.b.j === 'scan' && !item.it.b.rf) {
    /* triage found it at 30ms; before we teach it, a 400ms look confirms
       the swing and upgrades the answer. A refuted card quietly leaves. */
    var itR = item.it;
    var ssR = ss;
    ss.active = null;
    ss.refineNote = true;
    renderTrainerInline();
    var preR = stateAtPly(itR.g.mv, itR.b.p);
    var meW = itR.g.color === 'white';
    if (!preR) { itR.b.rf = 1; loadSessionItem(); return; }
    var postR = cloneState(preR);
    var playedTok = itR.g.mv.split(' ')[itR.b.p] || '';
    if (!sanApply(postR, playedTok)) { itR.b.rf = 1; loadSessionItem(); return; }
    engineEval(stateFen(preR), 400, true).then(function (r1) {
      return engineEval(stateFen(postR), 400, true).then(function (r2) {
        if (ui.session !== ssR) return;
        var wb2 = winPct(meW ? r1.cp : -r1.cp);
        var wa2 = winPct(meW ? r2.cp : -r2.cp);
        ssR.refineNote = false;
        if (wb2 - wa2 < 15) {
          /* the deep engine disagrees — this was never a real mistake */
          itR.g.bl = (itR.g.bl || []).filter(function (b2) { return b2 !== itR.b; });
          if (itR.g.bl && !itR.g.bl.length) itR.g.bl = null;
          saveGames(data.games);
          ssR.items.splice(ssR.idx, 1);
          loadSessionItem();
          return;
        }
        var bm2 = r1.bestUci ? uciToMove(preR, r1.bestUci) : null;
        if (bm2) {
          var line2 = uciLine(preR, [r1.bestUci].concat((r1.pv || []).slice(1, 7)));
          itR.b.bs = moveNameOf(preR, bm2);
          itR.b.bv = line2.join(' ');
          itR.b.k = classifyBlunder(preR, playedTok, itR.b.bs, wb2, wa2);
        }
        itR.b.wb = wb2;
        itR.b.wa = wa2;
        itR.b.rf = 1;
        saveGames(data.games);
        loadSessionItem();
      });
    }).catch(function () {
      if (ui.session !== ssR) return;
      ssR.refineNote = false;
      itR.b.rf = 1;   /* engine unavailable: teach the triage answer */
      loadSessionItem();
    });
    return;
  }

  if (item.kind === 'blunder') {
    var it = item.it;
    var dayD = dayLoad();
    dayD.dealt = dayD.dealt || {};
    if (!dayD.dealt[it.g.id + ':' + it.b.p]) {
      dayD.dealt[it.g.id + ':' + it.b.p] = 1;
      store.set(dayKey(), dayD);
    }
    var st = stateAtPly(it.g.mv, it.b.p);
    var probe = st ? cloneState(st) : null;
    var mv = probe ? sanApply(probe, it.b.bs) : null;
    if (!st || !mv) { ss.idx++; loadSessionItem(); return; }
    /* the move that led here — the opponent's, at ply p-1 — orients the eye */
    var lastOpp = null;
    if (it.b.p > 0) {
      var preSt = stateAtPly(it.g.mv, it.b.p - 1);
      if (preSt) {
        var lm = sanApply(preSt, it.g.mv.split(' ')[it.b.p - 1]);
        if (lm) lastOpp = [lm.from, lm.to];
      }
    }
    var bp = /=([QRBN])/.exec(it.b.bs);   /* a promoting answer must promote */
    var badProbe = cloneState(st);
    var badMv = sanApply(badProbe, it.g.mv.split(' ')[it.b.p] || '');
    ss.active = {
      kind: 'blunder', it: it, st: st, best: mv, bestPromo: bp ? bp[1] : null,
      playedMove: badMv ? [badMv.from, badMv.to] : null,
      sel: -1, attempts: 0, arrivedBy: lastOpp,
      hist: [{ st: cloneState(st), last: lastOpp, label: 'position' }], view: 0, shapes: [],
      phase: 'guess', flash: false, meWhite: it.g.color === 'white',
      played: it.g.mv.split(' ')[it.b.p] || '?',
      why: item.refresher
        ? 'Spot check — you trained this one the hard way. Prove it stuck.'
        : 'You played ' + (it.g.mv.split(' ')[it.b.p] || '?') + '? here'
          + (it.b.k ? ' — ' + KIND_WORD[it.b.k] : '')
          + ' (' + Math.round(it.b.wb) + '% win chance fell to ' + Math.round(it.b.wa)
          + '%). Find the better move.'
    };
    renderTrainerInline();
    return;
  }

  if (item.kind === 'opening' || item.kind === 'openlearn') {
    var line = item.line;
    var di0 = item.kind === 'opening' ? (item.startDi || 0) : 0;
    var d0 = line.decisions[di0];
    var st0 = cloneState(d0.nd.st);
    var probeK = cloneState(st0);
    var km = sanApply(probeK, d0.nd.keeper);
    if (!km) { ss.idx++; loadSessionItem(); return; }
    var learning = item.kind === 'openlearn';
    var why;
    if (learning) {
      why = 'New line: your ' + esc(line.fam) + ' as ' + line.colour
        + '. This is a lesson, not a test — each move is shown, you copy it, '
        + 'and then you play the whole line from memory.';
    } else if (item.justLearned) {
      why = 'Now from memory — the ' + esc(line.fam) + ' line you just learned.';
    } else if (item.dev) {
      var agoD = ago(item.dev.g.ts);
      why = 'You left this ' + esc(line.fam) + ' line vs ' + esc(item.dev.g.opp)
        + (agoD === 'just now' ? ' just now' : ' ' + agoD + ' ago')
        + ' — you played ' + esc(item.dev.played) + '. Back into the lab.';
    } else if (item.fresh) {
      why = 'Your ' + esc(line.fam) + ' as ' + line.colour
        + ' — you already play this line; prove it is yours and it enters the ladder.';
    } else {
      why = 'Your ' + esc(line.fam) + ' as ' + line.colour + ' — play the line.';
    }
    ss.active = {
      kind: item.kind, line: line, di: di0, st: st0, memTest: !!item.justLearned,
      srsKey: lineSrsKey(line),
      keeperMove: km, keeperSan: d0.nd.keeper,
      sel: -1, attempts: 0, stepNote: '',
      hist: [{ st: cloneState(st0), last: null, label: 'position' }], view: 0,
      shapes: learning ? [{ from: km.from, to: km.to }] : [],
      hintSq: learning ? km.from : null,
      phase: 'guess', flash: false, meWhite: line.colour === 'white',
      why: why
    };
    if (learning) ss.active.stepNote = lessonNote(line, 0);
    renderTrainerInline();
    return;
  }

  /* puzzle: fetched on arrival, serial like every other call */
  renderTrainerInline();   /* shows the fetching state */
  var myGen = gen;
  getJSON('/api/puzzle/next?angle=' + encodeURIComponent(item.theme.key)
      + '&difficulty=' + puzzleDifficulty())
    .then(function (d) {
      if (stale(myGen) || !ui.session || ui.session !== ss) return;
      var pgn = d.game && d.game.pgn ? d.game.pgn.split(' ') : null;
      var sol = d.puzzle && d.puzzle.solution;
      var st = pgn ? stateAtPly(pgn.join(' '), pgn.length) : null;
      if (!st || !sol || !sol.length) { ss.idx++; loadSessionItem(); return; }
      ss.active = {
        kind: 'puzzle', st: st, sol: sol, step: 0, sel: -1, attempts: 0,
        hist: [{ st: cloneState(st), last: null, label: 'position' }], view: 0, shapes: [],
        phase: 'guess', flash: false, meWhite: st.w,
        rating: d.puzzle.rating, pid: d.puzzle.id,
        why: 'Fresh from Lichess — ' + esc(item.theme.why) + '.'
      };
      renderTrainerInline();
    })
    .catch(function () {
      if (!ui.session || ui.session !== ss) return;
      ss.idx++; loadSessionItem();
    });
}

function walkOutLine(a) {
  /* the rest of the engine line becomes steps of the walkable history */
  var toks = (a.it && a.it.b.bv ? a.it.b.bv.split(' ') : []).slice(1, 7);
  for (var i = 0; i < toks.length; i++) {
    var mv = sanApply(a.st, toks[i]);
    if (!mv) break;
    a.lastMove = [mv.from, mv.to];
    pushHist(a, toks[i]);
  }
  /* the walk starts where the player left off: at their answer */
  a.view = 1;
}

function pushHist(a, label) {
  if (!a.hist) return;
  a.hist.push({ st: cloneState(a.st), last: a.lastMove ? a.lastMove.slice() : null, label: label });
  a.view = a.hist.length - 1;
}

function uciSanMatch(st, san, m) {
  var probe = cloneState(st);
  var r = sanApply(probe, san);
  return !!(r && r.from === m.from && r.to === m.to);
}
function uciToMove(st, uci) {
  if (!uci || uci.length < 4) return null;
  var from = (uci.charCodeAt(1) - 49) * 8 + (uci.charCodeAt(0) - 97);
  var to = (uci.charCodeAt(3) - 49) * 8 + (uci.charCodeAt(2) - 97);
  var promo = uci[4] ? uci[4].toUpperCase() : null;
  var out = null;
  legalMoves(st).forEach(function (m) {
    if (out) return;
    if (m.from === from && m.to === to && (!promo || m.promo === promo)) out = m;
  });
  return out;
}
function moveNameOf(st, m) {
  /* enough SAN for feedback text: piece letter + destination (+ promo) */
  var p = st.b[m.from];
  var u = p ? p.toUpperCase() : '';
  var dest = String.fromCharCode(97 + m.to % 8) + (1 + (m.to >> 3));
  if (m.castle) return m.castle;
  return (u === 'P' ? '' : u) + dest + (m.promo ? '=' + m.promo : '');
}

function finishItem(result) {
  store.set('nl:introSeen', true);   /* the mechanic has now been experienced */
  var ss = ui.session, a = ss.active;
  a.phase = 'done'; a.result = result;
  if (a.kind !== 'openlearn') {
    ss.done++;
    if (result === 'first') ss.solved++;
    ss.results[ss.idx] = result;
  }
  if (a.kind === 'blunder') srsRecord(a.it, result);
  else if (a.kind === 'opening') {
    srsRecordKey(a.srsKey, result);
    lineCache = null;   /* statuses just moved */
  }
  else if (a.kind === 'openlearn') {
    var dayL = dayLoad();
    dayL.trained++;
    store.set(dayKey(), dayL);
  }
  else {
    recordPuzzleResult(result === 'first');
    var day = dayLoad();
    day.trained++;
    if (result === 'first') day.first++;
    store.set(dayKey(), day);
  }

}

function sessionClick(sq) {
  var ss = ui.session;
  if (!ss || !ss.active || ss.active.phase !== 'guess') return;
  var a = ss.active, st = a.st;
  if (a.pendingPromo) return;   /* the picker owns the board until answered */
  var mine = st.b[sq] && isW(st.b[sq]) === st.w;
  if (a.sel < 0) {
    if (mine) { a.sel = sq; snd('tap'); renderTrainerInline(); }
    return;
  }
  if (sq === a.sel) { a.sel = -1; renderTrainerInline(); return; }
  if (mine) { a.sel = sq; snd('tap'); renderTrainerInline(); return; }
  var legal = legalMoves(st).filter(function (m) { return m.from === a.sel && m.to === sq; });
  if (!legal.length) return;
  a.sel = -1;
  /* a promotion is a question, not an assumption */
  if (legal.length > 1 && legal[0].promo) {
    a.pendingPromo = { moves: legal, to: sq };
    renderTrainerInline();
    return;
  }
  gradeMove(legal[0]);
}

function promoChoose(piece) {
  var ss = ui.session;
  if (!ss || !ss.active || !ss.active.pendingPromo) return;
  var a = ss.active;
  var m = null;
  a.pendingPromo.moves.forEach(function (x) { if (x.promo === piece) m = x; });
  a.pendingPromo = null;
  if (m) gradeMove(m); else renderTrainerInline();
}

function gradeMove(m) {
  var ss = ui.session;
  if (!ss || !ss.active || ss.active.phase !== 'guess') return;
  var a = ss.active, st = a.st;
  a.shapes = [];
  if (a.kind === 'blunder') {
    if (m.from === a.best.from && m.to === a.best.to
        && (!a.bestPromo || m.promo === a.bestPromo)) {
      var nm0 = moveNameOf(st, m);
      applyMove(st, m);
      a.lastMove = [m.from, m.to];
      pushHist(a, nm0);
      walkOutLine(a);
      finishItem(a.attempts === 0 ? 'first' : 'retry');
      snd('good');
      renderTrainerInline();
      return;
    }
    /* Not the book answer — but there is more than one good move in most
       positions, so the engine gets the final say before we call it wrong. */
    a.attempts++;
    snd('bad');
    if (SF.state === 'failed') {
      a.flash = true;
      if (a.attempts === 1) a.runBroke = srsBreakRun(a.it) > 0;
      renderTrainerInline();
      return;
    }
    a.phase = 'checking';
    a.moveName = moveNameOf(st, m);
    renderTrainerInline();
    var after = cloneState(st);
    applyMove(after, m);
    var wasFirst = a.attempts === 1;
    var ssNow = ui.session, aNow = a;
    engineEval(stateFen(after), 300, true).then(function (r) {
      if (ui.session !== ssNow || ssNow.active !== aNow || aNow.phase !== 'checking') return;
      var meWhite = aNow.it.g.color === 'white';
      var myWin = winPct(meWhite ? r.cp : -r.cp);
      if (myWin >= aNow.it.b.wb - 6) {
        applyMove(st, m);
        aNow.lastMove = [m.from, m.to];
        pushHist(aNow, aNow.moveName);
        aNow.altGood = aNow.moveName;
        aNow.altEval = { mine: Math.round(myWin), best: Math.round(aNow.it.b.wb) };
        aNow.ghostMove = [aNow.best.from, aNow.best.to];   /* the named book move, drawn */
        finishItem(wasFirst ? 'first' : 'retry');
      } else {
        aNow.phase = 'guess';
        aNow.flash = true;
        /* say HOW wrong, not just that it was: the two win chances */
        aNow.flashEval = { san: aNow.moveName, mine: Math.round(myWin), best: Math.round(aNow.it.b.wb) };
        if (aNow.attempts === 1) aNow.runBroke = srsBreakRun(aNow.it) > 0;
      }
      renderTrainerInline();
    }).catch(function () {
      if (ui.session !== ssNow || ssNow.active !== aNow) return;
      aNow.phase = 'guess';
      aNow.flash = true;
      renderTrainerInline();
    });
    return;
  }

  if (a.kind === 'openlearn') {
    /* the lesson: only the shown move advances; anything else re-pulses it */
    var dL = a.line.decisions[a.di];
    if (m.from === a.keeperMove.from && m.to === a.keeperMove.to) {
      applyMove(st, m);
      a.lastMove = [m.from, m.to];
      pushHist(a, dL.nd.keeper);
      snd('move');
      if (dL.reply) {
        var rm = sanApply(st, dL.reply.san);
        if (rm) {
          a.lastMove = [rm.from, rm.to];
          a.animMove = [rm.from, rm.to];
          pushHist(a, dL.reply.san);
        }
      }
      a.di++;
      if (a.di < a.line.decisions.length && dL.reply) {
        var dN = a.line.decisions[a.di];
        var probeL = cloneState(st);
        var kmN = sanApply(probeL, dN.nd.keeper);
        if (kmN) {
          a.keeperMove = kmN;
          a.keeperSan = dN.nd.keeper;
          a.shapes = [{ from: kmN.from, to: kmN.to }];
          a.hintSq = kmN.from;
          a.sel = -1;
          a.stepNote = (dL.reply ? 'They answer ' + esc(dL.reply.san) + ' ('
            + Math.round(dL.reply.share * 100) + '% do — the main reply). ' : '') + lessonNote(a.line, a.di);
          renderTrainerInline();
          return;
        }
      }
      /* lesson over: the test IS the next moment — it deals itself */
      markLearned(a.line);
      a.line.status = 'ready';
      a.shapes = []; a.hintSq = null;
      a.stepNote = 'Line learned. Testing you from memory…';
      ss.items[ss.idx].spawned = true;
      ss.items.splice(ss.idx + 1, 0, { kind: 'opening', line: a.line, justLearned: true });
      ss.nextLabel = 'Test me now';
      finishItem('first');
      snd('good');
      renderTrainerInline();
      var ssA = ss, aA = a;
      setTimeout(function () {
        if (ui.session === ssA && ssA.active === aA && aA.phase === 'done') nextSessionItem();
      }, 1600);
      return;
    }
    /* not the shown move: gentle, zero-cost redirect */
    a.flash = true;
    snd('tap');
    renderTrainerInline();
    return;
  }

  if (a.kind === 'opening') {
    var playedSan = moveNameOf(st, m);
    var dD = a.line.decisions[a.di];
    var okMove = (m.from === a.keeperMove.from && m.to === a.keeperMove.to
                  && (!a.keeperMove.promo || m.promo === a.keeperMove.promo));
    var alt = null;
    if (!okMove) {
      /* a sound sideline is an answer, not an error — the book decides */
      var bk = bookAt(a.st);
      if (bk) {
        var mineR = null, keepR = null;
        bk.forEach(function (r) {
          if (r.san === sanClean(playedSan) || uciSanMatch(a.st, r.san, m)) mineR = r;
          if (r.san === a.keeperSan) keepR = r;
        });
        if (mineR && mineR.share >= 0.05 && keepR
            && myScoreOf(keepR, a.line.colour) - myScoreOf(mineR, a.line.colour) <= REP_KEEP_GAP) {
          alt = mineR;
        }
      }
      if (!alt) {
        a.attempts++;
        a.flash = true;
        snd('bad');
        if (a.di === 0 && a.attempts === 1) a.runBroke = srsBreakRunKey(a.srsKey) > 0;
        renderTrainerInline();
        return;
      }
    }
    if (alt) {
      /* sound, but off this line — credit it and close the card */
      a.ghostMove = [a.keeperMove.from, a.keeperMove.to];   /* the named line move, drawn */
      applyMove(st, m);
      a.lastMove = [m.from, m.to];
      pushHist(a, alt.san);
      var keepScore = null;
      (bk || []).forEach(function (r) { if (r.san === a.keeperSan) keepScore = r; });
      a.stepNote = '✓ ' + esc(alt.san) + ' also holds — it scores '
        + Math.round(myScoreOf(alt, a.line.colour)) + '% for your side at ' + myBand()
        + (keepScore ? ' against the ' + Math.round(myScoreOf(keepScore, a.line.colour))
          + '% of the line\'s ' + esc(a.keeperSan) : ', near the line\'s ' + esc(a.keeperSan))
        + ', shown in gold. It returns to check that memory.';
      finishItem(a.attempts === 0 ? 'first' : 'retry');
      snd('good');
      renderTrainerInline();
      return;
    }
    applyMove(st, m);
    a.lastMove = [m.from, m.to];
    pushHist(a, dD.nd.keeper);
    snd('move');
    var noteBits = '✓ ' + esc(dD.nd.keeper);
    if (dD.reply) {
      var rm2 = sanApply(st, dD.reply.san);
      if (rm2) {
        a.lastMove = [rm2.from, rm2.to];
        a.animMove = [rm2.from, rm2.to];
        pushHist(a, dD.reply.san);
        noteBits += ' — they answer ' + esc(dD.reply.san) + ' ('
          + Math.round(dD.reply.share * 100) + '% of ' + myBand() + 's do).';
      }
    }
    a.di++;
    if (a.di < a.line.decisions.length && dD.reply) {
      var dN2 = a.line.decisions[a.di];
      var probeD = cloneState(st);
      var kmD = sanApply(probeD, dN2.nd.keeper);
      if (kmD) {
        a.keeperMove = kmD;
        a.keeperSan = dN2.nd.keeper;
        a.sel = -1;
        a.stepNote = noteBits + ' Your move.';
        renderTrainerInline();
        return;
      }
    }
    a.stepNote = noteBits;
    finishItem(a.attempts === 0 ? 'first' : 'retry');
    snd('good');
    renderTrainerInline();
    return;
  }

  /* puzzle: the solution is a UCI line; opponent replies play themselves.
     Exception, same as Lichess's own rule: any checkmate is a win. */
  var mateProbe = cloneState(st);
  applyMove(mateProbe, m);
  if (!legalMoves(mateProbe).length
      && squareAttacked(mateProbe.b, kingSq(mateProbe.b, mateProbe.w), !mateProbe.w)) {
    var nmM = moveNameOf(st, m);
    applyMove(st, m);
    a.lastMove = [m.from, m.to];
    pushHist(a, nmM + '#');
    a.step = a.sol.length;
    finishItem(a.attempts === 0 ? 'first' : 'retry');
    renderTrainerInline();
    return;
  }
  var want = uciToMove(st, a.sol[a.step]);
  if (want && m.from === want.from && m.to === want.to
      && (!want.promo || want.promo === (m.promo || 'Q'))) {
    var nm1 = moveNameOf(st, want);
    applyMove(st, want);
    a.lastMove = [want.from, want.to];
    a.step++;
    pushHist(a, nm1);
    if (a.step >= a.sol.length) {
      finishItem(a.attempts === 0 ? 'first' : 'retry');
      snd('good');
    } else {
      snd('move');
      var reply = uciToMove(st, a.sol[a.step]);
      if (reply) {
        var nm2 = moveNameOf(st, reply);
        applyMove(st, reply);
        a.lastMove = [reply.from, reply.to];
        a.animMove = [reply.from, reply.to];
        a.step++;
        pushHist(a, nm2);
      }
      if (a.step >= a.sol.length) finishItem(a.attempts === 0 ? 'first' : 'retry');
    }
  } else { a.attempts++; a.flash = true; snd('bad'); }
  renderTrainerInline();
}

function revealAnswer() {
  var ss = ui.session;
  if (!ss || !ss.active || ss.active.phase !== 'guess') return;
  var a = ss.active, st = a.st;
  if (a.kind === 'blunder' && a.attempts === 0) a.runBroke = srsBreakRun(a.it) > 0;
  if (a.kind === 'opening') {
    if (a.attempts === 0 && a.di === 0) a.runBroke = srsBreakRunKey(a.srsKey) > 0;
    var nmO = a.keeperSan;
    applyMove(st, a.keeperMove);
    a.lastMove = [a.keeperMove.from, a.keeperMove.to];
    pushHist(a, nmO);
    finishItem('fail');
    renderTrainerInline();
    return;
  }
  if (a.kind === 'blunder') {
    var name0 = moveNameOf(st, { from: a.best.from, to: a.best.to, promo: a.bestPromo });
    applyMove(st, { from: a.best.from, to: a.best.to, promo: a.bestPromo || null, ep: -1 });
    a.lastMove = [a.best.from, a.best.to];
    pushHist(a, name0);
    walkOutLine(a);
  } else {
    while (a.step < a.sol.length) {
      var nm = uciToMove(st, a.sol[a.step]);
      if (!nm) break;
      var nameN = moveNameOf(st, nm);
      applyMove(st, nm);
      a.lastMove = [nm.from, nm.to];
      a.step++;
      pushHist(a, nameN);
    }
    /* walking starts at the beginning: the user asked what happened */
    a.view = Math.min(1, a.hist.length - 1);
  }
  finishItem('fail');
  renderTrainerInline();
}

function nextSessionItem() {
  var ss = ui.session;
  if (!ss) return;
  ss.nextLabel = null;
  ss.idx++;
  loadSessionItem();
  setTimeout(autoScan, 400);
}

function masteryHtml(a) {
  var key = a.kind === 'blunder' ? (a.it.g.id + ':' + a.it.b.p)
    : (a.kind === 'opening' ? a.srsKey : null);
  if (!key) return '';
  var rec = srsLoad()[key] || null;
  var n = rec ? rec.streak || 0 : 0;
  var broke = a.runBroke && a.phase !== 'done' ? true : (a.runBroke && a.result !== 'first');
  var out = '<span class="run-meter' + (broke ? ' meter-broke' : '')
    + '" title="Answer this right first try on three separate days and it is trained for good. A wrong try resets the run.">';
  for (var i = 0; i < 3; i++) {
    out += '<span class="run-step' + (i < n ? ' run-won' : '') + '">'
      + (i < n ? '✓' : '') + '</span>';
  }
  return out + '<span class="run-word' + (broke ? ' loss' : '') + '">'
    + (broke ? 'run reset' : (n >= 3 ? 'trained' : n + ' of 3 to trained')) + '</span></span>';
}

function trainerIntroHtml() {
  return '<div class="intro" style="max-width:480px;margin-bottom:14px">'
    + '<div class="kicker" style="margin-bottom:10px">how it works</div>'
    + '<div class="intro-line">These are your own mistakes. Find the better move — drag a piece, or tap it and tap a square.</div>'
    + '<div class="intro-line"><span class="run-meter" style="margin-right:6px">'
      + '<span class="run-step run-won">✓</span><span class="run-step run-won">✓</span><span class="run-step"></span></span>'
    + 'Each ✓ is a right answer on a different day. Three and the mistake is trained for good; a miss clears them.</div>'
    + '<div class="intro-line">Finish the whole set and your streak grows by one.</div>'

}

/* computed ONCE when games land, then the clock re-stamps immediately —
   the line itself stays for the whole visit */
function computeGreeting() {
  var lastSeen = store.get('nl:lastSeen:' + String(cfg.user).toLowerCase(), 0);
  data.greeting = greetingLine(lastSeen);
  stampSeen();
}
function sinceYouWereHere() { return data.greeting || ''; }

function greetingLine(lastSeen) {
  if (!lastSeen) return '';
  var fresh = data.games.filter(function (g) { return g.ts > lastSeen; });
  if (!fresh.length || fresh.length > 60) return '';
  var w = fresh.filter(function (g) { return g.res === 'win'; }).length;
  var l = fresh.filter(function (g) { return g.res === 'loss'; }).length;
  var withM = fresh.filter(function (g) { return g.bl && g.bl.length; });
  var minted = withM.reduce(function (a, g) { return a + g.bl.length; }, 0);
  var line = 'Since you were here: ' + fresh.length + ' game' + (fresh.length === 1 ? '' : 's')
    + ' (' + w + '–' + l + ')';
  if (minted) {
    var eg = withM[0];
    line += ' · ' + minted + ' new mistake' + (minted === 1 ? '' : 's')
      + ' found — the one vs ' + esc(eg.opp) + ' is in today\'s set';
  } else if (fresh.length) {
    line += ' · the engine is reading them now';
  }
  return '<p class="since">' + line + '.</p>';
}
function stampSeen() {
  store.set('nl:lastSeen:' + String(cfg.user).toLowerCase(), Date.now());
}

/* ── Missions ────────────────────────────────────────────────────────────
   Every kind of set the app can deal, in one checklist on Today: the daily
   set first, then the book drills, then whatever the coach is prescribing.
   Each is startable in one tap, checkable for the day, and repeatable —
   the check is satisfaction, never a lock.                                 */

function missionList() {
  if (data.sections.games !== 'ok') return [];
  var done = dayLoad().missions || {};
  var out = [], seen = {};
  function add(m) {
    if (seen[m.key]) return;
    seen[m.key] = 1;
    m.count = done[m.key] || 0;
    out.push(m);
  }

  var q = drillQueue();
  var due = dueCount();
  add({ key: 'daily', label: 'Mistakes & puzzles', gold: true,
        sub: q.length ? q.length + ' positions' + (due ? ' · ' + due + ' due back' : '')
                      : 'puzzles at your level' });

  ['white', 'black'].forEach(function (colour) {
    try {
      var lns = linesFor(colour, null);
      if (!lns.length) return;
      var newN = lns.filter(function (l) { return l.status === 'new'; }).length;
      var dueN = lns.filter(function (l) { return l.status === 'due'; }).length;
      /* learning and drilling are different work — they get different rows */
      if (newN) {
        add({ key: 'oplearn:' + colour, label: 'Learn: ' + colour + ' lines',
              sub: (newN === 1 ? 'one new line' : newN + ' new lines') + ', taught move by move' });
      }
      var drillable = lns.length - newN;
      if (drillable > 0) {
        add({ key: 'op:' + colour, label: 'Drill: ' + colour + ' book',
              sub: 'a set of ' + Math.min(setSize() <= 8 ? 6 : 8, drillable) + ' from your ' + drillable + ' lines'
                + (dueN ? ' · ' + dueN + ' due today' : '') });
      }
    } catch (e) {}
  });

  /* the coach's prescriptions, registered here so the buttons work even if
     the Coach tab has never rendered this visit */
  try {
    var focus = coachFocus();
    if (focus && (focus.key === 'white' || focus.key === 'black')) {
      var iF = registerSpec({ type: 'colour', colour: focus.key,
        label: 'as ' + focus.key, theme: 'opening',
        why: 'Your mistakes with ' + focus.key + ' — the focus.' });
      add({ key: 'cs:' + data.customSpecs[iF]._k, i: iF,
            label: 'Focus: your ' + focus.key + ' games',
            sub: 'mistakes with ' + focus.key });
    }
    runDetectors().slice(0, 4).forEach(function (f) {
      if (!f.custom) return;
      var i2 = registerSpec({ type: f.custom.type, name: f.custom.name,
        family: f.custom.family, colour: f.custom.colour, mode: f.custom.mode,
        days: f.custom.days, label: f.custom.label,
        theme: f.custom.type === 'opening' ? 'opening' : null, why: f.custom.why });
      add({ key: 'cs:' + data.customSpecs[i2]._k, i: i2,
            label: f.custom.label, sub: f.note ? String(f.note).replace(/<[^>]*>/g, '') : '' });
    });
  } catch (e) {}

  add({ key: 'puzzles', label: 'Bonus puzzle run',
        sub: 'six fresh, tuned to your level' });
  return out.slice(0, 7);
}

function missionsPanel() {
  var list = missionList();
  if (!list.length) return '';
  var ss = ui.session;
  var doneN = list.filter(function (m) { return m.count > 0; }).length;
  return '<div class="missions">'
    + '<div class="missions-head"><span class="kicker-sm">missions</span>'
      + '<span class="dim tnum" style="font-size:11px">' + doneN + ' / ' + list.length + '</span></div>'
    + list.map(function (m) {
        var active = ss && !ss.finished && ss.missionKey === m.key;
        return '<a class="mission' + (m.count ? ' mission-done' : '') + (active ? ' mission-live' : '')
          + '" data-act="mission" data-k="' + esc(m.key) + '"'
          + (m.i != null ? ' data-i="' + m.i + '"' : '') + ' role="button" tabindex="0">'
          + '<span class="mission-check">' + (m.count ? '✓' : '') + '</span>'
          + '<span class="mission-body"><span class="mission-label'
            + (m.gold ? ' mission-gold' : '') + '">' + esc(m.label)
            + (m.count > 1 ? ' <span class="tnum dim">×' + m.count + '</span>' : '') + '</span>'
          + (m.sub ? '<span class="mission-sub">' + esc(m.sub) + '</span>' : '')
          + '</span>'
          + '<span class="mission-go">' + (active ? 'now' : (m.count ? 'again' : 'start')) + '</span>'
          + '</a>';
      }).join('')
    + '</div>';
}

function startMission(key, idx) {
  data.freshOnboard = false;
  data.autoStarted = true;
  if (key === 'daily') startSession(null);
  else if (key === 'puzzles') startPuzzleRun();
  else if (key.indexOf('oplearn:') === 0) {
    var bitsL = key.slice(8).split('|');
    startOpeningSession(bitsL[0] === 'all' ? null : bitsL[0], bitsL[1] || null, 'learn');
  } else if (key.indexOf('op:') === 0) {
    var bits = key.slice(3).split('|');
    startOpeningSession(bits[0] === 'all' ? null : bits[0], bits[1] || null, 'drill');
  } else if (key.indexOf('cs:') === 0) {
    var spec = data.customSpecs && data.customSpecs[idx];
    if (spec) startCustomSession(spec);
  }
}

function setHeaderHtml(sub) {
  var si = streakInfo();
  var today = dayLoad();
  var label = ui.session && ui.session.customLabel
    ? 'custom set · ' + ui.session.customLabel : 'today\'s set';
  return '<div class="set-head">'
    + '<span class="kicker">' + esc(label) + '</span>'
    + (sub ? '<span class="set-sub tnum">' + sub + '</span>' : '')
    + '<span class="set-spacer"></span>'
    + '<a class="how-btn" data-act="howToggle" title="How training works">?</a>'
    + '<span class="run-lockup" title="Set streak: sets scored on consecutive days'
      + (bestStreak() > 1 ? ' · best ' + bestStreak() : '') + '">'
      + '<span class="run-flame">' + FLAME + '</span>'
      + (si.sets > 0 ? '<b class="run-count tnum">' + si.sets + '</b>' : '')
      + '<span class="run-label">' + (si.sets > 0 ? 'set streak' : 'finish a set to start your streak')
        + (today.sets ? ' · ' + today.sets + ' today' : '') + '</span>'
    + '</span>'
    + '</div>';
}

function segPos(ss) {
  var n = 0, cur = 1;
  ss.items.forEach(function (x, i) {
    if (x.kind === 'openlearn' && x.spawned) return;
    n++;
    if (i < ss.idx) cur++;
  });
  return Math.min(cur, n) + ' / ' + n;
}
function setProgressHtml(ss) {
  /* a lesson and its from-memory test share one segment: the bar only
     moves when the line is answered for real, so "make the bar move" always
     means "it is your turn to perform" */
  var segs = [];
  ss.items.forEach(function (x, i) {
    if (x.kind === 'openlearn' && x.spawned) return;   /* its test carries the segment */
    var cls = 'set-seg';
    if (ss.results[i] === 'first' || ss.results[i] === 'retry') cls += ' seg-won';
    else if (ss.results[i] === 'fail') cls += ' seg-lost';
    else if (i === ss.idx && !ss.finished) cls += ' seg-on';
    segs.push('<span class="' + cls + '"></span>');
  });
  return '<div class="set-bar">' + segs.join('') + '<span class="set-flag" title="Finish the set">⚑</span></div>';
}

function gameDateLine(g) {
  var d = new Date(g.ts);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function renderTrainerInline() {
  var box = el('trainer-inline');
  if (!box) return;
  var ss = ui.session;

  if (!ss) {
    if (data.sections.games === 'loading' && !data.games.length) {
      box.innerHTML = setHeaderHtml('') + '<div class="loading">reading your games…</div>';
      return;
    }
    if (data.sections.games === 'fail' && !data.games.length) {
      box.innerHTML = setHeaderHtml('')
        + '<div class="inline-trainer"><p class="trainer-prompt">Could not read your games'
        + (data.gamesErr ? ' — ' + esc(data.gamesErr) : '') + '</p>'
        + '<div class="trainer-foot"><a class="btn-quiet" data-act="reload">Try again</a></div></div>';
      return;
    }
    var q = drillQueue();
    if (data.freshOnboard) {
      var mCount = missionList().length;
      var an0 = data.games.filter(function (g) { return g.analysed; }).length;
      var minted0 = 0;
      data.games.forEach(function (g) { if (g.bl) minted0 += g.bl.length; });
      box.innerHTML = setHeaderHtml('')
        + '<div class="inline-trainer">'
        + '<p class="set-done-big" style="margin-top:4px">Your program is built.</p>'
        + '<p class="trainer-prompt">'
        + (minted0
            ? 'From your games: ' + minted0 + ' mistakes worth retraining, your opening lines '
              + 'as White and Black, and ' + mCount + ' missions for today. '
            : 'Your games are in. As you play, your mistakes and opening lines feed the missions here. ')
        + 'Everything below starts with one tap — no setup, ever.</p>'
        + '<p class="trainer-sub">The whole product works in sets — short, finishable rounds. '
        + 'Finish a set and its mission checks off; finish one tomorrow and your streak begins. '
        + 'The first moves are explained as you go.</p>'
        + '<div class="trainer-foot">'
        + '<a class="btn-big btn-pulse" data-act="firstSet">Start your first set</a>'
        + '</div></div>'
        + missionsPanel();
      return;
    }
    if (!data.autoStarted && data.sections.games === 'ok' && (q.length || openingItems(1).length)) {
      data.autoStarted = true;
      startSession(null, true);
      return;
    }
    var an = data.games.filter(function (g) { return g.analysed; }).length;
    var doneToday = dayLoad().trained > 0 && !q.length;
    if (!doneToday && data.sections.games === 'ok') {
      /* no button lives here: the set deals itself */
      data.autoStarted = true;
      startSession(null, true);
      return;
    }
    box.innerHTML = setHeaderHtml('')
      + sinceYouWereHere()
      + '<div class="inline-trainer">'
      + (doneToday
          ? '<p class="trainer-prompt">Today\'s set is done, and nothing is due back yet.</p>'
            + '<div class="trainer-foot">'
            + '<a class="btn-gold btn-pulse" data-act="train">Keep going!</a>'
            + '<a class="btn-quiet" href="' + playHref(cfg.tcs[0]) + '">Play one ' + cfg.tcs[0] + '</a></div>'
          : '<div class="loading">dealing today\'s set…</div>')
      + '<div class="caption-after">Positions come from the ' + an
      + ' of your games with analysis'
      + (reviewQueue().length
          ? ' — <a href="' + gameHref(reviewQueue()[0].id, reviewQueue()[0].color)
            + '">analyse your newest game</a> and the pool grows'
          : '') + '.</div></div>'
      + missionsPanel();
    return;
  }

  if (ss.finished) {
    var si = streakInfo();
    bumpBestStreak(si.sets);
    renderHeader();
    var day = dayLoad();
    box.innerHTML = setHeaderHtml('')
      + '<div class="inline-trainer set-done">'
      + setProgressHtml(ss)
      + (ss.done > 0
          ? '<div class="score-moment' + (ss.justScored ? ' score-live' : '') + '">'
            + '<span class="score-flame">' + FLAME + '</span>'
            + '<span class="score-num tnum">' + si.sets + '</span>'
          + '</div>'
          + '<p class="set-done-big">' + (ss.solved === ss.done && ss.done >= 6
              ? 'Perfect set.' : 'Set ' + (day.sets || 1) + ' scored.') + '</p>'
          + '<p class="trainer-prompt">' + ss.solved + ' of ' + ss.done + ' first try · streak '
            + si.sets + (si.sets >= bestStreak() && si.sets > 3 ? ' — your best run' : (bestStreak() > si.sets ? ' · best ' + bestStreak() : '')) + '.</p>'
          : '<p class="set-done-big">Set skipped.</p>'
            + '<p class="trainer-prompt">Skips keep the queue honest, but only answered positions score.</p>')
      + (si.shieldUsed
          ? '<p class="trainer-sub">Your rest-day shield is spent this week — the run needs you tomorrow.</p>'
          : '<p class="trainer-sub">One rest day a week is shielded. Two in a row ends the run.</p>')
      + (ss.done > 0 ? '<p class="trainer-sub">Mission checked off — the list below has your next one.</p>' : '')
      + '<div class="trainer-foot">'
        + '<a class="btn-quiet" href="' + playHref(cfg.tcs[0]) + '">Play one ' + cfg.tcs[0] + '</a>'
      + '</div></div>'
      + missionsPanel();
    ss.justScored = false;
    return;
  }

  var a = ss.active;
  var item = ss.items[ss.idx];
  if (!a) {
    box.innerHTML = setHeaderHtml(segPos(ss))
      + '<div class="inline-trainer">' + setProgressHtml(ss)
      + '<div class="loading">'
      + (ss.refineNote
          ? 'double-checking this position with a deeper engine look…'
          : 'fetching a ' + esc(item && item.theme ? item.theme.key : '') + ' puzzle from Lichess…')
      + '</div></div>';
    return;
  }

  /* which position paints: the live one, or a step of the walked line */
  var viewing = a.phase === 'done' && a.hist && a.view < a.hist.length - 1;
  var paintSt = viewing ? a.hist[a.view].st : a.st;
  var checkSq = checkedKingSq(paintSt);
  var paintLast = viewing ? a.hist[a.view].last
    : (a.phase === 'done' ? a.lastMove
       : (a.lastMove && a.kind === 'puzzle' ? a.lastMove : a.arrivedBy || null));

/* Drill — the mistakes from your own analysed games, reopened as positions.

function allBlunders() {

function swingWord(w) {
  if (w >= 65) return 'winning';

}
