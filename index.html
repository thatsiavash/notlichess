function worstOpening() {
  var perf = mainPerf();
  var gs = myGamesIn(perf).filter(function (g) { return g.opening; });
  if (gs.length < 30) return null;
  var groups = {};
  gs.forEach(function (g) {
    var k = g.opening.split(':')[0].trim() + '|' + g.color;
    (groups[k] = groups[k] || []).push(g);
  });
  var worst = null;
  Object.keys(groups).forEach(function (k) {
    var list = groups[k];
    if (list.length < 10) return;
    var r = winRate(list);
    if (!worst || r < worst.rate) {
      var bits = k.split('|');
      worst = { family: bits[0], colour: bits[1], rate: r, n: list.length };
    }
  });
  return worst;
}

function incrementTc() {
  var withInc = cfg.tcs.filter(function (tc) { return tcParts(tc).inc > 0; });
  return withInc[0] || '10+5';
}

/* One snapshot a day, twelve kept. Small enough to sit beside the game cache
   and enough to answer "is the thing I was told to fix getting better". */
function snapKey() { return 'nl:snap:' + String(cfg.user).toLowerCase(); }

function recordSnapshot(rows) {
  var today = iso(new Date());
  var list = store.get(snapKey(), []);
  if (!Array.isArray(list)) list = [];
  var vals = {};
  rows.forEach(function (r) { vals[r.key] = Math.round(r.mine * 10) / 10; });
  if (list.length && list[list.length - 1].d === today) list[list.length - 1].v = vals;
  else list.push({ d: today, v: vals });
  store.set(snapKey(), list.slice(-12));
}

/* The oldest snapshot at least a week old — a same-week comparison is noise. */
function snapshotBefore(days) {
  var list = store.get(snapKey(), []);
  if (!Array.isArray(list)) return null;
  var cut = iso(new Date(Date.now() - days * 864e5));
  for (var i = 0; i < list.length; i++) if (list[i].d <= cut) return list[i];
  return null;
}

function skillTrend(key, low) {
  var old = snapshotBefore(7);
  if (!old || !old.v || old.v[key] == null) return null;
  var prof = skillProfile();
  var row = null;
  for (var i = 0; i < prof.rows.length; i++) if (prof.rows[i].key === key) row = prof.rows[i];
  if (!row) return null;
  var delta = row.mine - old.v[key];
  if (Math.abs(delta) < 0.5) return null;
  return { delta: delta, better: low ? delta < 0 : delta > 0, since: old.d };
}

var profileCache = null;
function skillProfile() {
  var perf = mainPerf();
  var rating = data.user && data.user.perfs && data.user.perfs[perf]
    ? data.user.perfs[perf].rating : null;
  /* The rating belongs in the key: it arrives after the first paint, and it
     is what selects the peer band. */
  var token = censusToken() + '|' + perf + '|' + rating;
  if (profileCache && profileCache.token === token) return profileCache;

  var gs = myGamesIn(perf);
  var cell = peerCell(perf, rating);
  var rows = [];

  SKILLS.forEach(function (sk) {
    if (sk.key === 'review' && isCC()) return;   /* lichess-only concept */
    var mine = null;
    try { mine = sk.compute(gs); } catch (e) { mine = null; }
    if (!mine) return;
    var peer = cell ? cell[sk.peer] : null;
    var row = {
      key: sk.key, label: sk.label, unit: sk.unit, hint: sk.hint, phrase: sk.phrase, sent: sk.sent,
      contextual: !!sk.contextual,
      mine: mine.v, n: mine.n, peer: (peer == null ? null : peer),
      low: !!sk.low
    };
    if (peer != null) {
      var scale = sk.rel ? Math.max(1, peer * sk.scale) : sk.scale;
      row.rel = ((mine.v - peer) / scale) * (sk.low ? -1 : 1);
      /* colour rows: verdict from the opposition-adjusted number */
      if (sk.colourAdj && row.peer != null) {
        var gap = colourOppGap(sk.colourAdj);
        if (gap != null && Math.abs(gap) > 25) {
          var adj = row.mine + (50 - eloExpected(gap));
          row.adj = Math.round(adj * 10) / 10;
          row.oppGap = Math.round(gap);
          row.rel = (adj - row.peer) / sk.scale;
          row.rel = Math.max(-2, Math.min(2, row.rel));
        }
      }
      row.verdict = sk.contextual ? 'context' : verdictOf(row.rel);
      row.phrase = sk.phrase || sk.label.toLowerCase();
    }
    rows.push(row);
  });

  profileCache = { token: token, perf: perf, rating: rating, rows: rows, hasPeers: !!cell };
  if (rows.length) recordSnapshot(rows);
  return profileCache;
}

var BEHIND = -0.55;   /* clearly below peers, short of a full "weak" step */

function behindSkills() {
  return rankedSkills().filter(function (r) { return r.rel <= BEHIND && !r.contextual; });
}

/* Weakest first, but only rows that have a peer number to be weak against. */
/* Plans are resolved from the registry by key, never read off row objects —
   rows travel through JSON (snapshots, caches) where functions do not. */
function planFor(row) {
  var sk = null;
  SKILLS.forEach(function (k) { if (k.key === row.key) sk = k; });
  if (sk && sk.plan) { try { return sk.plan(); } catch (e) {} }
  return { label: 'Train', act: 'train', why: '' };
}

function rankedSkills() {
  return skillProfile().rows.filter(function (r) { return r.rel != null; })
    .slice().sort(function (a, b) { return a.rel - b.rel; });
}
/* A registry of independent detectors. Each is a pure function over loaded
   data and returns null or a finding. Nothing here invents a peer baseline:
   Lichess's peer numbers are not exposed to third parties, so every
   comparison is self-relative and says so.                                */

/* A format has to be a real part of how you play before this page is allowed
   to say anything about it. Three bullet games in a thousand is not a habit,
   it is noise, and noise dressed as a finding is worse than no finding. */
var MIN_FORMAT_GAMES = 40;
var MIN_FORMAT_SHARE = 0.08;

var censusCache = null;
function censusToken() {
  return data.games.length + '|' + (data.games[0] ? data.games[0].id : '') + '|' + cfg.tcs.join(',');
}
function census() {
  var token = censusToken();
  if (censusCache && censusCache.token === token) return censusCache;
  var c = {}, total = 0;
  data.games.forEach(function (g) { c[g.perf] = (c[g.perf] || 0) + 1; total++; });
  c._total = total;
  var eligible = trackedPerfs().filter(function (p) {
    return (c[p] || 0) >= MIN_FORMAT_GAMES && (c[p] || 0) / Math.max(1, total) >= MIN_FORMAT_SHARE;
  });
  var set = {};
  eligible.forEach(function (p) { set[p] = true; });
  censusCache = { token: token, counts: c, eligible: eligible, set: set };
  return censusCache;
}
function formatCounts() { return census().counts; }
function eligibleFormats() { return census().eligible; }
function isEligible(perf) { return !!census().set[perf]; }
/* The format the page speaks about. Intent first: the time control you put at
   the top is the one you are trying to improve, so it wins whenever it has a
   large enough sample to be honest about. Only if it does not does the page
   fall back to whatever you actually play most. Ranking purely by volume made
   the whole page talk about bullet to someone whose stated focus is rapid. */
/* Formats with enough games in the window to coach honestly */
function coachableFormats() {
  return trackedPerfs().filter(function (p) {
    return data.games.filter(function (g) { return g.perf === p; }).length >= 50;
  });
}

function mainPerf() {
  /* the user's coach-format pick wins when it is coachable */
  var pick = store.get('nl:coachPerf', null);
  if (pick && coachableFormats().indexOf(pick) !== -1) return pick;
  var wanted = (cfg.perfs && cfg.perfs.length) ? cfg.perfs[0] : primaryPerf();
  if (isEligible(wanted)) return wanted;
  var c = formatCounts(), best = null;
  eligibleFormats().forEach(function (p) {
    if (!best || (c[p] || 0) > (c[best] || 0)) best = p;
  });
  return best || wanted;
}

/* Real idle time between two games: the later game's start minus the earlier
   one's END. Using start-to-start counted the game's own duration as rest,
   which made every gap test wrong for anything slower than bullet. */
function idleGap(later, earlier) {
  if (!later || !earlier) return Infinity;
  var earlierEnd = earlier.ts + (earlier.secs != null ? earlier.secs * 1000 : 0);
  return later.ts - earlierEnd;
}

function myGamesIn(perf) {
  return data.games.filter(function (g) { return !perf || g.perf === perf; });
}
function winRate(list) {
  if (!list.length) return null;
  var w = list.filter(function (g) { return g.res === 'win'; }).length;
  return (w / list.length) * 100;
}
function primaryPerf() { return tcPerf(cfg.tcs[0] || '10+0'); }
function perfLabel(p) { return p === 'ultraBullet' ? 'ultrabullet' : p; }


/* ── 8d. Evidence — what opens when a skill row is clicked ─────────────
   Each panel is the concrete version of the abstract number: the actual
   games, the actual positions, the actual openings. Nothing generic.     */

function colourFamilies(colour) {
  var perf = mainPerf();
  var rating = data.user && data.user.perfs && data.user.perfs[perf]
    ? data.user.perfs[perf].rating : null;
  var groups = {};
  myGamesIn(perf).forEach(function (g) {
    if (g.color !== colour || !g.opening) return;
    var fam = g.opening.split(':')[0].trim();
    (groups[fam] = groups[fam] || []).push(g);
  });
  return Object.keys(groups).map(function (fam) {
    var list = groups[fam];
    if (list.length < 10) return null;
    return {
      family: fam, n: list.length,
      rate: winRate(list),
      peer: peerOpening(fam, colour, rating)
    };
  }).filter(Boolean).sort(function (a, b) { return b.n - a.n; }).slice(0, 4);
}

function biggestBlunderIn(loPly, hiPly) {
  var best = null;
  allBlunders().forEach(function (it) {
    if (it.b.p < loPly || it.b.p >= hiPly) return;
    if (!best || (it.b.wb - it.b.wa) > (best.b.wb - best.b.wa)) best = it;
  });
  return best && retryHref(best) ? best : null;
}

function gameRow(g, note) {
  return '<a class="row" href="' + gameHref(g.id, g.color) + '">'
    + '<span class="' + (g.res === 'win' ? 'win' : (g.res === 'loss' ? 'loss' : 'sec')) + '">'
    + (g.res === 'win' ? '+' : (g.res === 'loss' ? '−' : '=')) + '</span>'
    + '<b>' + esc(g.opp) + '</b>'
    + '<span class="when">' + esc(note) + ' · ' + ago(g.ts) + '</span></a>';
}
function famLine(f) {
  return '<div class="ev-line tnum">' + esc(f.family) + ' · '
    + '<span class="' + (f.peer != null && f.rate < f.peer - 4 ? 'loss' : '') + '">' + pct(f.rate) + '</span>'
    + ' over ' + f.n
    + (f.peer != null ? ' · <span class="dim">peers ' + pct(f.peer) + '</span>' : '')
    + '</div>';
}
function retryLine(it, label) {
  return '<a class="ev-line" href="' + retryHref(it) + '">' + esc(label)
    + ': move ' + moveNo(it.b.p) + ' vs ' + esc(it.g.opp)
    + ' (' + swingWord(it.b.wb) + ' → ' + swingWord(it.b.wa) + ') — retry it</a>';
}

/* Your actual first moves, grouped on the first four plies. This is the
   book you play, not the one you meant to learn. */
function numberedLine(toks) {
  var out = [];
  for (var i = 0; i < toks.length; i += 2) {
    out.push((i / 2 + 1) + '.' + toks[i] + (toks[i + 1] ? ' ' + toks[i + 1] : ''));
  }
  return out.join(' ');
}
function openingBook(colour) {
  var groups = {};
  myGamesIn(mainPerf()).forEach(function (g) {
    if (g.color !== colour || !g.op16) return;
    var toks = g.op16.split(' ');
    if (toks.length < 4) return;
    var key = toks.slice(0, 4).join(' ');
    (groups[key] = groups[key] || []).push(g);
  });
  return Object.keys(groups).map(function (key) {
    var list = groups[key];
    if (list.length < 5) return null;
    return { seq: key.split(' '), n: list.length, rate: winRate(list), g: list[0] };
  }).filter(Boolean).sort(function (a, b) { return b.n - a.n; }).slice(0, 3);
}
function bookLine(o, colour) {
  var fen = fenAtPly(o.g.id + ':bk', o.seq.join(' '), 4);
  return '<div class="ev-line tnum">' + esc(numberedLine(o.seq)) + ' · '
    + '<span class="' + (o.rate < 45 ? 'loss' : (o.rate > 55 ? 'win' : '')) + '">' + pct(o.rate) + '</span>'
    + ' over ' + o.n
    + (fen ? ' · <a href="' + analysisHref(fen, colour) + '">explore</a>' : '')
    + '</div>';
}

function skillDetail(key) {
  var perf = mainPerf();
  var gs = myGamesIn(perf);
  var html = '';
  switch (key) {
    case 'clock': {
      var losses = gs.filter(function (g) { return g.res === 'loss'; });
      var flagged = losses.filter(function (g) { return g.status === 'outoftime'; });
      html += '<div class="ev-line">' + flagged.length + ' of your ' + losses.length
        + ' losses ended on the clock.</div>';
      if (flagged.length) {
        html += '<div class="ev-line dim">The most recent ones:</div>'
          + flagged.slice(0, 2).map(function (g) { return gameRow(g, 'lost on time'); }).join('');
      }
      var withClk = allBlunders().filter(function (it) { return it.b.c != null; });
      var rushed = withClk.filter(function (it) { return it.b.c <= 60; });
      if (withClk.length >= 20)
        html += '<div class="ev-line dim">Separate point: ' + pct(rushed.length * 100 / withClk.length)
          + ' of your recorded mistakes (' + rushed.length + ' of ' + withClk.length
          + ') happened with under a minute on your clock. Even when you do not flag, '
          + 'the clock shapes the errors.</div>';
      break;
    }
    case 'accuracy': {
      var an = gs.filter(function (g) { return g.ev; })

      if (an.length) html += gameRow(an[0], an[0].ev[0] + ' acpl, your roughest');
      var all = allBlunders().sort(function (x, y) {
        return (y.b.wb - y.b.wa) - (x.b.wb - x.b.wa); });
      if (all.length && retryHref(all[0])) html += retryLine(all[0], 'Biggest single mistake');
      break;

        + '<span class="loss">' + pct(w.rate) + '</span> over ' + w.n + ' games · '

    }

        if (worstFam && worstFam.rate < 50) {

          });
          var vRows = Object.keys(vars).map(function (name) {

            return { name: name, n: list.length, rate: winRate(list) };
          }).filter(Boolean).sort(function (a, b) { return a.rate - b.rate; }).slice(0, 2);
          if (vRows.length) {

                  return '<div class="ev-line tnum">' + esc(v.name.split(':')[1].trim()) + ' · '
                    + '<span class="' + (v.rate < 42 ? 'loss' : '') + '">' + pct(v.rate) + '</span>'

    }
    case 'opposition': {
      var up = gs.filter(function (g) { return g.oppR && g.myR && g.oppR - g.myR >= 50; });
      var down = gs.filter(function (g) { return g.oppR && g.myR && g.myR - g.oppR >= 50; });
      if (up.length >= 10)
        html += '<div class="ev-line tnum">vs stronger players: ' + pct(winRate(up)) + ' over ' + up.length + '</div>';
      if (down.length >= 10)
        html += '<div class="ev-line tnum">vs weaker players: ' + pct(winRate(down)) + ' over ' + down.length + '</div>';
      break;
    }
  }
  return html;
}

/* Severity bands. The page leads with whatever you can change tonight, so
   behaviour outranks skill leaks, and skill leaks outrank context. A rating
   gap is worth knowing and worth nothing at 2am; a losing streak is the
   opposite. Ranking on raw magnitude put "260 below your peak" above "you win
   36% of games after midnight", which is exactly backwards for a launchpad. */
var detectors = [

  /* Day-of-week split — weekends and weekdays are different players. ---- */
  { id: 'weekday', name: 'Day of the week', blurb: 'Whether some days reliably go badly', cat: 'rhythm', run: function () {
    var gs = data.games.filter(function (g) { return g.res !== 'draw'; });
    if (gs.length < 120) return null;
    var byDay = {};
    gs.forEach(function (g) {
      var d = new Date(g.ts).getDay();
      (byDay[d] = byDay[d] || []).push(g);
    });
    var worst = null, base = winRate(gs);
    Object.keys(byDay).forEach(function (d) {
      var list = byDay[d];
      if (list.length < 25) return;
      var r = winRate(list);
      if (!worst || r < worst.rate) worst = { day: +d, rate: r, n: list.length };
    });
    if (!worst || base - worst.rate < 9) return null;
    var name = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][worst.day];
    return {
      id: 'weekday', cat: 'rhythm', severity: Math.min(50, Math.round((base - worst.rate) * 2.4)),
      headline: name + 's are your worst day.',
      evidence: pct(worst.rate) + ' across ' + worst.n + ' decisive games on ' + name + 's · ' + pct(base) + ' overall',
      note: '<span class="loss">' + pct(worst.rate) + '</span> on ' + name + 's',
      compare: pct(base) + ' overall',
      peerRelative: false,
      action: { label: 'Puzzles instead that day', href: L + '/training' }
    };
  }},

  /* Cold starts — the first game of a session. ------------------------- */
  { id: 'coldstart', name: 'Cold starts', blurb: 'How the first game of each session goes', cat: 'warmup', run: function () {
    var gs = data.games;
    if (gs.length < 100) return null;
    var gap = 40 * 60 * 1000;
    var firsts = [], rest = [];
    for (var i = gs.length - 1; i >= 0; i--) {
      var prev = gs[i + 1];
      var isFirst = !(prev && prev.ts && gs[i].ts - prev.ts < gap);
      if (gs[i].res === 'draw') continue;
      (isFirst ? firsts : rest).push(gs[i]);
    }
    if (firsts.length < 30 || rest.length < 30) return null;
    var f = winRate(firsts), r = winRate(rest);
    if (r - f < 8) return null;
    return {
      id: 'coldstart', cat: 'warmup', severity: Math.min(55, Math.round((r - f) * 2.6)),
      headline: 'Your first game of the day is your worst.',
      evidence: pct(f) + ' in session openers · ' + pct(r) + ' once warm · ' + firsts.length + ' openers',
      note: '<span class="loss">' + pct(f) + '</span> when cold',
      compare: pct(r) + ' once warm',
      peerRelative: false,
      action: { label: 'Warm up with three puzzles', href: L + '/training' }
    };
  }},

  /* Late castling — read straight off the stored opening prefixes. ------ */
  { id: 'castling', name: 'Castling habits', blurb: 'How often your king is still central eight moves in', cat: 'opening', run: function () {
    var gs = data.games.filter(function (g) { return g.op16 && g.plies >= 24; });
    if (gs.length < 60) return null;
    var uncastled = gs.filter(function (g) { return g.op16.indexOf('O-O') === -1; });
    var share = uncastled.length * 100 / gs.length;
    if (share < 55) return null;
    var uw = winRate(uncastled.filter(function (g) { return g.res !== 'draw'; }));
    var cw = winRate(gs.filter(function (g) {
      return g.op16.indexOf('O-O') !== -1 && g.res !== 'draw';
    }));
    if (uw == null || cw == null || cw - uw < 6) return null;
    return {
      id: 'castling', cat: 'opening', severity: Math.min(52, Math.round(share * 0.6)),
      headline: 'Your king stays home too long.',
      evidence: 'No castling in your first eight moves in ' + pct(share) + ' of games · '
        + pct(uw) + ' when uncastled vs ' + pct(cw) + ' when castled',
      note: '<span class="loss">' + pct(share) + '</span> uncastled at move 8',
      compare: pct(uw) + ' vs ' + pct(cw) + ' castled',
      peerRelative: false,
      action: { label: 'King-safety puzzles', href: L + '/training/kingsideAttack' }
    };
  }},

  /* Best hours — when you actually play well. Positive framing. --------- */
  { id: 'besthours', name: 'Best hours', blurb: 'The time of day you actually play well', cat: 'rhythm', run: function () {
    var gs = data.games.filter(function (g) { return g.res !== 'draw'; });
    if (gs.length < 150) return null;
    var bands = { morning: [6, 12], afternoon: [12, 18], evening: [18, 24], night: [0, 6] };
    var best = null, worst = null;
    Object.keys(bands).forEach(function (k) {
      var lo = bands[k][0], hi = bands[k][1];
      var list = gs.filter(function (g) {
        var h = new Date(g.ts).getHours();
        return h >= lo && h < hi;
      });
      if (list.length < 30) return;
      var r = winRate(list);
      if (!best || r > best.rate) best = { k: k, rate: r, n: list.length };
      if (!worst || r < worst.rate) worst = { k: k, rate: r, n: list.length };
    });
    if (!best || !worst || best.rate - worst.rate < 10) return null;
    return {
      id: 'besthours', cat: 'rhythm', severity: Math.min(48, Math.round((best.rate - worst.rate) * 1.8)),
      headline: 'You are a ' + best.k + ' player.',
      evidence: pct(best.rate) + ' in the ' + best.k + ' (' + best.n + ' games) · '
        + pct(worst.rate) + ' in the ' + worst.k,
      note: '<span class="win">' + pct(best.rate) + '</span> in the ' + best.k,
      compare: pct(worst.rate) + ' in the ' + worst.k,
      peerRelative: false,
      action: { label: 'Play ' + cfg.tcs[0] + ' now', href: playHref(cfg.tcs[0]) }
    };
  }},

  /* Tilt — no Lichess equivalent. ------------------------------------- */
  { id: 'tilt', name: 'Tilt', blurb: 'Losing streaks and how you play right after a loss', cat: 'tilt', run: function () {
    var gs = data.games;
    if (gs.length < 12) return null;

    /* A session is a run of games with less than 40 minutes between them. */
    var session = [], cutoff = 40 * 60 * 1000;
    for (var i = 0; i < gs.length; i++) {
      if (i > 0 && idleGap(gs[i - 1], gs[i]) > cutoff) break;
      session.push(gs[i]);
    }
    var live = session.length && (Date.now() - session[0].ts) < 3 * 3600 * 1000;
    var streak = 0;
    for (var j = 0; j < session.length && session[j].res === 'loss'; j++) streak++;

    if (live && streak >= 3) {
      var delta = session.reduce(function (a, g) { return a + (g.rd || 0); }, 0);
      var since = clockOf(session[session.length - 1].ts);
      return {
        id: 'tilt', cat: 'tilt', severity: Math.min(95, 58 + streak * 7),
        headline: 'Stop playing tonight.',
        evidence: streak + ' losses in a row · <span class="loss">' + signed(delta) + '</span> since ' + since,
        note: '<span class="loss">' + streak + ' losses</span> in a row',
        compare: 'this session · ' + signed(delta) + ' rating',
        peerRelative: false,
        action: { label: 'Watch TV instead', href: L + '/tv' }
      };
    }

    /* Otherwise: how you do in games begun within 10 minutes of a loss. */
    var after = [], rest = [];
    for (var k = 0; k < gs.length - 1; k++) {
      var prev = gs[k + 1];
      if (gs[k].res === 'draw' || !isEligible(gs[k].perf)) continue;
      if (prev.res === 'loss' && idleGap(gs[k], prev) < 10 * 60 * 1000) after.push(gs[k]);
      else rest.push(gs[k]);
    }
    if (after.length < 20 || rest.length < 20) return null;
    var a = winRate(after), b = winRate(rest);
    if (a == null || b == null || b - a < 8) return null;
    return {
      id: 'tilt', cat: 'tilt', severity: Math.min(72, Math.round(42 + (b - a) * 2.4)),
      headline: 'You play worse straight after a loss.',
      evidence: pct(a) + ' in the ' + after.length + ' games begun within 10 minutes of a loss · ' + pct(b) + ' otherwise',
      note: pct(a) + ' after a loss',
      compare: pct(b) + ' otherwise · ' + after.length + ' games',
      peerRelative: false,
      action: { label: 'Watch TV instead', href: L + '/tv' }
    };
  }},

  /* Review debt — no Lichess equivalent. Scored on recent habit, not on the
     size of the pile: a wider window always holds a bigger backlog, and that
     says nothing about whether you are reviewing what you play. ---------- */
  { id: 'review-debt', name: 'Review backlog', blurb: 'Whether you analyse the games you play', cat: 'backlog', run: function () {
    var queue = reviewQueue();
    if (queue.length < 10) return null;
    var sel = reviewSelection();
    var recent = data.games.filter(function (g) {
      return !g.tc || sel.indexOf(g.tc) !== -1;
    }).slice(0, 40);
    if (recent.length < 20) return null;
    var un = recent.filter(function (g) { return !g.analysed; }).length;
    var share = un / recent.length;
    if (share < 0.5) return null;
    var oldest = queue[queue.length - 1];
    return {
      id: 'review-debt', cat: 'backlog', severity: Math.min(58, Math.round(share * 58)),
      headline: 'You are not reviewing what you play.',
      evidence: un + ' of your last ' + recent.length + ' games have no analysis · '
        + queue.length + ' unreviewed in the window — the newest is the one you still remember',
      note: un + ' of last ' + recent.length + ' unreviewed',
      compare: queue.length + ' in the window · oldest from ' + monthYear(oldest.ts),
      peerRelative: false,
      action: { label: 'Review the newest', href: gameHref(queue[0].id, queue[0].color) }
    };
  }},

  /* Peak gap — no Lichess equivalent. --------------------------------- */
  { id: 'peak-gap', name: 'Distance from your peak', blurb: 'Current rating against your best ever', cat: 'rating', run: function () {
    if (!data.user || !data.user.perfs) return null;
    var best = null;
    eligibleFormats().forEach(function (p) {
      var perf = data.user.perfs[p];
      var peak = data.peaks && data.peaks[p];
      if (!perf || !peak || !peak.rating) return;
      var gap = peak.rating - perf.rating;
      if (gap < 40) return;
      if (!best || gap > best.gap) best = { perf: p, gap: gap, peak: peak, now: perf.rating };
    });
    if (!best) return null;
    return {
      id: 'peak-gap', cat: 'rating', severity: Math.min(40, 14 + best.gap * 0.22),
      headline: 'You are ' + best.gap + ' below your ' + perfLabel(best.perf) + ' peak.',
      evidence: 'peak ' + best.peak.rating + (best.peak.when ? ' in ' + best.peak.when : '') + ' · ' + best.now + ' now',
      note: '<span class="loss">−' + best.gap + '</span> from ' + perfLabel(best.perf) + ' peak',
      compare: 'peak ' + best.peak.rating + (best.peak.when ? ' in ' + best.peak.when : '') + ' · ' + best.now + ' now',
      peerRelative: false,
      action: { label: 'See the curve', href: perfHref(cfg.user, best.perf) }
    };
  }},


  { id: 'opening-leak', name: 'Opening leak', blurb: 'A line scoring below what players at your rating get from it', cat: 'opening', run: function () {
    var perf = mainPerf();
    if (!isEligible(perf)) return null;
    var gs = myGamesIn(perf).filter(function (g) { return g.opening; });
    if (gs.length < 40) return null;
    var rating = data.user && data.user.perfs && data.user.perfs[perf]
      ? data.user.perfs[perf].rating : null;

    /* Fallback baseline per colour, for lines the open database holds too few
       games of. White scores better than Black for everyone, so a shared
       baseline would flag a Black opening by construction. */
    var mineBy = {
      white: winRate(gs.filter(function (g) { return g.color === 'white'; })),
      black: winRate(gs.filter(function (g) { return g.color === 'black'; }))
    };

    var groups = {};
    gs.forEach(function (g) {
      var k = g.opening.split(':')[0].trim() + '|' + g.color;
      (groups[k] = groups[k] || []).push(g);
    });

    var worst = null;
    Object.keys(groups).forEach(function (k) {
      var list = groups[k];
      if (list.length < 12) return;
      var bits = k.split('|');
      var r = winRate(list);
      var peer = peerOpening(bits[0], bits[1], rating);
      var base = peer != null ? peer : mineBy[bits[1]];
      if (base == null) return;
      var deficit = base - r;
      if (!worst || deficit > worst.deficit) {
        worst = { family: bits[0], colour: bits[1], rate: r, n: list.length,
                  base: base, deficit: deficit, isPeer: peer != null };
      }
    });
    if (!worst || worst.deficit < 12) return null;

    var against = worst.isPeer
      ? pct(worst.base) + ' for players at your rating'
      : pct(worst.base) + ' across your other games as ' + worst.colour;

    return {
      id: 'opening-leak', cat: 'opening', severity: Math.min(72, Math.round(worst.deficit * 1.9)),
      headline: 'The ' + worst.family + ' is costing you as ' + worst.colour + '.',
      evidence: pct(worst.rate) + ' over ' + worst.n + ' games · ' + against,
      note: pct(worst.rate) + ' in the ' + worst.family,
      compare: worst.n + ' games as ' + worst.colour + ' · ' + against,
      peerRelative: worst.isPeer,
      custom: { type: 'opening', family: worst.family, colour: worst.colour,
                label: worst.family + ' as ' + worst.colour,
                why: 'Your mistakes from ' + worst.family + ' games as ' + worst.colour + '.' },
      action: { label: 'Train your ' + worst.family + ' mistakes', href: null },
      second: { label: 'Study the ' + worst.family, href: openingHref(worst.family) }
    };
  }},

  { id: 'disconnects', name: 'Disconnects', blurb: 'Games lost to the connection rather than the board', cat: 'connection', run: function () {
    var best = null;
    eligibleFormats().forEach(function (p) {
      var st = data.pstat && data.pstat[p];
      if (!st || !st.disconnects || !st.all) return;
      var share = (st.disconnects / st.all) * 100;
      if (st.disconnects < 15 || share < 1.5) return;
      if (!best || share > best.share) best = { perf: p, share: share, n: st.disconnects, all: st.all };
    });
    if (!best) return null;
    return {
      id: 'disconnects', cat: 'connection', severity: Math.min(55, Math.round(30 + best.share * 8)),
      headline: 'You are losing games to your connection.',
      evidence: best.n + ' of your ' + best.all + ' ' + perfLabel(best.perf)
        + ' games ended in a disconnect · ' + pct(best.share) + ' of them',
      note: '<span class="loss">' + best.n + '</span> games lost to disconnects',
      compare: pct(best.share) + ' of your ' + perfLabel(best.perf) + ' games',
      peerRelative: false,
      action: { label: 'Your ' + perfLabel(best.perf) + ' record', href: perfHref(cfg.user, best.perf) }
    };
  }},

  /* Blunders vs the clock — we hold the seconds-in-hand at every mistake.
     Separates "loses to the clock" from "loses with the clock in hand",
     which prescribe opposite training. --------------------------------- */
  { id: 'blunder-clock', name: 'Blunders vs the clock', blurb: 'Were your mistakes rushed, or unhurried?', cat: 'habits', run: function () {
    var hi = 0, lo = 0, n = 0;
    data.games.forEach(function (g) {
      if (!g.bl || !isEligible(g.perf)) return;
      g.bl.forEach(function (b) {
        var band = blunderClockBand({ g: g, b: b });
        if (!band) return;
        n++;
        if (band === 'high') hi++;
        else if (band === 'low') lo++;
      });
    });
    if (n < 20) return null;
    var hiP = Math.round(hi * 100 / n), loP = Math.round(lo * 100 / n);
    if (hiP >= 55) {
      return {
        id: 'blunder-clock', cat: 'habits', severity: Math.min(72, 40 + hiP - 55),
        headline: 'Your blunders are not the clock\'s fault.',
        evidence: hiP + '% of your ' + n + ' measured blunders came with a third or more '
          + 'of your clock still in hand — attention, not time pressure',
        note: '<span class="loss">' + hiP + '%</span> unhurried blunders',
        compare: loP + '% happened in real time trouble',
        peerRelative: false,
        custom: { type: 'clock', mode: 'high', label: 'Unhurried blunders',
                  why: 'The mistakes you had time to avoid — a blunder-check habit, drilled.' }
      };
    }
    if (loP >= 50) {
      return {
        id: 'blunder-clock', cat: 'habits', severity: Math.min(70, 40 + loP - 50),
        headline: 'Time trouble is where your games bleed.',
        evidence: loP + '% of your ' + n + ' measured blunders came with under 15% of '
          + 'your clock left — the chess is fine until the clock is not',
        note: '<span class="loss">' + loP + '%</span> time-trouble blunders',
        compare: hiP + '% happened with time in hand',
        peerRelative: false,
        custom: { type: 'clock', mode: 'low', label: 'Time-trouble blunders',
                  why: 'The positions the clock took from you — see them again with time to think.' }
      };
    }
    return null;
  }},

  /* A worsening month is a finding; an improving one is praise and lives in
     the read. ---------------------------------------------------------- */
  { id: 'trend-up', name: 'Blunder rate rising', blurb: 'This month vs last, across every analysed game', cat: 'habits', run: function () {
    var tr = blunderTrend(mainPerf());
    if (!tr || tr.delta > -12) return null;
    return {
      id: 'trend-up', cat: 'habits', severity: Math.min(74, 46 + Math.round(-tr.delta / 2)),
      headline: 'You are blundering more than a month ago.',
      evidence: tr.now.toFixed(1) + ' blunders per 100 moves over your last ' + tr.nNow
        + ' covered games · ' + tr.prev.toFixed(1) + ' the month before',
      note: '<span class="loss">' + tr.now.toFixed(1) + '</span> per 100 moves, rising',
      compare: 'a month ago: ' + tr.prev.toFixed(1),
      peerRelative: false,
      custom: { type: 'window', days: 30, label: 'This month\'s new mistakes',
                why: 'The month the rate rose — its mistakes, retried until they stop.' }
    };
  }},

  /* Session fatigue — only computable because we hold the timestamps. No
     Lichess screen shows this. ------------------------------------------ */
  { id: 'session-fatigue', name: 'Session length', blurb: 'How you score deep into a sitting', cat: 'stamina', run: function () {
    var gs = data.games;
    if (gs.length < 120) return null;
    var gap = 40 * 60 * 1000;
    var early = [], late = [], idx = 0;
    /* Games arrive newest first, so walk backwards to number each session. */
    for (var i = gs.length - 1; i >= 0; i--) {
      var prev = gs[i + 1];
      idx = (prev && prev.ts && idleGap(gs[i], prev) < gap) ? idx + 1 : 1;
      if (gs[i].res === 'draw') continue;
      (idx <= 3 ? early : late).push(gs[i]);
    }
    if (early.length < 40 || late.length < 40) return null;
    var e = winRate(early), l = winRate(late);
    if (e - l < 7) return null;
    return {
      id: 'session-fatigue', cat: 'stamina', severity: Math.min(76, Math.round(40 + (e - l) * 2.6)),
      headline: 'Your fourth game is where it goes wrong.',
      evidence: pct(e) + ' in the first three games of a session · ' + pct(l) + ' from the fourth on'
        + ' · ' + (early.length + late.length) + ' decisive games',
      note: '<span class="loss">' + pct(l) + '</span> after 3 games',
      compare: pct(e) + ' in the first three · ' + late.length + ' later games',
      peerRelative: false,
      action: { label: 'Watch TV instead', href: L + '/tv' }
    };
  }},

  /* Time of day — every game carries a timestamp, and the browser knows the
     player's own timezone, so this needs no extra data at all. Nothing on
     Lichess shows it. ---------------------------------------------------- */
  { id: 'late-night', name: 'Late nights', blurb: 'How you score in the small hours', cat: 'hours', run: function () {
    var gs = data.games.filter(function (g) {
      return g.res !== 'draw' && isEligible(g.perf);
    });
    if (gs.length < 150) return null;
    /* Chess "night" is the small hours, which belong to the previous day. */
    var late = [], normal = [];
    gs.forEach(function (g) {
      var h = new Date(g.ts).getHours();
      (h >= 0 && h < 6 ? late : normal).push(g);
    });
    if (late.length < 40 || normal.length < 60) return null;
    var l = winRate(late), n = winRate(normal);
    if (n - l < 7) return null;
    return {
      id: 'late-night', cat: 'hours', severity: Math.min(80, Math.round(45 + (n - l) * 2.2)),
      headline: 'You should not play after midnight.',
      evidence: pct(l) + ' between midnight and 6am against ' + pct(n) + ' the rest of the day'
        + ' · ' + late.length + ' late games',
      note: '<span class="loss">' + pct(l) + '</span> after midnight',
      compare: pct(n) + ' the rest of the day · ' + late.length + ' late games',
      peerRelative: false,
      action: { label: 'Puzzles instead', href: L + '/training' }
    };
  }},

  /* Nemesis — computed from the window we already hold. -------------------- */
  { id: 'nemesis', name: 'Nemesis', blurb: 'An opponent you keep losing to', cat: 'opponent', run: function () {
    var by = {};
    data.games.forEach(function (g) {
      if (!g.opp || g.res === 'draw') return;
      var k = g.opp;
      var r = by[k] = by[k] || { w: 0, l: 0, name: g.opp };
      if (g.res === 'win') r.w++; else r.l++;
    });
    var worst = null;
    Object.keys(by).forEach(function (k) {
      var r = by[k];
      var n = r.w + r.l;
      if (n < 6 || r.l - r.w < 4) return;
      if (!worst || (r.l - r.w) > (worst.l - worst.w)) worst = r;
    });
    if (!worst) return null;
    return {
      id: 'nemesis', cat: 'opponent', severity: Math.min(50, 20 + (worst.l - worst.w) * 4),
      headline: worst.name + ' has your number.',
      evidence: 'you are ' + worst.w + '–' + worst.l + ' against them in this window',
      note: '<span class="loss">' + worst.w + '–' + worst.l + '</span> against ' + esc(worst.name),
      compare: (worst.w + worst.l) + ' decisive games in the window',
      peerRelative: false,
      custom: { type: 'opp', name: worst.name,
                label: 'vs ' + worst.name,
                why: 'Your mistakes from games against ' + worst.name + '.' },
      action: { label: 'Train the ' + worst.name + ' games', href: null }
    };
  }},

  /* Tournament versus casual — the export carries a source on every game. --- */
  { id: 'source-split', name: 'Tournaments', blurb: 'Tournament results against ordinary pairing', cat: 'arena', run: function () {
    var tour = [], casual = [];
    data.games.forEach(function (g) {
      if (g.res === 'draw' || !isEligible(g.perf)) return;
      if (g.src === 'arena' || g.src === 'swiss' || g.src === 'tournament') tour.push(g);
      else if (g.src === 'pool' || g.src === 'lobby') casual.push(g);
    });
    if (tour.length < 40 || casual.length < 60) return null;
    var t = winRate(tour), c = winRate(casual);
    if (c - t < 8) return null;
    return {
      id: 'source-split', cat: 'arena', severity: Math.min(56, Math.round((c - t) * 2.6)),
      headline: 'Tournaments are going worse than your normal games.',
      evidence: pct(t) + ' across ' + tour.length + ' tournament games · ' + pct(c) + ' in ordinary pairing',
      note: '<span class="loss">' + pct(t) + '</span> in tournaments',
      compare: pct(c) + ' in ordinary pairing · ' + tour.length + ' tournament games',
      peerRelative: false,
      action: { label: 'Your tournaments', href: L + '/@/' + encodeURIComponent(cfg.user) + '/tournaments' }
    };
  }},

];

var detectorCache = null;
function runDetectors() {
  var token = censusToken() + '|' + JSON.stringify(cfg.findingsOff);
  if (detectorCache && detectorCache.token === token) return detectorCache.out;
  var out = [];
  detectors.forEach(function (d) {
    if (cfg.findingsOff[d.id]) return;
    var f = null;
    try { f = d.run(); } catch (e) { f = null; }
    if (f) out.push(f);
  });
  out.sort(function (a, b) { return b.severity - a.severity; });
  detectorCache = { token: token, out: out };
  return out;
}

function reviewSelection() { return cfg.reviewTcs && cfg.reviewTcs.length ? cfg.reviewTcs : cfg.tcs; }
function windowStart() {
  var oldest = data.games.length ? data.games[data.games.length - 1].ts : null;
  return oldest ? iso(new Date(oldest)) : null;
}
function fromDate() {
  if (cfg.fromDate) return cfg.fromDate;
  /* The default is the start of the loaded window, not the account's signup:
     the queue cannot count games that were never fetched. */
  return windowStart() || iso(new Date(Date.now() - 90 * 864e5));
}
function reviewQueue() {
  var sel = reviewSelection();
  var since = new Date(fromDate() + 'T00:00:00').getTime();
  return data.games.filter(function (g) {
    return !g.analysed && g.ts >= since && (!g.tc || sel.indexOf(g.tc) !== -1);
  });
}

/* ── 8f. The coach ───────────────────────────────────────────────────────
   The product is for the player who is stuck and annoyed — they do not want
   a dashboard, they want to be told what to do. The read is a paragraph with
   an opinion, and it ends in one directive. The data that justifies it stays
   one click deeper, in the profile rows.                                    */

/* The coach recommends; the player decides. A chosen focus persists until
   changed or until it stops being behind. Autonomy-supportive choice beats
   dictation — but the choice is structured: only skills with a real gap. */
/* "your " + phrase must never produce "your your…" or "your the…". */
function poss(phrase) {
  if (phrase.indexOf('your ') === 0) return phrase;
  if (phrase.indexOf('the ') === 0) return 'your ' + phrase.slice(4);
  /* gerunds stand alone: "converting a win is strong", never "your
     converting a win" or "your reviewing your games" */
  if (/^\w+ing\b/.test(phrase)) return phrase;
  return 'your ' + phrase;
}
function coachFocus() {
  var weak = behindSkills();
  if (!weak.length) return null;
  /* what they said they came for tie-breaks near-equal gaps */
  var style = store.get('nl:goalStyle', null);
  var bias = { openings: ['opening','white','black'],
               blunders: ['accuracy','middlegame','conversion'] }[style];
  if (bias && weak.length > 1) {
    var pref = null;
    weak.forEach(function (r) {
      if (!pref && bias.indexOf(r.key) !== -1 && r.rel <= weak[0].rel + 0.35) pref = r;
    });
    if (pref) weak = [pref].concat(weak.filter(function (r) { return r !== pref; }));
  }
  var pick = store.get('nl:focus', null);
  if (pick) {
    var found = null;
    weak.forEach(function (r) { if (r.key === pick) found = r; });
    if (found) return found;
  }
  return weak[0];
}

/* ── The goal: specific, dated, checkable ── */
function currentGoal() {
  var focus = coachFocus();
  if (!focus || focus.peer == null) return null;
  var gk = 'nl:goal:' + mainPerf();
  var g = store.get(gk, null);
  if (!g || g.skill !== focus.key) {
    g = { skill: focus.key, start: Date.now(), from: Math.round(focus.mine * 10) / 10,
          target: Math.round(focus.peer * 10) / 10 };
    store.set(gk, g);
  }
  return g;
}
function goalProgress(goal, focus) {
  /* measured only on games since the goal was set — the number that can move */
  var perf = mainPerf();
  var since = data.games.filter(function (gm) {
    return gm.perf === perf && gm.ts >= goal.start;
  });
  if (focus.key === 'white' || focus.key === 'black') {
    var mine = since.filter(function (gm) { return gm.color === focus.key; });
    if (mine.length < 5) return { n: mine.length, val: null };
    return { n: mine.length, val: winRate(mine) };
  }
  return { n: since.length, val: null };
}

/* Blunders per 100 of the player's own moves, across every game that has
   analysis material — the unbiased number the analysed-only stats can't be. */
function blunderRateOf(gs) {
  var moves = 0, bls = 0;
  gs.forEach(function (g) {
    moves += Math.floor(g.plies / 2);
    if (g.bl) bls += g.bl.length;
  });
  return moves >= 300 ? { rate: bls * 100 / moves, moves: moves } : null;
}
function blunderTrend(perf) {
  var now = Date.now(), M = 30 * 864e5;
  var cur = [], prev = [];
  data.games.forEach(function (g) {
    if (g.perf !== perf || !(g.analysed || g.scanned)) return;
    var age = now - g.ts;
    if (age < M) cur.push(g);
    else if (age < 2 * M) prev.push(g);
  });
  if (cur.length < 25 || prev.length < 25) return null;
  var a = blunderRateOf(cur), b = blunderRateOf(prev);
  if (!a || !b || !b.rate) return null;
  return { now: a.rate, prev: b.rate,
           delta: (b.rate - a.rate) * 100 / b.rate,
           nNow: cur.length, nPrev: prev.length };
}

function coachRead() {
  var prof = skillProfile();
  if (!prof.rows.length) return null;
  var perfName = perfLabel(prof.perf);
  var scored = rankedSkills();
  var strong = scored.filter(function (r) { return r.rel != null && r.rel >= 1 && !r.contextual; });
  var focus = coachFocus();
  var bits = [];

  /* 0. Trajectory — the one number that moves week to week. Spoken only
     when it has actually moved. */
  var tr = blunderTrend(prof.perf);
  if (tr && Math.abs(tr.delta) >= 12) {
    bits.push(tr.delta > 0
      ? 'First, the number that matters most is moving: ' + tr.now.toFixed(1)
        + ' blunders per 100 moves this month, down from ' + tr.prev.toFixed(1)
        + ' — a ' + Math.round(tr.delta) + '% drop. Whatever you are doing, keep doing it.'
      : 'The number to watch: your blunder rate is up this month — ' + tr.now.toFixed(1)
        + ' per 100 moves against ' + tr.prev.toFixed(1) + ' last month.');
  }

  /* 1. What is genuinely good — said first, because it is true and because a
     player who only hears criticism stops listening. */
  if (strong.length >= 2) {
    var names = strong.slice(-2).map(function (r) { return r.phrase; });
    /* poss() applied at join */
    bits.push('For a ' + prof.rating + '-rated ' + perfName + ' player, '
      + names.map(poss).join(' and ') + (strong.length > 2 ? ', among others,' : '')
      + ' are genuinely strong.');
  } else if (strong.length === 1) {
    bits.push(poss(strong[0].phrase).charAt(0).toUpperCase()
      + poss(strong[0].phrase).slice(1) + ' is genuinely strong for '
      + prof.rating + '-rated ' + perfName + '.');
  } else if (prof.hasPeers) {
    bits.push('You sit level with ' + prof.rating + '-rated ' + perfName
      + ' players on most of what I can measure.');
  }

  /* 2. The diagnosis. One thing, not a list. */
  if (focus) {
    bits.push('What is holding you back is ' + focus.phrase + ': '
      + fmtSkill(focus) + ' against the ' + fmtPeer(focus) + ' your peers manage.');
    var pay = ratingPayoff(focus);
    if (pay) bits.push('Closing that gap alone is worth roughly ' + pay + ' rating points.');
  }

  /* 2b. Opposition as context: a large gap changes how every win rate reads. */
  var oppRow = null;
  scored.forEach(function (r) { if (r.key === 'opposition') oppRow = r; });
  if (oppRow && Math.abs(oppRow.mine) >= 60) {
    bits.push(oppRow.mine > 0
      ? 'You play up ' + Math.round(oppRow.mine) + ' points on average, so raw win rates '
        + 'run low here — the verdicts already account for that.'
      : 'You play down ' + Math.abs(Math.round(oppRow.mine)) + ' points on average — '
        + 'wins come easily, and the verdicts already discount that.');
  }

  /* 2c. The shape of the mistakes, when one shape dominates. */
  var dk2 = dominantKind();
  if (dk2) {
    bits.push('Your mistakes have a shape: ' + Math.round(dk2.share * 100) + '% of your last '
      + dk2.total + ' are ' + ({ hung: 'hung pieces', tactic: 'missed tactics',
        slip: 'won games let slip', collapse: 'level positions collapsing' })[dk2.kind]
      + ', so the puzzles in your sets target exactly that.');
  }

  /* 3. A behaviour note, if one is loud. */
  var found = runDetectors();
  if (found.length && found[0].severity >= 55) {
    bits.push(found[0].coach || found[0].headline);
  }

  /* 4. The directive. */
  var directive = focus
    ? 'The focus is ' + focus.phrase + '. The session below is built around it.'
    : 'Nothing is broken, so the job is volume: play, review, and keep the streak.';

  return { text: bits.join(' '), directive: directive, focus: focus };
}

/* A dose turns advice into an assignment: not "study endgames" but "ten
   endgame puzzles a day, this week". */
var DOSES = {

  clockuse: 'One rule when losing: stop, breathe, spend thirty seconds before you move.',
  clock: 'Play only increment time controls this week.',
  accuracy: 'Analyse every game you play this week, the same day you play it.',
  opening: 'Ten minutes on your worst line each day, then play it that evening.',
  middlegame: 'Ten middlegame puzzles a day this week.',
  endgame: 'Ten endgame puzzles a day this week.',
  conversion: 'Ten winning-position puzzles a day until converting feels boring.',
  resource: 'Ten defensive puzzles a day. A worse position is a task, not a verdict.',
  white: 'One White opening, every game, for two weeks.',
  black: 'One reply to 1.e4 and one to 1.d4, every game, for two weeks.',

function fmtUnit(r) { return r.unit === '' ? '' : r.unit.trim() === 'acpl' ? ' acpl' : r.unit; }

/* A control the eye reads as a control: labeled, bordered, the active

function renderCoach() {

        + m.custom + '">' + esc(m.label) + '</a>';

      + '<span class="move-text">' + esc(m.text) + '</span>' + btn + '</div>';

  /* The story: where the rating has been, where the goal points. */
  var story = '';
  var perf0 = mainPerf();
  var series = data.series && data.series[perf0];
  if (series && series.points.length >= 2) {

    var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts);

        + (deltaBadge(prof.perf) ? ' · past month' + deltaBadge(prof.perf) : '')
        + (masteredCount() ? ' · ' + masteredCount() + ' mistakes trained' : '')

  var coachable = coachableFormats();

  if (coachable.length > 1) {

        ? data.user.perfs[pf].rating : null;

/* ── 8e. The trainer ─────────────────────────────────────────────────────
   Positions from your own games, retried on a board that lives on the page.
   The answer key is Lichess's own analysis: `best` and `variation` arrive
   with the export, so grading needs no engine and no server. Results feed a
   small spaced-repetition ladder — a failed position returns tomorrow, a
   solved one in 3, then 7, then 21, then 60 days.                          */

var SRS_DAYS = [1, 3, 7, 21, 60];
function srsKey() { return 'nl:srs:' + String(cfg.user).toLowerCase(); }
function srsLoad() { return store.get(srsKey(), {}); }
function srsSave(m) { store.set(srsKey(), m); }
function dayKey() {
  var d = new Date();
  return 'nl:day:' + String(cfg.user).toLowerCase() + ':'
    + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function dayLoad() { return store.get(dayKey(), { trained: 0, first: 0 }); }

function trainable(it) { return !!(it.b.bs && it.g.mv); }

/* Due first (oldest due leading), then unseen — newest games, biggest
   swings. The session is finite on purpose. */
function drillQueue() {
  var srs = srsLoad(), now = Date.now();
  var due = [], fresh = [];
  allBlunders().forEach(function (it) {
    if (!trainable(it)) return;
    var rec = srs[it.g.id + ':' + it.b.p];
    if (rec) {
      if (rec.due == null || rec.due <= now) due.push({ it: it, rec: rec });
    } else fresh.push(it);
  });
  due.sort(function (a, b) { return a.rec.due - b.rec.due; });
  fresh.sort(function (a, b) {
    return (b.g.ts - a.g.ts) || ((b.b.wb - b.b.wa) - (a.b.wb - a.b.wa));
  });
  return due.map(function (d) { return d.it; }).concat(fresh.slice(0, 12));
}
function dueCount() {
  var srs = srsLoad(), now = Date.now(), n = 0;
  allBlunders().forEach(function (it) {
    if (!trainable(it)) return;
    var rec = srs[it.g.id + ':' + it.b.p];
    if (rec && (rec.due == null || rec.due <= now)) n++;
  });
  return n;
}

/* the run breaks the moment a wrong attempt lands — written immediately so
   the meter can show it shattering, before the item even resolves */
function srsBreakRun(it) { return srsBreakRunKey(it.g.id + ':' + it.b.p); }
function srsBreakRunKey(key) {
  var srs = srsLoad();
  var rec = srs[key] || { box: 0, streak: 0, clean: true };
  /* an abandoned card must come straight back — a record with no due date
     falls out of every queue forever */
  if (rec.due == null) rec.due = Date.now();
  var had = rec.streak || 0;
  rec.streak = 0;
  rec.clean = false;
  rec.mastered = false;
  srs[key] = rec;
  srsSave(srs);
  return had;
}

function srsRecord(it, result) { return srsRecordKey(it.g.id + ':' + it.b.p, result); }
function srsRecordKey(key, result) {
  var srs = srsLoad();
  var rec = srs[key] || { box: 0, streak: 0, clean: true };
  if (result === 'fail') { rec.streak = 0; rec.clean = false; rec.box = 0; }
  else if (result === 'retry') {
    /* got there after a miss: the run breaks, but the schedule keeps the
       savings — relearning is faster than learning (Ebbinghaus), so the
       interval drops two boxes rather than resetting to a day */
    rec.streak = 0;
    rec.clean = false;
    rec.box = Math.max(0, rec.box - 2);
  } else {
    rec.streak = (rec.streak || 0) + 1;
    rec.box = Math.min(rec.box + 1, SRS_DAYS.length - 1);
  }
  /* Trained = three clean spaced retrievals (Rawson & Dunlosky's successive-
     relearning criterion). It then rests ~6 weeks (45d) — hard-way trained
     rests 3 (21d) and gets the spot-check — because durable retention needs
     the occasional touch, not a burial. */
  rec.mastered = rec.streak >= 3;
  rec.due = rec.mastered
    ? Date.now() + (rec.clean ? 45 : 21) * 864e5
    : Date.now() + SRS_DAYS[rec.box] * 864e5;
  rec.last = Date.now();
  srs[key] = rec;
  srsSave(srs);
  var day = dayLoad();
  day.trained++;
  if (result === 'first') day.first++;
  store.set(dayKey(), day);
  return rec;
}
function srsRec(it) { return srsLoad()[it.g.id + ':' + it.b.p] || null; }
function masteredCount() {
  var srs = srsLoad(), n = 0;
  Object.keys(srs).forEach(function (k) { if (srs[k].mastered) n++; });
  return n;
}

/* ── 8g. The repertoire ──────────────────────────────────────────────────
   Mined from the user's own games, never authored on a blank page: every
   position they actually reach gets a keeper move — their habitual choice
   when the book approves of it, the band's better move when it does not.
   Drills replay the line with the opponent answering from the real reply
   distribution at the user's rating. Chessable trains you against a course;
   this trains you against the people you will actually sit across.        */

var REP_DEPTH = 16;      /* plies mined from each game */
var REP_MIN_N = 4;       /* a position this rare is not repertoire yet */
var REP_KEEP_GAP = 2.0;  /* my move within this many score points of best = keep */
var OPEN_PER_SET = 3;    /* opening cards folded into a daily set */

function bandFor(rating) {
  if (rating == null) return '1400';
  if (rating < 1200) return '1000';
  if (rating < 1600) return '1400';
  if (rating < 2000) return '1800';
  return '2200';
}
function myBand() {
  var perf = mainPerf();
  var r = data.user && data.user.perfs && data.user.perfs[perf]
    ? data.user.perfs[perf].rating : null;
  return bandFor(bandEquivRating(perf, r));
}
function posKey(st) {
  var f = stateFen(st).split(' ');
  return f[0] + ' ' + f[1];
}
function sanClean(san) { return String(san).replace(/[+#?!]+$/, ''); }

/* the blob is prefix-keyed; FEN-keyed maps are built once per band and
   merge transpositions as a side effect of the keying */
var bookMaps = {};
function bookMap(band) {
  if (bookMaps[band]) return bookMaps[band];
  var map = {};
  var bands = BOOK.bands || {};
  var src = bands[band] || {};
  Object.keys(src).forEach(function (pfx) {
    var st = chessStart();
    var ok = true;

  out.black.sort(function (a, b) { return b.n - a.n || a.ply - b.ply; });
  out.white = out.white.slice(0, 80);

  /* coverage: of the replies the band actually plays after my keeper, how
     much volume lands in a position my tree also has an answer for */
  var have = {};
  out.white.concat(out.black).forEach(function (nd) { have[nd.key] = 1; });
  out.white.concat(out.black).forEach(function (nd) {
    var after = cloneState(nd.st);
    if (!sanApply(after, nd.keeper)) return;
    var replies = bookAt(after, band);
    if (!replies || nd.ply >= REP_DEPTH - 2) return;
    var vol = 0, cov = 0;

function repFamilies(colour) {

    var g = groups[nd.fam] = groups[nd.fam] || { fam: nd.fam, nodes: [], n: 0 };
    g.nodes.push(nd);

    g.n = Math.max(g.n, nd.n);

    g.fixes = g.nodes.filter(function (nd) { return nd.status === 'fix'; }).length;
    var covs = g.nodes.filter(function (nd) { return nd.coverage != null; });
    g.coverage = covs.length
      ? covs.reduce(function (a, nd) { return a + nd.coverage; }, 0) / covs.length : null;
    var withGames = colourFamilies(colour).filter(function (cf) { return cf.family === f; })[0];
    g.games = withGames ? withGames.n : null;

/* ── Lines, not positions ────────────────────────────────────────────────
   The drilled unit is a LINE: a walk through the tree following keeper
   moves, branching where the band's replies branch. A line is what a player
   experiences as "an opening" — eight isolated positions that all answer
   Nf3 are one boring fact; the line they belong to is a story.

   Lines the user already plays by habit are born ready to drill. Lines
   holding a 'fix' (a keeper they have never played) must be LEARNED first:
   the learn pass shows each move before asking for it — instruction before
   retrieval, per the charter — then the same line is tested from memory in
   the same session, and only then does the SRS ladder take over.          */

var LINE_MAX_DECISIONS = 7;

function learnStore() { return store.get('nl:oplearn:' + String(cfg.user).toLowerCase(), {}); }
function markLearned(line) {

}

var lineCache = null;
function repLines() {
  var rp = repertoire();
  var token = rp.token;
  if (lineCache && lineCache.token === token) return lineCache;
  var out = { white: [], black: [] };
  ['white', 'black'].forEach(function (colour) {
    var pool = rp[colour];
    var byKey = {};
    pool.forEach(function (nd) { byKey[nd.key] = nd; });
    /* roots: nodes no other node reaches within this tree */
    var reached = {};
    pool.forEach(function (nd) {
      if (!nd.keeper) return;
      var st = cloneState(nd.st);
      if (!sanApply(st, nd.keeper)) return;
      (bookAt(st) || []).forEach(function (r) {
        if (r.share < 0.05) return;
        var p2 = cloneState(st);
        if (!sanApply(p2, r.san)) return;
        var child = byKey[posKey(p2)];
        if (child) reached[child.key] = 1;
      });
    });
    var roots = pool.filter(function (nd) { return nd.keeper && !reached[nd.key]; });
    roots.sort(function (a, b) { return a.ply - b.ply || b.n - a.n; });

    var lines = [];
    function walk(nd, decisions, seen) {
      if (lines.length >= LINE_CAP_PER_COLOUR * 2) return;
      var st = cloneState(nd.st);
      if (!sanApply(st, nd.keeper)) return;
      var branches = [];
      (bookAt(st) || []).forEach(function (r) {
        if (r.share < 0.05) return;
        var p2 = cloneState(st);
        if (!sanApply(p2, r.san)) return;
        var child = byKey[posKey(p2)];
        if (child && child.keeper && !seen[child.key]) branches.push({ r: r, child: child });
      });
      branches.sort(function (a, b) { return b.r.n - a.r.n; });
      branches = branches.slice(0, LINE_BRANCH_PER_NODE);
      if (!branches.length || decisions.length + 1 >= LINE_MAX_DECISIONS) {
        var ds = decisions.concat([{ nd: nd, reply: null }]);
        if (ds.length >= 2) lines.push(ds);

      branches.forEach(function (b) {
        var s2 = {}; Object.keys(seen).forEach(function (k) { s2[k] = 1; });
        s2[b.child.key] = 1;

      var first = ds[0].nd;
      var sans = ds.map(function (d) { return d.nd.keeper + (d.reply ? ' ' + d.reply.san : ''); }).join(' ');
      var key = colour + '|' + (first.path || 'start') + '|' + sans;
      var hasFix = ds.some(function (d) { return d.nd.status === 'fix'; });
      var fam = null, fc = {};
      ds.forEach(function (d) { fc[d.nd.fam] = (fc[d.nd.fam] || 0) + 1; });

}

/* ── Adopting a NEW opening ──────────────────────────────────────────────
   Not from your games — from the band book: pick a first move (or a reply),
   and the lines generate themselves by following the best-scoring popular
   move for your side and the most common answers for theirs. Every adopted
   line is born unlearned, so it flows through Learn before it ever tests.  */

var ADOPT_NAMES = {
  'e4': "1.e4 — King's Pawn", 'd4': "1.d4 — Queen's Pawn",

  'e4 c5': 'Sicilian Defence', 'e4 e5': '1...e5 Classical',
  'e4 e6': 'French Defence', 'e4 c6': 'Caro-Kann',
  'e4 d5': 'Scandinavian', 'e4 d6': 'Pirc Defence',
  'd4 Nf6': 'Indian Defences', 'd4 d5': "Queen's Gambit lines",
  'd4 e6': '1...e6 vs d4', 'd4 g6': 'Modern vs d4', 'd4 f5': 'Dutch Defence'

function adoptedList() { return store.get('nl:adopted:' + String(cfg.user).toLowerCase(), []); }

  store.set('nl:adopted:' + String(cfg.user).toLowerCase(), list);
  repCache = null; lineCache = null;
}
function adoptLabel(seed) { return ADOPT_NAMES[seed.join(' ')] || seed.join(' '); }

function genAdoptedLines(spec) {
  var band = myBand();
  var lines = [];
  var meWhite = spec.colour === 'white';
  function myPick(st) {
    var book = bookAt(st, band);
    if (!book) return null;
    var best = null;
    book.forEach(function (r) {

      if (!best || myScoreOf(r, spec.colour) > myScoreOf(best, spec.colour)) best = r;
    });
    return best;

      var replies = (bookAt(st, band) || []).filter(function (r) { return r.share >= 0.08; }).slice(0, 2);
      if (!replies.length) { finalize(decisions); return; }
      replies.forEach(function (r) {

    var after = cloneState(st);
    if (!sanApply(after, pick.san)) { finalize(decisions); return; }

                 mineBook: pick, ply: ply, n: 0, path: path };

    var rec = srs['l|' + key] || null;

/* the menu: what the band actually faces, scored for your side */
function adoptChoices(colour) {
  var band = myBand();
  var out = [];
  function offer(seed) {
    var st = chessStart();
    for (var i = 0; i < seed.length - 1; i++) if (!sanApply(st, seed[i])) return;
    var book = bookAt(st, band);
    if (!book) return;
    var last = seed[seed.length - 1];
    var entry = null;
    book.forEach(function (r) { if (r.san === last) entry = r; });
    if (!entry || entry.share < 0.04) return;
    out.push({ seed: seed, label: adoptLabel(seed),
               share: entry.share, score: colour === 'white' ? entry.score : 100 - entry.score });
  }
  if (colour === 'white') {
    ['e4', 'd4', 'c4', 'Nf3'].forEach(function (m) { offer([m]); });
  } else {
    ['c5', 'e5', 'e6', 'c6', 'd5'].forEach(function (m) { offer(['e4', m]); });
    ['Nf6', 'd5', 'e6', 'g6', 'f5'].forEach(function (m) { offer(['d4', m]); });

}

  var all = pre.map(esc).concat(toks);

  for (var i = 0; i < all.length; i += 2) {

  }

}

/* a recent game that left a keeper line marks that LINE due */
function repDeviations() {
  var rp = repertoire();
  var byKey = {};
  rp.white.concat(rp.black).forEach(function (nd) { byKey[nd.key] = nd; });
  var cut = Date.now() - 14 * 864e5;
  var out = [], seen = {};
  data.games.forEach(function (g) {
    if (!g.op16 || g.ts < cut || !isEligible(g.perf)) return;
    var toks = g.op16.split(' ');
    var meWhite = g.color === 'white';
    var st = chessStart();
    for (var i = 0; i < toks.length; i++) {
      if (st.w === meWhite) {
        var nd = byKey[posKey(st)];
        if (nd && nd.keeper && sanClean(toks[i]) !== nd.keeper && nd.status !== 'solo') {
          var okAlt = false;
          if (nd.book) {

              && myScoreOf(kr, nd.colour) - myScoreOf(pr, nd.colour) <= REP_KEEP_GAP);
          }

  var all = repLines()[nd.colour];
  for (var i = 0; i < all.length; i++) {
    var l = all[i];
    for (var j = 0; j < l.decisions.length; j++) {
      if (l.decisions[j].nd.key === nd.key) return l;
    }
  }
  return null;

/* the daily set folds in DRILLS only — lessons are a chosen activity, not

function openingItems(maxN) {
  try {
    var out = [], seen = {};
    repDeviations().forEach(function (d) {
      var l = lineForNode(d.nd);
      if (l && l.status !== 'new' && !seen[l.key] && out.length < maxN) {
        seen[l.key] = 1;
        out.push({ kind: 'opening', line: l, dev: d });
      }
    });
    var all = repLines();
    var due = all.white.concat(all.black).filter(function (l) { return l.status === 'due'; });
    due.forEach(function (l) {
      if (out.length < maxN && !seen[l.key]) { seen[l.key] = 1; out.push({ kind: 'opening', line: l }); }
    });
    var ready = all.white.concat(all.black).filter(function (l) { return l.status === 'ready'; });
    ready.sort(function (a, b) { return b.n - a.n; });
    ready.slice(0, 1).forEach(function (l) {
      if (out.length < maxN && !seen[l.key]) { seen[l.key] = 1; out.push({ kind: 'opening', line: l, fresh: true }); }
    });
    return out;
  } catch (e) { return []; }
}

/* mode: 'learn' teaches new lines (each lesson immediately re-tested from
