/* Arena: joinable-now (started within 15 minutes) first, then the next
   starts, soonest first. Swiss: upcoming only — a Swiss you did not join
   before the clock is a Swiss you missed. Both filtered to my TCs. */
function splitTours() {
  var mine = {};
  cfg.tcs.forEach(function (tc) { mine[tc] = 1; });
  var now = Date.now();
  var raw = (data.toursRaw || []).filter(function (t) { return t && t.at != null && mine[t.tc]; });
  function take(kind, includeLive) {
    var seen = {};
    return raw.filter(function (t) {
      if (t.kind !== kind) return false;
      if (t.at > now) return true;
      return includeLive && now - t.at <= 15 * 60 * 1000;
    }).sort(function (a, b) { return a.at - b.at; })
      .filter(function (t) {
        /* one entry per (tc, hour-slot): hourly arenas repeat, and a list of
           five identical Blitz Arenas teaches nothing */
        var key = t.tc + '|' + t.name;
        if (seen[key]) return false;
        seen[key] = 1;
        return true;
      }).slice(0, 5);
  }
  return { arena: take('Arena', true), swiss: take('Swiss', false) };
}

function refreshTours() {
  if (isCC()) { data.sections.tours = 'ok'; data.toursRaw = []; renderArena(); return Promise.resolve(); }
  var myGen = gen;
  /* schedules are written far in advance — a stored feed inside its six-hour
     window is the answer, not a request */
  var kept = store.get('nl:cache:tours', null);
  if (kept && kept.at && Date.now() - kept.at < TOURS_TTL && kept.v && kept.v.length) {
    data.toursRaw = kept.v;
    data.toursAt = kept.at;
    data.sections.tours = 'ok';
    renderArena();
    return Promise.resolve();
  }
  data.sections.tours = 'loading';
  renderArena();
  var out = [];
  var anyOk = false;

  return getJSON('/api/tournament', { quiet: true }).then(function (r) {
    (r.started || []).forEach(function (t) { out.push(shapeTour(t, true)); });
    (r.created || []).forEach(function (t) { out.push(shapeTour(t, false)); });
    anyOk = true;
  }).catch(function () {})
  /* Swiss has no global feed. The official lichess-swiss team hosts the ones
     open to everyone, and that team endpoint needs no token.

     The feed is ordered by start time DESCENDING, so the events starting soon
     sit at the END of the list — a small max returns only the ones days away.
     Fetch the running ones separately and take the whole created list, which
     is small (about 200 records, ~120KB) and sorts correctly here. */
  .then(function () {
    return getND('/api/team/lichess-swiss/swiss?status=started&max=20', function (t) {
      var sh = shapeSwiss(t);
      if (sh) out.push(sh);
    }, { quiet: true }).catch(function () {});
  })
  .then(function () {
    return getND('/api/team/lichess-swiss/swiss?status=created&max=250', function (t) {
      var sh = shapeSwiss(t);
      if (sh) out.push(sh);
    }, { quiet: true }).then(function () { anyOk = true; }).catch(function () {});
  })
  .then(function () {
    if (stale(myGen)) return;
    data.toursRaw = out;
    data.toursAt = Date.now();
    if (anyOk && out.length) store.set('nl:cache:tours', { at: Date.now(), v: out });
    data.sections.tours = anyOk ? 'ok' : 'fail';
    renderArena();
  });
}

function shapeTour(t, running) {
  if (!t || !t.clock) return null;
  if (t.variant && t.variant.key && t.variant.key !== 'standard') return null;

  /* The list endpoint sends conditions:null, but Lichess writes the rating cap
     into the name ("≤1700 Bullet Arena"), so an arena you could not enter is
     still identifiable. Drop those rather than offer a door that is shut. */
  var name = (t.fullName || t.name || '');
  var perfKey = t.perf && t.perf.key;
  var mine = data.user && data.user.perfs && perfKey && data.user.perfs[perfKey]
    ? data.user.perfs[perfKey].rating : null;
  if (mine != null) {
    var cap = name.match(/[≤<]\s*(\d{3,4})/);
    if (cap && mine > parseInt(cap[1], 10)) return null;
    var floor = name.match(/[≥>]\s*(\d{3,4})/);
    if (floor && mine < parseInt(floor[1], 10)) return null;
  }

  var secs = t.secondsToStart != null ? t.secondsToStart
    : (t.startsAt ? Math.round((t.startsAt - Date.now()) / 1000) : null);
  return {
    kind: 'Arena',
    name: name.replace(/ Arena$/, ''),
    tc: (t.clock.limit / 60) + '+' + t.clock.increment,
    at: t.startsAt || (secs != null ? Date.now() + secs * 1000 : null),
    url: L + '/tournament/' + t.id
  };
}

function shapeSwiss(t) {
  if (!t || !t.clock || !t.id) return null;
  if (t.variant && t.variant !== 'standard') return null;
  if (t.status === 'finished') return null;
  var starts = t.startsAt ? Date.parse(t.startsAt) : null;
  if (!starts) return null;
  return {
    kind: 'Swiss',
    name: t.name || 'Swiss',
    tc: (t.clock.limit / 60) + '+' + t.clock.increment,
    at: starts,
    url: L + '/swiss/' + t.id
  };
}

/* ── 16. Boot ────────────────────────────────────────────────────────── */


/* ── 15b. Narration — the first load, watched ────────────────────────────
   A first-time user should see their program being built, not a skeleton
   with spinners. Lines appear as the data lands; the page reveals when the
   profile is computable. Only runs when there is no cached history.        */

/* Lines shown while the export streams. Each one teaches the method the
   page is built on, so the wait primes the product. One read costs ~30-60
   seconds, once — afterwards the cache makes boots instant, and the copy
   says so. */
var NARR_WISDOM = [
  'This takes about half a minute, once. After today the page opens instantly.',
  'Everything here comes in sets — short, finishable rounds built from your games.',
  'Most players replay their wins. The rating lives in the losses.',
  'A mistake you retry from the exact position is worth ten you read about.',
  'Finish a set and the day is won. Finish one tomorrow and the streak begins.',
  'Your worst positions will come back just before you would forget them. That is the trick.',
  'Three spaced successes and a mistake counts as trained, for good.',
  'Missions are just sets with names: your mistakes, your openings, your gaps.',
  'One focus at a time. Players who fix one thing outpace players who browse ten.'
];
function renderObQuestions() {
  var size = store.get('nl:setSize', 14);
  el('main').innerHTML = '<div class="first first-lean">'
    + '<div class="kicker" style="margin-bottom:16px">two questions</div>'
    + '<h1 style="font-size:clamp(26px,6vw,36px)">While I read your games…</h1>'
    + '<div class="ob-q">'
      + '<div class="ob-label">What are you training?</div>'
      + '<div class="caption" style="margin-bottom:6px">One or two reads best — the coach sharpens with depth. Pick more if you truly play more.</div>'
      + '<div class="chips">'
      + ['rapid','blitz','bullet','classical'].map(function (pf) {
          var on = trackedPerfs().indexOf(pf) !== -1;
          return '<a class="chip ' + (on ? 'chip-on' : '') + '" data-act="narrPerf" data-k="' + pf + '">'
            + (on ? '✓ ' + pf : pf)
            + ' <span class="dim" style="font-size:11px">' + PERF_HINT[pf] + '</span></a>';
        }).join('')
      + '</div>'
    + '</div>'
    + '<div class="ob-q">'
      + '<div class="ob-label">How much time do you have, most days?</div>'
      + '<div class="chips">'
      + [[8,'5 minutes'],[14,'15 minutes'],[20,'Half an hour']].map(function (o) {
          var on = size === o[0];
          return '<a class="chip ' + (on ? 'chip-on' : '') + '" data-act="obSize" data-k="' + o[0] + '">'
            + (on ? '✓ ' : '') + o[1] + '</a>';
        }).join('')
      + '</div>'
      + '<div class="caption" style="margin-top:6px">Sets the size of your daily set. Changeable any time.</div>'
    + '</div>'
    + '<div style="margin-top:26px"><a class="btn-outline" data-act="obDone" style="display:inline-block">Build my program</a></div>'
    + '</div>';
}

/* The loading theater: the user's own games replay on a slow-drifting strip
   of boards while the count climbs — the wait shows the work. */
function narrBoards() {
  var src = (data.narrPreview && data.narrPreview.length >= 4)
    ? data.narrPreview
    : data.games;
  var gs = src.slice(0, 10).filter(function (g) { return g.op16; });
  if (gs.length < 4) return '';
  /* each board keeps its own live cursor: position, next token, next beat */
  data.narrLive = gs.map(function (g, i) {
    return { toks: (g.mv40 || g.op16).split(' '), st: chessStart(), ply: 0,
             flip: g.color === 'black',
             nextAt: Date.now() + Math.random() * 250 };
  });
  var cards = gs.map(function (g, i) {
    return '<div class="narr-card">'
      + boardSvg(data.narrLive[i].st, { flip: data.narrLive[i].flip })
      + '<span class="narr-card-cap">' + esc(cfg.user) + ' vs ' + esc(g.opp) + '</span></div>';
  }).join('');
  return '<div class="narr-strip"><div class="narr-track">' + cards + cards + '</div></div>';
}
function renderNarration() {
  el('main').innerHTML = '<div class="first" style="max-width:none">'
    + '<div style="max-width:720px;margin:0 auto">'
    + '<div class="kicker" style="margin-bottom:18px">building your program</div>'
    + '<h1>Reading ' + esc(cfg.user) + "'s chess.</h1>"
    + '<div id="narr" class="narr" aria-live="polite"></div>'
    + '</div>'
    + '<div id="narr-stage">' + narrBoards() + '</div>'
    + '<div style="max-width:720px;margin:0 auto">'
    + '<p id="narr-wisdom" class="narr-wisdom"></p>'
    + '</div></div>';
  /* replay anything that already streamed in while the questions were up */
  (data.narrLog || []).forEach(function (l) { narrLine(l[0], l[1]); });
  /* the strip mounts once so the drift never restarts; each board then
     plays its own game — one animated move every 0.2–0.4s, on its own
     clock, so the wall is alive without marching in lockstep */
  var stageTimer = setInterval(function () {
    if (!data.narrate || !el('narr-stage')) { clearInterval(stageTimer); return; }
    var stage = el('narr-stage');
    if (!stage.querySelector('.narr-track')) {
      stage.innerHTML = narrBoards();
      return;
    }
    var live = data.narrLive || [];
    var cards = stage.querySelectorAll('.narr-card');
    if (!live.length || !cards.length) return;
    var now = Date.now();
    var n = live.length;
    var pool = (data.narrPreview && data.narrPreview.length >= 4)
      ? data.narrPreview
      : data.games.filter(function (g) { return g.op16; });
    live.forEach(function (b, i) {
      var pair = [cards[i], cards[i + n]];
      if (b.phase === 'fading') {
        if (now < b.until) return;
        /* the analyzed game leaves; the next one takes its seat */
        data.narrNext = (data.narrNext == null ? live.length : data.narrNext);
        var g2 = pool[data.narrNext % pool.length];
        data.narrNext++;
        if (g2) {
          b.toks = (g2.mv40 || g2.op16).split(' ');
          b.opp = g2.opp;
          b.flip = g2.color === 'black';
        }
        b.st = chessStart(); b.ply = 0;
        b.phase = 'live';
        b.nextAt = now + 350 + Math.random() * 250;
        var freshHtml = boardSvg(b.st, { flip: b.flip });
        pair.forEach(function (c) {
          if (!c) return;
          var old = c.querySelector('svg');
          if (old) old.outerHTML = freshHtml;
          var cap = c.querySelector('.narr-card-cap');
          if (cap && b.opp) cap.textContent = cfg.user + ' vs ' + b.opp;
          c.classList.remove('narr-fade');
        });
        return;
      }
      if (now < b.nextAt) return;
      b.nextAt = b.nextAt + 250;              /* steady beat, per-board phase */
      if (now - b.nextAt > 1000) b.nextAt = now + 250;   /* tab was hidden */
      var mv = b.ply < b.toks.length ? sanApply(b.st, b.toks[b.ply]) : null;
      if (!mv) {
        b.phase = 'fading';
        b.until = now + 480;
        pair.forEach(function (c) { if (c) c.classList.add('narr-fade'); });
        return;
      }
      b.ply++;
      var html = boardSvg(b.st, { flip: b.flip, anim: [mv.from, mv.to] });
      pair.forEach(function (c) {
        if (!c) return;
        var old = c.querySelector('svg');
        if (old) old.outerHTML = html;
      });
      releaseAnims(stage);
    });
  }, 90);
  var i = 0;
  function tick() {
    var box = el('narr-wisdom');
    if (!box || !data.narrate) return;
    box.style.opacity = 0;
    setTimeout(function () {
      if (!el('narr-wisdom') || !data.narrate) return;
      box.textContent = NARR_WISDOM[i % NARR_WISDOM.length];
      box.style.opacity = 1;
      i++;
    }, 300);
    setTimeout(tick, 4600);
  }
  tick();
}
function narrLine(id, html) {
  data.narrLog = (data.narrLog || []).filter(function (l) { return l[0] !== id; });
  data.narrLog.push([id, html]);
  var box = el('narr');
  if (!box) return;
  var row = box.querySelector('[data-n="' + id + '"]');
  if (!row) {
    row = document.createElement('div');
    row.className = 'narr-line';
    row.setAttribute('data-n', id);
    box.appendChild(row);
  }
  row.innerHTML = html;
}
function finishNarration() {
  if (!data.narrate) return;
  var prof = skillProfile();
  var w = behindSkills();
  narrLine('done', prof.rows.length
    ? (w.length
        ? 'Found the gap: ' + esc(w[0].phrase) + '. Building your plan around it.'
        : 'Nothing behind players at your rating. Building your program.')
    : 'Building your program.');
  setTimeout(function () {
    data.narrate = false;
    data.freshOnboard = true;   /* the first landing explains before it deals */
    renderShell();
    renderAll();
  }, 900);
}

function renderNoAccount() {
  data.narrate = false;
  el('main').innerHTML = '<div class="first">'
    + '<div class="kicker" style="margin-bottom:18px">not found</div>'
    + '<h1>Lichess has no account called ' + esc(cfg.user) + '.</h1>'
    + '<p>Check the spelling, or use a different one. Nothing else on the page can load until this resolves.</p>'
    + '<div class="first-form">'
      + '<input class="input" id="firstUser" placeholder="Lichess username" autocomplete="off" spellcheck="false" style="width:260px">'
      + '<button class="btn-outline" data-act="setUser">Use this account</button>'
    + '</div></div>';
  var i = el('firstUser');
  if (i) { i.focus(); i.addEventListener('keydown', function (e) { if (e.key === 'Enter') setUser(i.value); }); }
}

window.addEventListener('online', function () { notice('Back online.'); boot(); });
window.addEventListener('offline', function () { notice('You are offline. Showing the last cached read.'); });

function boot() {
  gen++;
  applyLinkTarget();
  if (typeof navigator.onLine === 'boolean' && !navigator.onLine) {
    notice('You are offline. Showing the last cached read.');
  }
  if (!cfg.user) { renderHeader(); renderFirstVisit(); renderFoot(); return; }
  document.title = 'notlichess.org · ' + cfg.user;
  data.games = loadCachedGames().games;   /* paint from cache immediately */
  data.sections = { user:'loading', games:'loading', peaks:'loading',
                    tours:'loading', watch:'loading', studies:'loading' };
  data.playing = null; data.h2h = null; data.broadcast = null; data.tv = null;
  data.tours = null; data.studies = null; data.streamers = null;
  data.daily = null; data.storm = null;
  data.peaks = {}; data.pstat = {}; data.series = {}; data.deltas = {};
  data.customSpecs = []; data.scanFocus = null; data.autoStarted = false;
  data.topups = {};
  profileCache = null; detectorCache = null;
  buildSeries();
  data.narrate = !data.games.length;
  data.narrPreview = null; data.narrStart = null; data.narrTick = 0;
  if (data.narrate) {
    renderHeader();
    if (!store.get('nl:obDone', false)) renderObQuestions();
    else renderNarration();
  }
  else { renderShell(); renderAll(); }

  /* Serial by policy. Order is: what the header needs, then the heavy game
     export, then everything that only fills one card. */
  loadUser()
    .then(function () {
      if (data.sections.user === 'fail' && data.userErr === 404) {
        var e = new Error('no account'); e.stop = true; throw e;
      }
    })
    .then(loadNarrPreview)
    .then(loadGames)
    .then(loadPlaying)
    .then(function () { finishNarration(); })
    .then(loadPeaks)
    .then(refreshTours)
    .then(function () { renderAll(); })
    .then(function () {
      engineLoad().catch(function () {});
      setTimeout(autoScan, 1200);
    })
    .catch(function (err) {
      if (err && err.stop) renderNoAccount(); else renderAll();
    });
}

boot();

})();
</script>
