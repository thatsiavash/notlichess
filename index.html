/* ── Today — the session. A finite thing to complete, not a feed. ────── */
var FLAME = '<svg class="flame" viewBox="0 0 16 20" aria-hidden="true">'
  + '<path d="M8 1.5c.6 3-2.4 4.6-3.6 7A6.3 6.3 0 0 0 8 18.4 6.3 6.3 0 0 0 14 12c0-3.4-2.6-4.6-3.2-7.6-1 1-1.4 2.2-1.2 3.6C8.4 6.6 7.6 4 8 1.5z" '
  + 'fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

function bestStreak() { return store.get('nl:bestStreak:' + String(cfg.user).toLowerCase(), 0); }
function bumpBestStreak(n) {
  if (n > bestStreak()) store.set('nl:bestStreak:' + String(cfg.user).toLowerCase(), n);
}

function dayRec(d) {
  var prefix = 'nl:day:' + String(cfg.user).toLowerCase() + ':';
  return store.get(prefix + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), null);
}
function setsOn(d) {
  var rec = dayRec(d);
  if (!rec) return 0;
  /* older records counted positions, not sets */
  return rec.sets != null ? rec.sets : (rec.trained > 0 ? 1 : 0);
}

/* The streak is SETS across consecutive days: 3 sets, then 2, then 4 is a
   streak of 9. One missed day per rolling week is shielded — a rest day
   pauses the run instead of burning it (#14: habits survive being human). */
function streakInfo() {
  /* one rest day forgiven per rolling week of the run, as promised in the
     set-done copy — not one per streak lifetime */
  var sets = 0, days = 0, lastShieldAt = null;
  var d = new Date();
  if (setsOn(d) === 0) d.setDate(d.getDate() - 1);
  var guard = 0;
  while (guard++ <= 400) {
    var n = setsOn(d);
    if (n > 0) {
      sets += n; days++;
      d.setDate(d.getDate() - 1);
    } else if (days > 0 && (lastShieldAt == null || days - lastShieldAt >= 7)) {
      lastShieldAt = days;
      d.setDate(d.getDate() - 1);
      if (setsOn(d) === 0) break;   /* two in a row ends the run for real */
    } else break;
  }
  var shieldUsed = lastShieldAt != null && lastShieldAt <= 7;
  var grant = store.get('nl:streakGrant', 0) || 0;
  if (grant && sets === 0 && days === 0) {
    /* a restored count expires only once the run has truly gone cold:
       two full days after the restore with nothing scored */
    var at = store.get('nl:streakGrantAt', 0);
    if (at && Date.now() - at > 2 * 864e5) {
      store.del('nl:streakGrant');
      store.del('nl:streakGrantAt');
      grant = 0;
    }
  }
  return { sets: sets + grant, days: days, shieldUsed: shieldUsed };
}
function streakDays() { return streakInfo().sets; }

/* ── Opponent prep (#8) ──────────────────────────────────────────────────
   Thirty seconds before a match: their book, their colours, their leaks.
   One request, cached per name for the session.                            */

function prepFetch(name) {
  var key = name.toLowerCase();
  data.prep = data.prep || {};
  if (data.prep[key]) { renderPrep(); return; }
  var kept = store.get('nl:cache:prep:' + cfg.src + ':' + key, null);
  if (kept && kept.at && Date.now() - kept.at < 12 * 3600 * 1000) {
    data.prep[key] = kept.v;
    renderPrep();
    return;
  }
  data.prep[key] = { loading: true, name: name };
  renderPrep();
  var games = [];
  var myGen = gen;
  var collect = function (g) {
      var w = g.players && g.players.white, b = g.players && g.players.black;
      if (!w || !b) return;
      var isWhite = !!(w.user && w.user.id === key);
      var isBlack = !!(b.user && b.user.id === key);
      if (!isWhite && !isBlack) return;
      var colour = isWhite ? 'white' : 'black';
      games.push({
        colour: colour,
        res: g.winner ? (g.winner === colour ? 'win' : 'loss') : 'draw',
        fam: g.opening ? (g.opening.name || '').split(':')[0].trim() : null,
        status: g.status,
        rating: (isWhite ? w : b).rating || null
      });
    };
  var src = isCC()
    ? ccJSON('/player/' + encodeURIComponent(name) + '/games/archives', { quiet: true })
        .then(function (a) {
          var months = (a.archives || []).slice(-3).reverse();
          var chain = Promise.resolve();
          months.forEach(function (mUrl) {
            chain = chain.then(function () {
              if (games.length >= 120 || stale(myGen)) return;
              return ccJSON(mUrl.replace(CC, ''), { quiet: true }).then(function (mo) {
                (mo.games || []).slice().reverse().forEach(function (raw) {
                  if (games.length >= 120) return;
                  var shaped = ccShape(raw);
                  if (shaped) collect(shaped);
                });
              }).catch(function () {});
            });
          });
          return chain;
        })
    : getND('/api/games/user/' + encodeURIComponent(name)
        + '?rated=true&max=120&opening=true&perfType=' + trackedPerfs().join(','), collect);
  src.then(function () {
    if (stale(myGen)) return;
    if (!games.length) { data.prep[key] = { empty: true, name: name }; renderPrep(); return; }
    function side(colour) {
      var list = games.filter(function (g) { return g.colour === colour; });
      var dec = list.filter(function (g) { return g.res !== 'draw'; });
      var fams = {};
      list.forEach(function (g) { if (g.fam) (fams[g.fam] = fams[g.fam] || []).push(g); });
      var all = Object.keys(fams).map(function (f) {
        var l = fams[f];
        return { fam: f, n: l.length, rate: winRate(l.filter(function (g) { return g.res !== 'draw'; }) ) };
      }).filter(function (x) { return x.n >= 5; });
      var top = all.slice().sort(function (a, b) { return b.n - a.n; });
      return { n: list.length, rate: dec.length >= 8 ? winRate(dec) : null, top: top.slice(0, 2),
               all: all,
               weak: top.slice().sort(function (a, b) { return (a.rate == null ? 99 : a.rate) - (b.rate == null ? 99 : b.rate); })[0] || null };
    }
    var losses = games.filter(function (g) { return g.res === 'loss'; });
    var flags = losses.filter(function (g) { return g.status === 'outoftime'; });
    data.prep[key] = {
      name: name, n: games.length,
      rating: games[0].rating,
      white: side('white'), black: side('black'),
      flagRate: losses.length >= 10 ? Math.round(flags.length * 100 / losses.length) : null
    };
    store.set('nl:cache:prep:' + cfg.src + ':' + key, { at: Date.now(), v: data.prep[key] });
    renderPrep();
    /* the lifetime record, from Lichess's own ledger */
    (isCC() ? Promise.reject(new Error('n/a'))
      : getJSON('/api/crosstable/' + encodeURIComponent(cfg.user) + '/' + encodeURIComponent(name)))
      .then(function (x) {
        if (stale(myGen) || !data.prep[key]) return;
        if (x && x.nbGames) {
          var meK = String(cfg.user).toLowerCase();
          data.prep[key].lifetime = {
            n: x.nbGames,
            me: x.users && x.users[meK] != null ? x.users[meK] : null
          };
          store.set('nl:cache:prep:' + cfg.src + ':' + key, { at: Date.now(), v: data.prep[key] });
          renderPrep();
        }
      }).catch(function () {});
  }).catch(function () {
    if (!stale(myGen)) { data.prep[key] = { failed: true, name: name }; renderPrep(); }
  });
}

/* Elo expectation split into win/draw/loss using the draw rate players at
   my rating actually produce */
function eloOdds(myR, theirR) {
  if (!myR || !theirR) return null;
  var e = 1 / (1 + Math.pow(10, (theirR - myR) / 400));
  var cell = peerCell(mainPerf(), myR);
  var d = cell && cell.draw != null ? cell.draw / 100 : 0.05;
  var w = Math.max(0, e - d / 2), l = Math.max(0, 1 - e - d / 2);
  var t = w + d + l;
  return { w: Math.round(w / t * 100), d: Math.round(d / t * 100), l: Math.round(l / t * 100) };
}

/* where my book meets theirs: my colour families against their replies */
function bookCollisions(prep) {
  var out = [];
  [['white', 'black'], ['black', 'white']].forEach(function (pair) {
    var mine = colourFamilies(pair[0]);
    var theirs = (prep[pair[1]] && prep[pair[1]].all) || [];
    mine.forEach(function (m) {
      theirs.forEach(function (t) {
        if (t.fam !== m.family || m.rate == null || t.rate == null) return;
        out.push({ fam: m.family, myColour: pair[0], myRate: m.rate, myN: m.n,
                   theirRate: t.rate, theirN: t.n, edge: m.rate - t.rate });
      });
    });
  });
  return out.sort(function (a, b) { return b.edge - a.edge; });
}

function prepSide(label, sd) {
  if (!sd || !sd.n) return '';
  var out = '<div class="prep-side"><span class="kicker-sm">' + label + '</span>';
  if (sd.rate != null) out += '<div class="prep-line tnum">wins ' + pct(sd.rate) + ' of decisive games</div>';
  sd.top.forEach(function (t) {
    out += '<div class="prep-line tnum">' + esc(t.fam) + ' · ' + t.n + ' games'
      + (t.rate != null ? ' · scores ' + pct(t.rate) : '') + '</div>';
  });
  if (sd.weak && sd.weak.rate != null && sd.weak.rate < 45)
    out += '<div class="prep-line"><span class="win">Lean here:</span> ' + esc(sd.weak.fam)
      + ' — they score only ' + pct(sd.weak.rate) + '.</div>';
  return out + '</div>';
}

function renderPrep() {
  var box = el('play-prep');
  if (!box) return;
  var key = (ui.prepName || '').toLowerCase();
  var d = key && data.prep && data.prep[key];
  box.innerHTML = '<div class="set-head" style="margin-top:26px;padding-bottom:8px"><span class="kicker">prep for an opponent</span></div>'
    + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'
      + '<input class="input input-sm" id="prepInput" placeholder="their username" spellcheck="false" '
      + 'value="' + esc(ui.prepName || '') + '" style="width:180px">'
      + '<a class="chip-sm chip-off" data-act="prepGo">Read them</a>'
    + '</div>'
    + (!d ? ''
      : d.loading ? '<div class="loading">reading ' + esc(d.name) + '\'s last games…</div>'
      : d.failed ? '<div class="dim" style="font-size:14px;padding-top:8px">Could not read that account.</div>'
      : d.empty ? '<div class="dim" style="font-size:14px;padding-top:8px">No rated games found in your formats.</div>'
      : (function () {
          var myR = data.user && data.user.perfs && data.user.perfs[mainPerf()]
            ? data.user.perfs[mainPerf()].rating : null;
          var odds = eloOdds(myR, d.rating);
          var myGames = data.games.filter(function (g) {
            return g.opp && g.opp.toLowerCase() === d.name.toLowerCase();
          });
          var myW = myGames.filter(function (g) { return g.res === 'win'; }).length;
          var myL = myGames.filter(function (g) { return g.res === 'loss'; }).length;
          var col = bookCollisions(d);
          var best = col.filter(function (c) { return c.edge >= 8; })[0];
          var trap = col.slice().reverse().filter(function (c) { return c.edge <= -8; })[0];

          /* the plan: one sentence, the strongest true edge */
          var plan;
          if (best) plan = 'Steer into the ' + best.fam + ' as ' + best.myColour
            + ' — you score ' + pct(best.myRate) + ' in it and they manage ' + pct(best.theirRate) + '.';
          else if (d.flagRate != null && d.flagRate >= 25)
            plan = 'They lose ' + d.flagRate + '% of their losses on time — in worse positions, keep playing.';
          else if (d.white && d.black && d.white.rate != null && d.black.rate != null)
            plan = 'They are ' + (d.white.rate > d.black.rate ? 'far stronger as White — the game to win is when you have White' : 'weaker as White — press hardest with Black') + '.';
          else plan = 'No sharp edge found — play your own game.';

          return '<div class="prep">'
            + '<div class="prep-line" style="margin-bottom:2px"><b style="color:var(--display);font-weight:400">'
              + esc(d.name) + '</b> · ' + (d.rating || '?') + ' · last ' + d.n + ' games'
            + '</div>'

            + ((d.lifetime || myGames.length)
                ? '<div class="prep-line tnum"><span class="kicker-sm">record</span> '
                  + (d.lifetime
                      ? 'lifetime ' + (d.lifetime.me != null ? d.lifetime.me : '?') + ' – '
                        + (d.lifetime.me != null ? Math.round((d.lifetime.n - d.lifetime.me) * 10) / 10 : '?')
                        + ' over ' + d.lifetime.n + ' games'
                      : '')
                  + (myGames.length
                      ? (d.lifetime ? ' · ' : '') + 'this window ' + myW + '–' + myL
                        + ' · last met ' + ago(myGames[0].ts)
                      : '')
                  + '</div>'
                : '')

            + (odds
                ? '<div class="prep-line"><span class="kicker-sm">odds</span> '
                  + '<span class="odds-bar" title="From the rating gap, split by how often players at your rating actually draw">'
                    + '<span class="ob ob-w" style="width:' + odds.w + '%"></span>'
                    + '<span class="ob ob-d" style="width:' + odds.d + '%"></span>'
                    + '<span class="ob ob-l" style="width:' + odds.l + '%"></span>'
                  + '</span> <span class="tnum">' + odds.w + '/' + odds.d + '/' + odds.l + '</span></div>'
                : '')

            + '<div class="prep-cols">' + prepSide('as white', d.white) + prepSide('as black', d.black) + '</div>'

            + (best || trap
                ? '<div class="prep-line" style="margin-top:6px"><span class="kicker-sm">where the books collide</span></div>'
                  + (best ? '<div class="prep-line tnum"><span class="win">Your edge:</span> ' + esc(best.fam)
                      + ' as ' + best.myColour + ' — you ' + pct(best.myRate) + ' (' + best.myN
                      + '), them ' + pct(best.theirRate) + ' (' + best.theirN + ')</div>' : '')
                  + (trap ? '<div class="prep-line tnum"><span class="loss">Their edge:</span> ' + esc(trap.fam)
                      + ' as ' + trap.myColour + ' — you ' + pct(trap.myRate)
                      + ', them ' + pct(trap.theirRate) + '</div>' : '')
                : '')

            + '<div class="prep-line" style="margin-top:8px"><span class="kicker-sm">the plan</span> '
              + esc(plan) + '</div>'
            + '</div>';
        })());
}

/* Tournament status is derived from the stored start time at render, so a
   six-hour-old feed still tells the truth: an arena that has begun since the
   last pull shows as live, and one 20 minutes into its run drops off. */
function relStart(at) {
  var d = Math.round((at - Date.now()) / 1000);
  if (d <= 0) {
    var m = Math.max(1, Math.round(-d / 60));
    return 'started ' + m + 'm ago';
  }
  if (d < 3600) return 'in ' + Math.round(d / 60) + 'm';
  if (d < 22 * 3600) {
    var h = Math.floor(d / 3600);
    var mm = Math.round((d % 3600) / 60);
    return 'in ' + h + 'h' + (mm ? ' ' + String(mm).padStart(2, '0') + 'm' : '');
  }
  var dt = new Date(at);
  var day = dt.toLocaleDateString('en-GB', { weekday: 'short' });
  var today = new Date(); today.setHours(0,0,0,0);
  var days = Math.round((at - today.getTime()) / 864e5);
  return (days === 1 ? 'tomorrow' : day) + ' ' + clockOf(at);
}
function tourRow(t) {
  var now = Date.now();
  var live = t.at != null && t.at <= now;
  return '<a class="row" href="' + t.url + '">'
    + '<b>' + esc(t.name) + '</b>'
    + '<span class="when tnum">' + esc(t.tc) + ' · '
    + (live ? '<span class="win">' + relStart(t.at) + ' · join</span>' : relStart(t.at))
    + '</span></a>';
}
function tourCol(label, list, allHref) {
  return '<div class="prep-side">'
    + '<span class="kicker-sm">' + label + '</span>'
    + (list.length
        ? '<div class="rows">' + list.map(tourRow).join('') + '</div>'
        : '<div class="dim" style="font-size:13px;padding-top:4px">Nothing at your time controls in the loaded window.</div>')
    + '<div class="more" style="margin-top:8px"><a href="' + allHref + '">see all</a></div>'
    + '</div>';
}
function renderArena() {
  var box = el('play-tours');
  if (!box) return;
  var head = '<div class="set-head" style="margin-top:26px;padding-bottom:8px">'
    + '<span class="kicker">tournaments</span>'
    + '<span class="set-spacer"></span>'
    + (data.toursAt ? '<span class="dim" style="font-size:12px">schedules '
        + (ago(data.toursAt) === 'just now' ? 'pulled just now' : 'pulled ' + ago(data.toursAt) + ' ago') + '</span>' : '')
    + '</div>';
  if (data.sections.tours === 'loading' && !data.toursRaw) {
    box.innerHTML = head + '<div class="loading">reading the tournament schedules…</div>';
    return;
  }
  var lists = splitTours();
  box.innerHTML = head
    + '<div class="prep-cols" style="max-width:760px">'
    + tourCol('arena', lists.arena, L + '/tournament')
    + tourCol('swiss', lists.swiss, L + '/swiss')
    + '</div>';
}

function fmtSigned(v) {
  var n = Math.round(v);
  return n > 0 ? '+' + n : (n < 0 ? '−' + Math.abs(n) : '0');
}
function fmtSkill(r) {
  return r.unit === '' ? fmtSigned(r.mine) : Math.round(r.mine) + r.unit;
}
function fmtPeer(r) {
  if (r.peer == null) return '';
  return r.unit === '' ? fmtSigned(r.peer) : Math.round(r.peer) + r.unit;
}
function verdictClass(v) {
  return {
    critical: 'v-critical', weak: 'v-weak', behind: 'v-behind',
    level: 'v-level', solid: 'v-solid', strong: 'v-strong', elite: 'v-elite',
    context: 'v-context'
  }[v] || 'v-level';
}

/* A hairline with the peer value at the centre and your dot placed by how far
   off it you are. Stroke only, no fills — it reads at a glance and stays in
   the page's language. */
var PIECE_NAME = { P: 'Pawns', N: 'Knights', B: 'Bishops', R: 'Rooks', Q: 'Queen', K: 'King' };

/* Tutor's pieces page, condensed to one strip: mean win-chance cost per move
   of each piece, against peers, worst first — with a set to train it. */
/* The pieces speak only when they have something to say: the worst piece,
   named, costed against peers, with its training set — or silence. */
function pieceInsight(prof) {
  var totals = {};
  myGamesIn(prof.perf).forEach(function (g) {
    if (!g.pcs) return;
    Object.keys(g.pcs).forEach(function (k) {
      (totals[k] = totals[k] || [0, 0]);
      totals[k][0] += g.pcs[k][0] * g.pcs[k][1];
      totals[k][1] += g.pcs[k][1];
    });
  });
  var cell = prof.rating != null ? peerCell(prof.perf, prof.rating) : null;
  var peerPieces = cell && cell.pieces ? cell.pieces : null;
  if (!peerPieces) return '';
  var worst = null;
  Object.keys(totals).forEach(function (k) {
    if (totals[k][1] < 150 || peerPieces[k] == null) return;
    var drop = totals[k][0] / totals[k][1];
    var over = drop / peerPieces[k];
    if (!worst || over > worst.over) worst = { k: k, drop: drop, peer: peerPieces[k], over: over, n: totals[k][1] };
  });
  if (!worst || worst.over < 1.2) return '';
  return '<div class="skill-sent" style="padding-top:10px">'
    + '<b style="color:var(--primary);font-weight:400">Your ' + PIECE_NAME[worst.k].toLowerCase()
    + (worst.k === 'Q' || worst.k === 'K' ? ' is' : ' are') + ' the leak:</b> each '
    + PIECE_NAME[worst.k].toLowerCase().replace(/s$/, '') + ' move costs you '
    + (Math.round(worst.drop * 10) / 10) + ' win-chance points on average — peers lose '
    + (Math.round(worst.peer * 10) / 10) + '. (' + worst.n + ' moves) '
    + '<a data-act="customSet" data-i="' + registerSpec({ type: 'piece', piece: worst.k,
        label: PIECE_NAME[worst.k].toLowerCase() + ' mistakes', theme: 'mix',
        why: 'Positions where your ' + PIECE_NAME[worst.k].toLowerCase() + ' move went wrong.' })
    + '">Train it →</a></div>';
}
/* the word and the bar are one scale: seven segments, seven words */
var VERDICT_WORDS = ['critical', 'critical', 'weak', 'behind', 'level', 'solid', 'strong', 'elite'];
function segFill(rel) { return Math.max(0, Math.min(7, Math.round(3.5 + rel * 1.75))); }
function verdictOf(rel) {
  if (rel == null) return null;
  return VERDICT_WORDS[segFill(rel)];
}

function segBar(rel) {
  if (rel == null) return '<span class="segbar"></span>';
  var fill = segFill(rel);
  var cls = 'seg-' + (verdictOf(rel) || 'mid');
  var out = '<span class="segbar">';
  for (var i = 0; i < 7; i++) {
    out += '<span class="segb' + (i < fill ? ' ' + cls : '') + '"></span>';
  }
  return out + '</span>';
}

function renderProfile() {
  var box = el('profile');
  if (!box) return;

  if (data.sections.games === 'loading' && !data.games.length) {
    box.innerHTML = '<div class="prof"><div class="kicker">your game</div>'
      + '<div class="loading">reading your games…</div></div>';
    return;
  }

  var prof = skillProfile();
  if (!prof.rows.length) {
    box.innerHTML = '';
    return;
  }

  var perfName = perfLabel(prof.perf);
  var scored = rankedSkills();
  var strong = scored.filter(function (r) { return r.rel != null && r.rel >= 1 && !r.contextual; });
  var weak = behindSkills();
  var vs = prof.rating + '-rated ' + perfName + ' players';

  var capNote = prof.rating > 2450
    ? ' Peer data tops out at the 2400 band, so comparisons up here read generous.' : '';
  var line;
  if (!prof.hasPeers) {
    line = 'No peer baseline for ' + perfName + ' at your rating yet, so these are your own numbers only.';
  } else if (weak.length && strong.length) {
    var best = strong[strong.length - 1];
    line = 'Ahead of ' + vs + ' on ' + best.phrase
      + (strong.length > 1 ? ' and ' + (strong.length - 1) + ' other'
          + (strong.length > 2 ? 's' : '') : '')
      + '. Behind on ' + weak[0].phrase
      + (weak.length > 1 ? ' and ' + (weak.length - 1) + ' more' : '') + '.';
  } else if (strong.length) {
    line = 'Nothing here is behind ' + vs + ', and you are ahead on ' + strong.length
      + ' of the ' + scored.length + ' measured.';
  } else if (weak.length) {
    line = 'Against ' + vs + ' you are behind on ' + weak.length + ' of these.';
  } else {
    line = 'You sit level with ' + vs + ' right across the board.';
  }

  /* The trend column only earns its place once there is a week of history. */
  var trends = {};
  var anyTrend = false;
  prof.rows.forEach(function (r) {
    var t = skillTrend(r.key, r.low);
    if (t) { trends[r.key] = t; anyTrend = true; }
  });

  var coach = '';
  if (anyTrend) {
    var best = null, worst = null;
    prof.rows.forEach(function (r) {
      var t = trends[r.key];
      if (!t || Math.abs(t.delta) < 0.5) return;
      if (t.better && (!best || Math.abs(t.delta) > Math.abs(best.t.delta))) best = { r: r, t: t };
      if (!t.better && (!worst || Math.abs(t.delta) > Math.abs(worst.t.delta))) worst = { r: r, t: t };
    });
    if (best || worst) {
      coach = '<p class="prof-coach">Since ' + prettyDate((best || worst).t.since) + ': '
        + (best ? best.r.phrase + ' has moved your way' : '')
        + (best && worst ? ', while ' + worst.r.phrase + ' has slipped' : '')
        + (!best && worst ? worst.r.phrase + ' has slipped' : '')
        + '.</p>';
    }
  }

  /* every row, weakest first — the full report is the report */
  var ordered = prof.rows.slice().sort(function (a, b) {
    var ra = a.contextual || a.rel == null ? 99 : a.rel;
    var rb = b.contextual || b.rel == null ? 99 : b.rel;
    return ra - rb;
  });
  var rowsHtml = ordered.map(function (r) {
    var trend = trends[r.key];
    var open = ui.openSkill === r.key;
    var detailHtml = open ? skillDetail(r.key) : '';
    var sentence = r.sent
      ? r.sent(fmtSkill(r), r.peer != null ? fmtPeer(r) : null)
      : fmtSkill(r) + (r.peer != null ? ' against ' + fmtPeer(r) : '');
    if (r.peer == null) sentence += ' No peer number at your rating yet.';
    if (r.adj != null) {
      sentence += ' Your opponents in these run ' + (r.oppGap > 0 ? '+' : '') + r.oppGap
        + ' against you, so adjusted for opposition this plays like '
        + Math.round(r.adj) + '% — the verdict uses that.';
    }
    return '<div class="skill skill-click' + (open ? ' skill-open' : '')
      + '" data-act="skillRow" data-k="' + r.key + '" role="button" tabindex="0"'
      + ' aria-expanded="' + open + '">'
      + '<span class="skill-label">' + esc(r.label) + '</span>'
      + segBar(r.rel)
      + '<span class="skill-verdict ' + verdictClass(r.verdict) + '">'
        + (r.verdict || 'no peer') + '</span>'
      + (anyTrend
          ? '<span class="skill-trend tnum">' + (trend
              ? det('<span class="' + (trend.better ? 'win' : 'loss') + '">'
                    + (trend.better ? '↑' : '↓') + '</span>',
                    (trend.delta > 0 ? '+' : '−') + Math.abs(Math.round(trend.delta * 10) / 10)
                    + ' since ' + prettyDate(trend.since))
              : '') + '</span>'
          : '')
    + '</div>'
    + '<div class="skill-sent' + (open ? ' skill-open' : '') + '">' + sentence
      + ' <span class="dim tnum">(' + r.n + ' games)</span>'
      + (r.rel != null && r.rel <= -0.45 && !r.contextual
          ? (function () {
              var pl2 = planFor(r);
              return pl2.custom
                ? ' <a data-act="customSet" data-i="' + registerSpec(pl2.custom) + '">Train it →</a>'
                : (pl2.act
                    ? ' <a data-act="' + pl2.act + '">' + esc(pl2.label) + ' →</a>'
                    : ' <a href="' + pl2.href + '">' + esc(pl2.label) + ' →</a>');
            })()
          : '')
      + '</div>'
    + (open && detailHtml ? '<div class="skill-detail">' + detailHtml + '</div>' : '');
  }).join('');

  box.innerHTML = '<div class="prof">'
    + '<div class="prof-head">'
      + '<span class="kicker">your game · ' + esc(perfName) + '</span>'
      + '<span class="card-ctrl">'
        + '<a data-act="peerInfo">where these come from</a>'
      + '</span>'
    + '</div>'
    + '<p class="prof-line">' + esc(line + capNote) + '</p>'
    + coach
    + '<div class="skills' + (anyTrend ? '' : ' no-trend') + '">'
      + rowsHtml
      + pieceInsight(prof)
    + '</div>'
    + '</div>';
}

/* Rough Elo payoff for closing a win-rate gap: one percentage point of
   overall win rate is worth about seven rating points at equilibrium, scaled
   by the share of games the skill actually touches. Only win-rate skills get
   one — there is no honest acpl-to-Elo conversion. */
function ratingPayoff(r) {
  if (r.low || r.peer == null || r.unit !== '%') return null;
  /* reviewing is a process metric — more analysis does not convert to Elo
     by the win-rate formula, so it makes no rating claim */
  if (r.key === 'review') return null;
  var gap = r.peer - r.mine;
  if (gap <= 0) return null;
  var total = myGamesIn(mainPerf()).length;
  if (!total || !r.n) return null;
  var pts = gap * 7 * (r.n / total);
  if (pts < 10) return null;
  return Math.round(pts / 5) * 5;
}

/* The shapes of a player's mistakes — kind, phase, opposition. These are
   not peer comparisons; they are self-portraits, and every account with a
   handful of analysed games has them. Each one is a set. */
var KIND_LABEL = { hung: 'Hung pieces', tactic: 'Missed tactics',
                   slip: 'Won games slipping', collapse: 'Level positions collapsing' };
var PHASE_LABEL = { open: 'Opening mistakes', mid: 'Middlegame mistakes', end: 'Endgame mistakes' };
var PHASE_HINT = { open: 'before move 15', mid: 'moves 15–30', end: 'past move 30' };
function mistakeShapes() {
  var all = allBlunders();
  if (all.length < 8) return [];
  var kinds = {}, phases = {}, strongerN = 0, strongerTotal = 0;
  all.forEach(function (it) {
    if (it.b.k) kinds[it.b.k] = (kinds[it.b.k] || 0) + 1;
    var ph = blunderPhase(it);
    phases[ph] = (phases[ph] || 0) + 1;
    if (it.g.oppR != null && it.g.myR != null) {
      strongerTotal++;
      if (it.g.oppR - it.g.myR >= 50) strongerN++;
    }
  });
  var rows = [];
  var kindTop = Object.keys(kinds).sort(function (a, b) { return kinds[b] - kinds[a]; })[0];
  if (kindTop && kinds[kindTop] >= 6) {
    var kp = Math.round(kinds[kindTop] * 100 / all.length);
    rows.push({
      label: KIND_LABEL[kindTop], stat: kp + '% of your mistakes',
      why: 'Your own ' + KIND_LABEL[kindTop].toLowerCase() + ', retried from the exact positions until the reflex changes.',
      spec: { type: 'kind', kind: kindTop, label: KIND_LABEL[kindTop],
              theme: (KIND_THEME[kindTop] || [null])[0],
              why: KIND_WORD[kindTop] + ' — your most common shape' }
    });
  }
  var phTop = Object.keys(phases).sort(function (a, b) { return phases[b] - phases[a]; })[0];
  if (phTop && phases[phTop] >= 6 && phases[phTop] * 100 / all.length >= 40) {
    var pp = Math.round(phases[phTop] * 100 / all.length);
    rows.push({
      label: PHASE_LABEL[phTop], stat: pp + '% happen ' + PHASE_HINT[phTop],
      why: 'The phase where your games actually bleed — its mistakes, together.',
      spec: { type: 'phase', phase: phTop, label: PHASE_LABEL[phTop],
              why: pp + '% of your mistakes come ' + PHASE_HINT[phTop] }
    });
  }
  if (strongerN >= 6 && strongerTotal >= 15
      && strongerN * 100 / strongerTotal >= 45) {
    var sp = Math.round(strongerN * 100 / strongerTotal);
    rows.push({
      label: 'Against stronger players', stat: sp + '% of your mistakes',
      why: 'What +50-rated opposition does to your play — those positions, retried.',
      spec: { type: 'stronger', label: 'Vs stronger opposition',
              why: 'the mistakes stronger players extract from you' }
    });
  }
  return rows.slice(0, 3);
}

function renderPlan() {
  var box = el('plan');
  if (!box) return;
  var prof = skillProfile();
  if (!prof.rows.length) { box.innerHTML = ''; return; }

  var weak = behindSkills().slice(0, 3);
  var stretch = false;
  if (!weak.length) {
    /* Nothing is behind, so aim at the narrowest lead instead of stopping. */
    var scored = rankedSkills();
    if (!scored.length) { box.innerHTML = ''; return; }
    weak = scored.slice(0, 1);
    stretch = true;
  }

  var steps = weak.map(function (r, i) {
    var pl = planFor(r);
    return '<li class="plan-step">'
      + '<span class="plan-n tnum">' + (i + 1) + '</span>'
      + '<span class="plan-body">'
        + '<span class="plan-what">' + esc(r.label) + ' · '
          + '<span class="' + verdictClass(r.verdict) + '">' + fmtSkill(r) + '</span>'
          + (r.peer != null ? ' <span class="dim">against ' + fmtPeer(r) + '</span>' : '')
        + '</span>'
        + '<span class="plan-why">' + esc(pl.why)
          + (function () {
              var pay = ratingPayoff(r);
              return pay ? ' <span class="plan-pay" title="Rough: one point of overall win '
                + 'rate is worth about seven Elo. Closing this gap on the games it touches.">'
                + 'worth ≈ +' + pay + ' rating</span>' : '';
            })()
        + '</span>'
      + '</span>'
      + (pl.custom
          ? '<a class="' + (i === 0 ? 'btn-gold' : 'btn-quiet') + '" data-act="customSet" data-i="'
            + registerSpec(pl.custom) + '">Train it</a>'
            + '<a href="' + pl.href + '" class="btn-quiet btn-out">' + esc(pl.hrefLabel || pl.label)
            + ' <span class="out-mark">↗</span></a>'
          : pl.act
            ? '<a class="' + (i === 0 ? 'btn-gold' : 'btn-quiet') + '" data-act="' + pl.act + '">'
              + esc(pl.label) + '</a>'
            : '<a class="' + (i === 0 ? 'btn-gold' : 'btn-quiet') + '" href="' + pl.href + '">'
              + esc(pl.label) + '</a>')
      + '</li>';
  }).join('');

  box.innerHTML = '<div class="plan">'
    + (stretch
        ? '<p class="plan-none" style="margin-bottom:10px">Nothing is behind players at your '
          + 'rating. The closest thing to a weak spot:</p>'
        : '')
    + '<div class="prof-head"><span class="kicker">work on this</span></div>'
    + '<ol class="plan-list">' + steps
    + mistakeShapes().filter(function (sh) {
        return !weak.some(function (r) { return r.label === sh.label; });
      }).map(function (sh, i) {
        return '<li class="plan-step">'
          + '<span class="plan-n tnum">' + (weak.length + i + 1) + '</span>'
          + '<span class="plan-body">'
            + '<span class="plan-what">' + esc(sh.label) + ' · '
              + '<span class="loss">' + esc(sh.stat) + '</span></span>'
            + '<span class="plan-why">' + esc(sh.why) + '</span>'
          + '</span>'
          + '<a class="btn-quiet" data-act="customSet" data-i="' + registerSpec(sh.spec) + '">Train it</a>'
          + '</li>';
      }).join('')
    + '</ol>'
    + '</div>';
}

function renderSettings() {

  box.innerHTML = '<div class="settings">'
    + '<h2>Settings</h2>'

var palette = { open: false, items: [], sel: 0 };

function openPalette() {
  palette.open = true;

  el('overlay').innerHTML = '<div class="scrim" data-act="closePalette"><div class="palette">'
    + '<input id="pq" placeholder="Go to…" autocomplete="off" spellcheck="false" '

    + '</div></div>';

  q.addEventListener('input', function () { palette.sel = 0; filterPalette(q.value); });
  q.addEventListener('keydown', paletteKeys);
}
function closePalette() {
  palette.open = false;
  el('overlay').innerHTML = '';

    try { palette.returnTo.focus(); } catch (e) {}

function filterPalette(term) {
  var t = term.trim().toLowerCase();
  var all = destinations();
  var items = t
    ? all.filter(function (d) { return d[0].toLowerCase().indexOf(t) !== -1 || d[2].indexOf(t) !== -1; })
    : all;
  if (t && !items.length) {
    items = [['Open lichess.org/@/' + term.trim(), userHref(term.trim()), 'player'],
             ['Search Lichess players', L + '/player', 'player']];
  }
  palette.items = items;
  var list = el('plist');
  if (!list) return;
  list.innerHTML = items.length
    ? items.map(function (d, i) {
        return '<li role="option" aria-selected="' + (i === palette.sel) + '" data-i="' + i + '">'
          + esc(d[0]) + '<span class="grp">' + esc(d[2]) + '</span></li>';
      }).join('')
    : '<div class="empty">Nothing matches.</div>';
}
function paletteKeys(e) {
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    var n = palette.items.length;
    if (!n) return;
    palette.sel = (palette.sel + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
    filterPalette(el('pq').value);
    var sel = document.querySelector('#plist li[aria-selected=true]');
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Enter') {
    var d = palette.items[palette.sel];
    if (d) go(d[1]);
  }
}

function setLimit(n) {
  if (!n || isNaN(n)) return;
  n = Math.max(FIRST_PAINT, Math.min(MAX_GAMES, Math.round(n)));
  var grew = n > cfg.gameLimit;
  cfg.gameLimit = n;
  saveCfg('gameLimit');
  if (grew) store.del(cacheKey());   /* a bigger window has to be refetched */
  else data.games = data.games.slice(0, n);
  renderFoot();
  loadGames();
}


function setUser(name) {
  if (!cfg.perfs) setPerfs(['rapid', 'blitz']);
  name = String(name || '').trim();
  if (!name) return;
  if (!/^[a-zA-Z0-9_-]{2,30}$/.test(name)) {
    notice('That is not a Lichess username — letters, numbers, underscore and hyphen only.');
    return;
  }
  cfg.user = name;
  saveCfg('user');
  boot();
}

/* Idle traffic policy: the page at rest makes NO requests. Tournament
   schedules are written well in advance, so the feed is pulled at boot and
   then at most every six hours; between pulls the stored list is re-rendered
   locally every 30s so "in 42m" stays true. Nothing else runs on a timer. */
var TICK = 30000;          /* redraw countdowns — no network at all */
var TOURS_TTL = 6 * 3600 * 1000;
var liveTimer = null;

function refreshLive() {
  if (!cfg.user || document.hidden) return;
  renderArena();                               /* relative times move on their own */
  if (data.toursAt && Date.now() - data.toursAt > TOURS_TTL
      && data.sections.tours !== 'loading') {
    refreshTours();                            /* twice-a-day class of refresh */
  }
}
function startLive() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(refreshLive, TICK);
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) refreshLive();
});

/* Quiet hourly pickup: the incremental fetch is cheap (it asks only for
   games since the newest cached one), so staying current costs almost
   nothing and the user never has to think about refreshing. */
setInterval(function () {
  if (!cfg.user || data.narrate) return;
  var c = loadCachedGames();
  if (c.at && Date.now() - c.at > 3600 * 1000 && data.sections.games !== 'loading') {
    loadGames();
  }
}, 10 * 60 * 1000);
startLive();

/* ── Board input: click-click, drag like lichess, right-click drawing ── */
var pointerState = { dragFrom: -1, rightFrom: -1, moved: false, suppressClick: false };

function sqFromEvent(e) {
  var el2 = document.elementFromPoint(e.clientX, e.clientY);
  var sqEl = el2 && el2.closest ? el2.closest('[data-sq]') : null;
  return sqEl ? parseInt(sqEl.getAttribute('data-sq'), 10) : -1;
}

document.addEventListener('contextmenu', function (e) {
  if (e.target.closest && e.target.closest('.board')) e.preventDefault();
});

var dragGhost = null;
function killGhost() {
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  document.querySelectorAll('.board use.drag-src').forEach(function (u) {
    u.classList.remove('drag-src');
  });
}
function spawnGhost(pieceChar, x, y, size) {
  killGhost();
  dragGhost = document.createElement('div');
  dragGhost.className = 'drag-ghost';
  dragGhost.style.width = dragGhost.style.height = size + 'px';
  dragGhost.innerHTML = '<svg viewBox="0 0 45 45"><use href="#pc-' + PIECE_ID[pieceChar] + '"/></svg>';
  document.body.appendChild(dragGhost);
  moveGhost(x, y);
}
function moveGhost(x, y) {
  if (dragGhost) dragGhost.style.transform =
    'translate(' + (x - dragGhost.offsetWidth / 2) + 'px,' + (y - dragGhost.offsetHeight / 2) + 'px)';
}

document.addEventListener('pointerdown', function (e) {
  var ss = ui.session;
  if (!ss || !ss.active || !e.target.closest || !e.target.closest('.board')) return;
  var a = ss.active;
  var sq = sqFromEvent(e);
  if (sq < 0) return;
  if (e.button === 2) {
    pointerState.rightFrom = sq;
    return;
  }
  if (e.button !== 0 || a.phase !== 'guess') return;
  /* each gesture governs only its own click — a leftover suppression from
     the selecting tap must not swallow the destination tap */
  pointerState.suppressClick = false;
  /* left button: arrows clear, and a grab on an own piece starts a drag */
  if (a.shapes.length) { a.shapes = []; renderTrainerInline(); }
  var p = a.st.b[sq];
  if (p && isW(p) === a.st.w) {
    pointerState.dragFrom = sq;
    pointerState.dragPiece = p;
    pointerState.moved = false;
    pointerState.startX = e.clientX;
    pointerState.startY = e.clientY;
    /* a tap that selects must not be un-selected by its own click event —
       that broken toggle is why tap-tap never worked on phones */
    pointerState.justSelected = a.sel !== sq;
    if (a.sel !== sq) { a.sel = sq; renderTrainerInline(); }
  }
});

document.addEventListener('pointermove', function (e) {
  if (pointerState.dragFrom < 0) return;
  if (!pointerState.moved) {
    /* a thumb never taps perfectly still — a few pixels of jitter is still
       a tap, not a drag. Only real travel starts the drag. */
    var jdx = e.clientX - pointerState.startX, jdy = e.clientY - pointerState.startY;
    if (jdx * jdx + jdy * jdy < 64) return;
    pointerState.moved = true;
    /* the ghost appears on first movement, sized to the board's squares */
    var rect0 = document.querySelector('.board rect[data-sq]');
    var size = rect0 ? rect0.getBoundingClientRect().width : 45;
    spawnGhost(pointerState.dragPiece, e.clientX, e.clientY, size);
    var src = document.querySelector('.board use[data-sq="' + pointerState.dragFrom + '"]');
    if (src) src.classList.add('drag-src');
  }
  moveGhost(e.clientX, e.clientY);
});

document.addEventListener('pointerup', function (e) {
  var ss = ui.session;
  if (!ss || !ss.active) { pointerState.dragFrom = -1; pointerState.rightFrom = -1; return; }
  var a = ss.active;
  var sq = sqFromEvent(e);
  if (e.button === 2 && pointerState.rightFrom >= 0) {
    if (sq >= 0) {
      if (sq === pointerState.rightFrom) a.shapes.push({ at: sq });
      else a.shapes.push({ from: pointerState.rightFrom, to: sq });
      renderTrainerInline();
    }
    pointerState.rightFrom = -1;
    return;
  }
  if (pointerState.dragFrom >= 0) {
    var from = pointerState.dragFrom;
    pointerState.dragFrom = -1;
    killGhost();
    if (pointerState.moved && sq >= 0 && sq !== from && a.phase === 'guess') {
      a.sel = from;
      pointerState.suppressClick = true;
      sessionClick(sq);
    } else if (!pointerState.moved && pointerState.justSelected) {
      /* pure tap that made the selection: swallow the click so it sticks;
         tapping the already-selected piece again still deselects */
      pointerState.suppressClick = true;
    }
    pointerState.justSelected = false;
  }
});

document.addEventListener('click', function (e) {
  if (ui.session && !ui.session.finished) {
    var sqEl = e.target.closest ? e.target.closest('[data-sq]') : null;
    if (sqEl) {
      if (pointerState.suppressClick) { pointerState.suppressClick = false; return; }
      sessionClick(parseInt(sqEl.getAttribute('data-sq'), 10));
      return;
    }
  }
  var li = e.target.closest ? e.target.closest('#plist li') : null;
  if (li) {
    var d = palette.items[parseInt(li.getAttribute('data-i'), 10)];
    if (d) go(d[1]);
    return;
  }
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  var k = t.getAttribute('data-k');
  var tc = t.getAttribute('data-tc');

  /* Checkboxes fire click too; let those pass through to the change handler. */
  if (t.tagName === 'INPUT' || t.tagName === 'LABEL') return;

  if (act === 'closePalette' && e.target === t) { closePalette(); return; }
  if (act === 'closePalette') return;

  e.preventDefault();

  switch (act) {
    case 'setUser': setUser(el('firstUser') ? el('firstUser').value : ''); break;
    case 'logout':
      gen++;
      document.title = 'notlichess.org';
      cfg.user = '';
      store.del('nl:user');
      cfg.perfs = null;
      store.del('nl:perfs');
      store.del('nl:focus');
      store.del('nl:goal');
      ui.settingsOpen = false;
      ui.session = null;
      data.narrate = false;
      renderHeader();
      renderFirstVisit();
      break;
    case 'settings': {
      ui.settingsOpen = !ui.settingsOpen; ui.wipeArmed = false; renderSettings();
      var sEl = el('settings');
      if (ui.settingsOpen && sEl) sEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'view': setView(k); break;
    case 'narrPerf': {
      var curN = trackedPerfs();
      var iN = curN.indexOf(k);
      if (iN >= 0) { if (curN.length > 1) curN.splice(iN, 1); }
      else curN.unshift(k);
      setPerfs(curN);
      if (el('narr')) renderNarration(); else renderObQuestions();
      break;
    }
    case 'obSize':
      store.set('nl:setSize', parseInt(k, 10));
      if (ui.settingsOpen) renderSettings();
      renderObQuestions();
      break;
    case 'obDone':
      store.set('nl:obDone', true);
      if (data.narrate) renderNarration();
      else { renderShell(); renderAll(); }
      break;

    case 'coachPerf':
      store.set('nl:coachPerf', k);
      profileCache = null;
      detectorCache = null;
      renderCoach(); renderProfile(); renderPlan();
      break;
    case 'focus':
      store.set('nl:focus', k);
      store.del('nl:goal:' + mainPerf());   /* new focus, new goal */
      renderCoach(); renderTrainerInline(); renderPlan();
      notice('Focus changed. The sessions and the plan follow it.');
      break;
    case 'perf': {
      var cur = trackedPerfs();
      var i2 = cur.indexOf(k);
      if (i2 >= 0) { if (cur.length > 1) cur.splice(i2, 1); }
      else cur.unshift(k);
      setPerfs(cur);
      perfsChanged();
      break;
    }
    case 'skillRow': ui.openSkill = ui.openSkill === k ? null : k; renderProfile(); break;
    case 'train': startSession(t.getAttribute('data-key') || null); break;
    case 'srcPick': {
      cfg.src = k;
      saveCfg('src');
      var keepU = el('firstUser') ? el('firstUser').value : '';
      renderFirstVisit(keepU);
      break;
    }
    case 'firstSet':
      data.freshOnboard = false;
      data.autoStarted = true;
      startSession(null);
      break;
    case 'trainerNext': nextSessionItem(); break;
    case 'mission':
      startMission(k, parseInt(t.getAttribute('data-i') || '-1', 10));
      break;
    case 'adopt': {
      var seedA = (t.getAttribute('data-seed') || '').split(' ');
      var listA = adoptedList();
      listA.push({ colour: t.getAttribute('data-c'), seed: seedA, label: adoptLabel(seedA) });
      saveAdopted(listA);
      renderOpenings();
      notice(adoptLabel(seedA) + ' added — its lessons are waiting in Learn.');
      break;
    }
    case 'unadopt': {
      var seedU = t.getAttribute('data-seed') || '';
      saveAdopted(adoptedList().filter(function (sp) {
        return !(sp.colour === t.getAttribute('data-c') && sp.seed.join(' ') === seedU);
      }));
      renderOpenings();
      break;
    }
    case 'repLearn':
      startOpeningSession(t.getAttribute('data-c'), t.getAttribute('data-f') || null, 'learn');
      break;
    case 'home':
      if (cfg.user) {
        try { history.pushState(null, '', '?u=' + encodeURIComponent(cfg.user) + '#train'); } catch (e2) {}
        setView('train', true);
      }
      break;
    case 'promo': promoChoose(k); break;
    case 'trainerHint': {
      var ah = ui.session && ui.session.active;
      var hm = ah && (ah.best || ah.keeperMove);
      if (hm) {
        ah.hintUsed = true;
        ah.hintSq = hm.from;
        renderTrainerInline();
      }
      break;
    }
    case 'trainerReveal': revealAnswer(); break;
    case 'fishTip': notice(scanTip()); break;
    case 'howToggle': ui.helpOpen = !ui.helpOpen; renderTrainerInline(); break;
    case 'streakFix': {
      ui.streakFixOpen = true;
      el('overlay').innerHTML = '<div class="scrim" data-act="streakClose">'
        + '<div class="trainer" style="width:min(400px,94vw)" role="dialog">'
        + '<div class="trainer-head"><span class="kicker">restore your streak</span>'
        + '<a data-act="streakClose" style="margin-left:auto;font-size:18px;color:var(--dim)">×</a></div>'
        + '<p class="trainer-prompt" style="margin-top:4px">What was your streak — total sets across '
        + 'your run of consecutive days?</p>'
        + '<div style="display:flex;gap:10px;align-items:center;margin:10px 0 4px">'
        + '<input class="input input-sm tnum" id="streakInput" type="number" min="0" max="9999" '
        + 'value="' + streakInfo().sets + '" style="width:90px">'
        + '<a class="btn-gold" data-act="streakSave">Restore</a></div>'
        + '<p class="trainer-sub">On your honour — the streak only means what you let it mean.</p>'
        + '</div></div>';
      break;
    }
    case 'streakClose':
      if (t.getAttribute('data-act') === 'streakClose' && (e.target === t || t.tagName === 'A')) {
        el('overlay').innerHTML = '';
      }
      break;
    case 'streakSave': {
      var vIn = parseInt((el('streakInput') || {}).value, 10);
      if (!isNaN(vIn) && vIn >= 0) {
        var cur = streakInfo().sets - (store.get('nl:streakGrant', 0) || 0);
        store.set('nl:streakGrant', Math.max(0, vIn - cur));
        store.set('nl:streakGrantAt', Date.now());
        bumpBestStreak(vIn);
        el('overlay').innerHTML = '';

    case 'repInfo':

        + 'checked against ' + Math.round((BOOK.games || 0) / 1e5) / 10 + 'M games of ' + myBand()
        + '-band play from the Lichess open database. Drills replay your lines with the opponent '

/* ── 14c. The engine ─────────────────────────────────────────────────────
   Stockfish 16 NNUE, fetched once from a CDN and booted as a blob worker
   (the glue is patched so its .wasm loads cross-origin; jsDelivr sends
   CORS). Falls back to the older asm.js build if WASM is unavailable. Used
   for two things: quietly scanning unanalysed games into training material,
   and judging whether a non-book answer in the trainer was also good.      */

/* An engine POOL, not an engine: position evals are independent jobs, so
   every core the device can spare runs its own single-threaded Stockfish.
   Desktop typically gets 4 analysts, a phone 2 — a 1000-game backlog goes
   from ~90 minutes of tab-life to ~25. */
var SF = { workers: [], state: 'idle', loading: null, queue: [], code: null };
function poolSize() {
  var hc = navigator.hardwareConcurrency || 2;
  return Math.max(1, Math.min(4, hc - 2)) + (hc >= 8 ? 1 : 0);
}
function engineLoad() {
  if (SF.workers.length) return Promise.resolve(SF.workers[0].w);
  if (SF.loading) return SF.loading;
  var base = 'https://cdn.jsdelivr.net/npm/stockfish@16.0.0/src/';
  SF.loading = fetch(base + 'stockfish-nnue-16-single.js')
    .then(function (r) { if (!r.ok) throw new Error('glue ' + r.status); return r.text(); })
    .then(function (code) {
      code = code.split('"stockfish-nnue-16-single.wasm"')
        .join(JSON.stringify(base + 'stockfish-nnue-16-single.wasm'));
      return bootWorker(code).then(function (w) { SF.code = code; return w; });
    })
    .catch(function () {
      /* asm.js fallback: slower, still far above club strength at low depth */
      return fetch('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js')
        .then(function (r) { if (!r.ok) throw new Error('no engine'); return r.text(); })
        .then(function (code) { return bootWorker(code).then(function (w) { SF.code = code; return w; }); });
    })
    .then(function (w) {
      SF.workers.push({ w: w, busy: false });
      SF.state = 'ready';
      /* the rest of the pool boots quietly behind the first analyst */
      var extra = poolSize() - 1;
      for (var i = 0; i < extra; i++) {
        bootWorker(SF.code).then(function (w2) {
          SF.workers.push({ w: w2, busy: false });
          enginePump();
        }).catch(function () {});
      }
      return w;
    })
    .catch(function (e) { SF.state = 'failed'; SF.loading = null; throw e; });
  return SF.loading;
}
function bootWorker(code) {
  return new Promise(function (resolve, reject) {
    var w = new Worker(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
    var t = setTimeout(function () { reject(new Error('engine boot timeout')); w.terminate(); }, 30000);
    w.onmessage = function (e) {
      if (String(e.data) === 'uciok') { clearTimeout(t); resolve(w); }
    };
    w.onerror = function (e) { clearTimeout(t); reject(e); };
    w.postMessage('uci');
  });
}

/* One position at a time; each caller gets {cp, mate, bestUci, pv[]} with the
   score from WHITE's point of view. */
function engineEval(fen, movetime, priority) {
  /* movetime as a number = milliseconds; as {nodes: N} = a fixed node
     budget, which buys the SAME analysis quality on a phone and a desktop */
  return new Promise(function (resolve, reject) {
    var job = { fen: fen, movetime: movetime || 80, resolve: resolve, reject: reject };
    /* a player is waiting on priority jobs; the scan can wait */
    if (priority) SF.queue.unshift(job); else SF.queue.push(job);
    enginePump();
  });
}
function enginePump() {
  if (!SF.queue.length) return;
  if (!SF.workers.length) { engineLoad().then(enginePump).catch(function () {}); return; }
  var slot = null;
  for (var wi = 0; wi < SF.workers.length; wi++) {
    if (!SF.workers[wi].busy) { slot = SF.workers[wi]; break; }
  }
  if (!slot) return;
  slot.busy = true;
  var job = SF.queue.shift();
  Promise.resolve(slot.w).then(function (w) {
    var last = null;
    var whiteToMove = job.fen.split(' ')[1] === 'w';
    var done = false;
    var nodes = job.movetime && job.movetime.nodes;
    var guardMs = (nodes ? Math.ceil(nodes / 15) : job.movetime) + 8000;
    var t = setTimeout(function () { finish(null); }, guardMs);
    function finish(res) {
      if (done) return;
      done = true;
      clearTimeout(t);
      w.onmessage = null;
      slot.busy = false;
      if (res) job.resolve(res); else job.reject(new Error('engine timeout'));
      enginePump();
    }
    w.onmessage = function (e) {
      var m = String(e.data);
      if (m.indexOf('info ') === 0 && m.indexOf(' score ') > 0) last = m;
      if (m.indexOf('bestmove') === 0) {
        var out = { cp: 0, mate: null, bestUci: m.split(' ')[1], pv: [] };
        if (last) {
          var sc = last.match(/score (cp|mate) (-?\d+)/);
          if (sc) {
            if (sc[1] === 'mate') { out.mate = parseInt(sc[2], 10); out.cp = out.mate > 0 ? 1500 : -1500; }
            else out.cp = Math.max(-1500, Math.min(1500, parseInt(sc[2], 10)));
          }
          var pv = last.match(/ pv (.+)$/);
          if (pv) out.pv = pv[1].split(' ').slice(0, 8);
        }
        if (!whiteToMove) { out.cp = -out.cp; if (out.mate != null) out.mate = -out.mate; }
        finish(out);
      }
    };
    w.postMessage('position fen ' + job.fen);
    w.postMessage(nodes ? 'go nodes ' + nodes : 'go movetime ' + job.movetime);
  }).catch(function () { slot.busy = false; job.reject(new Error('no engine')); });
}

/* ── 14d. The quiet scan ─────────────────────────────────────────────────
   Keeps a buffer of games ready to train: whenever fewer than SCAN_BUFFER
   games hold an unmastered position, the newest unanalysed game is scanned
   in the background — every position evaluated, the win-chance swings
   turned into the same blunder records the Lichess-analysed games carry.
   Results persist in the game cache, so each game is scanned once ever.   */

var SCAN_RECENT = 20;    /* incoming games always jump the queue */
var scanState = { running: false, current: null, done: 0 };

/* Coverage, not buffering: the newest SCAN_WINDOW games should each have
   analysis from somewhere — Lichess's servers or the engine here. Training
   always has fresh material, and new games go to the front of the line. */
function scanCoverage() {
  var covered = 0, total = data.games.length;
  data.games.forEach(function (g) {
    if (g.analysed || g.scanned || g.bl) covered++;
  });
  return { covered: covered, total: total };
}

function scannable(g) {
  return g && !g.analysed && !g.scanned && !g.bl && g.plies >= 16 && isEligible(g.perf);
}
/* the last lane ignores the format filter: the fish works until EVERYTHING
   is analysed — untracked formats go last, but they go */
function scannableAny(g) {
  return g && !g.analysed && !g.scanned && !g.bl && g.plies >= 16;
}

/* The scan never stops while anything is scannable — it rotates in batches
   so every consumer gets fed early and keeps getting fed: fresh games always
   first, then one game per coach custom set in turn, then the general pool,
   round and round until the whole window is covered. */
function nextScanTarget() {
  var i, g;
  /* tier 0, absolute: anything new at the top of the list */
  for (i = 0; i < Math.min(SCAN_RECENT, data.games.length); i++) {
    if (scannable(data.games[i])) return data.games[i];
  }
  /* tier 0.5: the retained batch, rotating across tracked formats so every
     format's RECENT games get analysis first — the floor is a floor of
     recent analyzed games per format, not just recent games */
  var perfs = trackedPerfs();
  var fStart = (scanState.frr || 0) % perfs.length;
  for (var fs = 0; fs < perfs.length; fs++) {
    var pf = perfs[(fStart + fs) % perfs.length];
    for (i = 0; i < data.games.length; i++) {
      g = data.games[i];
      if (g.perf === pf && g.mv && scannable(g)) {
        scanState.frr = (fStart + fs + 1) % perfs.length;
        return g;
      }
    }
  }
  var specs = (data.scanFocus ? [data.scanFocus] : []).concat(data.customSpecs || []);
  var lanes = specs.map(function (sp) { return { gf: customGameFilter(sp) }; });
  lanes.push({ gf: null });   /* the general pool is a lane like any other */
  var start = (scanState.rr || 0) % lanes.length;
  for (var step = 0; step < lanes.length; step++) {
    var lane = lanes[(start + step) % lanes.length];
    for (i = 0; i < data.games.length; i++) {
      g = data.games[i];
      if (lane.gf && !lane.gf(g)) continue;
      if (scannable(g)) {
        scanState.rr = (start + step + 1) % lanes.length;
        return g;
      }
    }
  }
  for (i = 0; i < data.games.length; i++) {
    if (scannableAny(data.games[i])) return data.games[i];
  }
  return null;
}

function uciLine(st0, uciMoves) {
  /* a rough SAN rendering of an engine line, for the reveal text */
  var st = cloneState(st0), out = [];
  for (var i = 0; i < uciMoves.length; i++) {
    var m = uciToMove(st, uciMoves[i]);
    if (!m) break;
    out.push(moveNameOf(st, m));
    applyMove(st, m);
  }
  return out;
}

var TRIAGE_NODES = 40000; /* fixed node budget: identical detection quality
                             on a phone and a desktop, faster than 30ms on
                             most desktops */
function scanGame(g) {
  /* Retained movetext scans fetch nothing; only games outside the retained
     batch still cost one export call. */
  var myGen = gen;
  var src = g.mv && !g.bl
    ? Promise.resolve({ moves: g.mv, clocks: g.ck || null })
    : getJSON('/game/export/' + g.id + '?moves=true&clocks=true', { quiet: true })
        .catch(function () { return null; });
  return src
    .then(function (full) {
      if (stale(myGen) || !full || !full.moves) { g.scanned = 1; return; }
      var toks = full.moves.split(' ');
      var meWhite = g.color === 'white';
      var st = chessStart();
      var evals = [];             /* white-POV cp after each ply */
      /* one cheap walk collects every FEN, then the whole game's evals hit
         the pool AT ONCE — with 4 analysts, 4 positions think in parallel */
      var fens = [];
      var walkOk = true;
      toks.forEach(function (tok, i) {
        if (!walkOk) { fens[i] = null; return; }
        if (!sanApply(st, tok)) { walkOk = false; fens[i] = null; return; }
        fens[i] = (i < 8 || i >= 120) ? null : stateFen(st);
      });
      var extreme = 0;   /* consecutive pinned evals: decided-game early-stop */
      var jobs = [];
      fens.forEach(function (fen, i) {
        if (!fen) { evals[i] = null; return; }
        jobs.push(engineEval(fen, { nodes: TRIAGE_NODES }).then(function (r) {
          if (stale(myGen)) return;
          evals[i] = r;
        }).catch(function () { evals[i] = null; }));
      });
      /* early-stop compatibility: with parallel dispatch the corpse-skip
         happens by post-filter — pinned stretches simply yield no swings */
      var chain = Promise.all(jobs);
      return chain.then(function () {
        if (stale(myGen)) return;
        var bl = [];
        for (var i = 9; i < toks.length; i++) {
          if (!evals[i] || !evals[i - 1]) continue;
          var moverWhite = i % 2 === 0;
          if (moverWhite !== meWhite) continue;
          var wb = winPct(meWhite ? evals[i - 1].cp : -evals[i - 1].cp);
          var wa = winPct(meWhite ? evals[i].cp : -evals[i].cp);
          if (wb - wa < 20) continue;
          /* the answer: what the engine wanted INSTEAD of the played move */
          var pre = stateAtPly(full.moves, i);
          if (!pre) continue;
          var bestUci = evals[i - 1].bestUci;   /* best from the position before */
          var bm = bestUci ? uciToMove(pre, bestUci) : null;
          if (!bm) continue;
          var line = uciLine(pre, [bestUci].concat((evals[i - 1].pv || []).slice(1, 7)));
          var clk = (full.clocks && full.clocks[i] != null) ? Math.round(full.clocks[i] / 100) : null;
          bl.push({ p: i, wb: wb, wa: wa, c: clk,
                    bs: moveNameOf(pre, bm), bv: line.join(' '),
                    k: classifyBlunder(pre, toks[i], moveNameOf(pre, bm), wb, wa),
                    j: 'scan', loc: 1 });
        }
        bl.sort(function (a, b) { return (b.wb - b.wa) - (a.wb - a.wa); });
        g.bl = bl.length ? bl.slice(0, 4).sort(function (a, b) { return a.p - b.p; }) : null;
        g.mv = g.bl ? full.moves : null;   /* movetext stays only where cards live */
        delete g.ck;                        /* the clocks did their job */
        g.scanned = 1;
        /* the scanned game joins the profile with the same metrics as a
           Lichess-analysed one: build a pseudo-analysis from the engine evals */
        /* clip to the evaluated window: a fake 0 after ply 120 would read as
           a phantom swing against whoever was winning */
        var pseudo = evals.slice(0, 120).map(function (r) { return r ? { eval: r.cp } : { eval: 0 }; });
        var em2 = evalMetrics(pseudo, meWhite, full.moves);
        if (em2) {
          g.ev = [em2.acpl, em2.best, em2.worst, em2.o, em2.m, em2.e];
          g.acc2 = [em2.acc, em2.accO, em2.accM, em2.accE, em2.ta, em2.taN];
          g.pcs = em2.pieces;
        }
        saveGames(data.games);
      });
    });
}

/* When the retained pool runs dry, refuel it wholesale: one POST to the
   export-by-ids endpoint brings movetext for up to 150 games — the pool
   keeps eating at 1.2s gaps instead of dropping to one fetch per 20s. */
var bulkState = { at: 0, fails: 0, busy: false };
function bulkAllowed() {
  return !bulkState.busy && bulkState.fails < 3
    && Date.now() - bulkState.at > 120000
    && Date.now() >= backoffUntil;
}
function bulkRetain() {
  /* chess.com games arrive with their movetext in hand — nothing to refuel */
  if (isCC()) return Promise.resolve(0);
  bulkState.busy = true;
  bulkState.at = Date.now();
  var myGen = gen;
  /* newest scannable per format, interleaved, up to 150 ids */
  var perfs = trackedPerfs();
  var byPerf = {};
  perfs.forEach(function (p) { byPerf[p] = []; });
  data.games.forEach(function (g) {
    if (scannable(g) && !g.mv && byPerf[g.perf]) byPerf[g.perf].push(g);
  });
  var ids = [];
  for (var round = 0; ids.length < 150; round++) {
    var got = false;
    for (var pi = 0; pi < perfs.length && ids.length < 150; pi++) {
      var g2 = byPerf[perfs[pi]][round];
      if (g2) { ids.push(g2.id); got = true; }
    }
    if (!got) break;
  }
  if (ids.length < 150) {
    var seenIds = {};
    ids.forEach(function (id) { seenIds[id] = 1; });
    for (var gi = 0; gi < data.games.length && ids.length < 150; gi++) {
      var g4 = data.games[gi];
      if (scannableAny(g4) && !g4.mv && !seenIds[g4.id]) ids.push(g4.id);
    }
  }
  if (!ids.length) { bulkState.busy = false; return Promise.resolve(0); }
  return request('/api/games/export/_ids?moves=true&clocks=true',
      { method: 'POST', body: ids.join(','), accept: 'application/x-ndjson', quiet: true })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      if (stale(myGen)) return 0;
      var byId = {};
      data.games.forEach(function (g) { byId[g.id] = g; });
      var fed = 0;
      text.split('\n').forEach(function (line) {
        if (!line.trim()) return;
        try {
          var full = JSON.parse(line);
          var g3 = byId[full.id];
          if (g3 && full.moves && scannable(g3)) {
            g3.mv = full.moves;
            if (full.clocks) g3.ck = full.clocks;
            fed++;
          }
        } catch (e) {}
      });
      if (fed) saveGames(data.games);
      bulkState.busy = false;
      bulkState.fails = 0;
      return fed;
    })
    .catch(function () {
      bulkState.busy = false;
      bulkState.fails++;
      return 0;
    });
}

function autoScan() {
  if (scanState.running || SF.state === 'failed') return;
  /* the scan is the politest customer in the shop: it waits out any backoff
     with room to spare rather than being the thing that causes one */
  if (Date.now() < backoffUntil) {
    setTimeout(autoScan, backoffUntil - Date.now() + 30000);
    return;
  }
  var target = nextScanTarget();
  if (!target) { scanState.current = null; scanState.pending = false; renderScanStatus(); return; }
  if (!target.mv && bulkAllowed()) {
    /* refuel first — the same games come back fetchless in a few seconds */
    scanState.running = true;
    renderScanStatus();
    bulkRetain().then(function (fed) {
      scanState.running = false;
      setTimeout(autoScan, fed ? 800 : 1500);
    });
    return;
  }
  scanState.running = true;
  scanState.current = target;
  scanState.lastLocal = !!(target.mv && !target.bl);
  renderScanStatus();
  scanGame(target)
    .catch(function () { target.scanned = 1; })
    .then(function () {
      scanState.running = false;
      /* the fish stays awake through the breather between games — grey means
         genuinely done (or the engine failed), never "between bites" */
      scanState.pending = !!nextScanTarget();
      scanState.done++;
      renderScanStatus();
      renderTrainerInline();
      /* a retained-movetext scan cost no request — run the next immediately;
         only scans that had to fetch keep the 20s courtesy gap */
      setTimeout(autoScan, scanState.lastLocal ? 1200 : 20000);
    });
}
var FISH = '<svg class="fish" viewBox="0 0 22 14" aria-hidden="true">'
  + '<path d="M1.5 7c3-4.2 7.2-5.6 11-5.6 3.2 0 5.8 2 7.3 4.2.4.6.4 2.2 0 2.8-1.5 2.2-4.1 4.2-7.3 4.2-3.8 0-8-1.4-11-5.6z" '
  + 'fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>'

/* "Enough" is the number that matters to the user: once the trainer has
   deep material, the count is noise — the fish just quietly keeps going. */
function scanEnough(c) { return c.covered >= 50 || c.covered >= c.total; }

function scanTip() {
  var c = scanCoverage();
  if (SF.state === 'failed') return 'The engine could not load — training uses your Lichess-analysed games only.';
  if (c.covered >= c.total) return 'All ' + c.total + ' of your games are analysed.';
  if (scanEnough(c))
    return 'Training is fully stocked — ' + c.covered + ' games analysed, and the fish keeps '
      + 'working through the rest (' + c.total + ') in the background. Nothing to wait for.';
  return 'Stockfish is stocking your trainer — ' + c.covered + ' games analysed so far. '
    + 'New games and the coach\'s sets go first.';
}
function renderScanStatus() {
  var ic = el('fish-ic');
  if (!ic) return;
  var awake = scanState.running || scanState.pending;
  ic.className = 'fish-ic' + (awake && SF.state !== 'failed' ? ' fish-on' : '');
  ic.title = scanTip();
  var cEl = el('scan-count');
  if (cEl) {
    var c = scanCoverage();
    /* the fraction only shows while it is meaningful — during the first
       stocking. Once training is well fed, a number would read like an
       unfinished chore. */
    cEl.textContent = c.total && !scanEnough(c) ? c.covered + ' ready' : '';
  }
}



/* Changing training formats must not blank the page: everything the user
   already has keeps rendering (the views filter by format anyway), the new
   stamp is written to the cache, and only genuinely missing history is
   fetched — quietly, behind a small header job, after the user has finished
   toggling. */
var perfFetchTimer = null;
function perfsChanged() {
  profileCache = null; detectorCache = null; repCache = null; lineCache = null;
  renderAll();
  /* the full window for the new format mix always refetches — the point is
     that it happens BEHIND what is already on screen, debounced so a burst
     of toggles becomes one fetch, announced only by the header job */
  saveGames(data.games);   /* keep the cache valid if they leave before it lands */
  clearTimeout(perfFetchTimer);
  perfFetchTimer = setTimeout(function () {
    if (data.sections.games === 'loading') return;
    store.del(cacheKey());   /* a fresh 1000-game window, not an increment */
    loadGames().then(function () { loadPeaks(); });
  }, 2500);
}

/* A player who mostly blitzes still deserves a real rapid read: after the
   main window lands, any tracked format sitting under its floor gets its
   own quiet per-format fetch, merged and deduped in the background. */
function retainMovetext() {
  var kept = {};
  /* count what is already retained so repeat passes respect the cap */
  data.games.forEach(function (g) {
    if (g.mv && !g.bl && !g.scanned && !g.analysed) kept[g.perf] = (kept[g.perf] || 0) + 1;
  });
  data.games.forEach(function (g) {
    if (!g.mvTmp) return;
    if (!g.analysed && !g.scanned && !g.bl && !g.mv && g.plies >= 16 && isEligible(g.perf)
        && (isCC() || (kept[g.perf] || 0) < RETAIN_PER_FORMAT)) {
      g.mv = g.mvTmp;
      if (g.ckTmp) g.ck = g.ckTmp;
      kept[g.perf] = (kept[g.perf] || 0) + 1;
    }
    delete g.mvTmp;
    delete g.ckTmp;
  });
}

function topUpFormats() {
  if (isCC()) return;   /* the archive walker enforces the floors itself */
  if (data.sections.games !== 'ok') return;
  data.topups = data.topups || {};
  var meId = String(cfg.user).toLowerCase();
  var myGen = gen;
  var chain = Promise.resolve();
  trackedPerfs().forEach(function (p) {
    var have = 0;
    data.games.forEach(function (g) { if (g.perf === p) have++; });
    if (have >= MIN_PER_FORMAT || data.topups[p]) return;
    data.topups[p] = 1;
    chain = chain.then(function () {
      if (stale(myGen)) return;
      return getND('/api/games/user/' + encodeURIComponent(cfg.user)
          + '?perfType=' + p + '&' + GAME_PARAMS + '&max=' + MIN_PER_FORMAT,
        function (g) {
          var c = compact(g, meId);
          if (c) data.games.push(c);
        }, { quiet: true }
      ).then(function () {
        if (stale(myGen)) return;
        var seen = {};
        data.games = data.games.filter(function (g) {
          if (seen[g.id]) return false;
          seen[g.id] = 1;
          return true;
        }).sort(function (a, b) { return b.ts - a.ts; });
        retainMovetext();
        saveGames(data.games);
        profileCache = null; detectorCache = null; repCache = null; lineCache = null;
        renderAll();
      }).catch(function () {
        /* a rate-limited top-up retries once the backoff clears — a format
           must not stay starved because one fetch hit a 429 */
        setTimeout(function () {
          if (stale(myGen)) return;
          delete data.topups[p];
          topUpFormats();
        }, 90000);
      });
    });
  });
}

/* ── 15. Loading ─────────────────────────────────────────────────────── */
/* Slow-moving data persists across visits: profiles, peaks and tournament
   schedules do not change by the minute, so they should not be fetched by
   the minute. Serve the stored copy inside its TTL and skip the network
   entirely; past the TTL, fetch and re-store. Rated games stay on their own
   incremental path. */
function cachedJSON(key, ttlMs, fetcher) {
  var k = 'nl:cache:' + key;
  var hit = store.get(k, null);
  if (hit && hit.at && Date.now() - hit.at < ttlMs) return Promise.resolve(hit.v);
  return fetcher().then(function (v) {
    store.set(k, { at: Date.now(), v: v });
    return v;
  }).catch(function (err) {
    if (hit) return hit.v;          /* stale beats an error */
    throw err;
  });
}

function loadUser() {

/* Peaks come from /api/user/{u}/perf/{perf}. The rating-history endpoint is
   documented but currently answers [] for every account we tried, so nothing
   here depends on it. */
function loadPeaks() {
  var myGen = gen;
  data.sections.peaks = 'loading';
  data.pstat = data.pstat || {};
  if (isCC()) {
    data.peaks = (data.user && data.user.ccPeaks) || {};
    data.sections.peaks = 'ok';
    return Promise.resolve();
  }
  return trackedPerfs().reduce(function (chain, p) {
    return chain.then(function () {
      return cachedJSON('perf:' + String(cfg.user).toLowerCase() + ':' + p, 12 * 3600 * 1000, function () {
        return getJSON('/api/user/' + encodeURIComponent(cfg.user) + '/perf/' + p, { quiet: true });
      })
        .then(function (r) {
          var st = r && r.stat;
          if (!st) return;
          if (st.highest && st.highest.int) {
            data.peaks[p] = { rating: st.highest.int, when: st.highest.at ? monthYear(Date.parse(st.highest.at)) : null };
          }
          /* The same call already carries disconnect counts, streaks and the
             average opponent — all of it free, none of it in the export. */
          var c = st.count || {};
          var rs = st.resultStreak || {};
          data.pstat[p] = {
            all: c.all || 0, win: c.win || 0, loss: c.loss || 0, draw: c.draw || 0,
            disconnects: c.disconnects || 0, opAvg: c.opAvg || null,
            berserk: c.berserk || 0, seconds: c.seconds || 0,
            winStreak: rs.win && rs.win.cur ? rs.win.cur.v : 0,

    });

}

/* The rating curve is reconstructed from the games we already hold: the rating
   after a game is the rating it was played at plus its diff. No extra request,
   and it moves with whatever game window is loaded. */
function buildSeries() {
  data.series = {};
  data.deltas = {};
  var midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  var cut = Date.now() - 90 * 864e5;

  trackedPerfs().forEach(function (p) {
    var list = data.games.filter(function (g) { return g.perf === p && g.myR; }).slice().reverse();
    if (!list.length) return;
    var rating = function (g) { return g.myR + (g.rd || 0); };
    var recent = list.filter(function (g) { return g.ts >= cut; });
    data.series[p] = {
      points: recent.length >= 2 ? recent.map(rating) : list.slice(-12).map(rating)
    };
    /* the product's one progress window: the past 30 days, same as the
       blunder trend. Baseline = rating after the last game older than 30d,
       or the pre-rating of the oldest in-window game for newer accounts. */
    var monthCut = Date.now() - 30 * 864e5;
    var older = list.filter(function (g) { return g.ts < monthCut; });
    var inWin = list.filter(function (g) { return g.ts >= monthCut; });
    if (inWin.length) {
      var base = older.length ? rating(older[older.length - 1]) : inWin[0].myR;
      var cur = data.user && data.user.perfs && data.user.perfs[p]
        ? data.user.perfs[p].rating : rating(list[list.length - 1]);
      data.deltas[p] = cur - base;
    }
  });
}

/* the marker itself, everywhere a rating shows: green up, red down */
function deltaBadge(p) {
  var d = data.deltas && data.deltas[p];
  if (d == null || !isFinite(d) || Math.abs(d) < 1) return '';
  /* up is green, down is grey — a dip is information, not a punishment */
  return ' <span class="' + (d > 0 ? 'win' : 'dim')
    + ' tnum" style="font-size:.82em" title="past 30 days">'
    + (d > 0 ? '▲' : '▼') + Math.abs(Math.round(d)) + '</span>';
}

/* The annotated 1000-game export takes Lichess several seconds to even
   begin sending. The theater cannot wait for that: a 12-game moves-only
   fetch returns instantly and fills the boards while the big one warms up. */
function loadNarrPreview() {
  if (!data.narrate || (data.narrPreview && data.narrPreview.length >= 4)) return Promise.resolve();
  var myGen = gen;
  var got = [];
  return getND('/api/games/user/' + encodeURIComponent(cfg.user)
      + '?max=12&moves=true&perfType=' + trackedPerfs().join(','),
    function (g) {
      if (!g.moves || (g.variant && g.variant !== 'standard')) return;
      var w = g.players && g.players.white, b = g.players && g.players.black;
      if (!w || !b) return;
      var meWhite = !!(w.user && w.user.id === String(cfg.user).toLowerCase());
      var opp = meWhite ? b : w;

        op16: g.moves.split(' ').slice(0, 16).join(' '),

function loadGames() {
  var myGen = gen;
  data.sections.games = 'loading';
  data.gamesErr = null;
  data.gamesCount = 0;

  return fetchGames(meId, function (n, c2) {

      if (n % 15 === 0 || n < 5) {

        var eta = '';
        var elapsed = (Date.now() - data.narrStart) / 1000;

        }

function loadPlaying() {

/* Your record against whoever is across the board right now. Public, cheap,
   and the single most interesting thing to know mid-game. */

var toursTimer = null;
function refreshToursSoon() {
  /* Debounced: chip-tapping during an edit fires many of these; Lichess
     sees at most one request, 1.5s after the hands leave the keyboard. */
  clearTimeout(toursTimer);
  toursTimer = setTimeout(function () {
    if (data.toursRaw) renderArena();
    else refreshTours();
  }, 1500);
